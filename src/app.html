<style>
:root{
  --land:#EADFC0; --paper:#EEF4F6; --shoal:#D6E7EF; --surface:#FFFFFF; --ink:#14283A; --muted:#506475; --line:#B8CCD7;
  --mag:#A3195B; --mag-ink:#FFFFFF; --mag-soft:#F6E0EB;
  --ok:#1C6E45; --ok-soft:#DCEFE4; --bad:#A8231C; --bad-soft:#F8E0DE;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --land:#3A3829; --paper:#0B141B; --shoal:#14242F; --surface:#111D27; --ink:#DCE7EE; --muted:#97AAB8; --line:#28404F;
    --mag:#E2649F; --mag-ink:#1A0610; --mag-soft:#3A1529;
    --ok:#62C995; --ok-soft:#133224; --bad:#F2877F; --bad-soft:#3A1715;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --land:#3A3829; --paper:#0B141B; --shoal:#14242F; --surface:#111D27; --ink:#DCE7EE; --muted:#97AAB8; --line:#28404F;
  --mag:#E2649F; --mag-ink:#1A0610; --mag-soft:#3A1529;
  --ok:#62C995; --ok-soft:#133224; --bad:#F2877F; --bad-soft:#3A1715;
  color-scheme: dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Source Serif 4",Georgia,"Times New Roman",serif;font-size:1.0625rem;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3,.ui,button,.btn,nav{font-family:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif}
h1{font-size:clamp(2.1rem,6vw,3.4rem);line-height:1.02;font-weight:700;margin:0 0 .5rem;letter-spacing:-.01em}
h2{font-size:1.6rem;line-height:1.15;font-weight:600;margin:0 0 .6rem}
h3{font-size:1.2rem;font-weight:600;margin:0 0 .3rem}
p{margin:0 0 1rem}
a{color:var(--mag)}
:focus-visible{outline:3px solid var(--mag);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-inner{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:1rem;padding:.55rem 1rem}
.brand{display:flex;align-items:center;gap:.5rem;font-weight:700;font-size:1.2rem;color:var(--ink);text-decoration:none;white-space:nowrap}
.brand svg{width:26px;height:26px;color:var(--mag)}
nav{display:flex;gap:.25rem;overflow-x:auto;scrollbar-width:none;flex:1}
nav::-webkit-scrollbar{display:none}
nav a{font-weight:600;font-size:1.02rem;color:var(--muted);text-decoration:none;padding:.4rem .65rem;border-radius:6px;white-space:nowrap}
nav a:hover{color:var(--ink);background:var(--shoal)}
nav a[aria-current="page"]{color:var(--ink);background:var(--shoal)}
.badge{display:inline-block;min-width:1.3em;padding:0 .35em;margin-left:.3em;border-radius:99px;background:var(--mag);color:var(--mag-ink);font-size:.8rem;text-align:center}

main{max-width:960px;margin:0 auto;padding:1.75rem 1rem 4rem}
.lede{font-size:1.15rem;color:var(--muted);max-width:60ch}
.muted{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;font-weight:600;font-size:1.08rem;border:2px solid var(--mag);background:var(--mag);color:var(--mag-ink);padding:.55rem 1.1rem;border-radius:8px;cursor:pointer;text-decoration:none;min-height:44px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--mag)}
.btn[disabled]{opacity:.4;cursor:default}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.95rem;padding:0}

.hero{display:grid;grid-template-columns:1fr auto;gap:2rem;align-items:center;padding:1rem 0 2.5rem;border-bottom:1px solid var(--line);margin-bottom:2rem}
.rose{width:220px;height:220px;color:var(--mag)}
.rose text{font-family:"Barlow Semi Condensed",Arial,sans-serif;font-size:9px;fill:currentColor;text-anchor:middle}
@media (max-width:680px){.hero{grid-template-columns:1fr}.rose{width:150px;height:150px;order:-1}}

.mods{display:grid;gap:0;border-top:1px solid var(--line);margin-bottom:2.5rem}
.mod{display:grid;grid-template-columns:1fr auto;gap:.4rem 1rem;align-items:center;padding:1rem 0;border-bottom:1px solid var(--line)}
.mod .meta{color:var(--muted);font-size:.95rem}
.track{grid-column:1 / -1;height:8px;background:var(--shoal);border-radius:4px;overflow:hidden}
.track span{display:block;height:100%;background:var(--mag)}

.tips ul{padding-left:1.2rem;max-width:62ch}
.tips li{margin-bottom:.5rem}

.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin:0 0 1.2rem}
.chip{font-weight:600;font-size:1rem;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:.4rem .85rem;border-radius:99px;cursor:pointer;min-height:40px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.field-label{font-family:"Barlow Semi Condensed",Arial,sans-serif;font-weight:600;color:var(--muted);margin:0 0 .4rem}

.session{max-width:680px}
.sess-top{display:flex;justify-content:space-between;gap:1rem;font-family:"Barlow Semi Condensed",Arial,sans-serif;font-weight:600;color:var(--muted);margin-bottom:.5rem}
.clock{color:var(--ink);font-variant-numeric:tabular-nums}
.progress{height:4px;background:var(--shoal);border-radius:2px;margin-bottom:1.6rem;overflow:hidden}
.progress span{display:block;height:100%;background:var(--mag)}
.tag{font-family:"Barlow Semi Condensed",Arial,sans-serif;font-weight:600;color:var(--mag);margin:0 0 .3rem}
.qtext{font-family:"Source Serif 4",Georgia,serif;font-weight:600;font-size:1.3rem;line-height:1.4;margin-bottom:1.2rem}
.opts{display:grid;gap:.55rem}
.opt{display:flex;gap:.8rem;align-items:flex-start;text-align:left;width:100%;font-family:"Source Serif 4",Georgia,serif;font-size:1.05rem;line-height:1.45;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:.75rem .9rem;cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--mag)}
.opt .key{font-family:"Barlow Semi Condensed",Arial,sans-serif;font-weight:700;color:var(--muted);min-width:1.1em}
.opt.picked{border-color:var(--mag);background:var(--mag-soft)}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.fb{margin-top:1.1rem}
.verdict{font-family:"Barlow Semi Condensed",Arial,sans-serif;font-weight:700;font-size:1.2rem;margin:0 0 .3rem}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.sess-nav{display:flex;justify-content:flex-end;gap:.6rem;margin-top:1.4rem}

.score{font-family:"Barlow Semi Condensed",Arial,sans-serif;font-size:clamp(2.6rem,9vw,4rem);font-weight:700;line-height:1;margin:.2rem 0 .4rem}
table{width:100%;border-collapse:collapse;margin:1rem 0 2rem;font-size:1rem}
th,td{text-align:left;padding:.55rem .4rem;border-bottom:1px solid var(--line)}
th{font-family:"Barlow Semi Condensed",Arial,sans-serif;font-weight:600;color:var(--muted)}
.pass{color:var(--ok);font-weight:600}.fail{color:var(--bad);font-weight:600}
.miss{padding:1rem 0;border-bottom:1px solid var(--line)}
.miss p{margin:.2rem 0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1rem;max-width:520px}
.stage{background:#04070B;border-radius:10px;display:flex;justify-content:center;align-items:center;padding:.5rem}
.stage.day{background:linear-gradient(#B9D3E2,#DCE9F0)}
.stage svg{width:100%;max-width:340px;height:auto;display:block}
.ctx{font-family:"Barlow Semi Condensed",Arial,sans-serif;font-weight:600;color:var(--muted);margin:.7rem 0 0}
.back{margin-top:.9rem}
.back h2{font-size:1.4rem}
.card-actions{display:flex;gap:.6rem;margin-top:1rem}
.card-actions .btn{flex:1}

.problem{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1.2rem;max-width:620px}
.problem .qtext{margin-bottom:1rem}
.answer-row{display:flex;gap:.6rem;flex-wrap:wrap}
.answer-row input{font:inherit;font-size:1.2rem;width:9rem;padding:.5rem .7rem;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);min-height:44px}
.steps{margin-top:1rem;line-height:1.75}
.streak{font-family:"Barlow Semi Condensed",Arial,sans-serif;font-weight:600;color:var(--muted);margin:1rem 0 0}
.formula{font-family:"Barlow Semi Condensed",Arial,sans-serif;font-size:1.1rem;background:var(--shoal);border-radius:8px;padding:.6rem .9rem;display:inline-block;margin-bottom:1rem}
.les-list{list-style:none;padding:0;margin:0 0 2rem;border-top:1px solid var(--line)}
.les-list a{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:.2rem 1rem;padding:.85rem .2rem;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.les-list a:hover .lt{color:var(--mag)}
.lt{font-family:"Barlow Semi Condensed",Arial,sans-serif;font-weight:600;font-size:1.2rem}
.lm{color:var(--muted);font-size:.95rem}
.lm .fin{color:var(--ok);font-weight:600}
.mod-h{margin-top:1.6rem}
.player{max-width:900px}
.back-link{font-family:"Barlow Semi Condensed",Arial,sans-serif;font-weight:600;text-decoration:none}
.les-title{font-size:clamp(1.8rem,5vw,2.6rem);margin-bottom:1rem}
.slide{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1rem 1.2rem;display:flex;flex-direction:column;min-height:320px}
@media (min-width:720px){.slide{aspect-ratio:16/9}}
.slide h2{font-size:1.5rem;margin-bottom:.5rem}
.visual{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.visual svg.dg{width:100%;height:100%;max-height:440px}
.vpoints,.vscript{margin:0;font-size:clamp(1.05rem,2.2vw,1.35rem);line-height:1.45;align-self:stretch;display:flex;flex-direction:column;justify-content:center;gap:.55rem;max-width:62ch}
.vpoints{padding-left:1.3rem}.vscript{padding-left:1.6rem}
.vpoints li::marker,.vscript li::marker{color:var(--mag);font-weight:700}
.vrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:.8rem;width:100%}
.vrow figure{margin:0}
.vrow figcaption{font-family:"Barlow Semi Condensed",Arial,sans-serif;font-weight:600;text-align:center;margin-top:.35rem;font-size:1rem;line-height:1.25}
.vformula{text-align:center}
.vformula .big{font-family:"Barlow Semi Condensed",Arial,sans-serif;font-weight:700;font-size:clamp(2.2rem,7vw,3.6rem);color:var(--mag);margin-bottom:.7rem;line-height:1}
.vformula p{margin:.2rem 0;font-size:1.15rem}
.vformula .ex{margin-top:1rem;color:var(--muted)}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem;margin:1rem 0 .7rem}
.ctl{min-width:6.5rem}
.count{font-family:"Barlow Semi Condensed",Arial,sans-serif;font-weight:600;color:var(--muted);margin-left:auto}
.opts-row{display:flex;flex-wrap:wrap;gap:1rem;font-family:"Barlow Semi Condensed",Arial,sans-serif;font-weight:600;color:var(--muted)}
.opts-row select{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:6px;padding:.25rem .4rem;margin-left:.3rem;max-width:15rem}
.tr-h{font-size:1.2rem;margin-top:1.6rem}
.transcript{max-width:68ch}
.snt{cursor:pointer;border-radius:3px}
.snt:hover{text-decoration:underline;text-decoration-color:var(--line)}
.snt.on{background:var(--mag-soft);box-shadow:0 0 0 3px var(--mag-soft)}
.endbox{margin-top:1.5rem;padding:1.2rem;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.vfig{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:1.3rem;align-items:center;width:100%;height:100%;min-height:0}
.vfig-art{min-height:0;height:100%;display:flex;align-items:center;justify-content:center}
.visual .vfig-art svg.fg{width:100%;height:auto;max-height:100%;aspect-ratio:11/10;border-radius:12px;display:block}
.vfig-txt{min-width:0;display:flex;align-items:center}
.vfig .vpoints,.vfig .vscript{font-size:clamp(1rem,1.8vw,1.2rem)}
.vfig .callout{width:100%}
@media (max-width:719px){.vfig{grid-template-columns:1fr;height:auto}.vfig-art{height:auto}.visual .vfig-art svg.fg{max-height:340px;width:auto;max-width:100%}}
.vfig.top{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);gap:.7rem}
.vfig.top .vfig-art{height:auto}
.visual .vfig.top .vfig-art svg.fg{aspect-ratio:64/15;max-height:150px;width:100%}
.vfig.top .vtable{font-size:.95em}
.askbox{margin-top:1rem;padding:1rem 1.2rem;border:1px solid var(--line);border-radius:12px;background:var(--surface);max-width:68ch}
.askbox h2{font-size:1.3rem;margin-bottom:.3rem}.askbox h3{font-size:1.05rem;margin:1rem 0 .3rem}
.askbox textarea{width:100%;font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:.6rem .7rem;margin:.6rem 0;resize:vertical}
.ask-note{font-size:.9rem;margin-top:.7rem}.ask-list{margin:0;padding-left:1.2rem}.ask-list li{margin:.25rem 0}
.linkish{font:inherit;color:var(--mag);background:none;border:0;padding:0;text-align:left;text-decoration:underline;cursor:pointer}.linkish.del{color:var(--muted);font-size:.85rem;margin-left:.4rem}
.s-land{fill:var(--land);stroke:var(--muted);stroke-width:.7}
.dg text{font-family:"Barlow Semi Condensed",Arial,sans-serif}
.s-ink{fill:var(--ink)}.s-mut{fill:var(--muted)}.s-mag{fill:var(--mag)}.s-on{fill:var(--mag-ink)}.s-bg{fill:var(--shoal)}
.s-surfb{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.s-magst{stroke:var(--mag);fill:none}.s-st{stroke:var(--ink);fill:none}.s-lst{stroke:var(--line);fill:none}
.s-lt{fill:#e9f0f4}.s-hull{fill:#7f95a6}.s-rd{fill:#ff8a80}.s-gn{fill:#7ee2a0}
.vtable-wrap{width:100%;overflow-x:auto;align-self:stretch;display:flex;align-items:center}
.vtable{margin:0;font-size:clamp(.88rem,1.7vw,1.08rem);line-height:1.35}
.vtable th,.vtable td{padding:.45rem .55rem;vertical-align:top}
.vtable td:first-child{font-family:"Barlow Semi Condensed",Arial,sans-serif;font-weight:600}
.rv-item{transition:opacity .45s ease}
.rv-item.dim{opacity:.12}
.callout{align-self:stretch;display:flex;flex-direction:column;justify-content:center;padding:1rem 1.4rem;border-left:5px solid var(--mag);background:var(--mag-soft);border-radius:10px}
.ctag{font-family:"Barlow Semi Condensed",Arial,sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--mag);font-size:.95rem;margin:0 0 .7rem}
.callout ul{margin:0;padding-left:1.2rem;font-size:clamp(1.1rem,2.4vw,1.5rem);line-height:1.5}
.callout li{margin-bottom:.45rem}
@media (prefers-reduced-motion: no-preference){.opt,.btn,.chip{transition:background-color .15s,border-color .15s}}
.site-foot{max-width:900px;margin:40px auto 0;padding:16px 16px 28px;border-top:1px solid var(--line);color:var(--muted);font-size:.85rem;text-align:center}
.narr-src{align-self:center;color:var(--muted);font-size:.9rem}
</style>

let store={stats:{},misses:[]};

function save(){try{localStorage.setItem("oupv-v1",JSON.stringify(store));}catch(e){}updateBadge();}
function record(id,ok){
  const s=store.stats[id]||[0,0,0];s[0]++;if(ok)s[1]++;s[2]=ok?1:0;store.stats[id]=s;
  const i=store.misses.indexOf(id);
  if(!ok&&i<0)store.misses.push(id);
  if(ok&&i>=0)store.misses.splice(i,1);
  save();
}

/* ---------- Session engine ---------- */
function tickTimer(){if(!S||!S.end)return;const left=S.end-Date.now();const el=document.getElementById("clock");if(el)el.textContent=fmtTime(left);if(left<=0)finish();}
function saveSess(){if(!S)return;store.sess=S.done?null:{key:S.key,ids:S.items.map(it=>it.q.id),orders:S.items.map(it=>it.order),picks:S.items.map(it=>it.pick),i:S.i,mode:S.mode,title:S.title,end:S.end};save();}
function resumeSess(sv){if(!sv||!sv.ids)return false;const items=sv.ids.map((id,k)=>{const q=BANK.find(x=>x.id===id);return q?{q,order:sv.orders[k],pick:sv.picks[k]}:null;});if(items.some(x=>!x)||!items.length)return false;S={items,i:Math.min(sv.i,items.length-1),mode:sv.mode,title:sv.title,end:sv.end,done:false,key:sv.key};clearInterval(timer);if(S.end)timer=setInterval(tickTimer,1000);renderQ();return true;}
function resumeHTML(key){const s=store.sess;if(!s||s.key!==key||(s.end&&s.end<Date.now()))return "";return `<div class="endbox" style="margin:0 0 1.4rem"><p style="margin:0 0 .6rem">You have an unfinished ${key==="test"?"practice test":"quiz"}, at question ${s.i+1} of ${s.ids.length}.</p><button class="btn" id="resume">Resume where you left off</button></div>`;}
function wireResume(){const b=document.getElementById("resume");if(b)b.onclick=()=>{if(!resumeSess(store.sess)){store.sess=null;save();}};}
function startSession(list,opt){
  S={items:list.map(q=>({q,order:shuffle(q.opts.map((_,i)=>i)),pick:null})),i:0,mode:opt.mode,title:opt.title,end:opt.minutes?Date.now()+opt.minutes*60000:null,done:false,key:opt.key||null};
  clearInterval(timer);
  if(S.end)timer=setInterval(tickTimer,1000);
  renderQ();
}
function renderQ(){
  const it=S.items[S.i],q=it.q,exam=S.mode==="exam",last=S.i===S.items.length-1;
  main.innerHTML=`<section class="session">
  <div class="sess-top"><span>${S.title}</span><span>${S.i+1} of ${S.items.length}</span>${S.end?`<span class="clock" id="clock">${fmtTime(S.end-Date.now())}</span>`:""}</div>
  <div class="progress"><span style="width:${(S.i/S.items.length*100).toFixed(1)}%"></span></div>
  <p class="tag">${MODS[q.m].name}</p>
  <h2 class="qtext">${q.text}</h2>
  <div class="opts">${it.order.map((oi,k)=>`<button class="opt" data-oi="${oi}"><span class="key">${"ABCD"[k]}</span><span>${q.opts[oi]}</span></button>`).join("")}</div>
  <div class="fb" id="fb" aria-live="polite"></div>
  <div class="sess-nav">${exam?`<button class="btn ghost" id="prev" ${S.i===0?"disabled":""}>Previous</button>`:""}<button class="btn" id="next" ${!exam&&it.pick===null?"hidden":""}>${last?(exam?"Finish test":"See results"):"Next question"}</button></div></section>`;
  main.querySelectorAll(".opt").forEach(b=>b.onclick=()=>choose(+b.dataset.oi));
  document.getElementById("next").onclick=()=>{if(last)finish();else{S.i++;renderQ();}};
  const p=document.getElementById("prev");if(p)p.onclick=()=>{S.i--;renderQ();};
  paint();saveSess();
}
function paint(){
  const it=S.items[S.i];
  main.querySelectorAll(".opt").forEach(b=>{
    const oi=+b.dataset.oi;b.className="opt";
    if(S.mode==="exam"){if(it.pick===oi)b.classList.add("picked");}
    else if(it.pick!==null){if(oi===0)b.classList.add("correct");else if(oi===it.pick)b.classList.add("wrong");b.disabled=true;}
  });
  if(S.mode!=="exam"&&it.pick!==null){
    const ok=it.pick===0;
    document.getElementById("fb").innerHTML=`<p class="verdict ${ok?"ok":"bad"}">${ok?"Correct.":"Not quite."}</p><p>${ok?"":`The answer is: ${it.q.opts[0]}. `}${it.q.exp}</p>`;
    document.getElementById("next").hidden=false;
  }
}
function choose(oi){
  const it=S.items[S.i];
  if(S.mode!=="exam"){if(it.pick!==null)return;it.pick=oi;record(it.q.id,oi===0);paint();document.getElementById("next").focus();}
  else{it.pick=oi;paint();}
  saveSess();
}
function finish(){
  if(!S||S.done)return;
  clearInterval(timer);S.done=true;saveSess();
  if(S.mode==="exam")S.items.forEach(it=>record(it.q.id,it.pick===0));
  const by={};S.items.forEach(it=>{const b=by[it.q.m]||(by[it.q.m]={n:0,c:0});b.n++;if(it.pick===0)b.c++;});
  const c=S.items.filter(it=>it.pick===0).length,missed=S.items.filter(it=>it.pick!==0),exam=S.mode==="exam";
  const allPass=Object.entries(by).every(([m,b])=>b.c/b.n*100>=MODS[m].pass);
  main.innerHTML=`<section class="session"><h1>${exam?(allPass?"You passed every module":"Not there yet"):"Quiz complete"}</h1>
  <p class="score">${c} of ${S.items.length}</p><p class="muted">${Math.round(c/S.items.length*100)}% correct overall.</p>
  <table><thead><tr><th>Module</th><th>Score</th>${exam?"<th>Result</th>":""}</tr></thead><tbody>
  ${Object.entries(by).map(([m,b])=>{const pct=Math.round(b.c/b.n*100);return `<tr><td>${MODS[m].name}</td><td>${b.c} of ${b.n} (${pct}%)</td>${exam?`<td class="${pct>=MODS[m].pass?"pass":"fail"}">${pct>=MODS[m].pass?"Pass":`Below ${MODS[m].pass}%`}</td>`:""}</tr>`;}).join("")}
  </tbody></table>
  ${missed.length?`<h2>Review what you missed</h2>${missed.map(it=>`<div class="miss"><p><strong>${it.q.text}</strong></p><p class="muted">Your answer: ${it.pick===null?"none":it.q.opts[it.pick]}</p><p>Correct: ${it.q.opts[0]}. ${it.q.exp}</p></div>`).join("")}`:"<p>A clean sheet. Try a longer quiz or the full practice test.</p>"}
  <div class="row" style="margin-top:1.5rem"><button class="btn" id="again">${exam?"Take another test":(S.key&&S.key.startsWith("check-"))?"Retake the lesson check":"Start another quiz"}</button>${(S.key&&S.key.startsWith("check-"))?`<a class="btn ghost" href="#lesson-${S.key.slice(6)}">Back to the lesson</a>`:""}${missed.length?`<a class="btn ghost" href="#misses">Go to missed questions</a>`:""}</div></section>`;
  const K=S.key,T=S.title;
  document.getElementById("again").onclick=()=>{if(K&&K.startsWith("check-"))startSession(shuffle(BANK.filter(x=>x.tag===K.slice(6))),{mode:"learn",title:T,key:K});else if(exam)test();else quiz();window.scrollTo(0,0);};
  window.scrollTo(0,0);
}
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"||!S||S.done||!document.querySelector(".session .opts"))return;
  const k=e.key.toLowerCase();let idx="1234".indexOf(k);if(idx<0)idx="abcd".indexOf(k);
  if(idx>=0&&k.length===1){const b=main.querySelectorAll(".opt")[idx];if(b&&!b.disabled)b.click();}
  else if(e.key==="Enter"){const n=document.getElementById("next");if(n&&!n.hidden&&document.activeElement!==n){e.preventDefault();n.click();}}
});

/* ---------- Flashcards ---------- */
const DECKS={lights:{name:"Lights at night",cards:LIGHTS},shapes:{name:"Day shapes",cards:SHAPES},sounds:{name:"Sound signals",cards:SOUNDS}};
let C={deck:"lights",order:[],i:0,shown:false,got:0,seen:0};
const LC={r:"#ff453a",g:"#30d158",w:"#fff4d6",y:"#ffd60a"};
function drawLights(c){
  return `<svg viewBox="0 0 200 150" role="img" aria-label="A vessel’s lights at night"><defs><filter id="glow" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="4.5"/></filter></defs><line x1="0" y1="138" x2="200" y2="138" stroke="#16222d"/>${c.d.map(([k,x,y])=>`<circle cx="${x}" cy="${y}" r="10" fill="${LC[k]}" filter="url(#glow)" opacity=".85"/><circle cx="${x}" cy="${y}" r="4.2" fill="${LC[k]}"/>`).join("")}</svg>`;
}
function shp(s,x,y){
  const f="#101418";
  if(s==="ball")return `<circle cx="${x}" cy="${y}" r="14" fill="${f}"/>`;
  if(s==="diamond")return `<polygon points="${x},${y-17} ${x+13},${y} ${x},${y+17} ${x-13},${y}" fill="${f}"/>`;
  if(s==="cyl")return `<rect x="${x-11}" y="${y-17}" width="22" height="34" fill="${f}"/>`;
  if(s==="coneDown")return `<polygon points="${x-15},${y-14} ${x+15},${y-14} ${x},${y+15}" fill="${f}"/>`;
  return `<polygon points="${x-15},${y+15} ${x+15},${y+15} ${x},${y-14}" fill="${f}"/>`;
}
function drawShapes(c){
  const n=c.s.length,h=Math.max(150,46+n*38);let y=36,out="";
  c.s.forEach(s=>{out+=shp(s,100,y);y+=(s==="coneDown"&&c.s.length===2&&c.s[1]==="coneUp")?30:38;});
  return `<svg viewBox="0 0 200 ${h}" role="img" aria-label="Day shapes on a mast"><line x1="100" y1="6" x2="100" y2="${h}" stroke="#4a5864" stroke-width="2.5"/><line x1="70" y1="12" x2="130" y2="12" stroke="#4a5864" stroke-width="2"/>${out}</svg>`;
}
function drawSound(c){
  const parts=c.p.split(""),W={P:56,S:18},gap=11,w=parts.reduce((t,p)=>t+W[p],0)+gap*(parts.length-1);let x=(200-w)/2,out="";
  parts.forEach(p=>{out+=`<rect x="${x}" y="67" width="${W[p]}" height="16" rx="8" fill="#e9f0f4"/>`;x+=W[p]+gap;});
  return `<svg viewBox="0 0 200 150" role="img" aria-label="${parts.map(p=>p==="P"?"prolonged":"short").join(", ")} blasts">${out}<text x="100" y="118" text-anchor="middle" fill="#7f93a3" font-family="Barlow Semi Condensed, Arial, sans-serif" font-size="11">short ≈ 1 second   prolonged = 4–6 seconds</text></svg>`;
}
function cards(){C.order=shuffle(DECKS[C.deck].cards.map((_,i)=>i));C.i=0;C.shown=false;C.got=0;C.seen=0;renderCard();}
function renderCard(){
  const deck=DECKS[C.deck],card=deck.cards[C.order[C.i]];
  const art=C.deck==="lights"?drawLights(card):C.deck==="shapes"?drawShapes(card):drawSound(card);
  main.innerHTML=`<section><h1>Lights, shapes and sound signals</h1><p class="lede">Name it before you reveal the answer. These make up a big share of the Rules of the Road module.</p>
  <div class="chips">${Object.entries(DECKS).map(([k,d])=>`<button class="chip" data-deck="${k}" aria-pressed="${k===C.deck}">${d.name}</button>`).join("")}</div>
  <div class="card"><div class="stage ${C.deck==="shapes"?"day":""}">${art}</div>${card.ctx?`<p class="ctx">${card.ctx}</p>`:""}
  ${C.shown?`<div class="back"><h2>${card.a}</h2><p>${card.n}</p></div>`:""}
  <div class="card-actions">${C.shown?`<button class="btn ghost" id="miss">I missed it</button><button class="btn" id="got">I got it</button>`:`<button class="btn" id="flip">Show answer</button>`}</div></div>
  <p class="muted" style="margin-top:.8rem">Card ${C.i+1} of ${deck.cards.length}. ${C.got} of ${C.seen} right this round.</p></section>`;
  main.querySelectorAll("[data-deck]").forEach(b=>b.onclick=()=>{C.deck=b.dataset.deck;cards();});
  const f=document.getElementById("flip");if(f){f.onclick=()=>{C.shown=true;renderCard();document.getElementById("got").focus();};}
  const adv=ok=>{C.seen++;if(ok)C.got++;C.shown=false;C.i++;if(C.i>=deck.cards.length){C.order=shuffle(C.order);C.i=0;}renderCard();document.getElementById("flip").focus();};
  const g=document.getElementById("got");if(g)g.onclick=()=>adv(true);
  const m=document.getElementById("miss");if(m)m.onclick=()=>adv(false);
}

/* ---------- Plotting drills ---------- */
let D={type:"ct",streak:0,best:0,prob:null,answered:false};
const deg=x=>String(x).padStart(3,"0")+"°";
const corr=x=>`${Math.abs(x)}°${x>=0?"E":"W"}`;
const sg=x=>x>=0?"+":"−";
const norm=x=>((x%360)+360)%360;
function newProb(){
  D.answered=false;

function renderDrill(){
  const types=[["ct","Compass to true"],["tc","True to compass"],["std","Speed, time, distance"],["eta","ETA"],["fuel","Fuel"],["rel","Relative bearings"],["sd","Set and drift"],["var","Variation update"],["geo","Light ranges"],["dbl","Bow angles"]],p=D.prob;

  <div class="chips">${types.map(([k,n])=>`<button class="chip" data-t="${k}" aria-pressed="${k===D.type}">${n}</button>`).join("")}</div>
  <div class="formula">${FORM[D.type]}</div>
  <div class="problem"><h2 class="qtext">${p.ask}</h2>
  <div class="answer-row"><input id="ans" inputmode="decimal" autocomplete="off" aria-label="Your answer in ${p.unit}" placeholder="${p.unit}"><button class="btn" id="check">Check answer</button><button class="btn ghost" id="skip">New problem</button></div>
  <div class="fb" id="fb" aria-live="polite"></div></div>

  main.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{D.type=b.dataset.t;drills();});

  const check=()=>{
    if(D.answered){newProb();renderDrill();return;}
    const v=p.kind==="time"?parseTime(inp.value):parseFloat(inp.value.replace(/[°,]/g,""));if(isNaN(v)){document.getElementById("fb").innerHTML=`<p class="muted">Type a number, then check.</p>`;return;}

const words=l=>l.slides.reduce((t,s)=>t+s.say.split(/\s+/).length,0);
const mins=l=>Math.max(1,Math.round(words(l)/140));

/* ---------- Lesson list and player ---------- */
const synth=("speechSynthesis" in window)?window.speechSynthesis:null;
let PL={les:null,i:0,playing:false,sent:0,tok:0,rate:store.rate||1,voice:null,u:null};
function stopSpeech(){PL.playing=false;PL.tok++;if(synth)try{synth.cancel();}catch(e){}if(PL.audio)try{PL.audio.pause();}catch(e){}}
function lessons(){
  const done=store.done||[],total=LESSONS.reduce((t,l)=>t+mins(l),0);
  main.innerHTML=`<section><h1>Lessons</h1><p class="lede">${LESSONS.length} narrated lessons with slides, about ${total} minutes in all. Press play and each lesson reads itself aloud in your device’s built-in voice, moving through the slides as it goes. You can also read along or tap any sentence to jump to it.</p>
  ${Object.entries(MODS).map(([m,info])=>{const ls=LESSONS.filter(l=>l.m===m);return `<h2 class="mod-h">${info.name}</h2><ol class="les-list">${ls.map(l=>`<li><a href="#lesson-${l.id}"><span class="lt">${l.t}</span><span class="lm">${l.slides.length} slides, about ${mins(l)} min${BANK.some(x=>x.tag===l.id)?`, ${BANK.filter(x=>x.tag===l.id).length}-question check`:""}${done.includes(l.id)?`. <span class="fin">Finished</span>`:""}</span></a></li>`).join("")}</ol>`;}).join("")}</section>`;
}
function visual(v){
  if(v.fig&&FIG[v.fig]){const art=FIG[v.fig]();return `<div class="vfig${art.includes("fg strip")?" top":""}"><div class="vfig-art">${art}</div><div class="vfig-txt">${visualBody(v)}</div></div>`;}
  return visualBody(v);
}
function visualBody(v){
  if(v.k==="points")return `<ul class="vpoints">${v.items.map(i=>`<li class="rv-item">${i}</li>`).join("")}</ul>`;
  if(v.k==="callout")return `<div class="callout"><p class="ctag">${v.tag}</p><ul>${v.lines.map(l=>`<li class="rv-item">${l}</li>`).join("")}</ul></div>`;
  if(v.k==="script")return `<ol class="vscript">${v.lines.map(i=>`<li class="rv-item">${i}</li>`).join("")}</ol>`;
  if(v.k==="table")return `<div class="vtable-wrap"><table class="vtable"><thead><tr>${v.head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${v.rows.map(r=>`<tr class="rv-item">${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  if(v.k==="dg")return DG[v.f]();
  if(v.k==="formula")return `<div class="vformula"><p class="big">${v.f}</p>${v.rows.map(r=>`<p>${r}</p>`).join("")}<p class="ex">${v.ex}</p></div>`;
  const fig=(art,l,day)=>`<figure class="rv-item"><div class="stage${day?" day":""}">${art}</div><figcaption>${l}</figcaption></figure>`;
  if(v.k==="lights")return `<div class="vrow">${v.items.map(([d,l])=>fig(drawLights({d}),l)).join("")}</div>`;
  if(v.k==="shapes")return `<div class="vrow">${v.items.map(([s,l])=>fig(drawShapes({s}),l,true)).join("")}</div>`;
  if(v.k==="sounds")return `<div class="vrow">${v.items.map(([p,l])=>fig(drawSound({p}),l)).join("")}</div>`;
  return "";
}
function splitS(t){return (t.match(/[^.!?]+(?:[.!?]+[”’"]?|$)/g)||[t]).map(s=>s.trim()).filter(Boolean);}
function player(id){
  const les=LESSONS.find(l=>l.id===id);PL.les=les;PL.i=(store.pos&&store.pos[id])||0;if(PL.i>=les.slides.length)PL.i=0;PL.sent=0;PL.playing=false;PL.silent=!!store.silent||!synth;PL.triedDefault=false;
  const n=LESSONS.filter(l=>l.m===les.m).indexOf(les)+1;
  main.innerHTML=`<section class="player"><a class="back-link" href="#lessons">All lessons</a><p class="tag" style="margin-top:.8rem">${MODS[les.m].name}, lesson ${n}</p><h1 class="les-title">${les.t}</h1>
  <div id="slide"></div>
  <div class="controls"><button class="btn ghost ctl" id="pv">Previous</button><button class="btn ctl" id="pp">Play</button><button class="btn ghost ctl" id="nx">Next</button><button class="btn ghost ctl" id="askb" title="Like raising your hand in class">Ask a question</button><span class="count" id="cnt"></span></div>
  <div class="opts-row" id="vopts"><label>Speed<select id="rate">${[0.8,0.9,1,1.1,1.25,1.5].map(r=>`<option value="${r}" ${r==PL.rate?"selected":""}>${r}×</option>`).join("")}</select></label><label title="Used only for slides that don’t have recorded narration yet">Device voice<select id="voice"><option value="">Device default</option></select></label><span id="narrsrc" class="narr-src" aria-live="polite"></span><label>Mode<select id="mode"><option value="voice">Read aloud</option><option value="silent" ${PL.silent?"selected":""}>Silent, timed</option></select></label></div>
  <div id="ask" class="askbox" hidden></div>
  <p class="muted" id="nospeech" hidden>This browser can’t read aloud. Read the transcript below instead.</p>
  <h2 class="tr-h">Transcript</h2><div id="tr" class="transcript"></div><div id="endbox"></div></section>`;
  if(!synth){notice("This browser can’t read aloud, so Play steps through the slides with the transcript highlighted at reading pace.");document.getElementById("voice").disabled=true;document.getElementById("mode").disabled=true;}
  document.getElementById("pp").onclick=()=>{if(PL.playing){stopSpeech();setPP();}else{if(PL.sent>=splitS(cur().say).length)PL.sent=0;PL.playing=true;speak();setPP();}};
  document.getElementById("askb").onclick=()=>{const b=document.getElementById("ask");b.hidden=!b.hidden;if(!b.hidden){askPanel();document.getElementById("askq").focus();}};
  document.getElementById("pv").onclick=()=>go(-1);
  document.getElementById("nx").onclick=()=>go(1);
  document.getElementById("rate").onchange=e=>{PL.rate=+e.target.value;store.rate=PL.rate;save();if(PL.playing)speak();};
  document.getElementById("voice").onchange=e=>{const vs=synth?synth.getVoices():[];PL.voice=vs.find(v=>v.name===e.target.value)||null;store.voice=e.target.value;PL.triedDefault=false;document.getElementById("nospeech").hidden=true;save();if(PL.playing)speak();};
  document.getElementById("mode").onchange=e=>{PL.silent=e.target.value==="silent";store.silent=PL.silent;document.getElementById("nospeech").hidden=true;save();if(PL.playing)speak();};
  fillVoices();renderSlide();
}
const cur=()=>PL.les.slides[PL.i];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* ---------- Ask a question ("raise your hand") ----------
   No AI runs inside this site and nothing is sent anywhere by the site itself. The learner's question,
   with the current slide attached for context, opens in a new tab in Claude or Google. Free: no API, no key. */
function askPrompt(q){const s=cur(),les=PL.les;
  return `I’m studying for the U.S. Coast Guard OUPV (“six-pack”) captain’s license exam. I’m on the lesson “${les.t}” (${MODS[les.m].name}), slide “${strip(s.h)}”.\n\nWhat the slide says:\n${strip(s.say)}\n\nMy question: ${q}\n\nPlease answer like a patient instructor: a direct answer first, then the reason, citing the specific Navigation Rule or regulation (for example Rule 3, 33 CFR 83.03). Say whether the Inland and International rules differ, and tell me if you aren’t sure.`;}
function askPanel(){
  const box=document.getElementById("ask");if(!box)return;const les=PL.les;
  const mine=(store.asks||[]).map((a,k)=>({...a,k})).filter(a=>a.l===les.id);
  box.innerHTML=`<h2>Ask a question</h2><p class="muted">Like raising your hand in class. Type your question and it opens in a new tab with this slide attached, so the answer fits what you were just taught.</p>
  <textarea id="askq" rows="3" placeholder="For example: is a charter boat at anchor with clients’ lines in the water “engaged in fishing”?"></textarea>
  <div class="row"><button class="btn" id="askc">Ask Claude</button><button class="btn ghost" id="askg">Search Google</button><button class="btn ghost" id="askcp">Copy question</button><button class="btn ghost" id="askx">Close</button></div>
  <p class="muted ask-note" id="askmsg">Answers come from outside this course and can be wrong. Check them against the rule itself. Claude needs a Claude account; Google needs nothing.</p>
  ${mine.length?`<h3>Your questions in this lesson</h3><ul class="ask-list">${mine.map(a=>`<li><button class="linkish" data-k="${a.k}">${esc(a.q)}</button> <span class="muted">slide ${a.i+1}</span> <button class="linkish del" data-d="${a.k}" aria-label="Remove this question">Remove</button></li>`).join("")}</ul>`:""}`;
  const ta=document.getElementById("askq"),msg=t=>{document.getElementById("askmsg").textContent=t;};
  const take=()=>{const q=ta.value.trim();if(!q){msg("Type your question first.");ta.focus();return null;}
    store.asks=store.asks||[];if(!store.asks.some(a=>a.l===les.id&&a.q===q)){store.asks.push({l:les.id,i:PL.i,q,t:Date.now()});if(store.asks.length>200)store.asks.shift();save();}
    stopSpeech();setPP();return q;};
  document.getElementById("askc").onclick=()=>{const q=take();if(q)window.open("https://claude.ai/new?q="+encodeURIComponent(askPrompt(q)),"_blank","noopener");};
  document.getElementById("askg").onclick=()=>{const q=take();if(q)window.open("https://www.google.com/search?q="+encodeURIComponent("USCG Navigation Rules "+q),"_blank","noopener");};
  document.getElementById("askcp").onclick=()=>{const q=take();if(!q)return;const t=askPrompt(q);
    (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>msg("Copied. Paste it into any AI assistant or search box."),()=>{ta.value=t;ta.select();msg("Select and copy the text above.");});};
  document.getElementById("askx").onclick=()=>{box.hidden=true;};
  box.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{ta.value=store.asks[+b.dataset.k].q;ta.focus();});
  box.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{const keep=ta.value;store.asks.splice(+b.dataset.d,1);save();askPanel();document.getElementById("askq").value=keep;});
}
function setPP(){const b=document.getElementById("pp");if(b)b.textContent=PL.playing?"Pause":"Play";}
function go(d){const was=PL.playing;PL.tok++;if(synth)synth.cancel();if(PL.audio)try{PL.audio.pause();}catch(e){}PL.i=Math.min(PL.les.slides.length-1,Math.max(0,PL.i+d));PL.sent=0;renderSlide();if(was){PL.playing=true;speak();}}
function renderSlide(){
  const les=PL.les,s=cur(),last=PL.i===les.slides.length-1;
  document.getElementById("slide").innerHTML=`<div class="slide"><h2>${s.h}</h2><div class="visual">${visual(s.v)}</div></div>`;reveal(PL.playing?PL.sent-1:999);
  document.getElementById("cnt").textContent=`Slide ${PL.i+1} of ${les.slides.length}`;
  document.getElementById("pv").disabled=PL.i===0;document.getElementById("nx").disabled=last;
  document.getElementById("tr").innerHTML="<p>"+splitS(s.say).map((t,k)=>`<span class="snt" data-k="${k}">${strip(t)}</span>`).join(" ")+"</p>";
  document.querySelectorAll(".snt").forEach(sp=>sp.onclick=()=>{if(!synth)return;PL.sent=+sp.dataset.k;PL.playing=true;speak();setPP();});
  store.pos=store.pos||{};store.pos[les.id]=PL.i;
  const eb=document.getElementById("endbox");
  if(last){store.done=store.done||[];if(!store.done.includes(les.id))store.done.push(les.id);
    const nxt=LESSONS[LESSONS.indexOf(les)+1],nChk=BANK.filter(x=>x.tag===les.id).length;
    eb.innerHTML=`<div class="endbox"><h2>Lesson complete</h2>${nChk?`<p>Check what you just learned with ${nChk} questions from this lesson.</p><div class="row"><button class="btn" id="lc">Take the lesson check</button><button class="btn ghost" id="qz">Quiz the whole module</button>`:`<p>Lock it in with a quiz on ${MODS[les.m].name}.</p><div class="row"><button class="btn" id="qz">Quiz this module</button>`}${nxt?`<a class="btn ghost" href="#lesson-${nxt.id}">Next lesson: ${nxt.t}</a>`:`<a class="btn ghost" href="#test">Take a practice test</a>`}</div></div>`;
    document.getElementById("qz").onclick=()=>{quizMod=les.m;quizAuto=true;location.hash="quiz";};
    const lc=document.getElementById("lc");if(lc)lc.onclick=()=>{stopSpeech();if(store.sess&&store.sess.key==="check-"+les.id){store.sess=null;save();}location.hash="check-"+les.id;};
  }else eb.innerHTML="";
  save();hl(-1);
}
function hl(k){document.querySelectorAll(".snt").forEach(sp=>sp.classList.toggle("on",+sp.dataset.k===k));}
function bestVoice(vs){const loc=vs.filter(v=>v.localService),pool=loc.length?loc:vs;return pool.find(v=>/en[-_]US/i.test(v.lang)&&/natural|neural|enhanced|premium/i.test(v.name))||pool.find(v=>/Samantha|Aria|Jenny|Guy|Ava|Allison|Zira|David|Mark/i.test(v.name))||pool.find(v=>/en[-_]US/i.test(v.lang))||pool[0];}
function fillVoices(){
  const sel=document.getElementById("voice");if(!sel||!synth)return;
  const vs=synth.getVoices().filter(v=>/^en/i.test(v.lang));if(!vs.length)return;
  const pick=store.voice===""?null:((store.voice&&vs.find(v=>v.name===store.voice))||bestVoice(vs));PL.voice=pick;
  sel.innerHTML=`<option value="" ${pick?"":"selected"}>Device default</option>`+vs.map(v=>`<option value="${v.name.replace(/"/g,"&quot;")}" ${v===pick?"selected":""}>${v.name}${v.localService?"":" (online)"}</option>`).join("");
}
if(synth)synth.onvoiceschanged=fillVoices;
function notice(t){const n=document.getElementById("nospeech");if(n){n.textContent=t;n.hidden=false;}}
function speechFailed(why){
  if(PL.voice&&!PL.triedDefault){
    PL.triedDefault=true;PL.voice=null;store.voice="";save();
    const sel=document.getElementById("voice");if(sel)sel.value="";
    notice("That voice didn’t play here, so I switched to your device’s default voice.");
    speak();return;
  }
  PL.playing=false;setPP();
  notice(`Audio didn’t play in this browser (${why}). Try another voice, or set Mode to “Silent, timed” to step through the slides with the transcript highlighted at reading pace.`);
}
const AUDIO_BASE="audio/"; // Narration MP3s + timing files from `npm run audio`, named like rules-01-1.mp3. Slides without a file use browser speech.
function strip(t){return t.replace(/\s*\[(\+|pause)\]\s*/g," ").replace(/\s{2,}/g," ").trim();}
function clean(t){return strip(t).replace(/°/g," degrees").replace(/×/g," times ").replace(/÷/g," divided by ");}
function reveal(k){const items=[...document.querySelectorAll("#slide .rv-item")];if(!PL.les)return;const say=cur().say;if(!/\[\+\]/.test(say)){items.forEach(el=>el.classList.remove("dim"));return;}const ss=splitS(say);let n=0;if(k>=ss.length)n=items.length;else for(let i=0;i<=k&&i<ss.length;i++)n+=(ss[i].match(/\[\+\]/g)||[]).length;items.forEach((el,i)=>el.classList.toggle("dim",i>=n));}
function playFile(tok,ss){const a=PL.audio||(PL.audio=new Audio());const key=`${PL.les.id}-${PL.i+1}`;const words=ss.map(s=>strip(s).split(/\s+/).length),tot=words.reduce((x,y)=>x+y,0);a.src=`${AUDIO_BASE}${key}.mp3`;a.playbackRate=PL.rate;
 // Exact sync: scripts/narrate.py writes {key}.timing.json with each sentence's start time. Without it (or when it
 // can't be fetched, e.g. opened from file://), fall back to splitting the audio by word count.
 let T=null;if(window.fetch)fetch(`${AUDIO_BASE}${key}.timing.json`).then(r=>r.ok?r.json():null).then(j=>{if(tok===PL.tok&&j&&Array.isArray(j.sentences)&&j.sentences.length===ss.length)T=j.sentences;}).catch(()=>{});
 const upd=()=>{if(tok!==PL.tok||!a.duration)return;let k=0;if(T){for(let i=1;i<T.length;i++){if(a.currentTime>=T[i].start)k=i;else break;}}else{const f=a.currentTime/a.duration*tot;let acc=0;for(;k<ss.length-1;k++){acc+=words[k];if(acc>f)break;}}if(k!==PL.sent){PL.sent=k;hl(k);reveal(k);}};
 const tick=()=>{if(tok!==PL.tok||a.paused||a.ended)return;upd();requestAnimationFrame(tick);};
 a.ontimeupdate=upd;a.onplaying=()=>requestAnimationFrame(tick);
 a.onended=()=>{if(tok!==PL.tok)return;hl(-1);reveal(999);if(PL.i<PL.les.slides.length-1){setTimeout(()=>{if(tok!==PL.tok||!PL.playing)return;PL.i++;PL.sent=0;renderSlide();speak();},900);}else{PL.playing=false;setPP();}};
 // A missing file falls back to browser speech for that slide only, so lessons can be narrated one module at a time.
 a.onerror=()=>{if(tok!==PL.tok)return;(PL.missing||(PL.missing={}))[key]=true;speak(true);};PL.sent=0;hl(0);reveal(0);a.play().catch(e=>{if(tok!==PL.tok||(e&&e.name==="AbortError"))return;speak(true);});}
function narrSrc(t){const e=document.getElementById("narrsrc");if(e)e.textContent=t;}
function speak(noFile){
  if(!PL.les)return;const tok=++PL.tok;if(synth)synth.cancel();if(PL.audio)try{PL.audio.pause();}catch(e){}
  const ss=splitS(cur().say);
  const useFile=AUDIO_BASE&&!noFile&&!PL.silent&&!(PL.missing&&PL.missing[`${PL.les.id}-${PL.i+1}`]);
  narrSrc(PL.silent?"":useFile?"Recorded narration":"Device voice");
  if(useFile){playFile(tok,ss);return;}
  const next=()=>{if(tok!==PL.tok)return;PL.sent++;step();};
  const step=()=>{
    if(tok!==PL.tok||!PL.playing)return;
    if(PL.sent>=ss.length){hl(-1);reveal(999);
      if(PL.i<PL.les.slides.length-1){setTimeout(()=>{if(tok!==PL.tok||!PL.playing)return;PL.i++;PL.sent=0;renderSlide();speak();},900);}
      else{PL.playing=false;setPP();}
      return;}
    hl(PL.sent);reveal(PL.sent);
    if(/\[pause\]/.test(ss[PL.sent])&&PL.pz!==PL.sent+":"+tok){PL.pz=PL.sent+":"+tok;setTimeout(()=>{if(tok===PL.tok)step();},750);return;}
    const text=clean(ss[PL.sent]);
    if(PL.silent||!synth){setTimeout(next,Math.max(1500,text.split(/\s+/).length*60000/(160*PL.rate)));return;}
    const u=new SpeechSynthesisUtterance(text);
    u.rate=PL.rate;if(PL.voice){u.voice=PL.voice;u.lang=PL.voice.lang;}else u.lang="en-US";
    let started=false,wd=null;
    const fail=why=>{if(tok!==PL.tok)return;clearTimeout(wd);PL.tok++;try{synth.cancel();}catch(e){}speechFailed(why);};
    wd=setTimeout(()=>{if(!started)fail("no sound started");},6000);
    u.onstart=()=>{started=true;clearTimeout(wd);document.getElementById("nospeech").hidden=true;};
    u.onend=()=>{if(tok!==PL.tok)return;clearTimeout(wd);if(!started)return fail("voice ended without speaking");next();};
    u.onerror=e=>{if(tok!==PL.tok)return;if(e.error==="interrupted"||e.error==="canceled")return;fail(e.error||"speech error");};
    PL.u=u;try{synth.resume();}catch(e){}synth.speak(u);
  };
  setTimeout(step,80);
}
document.addEventListener("keydown",e=>{
  if(!document.querySelector(".player")||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;
  if(e.key==="ArrowRight"){go(1);}else if(e.key==="ArrowLeft"){go(-1);}
  else if(e.key===" "&&e.target===document.body){e.preventDefault();document.getElementById("pp").click();}
});

updateBadge();
route();
</script>
