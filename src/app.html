<style>
:root{
  --land:#EADFC0; --paper:#EEF4F6; --shoal:#D6E7EF; --surface:#FFFFFF; --ink:#14283A; --muted:#506475; --line:#B8CCD7;
  --mag:#A3195B; --mag-ink:#FFFFFF; --mag-soft:#F6E0EB;
  --ok:#1C6E45; --ok-soft:#DCEFE4; --bad:#A8231C; --bad-soft:#F8E0DE;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --land:#3A3829; --paper:#0B141B; --shoal:#14242F; --surface:#111D27; --ink:#DCE7EE; --muted:#97AAB8; --line:#28404F;
    --mag:#E2649F; --mag-ink:#1A0610; --mag-soft:#3A1529;
    --ok:#62C995; --ok-soft:#133224; --bad:#F2877F; --bad-soft:#3A1715;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --land:#3A3829; --paper:#0B141B; --shoal:#14242F; --surface:#111D27; --ink:#DCE7EE; --muted:#97AAB8; --line:#28404F;
  --mag:#E2649F; --mag-ink:#1A0610; --mag-soft:#3A1529;
  --ok:#62C995; --ok-soft:#133224; --bad:#F2877F; --bad-soft:#3A1715;
  color-scheme: dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Source Serif 4",Georgia,"Times New Roman",serif;font-size:1.0625rem;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3,.ui,button,.btn,nav{font-family:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif}
h1{font-size:clamp(2.1rem,6vw,3.4rem);line-height:1.02;font-weight:700;margin:0 0 .5rem;letter-spacing:-.01em}
h2{font-size:1.6rem;line-height:1.15;font-weight:600;margin:0 0 .6rem}
h3{font-size:1.2rem;font-weight:600;margin:0 0 .3rem}
p{margin:0 0 1rem}
a{color:var(--mag)}
:focus-visible{outline:3px solid var(--mag);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-inner{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:1rem;padding:.55rem 1rem}
.brand{display:flex;align-items:center;gap:.5rem;font-weight:700;font-size:1.2rem;color:var(--ink);text-decoration:none;white-space:nowrap}
.brand svg{width:26px;height:26px;color:var(--mag)}
nav{display:flex;gap:.25rem;overflow-x:auto;scrollbar-width:none;flex:1}
nav::-webkit-scrollbar{display:none}
nav a{font-weight:600;font-size:1.02rem;color:var(--muted);text-decoration:none;padding:.4rem .65rem;border-radius:6px;white-space:nowrap}
nav a:hover{color:var(--ink);background:var(--shoal)}
nav a[aria-current="page"]{color:var(--ink);background:var(--shoal)}
.badge{display:inline-block;min-width:1.3em;padding:0 .35em;margin-left:.3em;border-radius:99px;background:var(--mag);color:var(--mag-ink);font-size:.8rem;text-align:center}

main{max-width:960px;margin:0 auto;padding:1.75rem 1rem 4rem}
.lede{font-size:1.15rem;color:var(--muted);max-width:60ch}
.muted{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;font-weight:600;font-size:1.08rem;border:2px solid var(--mag);background:var(--mag);color:var(--mag-ink);padding:.55rem 1.1rem;border-radius:8px;cursor:pointer;text-decoration:none;min-height:44px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--mag)}
.btn[disabled]{opacity:.4;cursor:default}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.95rem;padding:0}

.hero{display:grid;grid-template-columns:1fr auto;gap:2rem;align-items:center;padding:1rem 0 2.5rem;border-bottom:1px solid var(--line);margin-bottom:2rem}
.rose{width:220px;height:220px;color:var(--mag)}
.rose text{font-family:"Barlow Semi Condensed",Arial,sans-serif;font-size:9px;fill:currentColor;text-anchor:middle}
@media (max-width:680px){.hero{grid-template-columns:1fr}.rose{width:150px;height:150px;order:-1}}

.mods{display:grid;gap:0;border-top:1px solid var(--line);margin-bottom:2.5rem}
.mod{display:grid;grid-template-columns:1fr auto;gap:.4rem 1rem;align-items:center;padding:1rem 0;border-bottom:1px solid var(--line)}
.mod .meta{color:var(--muted);font-size:.95rem}
.track{grid-column:1 / -1;height:8px;background:var(--shoal);border-radius:4px;overflow:hidden}
.track span{display:block;height:100%;background:var(--mag)}

.tips ul{padding-left:1.2rem;max-width:62ch}
.tips li{margin-bottom:.5rem}

.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin:0 0 1.2rem}
.chip{font-weight:600;font-size:1rem;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:.4rem .85rem;border-radius:99px;cursor:pointer;min-height:40px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.field-label{font-family:"Barlow Semi Condensed",Arial,sans-serif;font-weight:600;color:var(--muted);margin:0 0 .4rem}

.session{max-width:680px}
.sess-top{display:flex;justify-content:space-between;gap:1rem;font-family:"Barlow Semi Condensed",Arial,sans-serif;font-weight:600;color:var(--muted);margin-bottom:.5rem}
.clock{color:var(--ink);font-variant-numeric:tabular-nums}
.progress{height:4px;background:var(--shoal);border-radius:2px;margin-bottom:1.6rem;overflow:hidden}
.progress span{display:block;height:100%;background:var(--mag)}
.tag{font-family:"Barlow Semi Condensed",Arial,sans-serif;font-weight:600;color:var(--mag);margin:0 0 .3rem}
.qtext{font-family:"Source Serif 4",Georgia,serif;font-weight:600;font-size:1.3rem;line-height:1.4;margin-bottom:1.2rem}
.opts{display:grid;gap:.55rem}
.opt{display:flex;gap:.8rem;align-items:flex-start;text-align:left;width:100%;font-family:"Source Serif 4",Georgia,serif;font-size:1.05rem;line-height:1.45;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:.75rem .9rem;cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--mag)}
.opt .key{font-family:"Barlow Semi Condensed",Arial,sans-serif;font-weight:700;color:var(--muted);min-width:1.1em}
.opt.picked{border-color:var(--mag);background:var(--mag-soft)}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.fb{margin-top:1.1rem}
.verdict{font-family:"Barlow Semi Condensed",Arial,sans-serif;font-weight:700;font-size:1.2rem;margin:0 0 .3rem}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.sess-nav{display:flex;justify-content:flex-end;gap:.6rem;margin-top:1.4rem}

.score{font-family:"Barlow Semi Condensed",Arial,sans-serif;font-size:clamp(2.6rem,9vw,4rem);font-weight:700;line-height:1;margin:.2rem 0 .4rem}
table{width:100%;border-collapse:collapse;margin:1rem 0 2rem;font-size:1rem}
th,td{text-align:left;padding:.55rem .4rem;border-bottom:1px solid var(--line)}
th{font-family:"Barlow Semi Condensed",Arial,sans-serif;font-weight:600;color:var(--muted)}
.pass{color:var(--ok);font-weight:600}.fail{color:var(--bad);font-weight:600}
.miss{padding:1rem 0;border-bottom:1px solid var(--line)}
.miss p{margin:.2rem 0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1rem;max-width:520px}
.stage{background:#04070B;border-radius:10px;display:flex;justify-content:center;align-items:center;padding:.5rem}
.stage.day{background:linear-gradient(#B9D3E2,#DCE9F0)}
.stage svg{width:100%;max-width:340px;height:auto;display:block}
.ctx{font-family:"Barlow Semi Condensed",Arial,sans-serif;font-weight:600;color:var(--muted);margin:.7rem 0 0}
.back{margin-top:.9rem}
.back h2{font-size:1.4rem}
.card-actions{display:flex;gap:.6rem;margin-top:1rem}
.card-actions .btn{flex:1}

.problem{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1.2rem;max-width:620px}
.problem .qtext{margin-bottom:1rem}
.answer-row{display:flex;gap:.6rem;flex-wrap:wrap}
.answer-row input{font:inherit;font-size:1.2rem;width:9rem;padding:.5rem .7rem;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);min-height:44px}
.steps{margin-top:1rem;line-height:1.75}
.streak{font-family:"Barlow Semi Condensed",Arial,sans-serif;font-weight:600;color:var(--muted);margin:1rem 0 0}
.formula{font-family:"Barlow Semi Condensed",Arial,sans-serif;font-size:1.1rem;background:var(--shoal);border-radius:8px;padding:.6rem .9rem;display:inline-block;margin-bottom:1rem}
.les-list{list-style:none;padding:0;margin:0 0 2rem;border-top:1px solid var(--line)}
.les-list a{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:.2rem 1rem;padding:.85rem .2rem;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.les-list a:hover .lt{color:var(--mag)}
.lt{font-family:"Barlow Semi Condensed",Arial,sans-serif;font-weight:600;font-size:1.2rem}
.lm{color:var(--muted);font-size:.95rem}
.lm .fin{color:var(--ok);font-weight:600}
.mod-h{margin-top:1.6rem}
.lcov{font-weight:500;color:var(--muted);white-space:nowrap}
.player{max-width:900px}
.back-link{font-family:"Barlow Semi Condensed",Arial,sans-serif;font-weight:600;text-decoration:none}
.les-title{font-size:clamp(1.8rem,5vw,2.6rem);margin-bottom:1rem}
.slide{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1rem 1.2rem;display:flex;flex-direction:column;min-height:320px}
@media (min-width:720px){.slide{aspect-ratio:16/9}}
.slide h2{font-size:1.5rem;margin-bottom:.5rem}
.visual{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.visual svg.dg{width:100%;height:100%;max-height:440px}
.vpoints,.vscript{margin:0;font-size:clamp(1.05rem,2.2vw,1.35rem);line-height:1.45;align-self:stretch;display:flex;flex-direction:column;justify-content:center;gap:.55rem;max-width:62ch}
.vpoints{padding-left:1.3rem}.vscript{padding-left:1.6rem}
.vpoints li::marker,.vscript li::marker{color:var(--mag);font-weight:700}
.vrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:.8rem;width:100%}
.vrow figure{margin:0}
.ldpair{display:grid;grid-template-columns:3fr 2fr;gap:.3rem}
.vrow:has(.ldpair){grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.ldpair .stage.day{flex-direction:column;justify-content:flex-start;padding:.3rem .3rem .4rem}
.ldpair .stage.day svg{max-height:150px;width:100%}
.bd{font-family:"Barlow Semi Condensed",Arial,sans-serif;font-weight:700;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:#1d2a35}
.bdn{font-family:"Barlow Semi Condensed",Arial,sans-serif;font-size:.78rem;color:#1d2a35;text-align:center;line-height:1.15}
.hear{margin-top:.35rem;font:inherit;font-size:.85rem;font-weight:600;color:var(--mag);background:var(--surface);border:1.5px solid var(--mag);border-radius:999px;padding:.15rem .7rem;cursor:pointer}
.hookq{color:#fff;font-family:"Barlow Semi Condensed",Arial,sans-serif;font-weight:600;font-size:clamp(1.3rem,4vw,1.8rem);text-align:center;padding:1.6rem 1rem;line-height:1.25}
.due{margin:0 0 1.6rem;padding:1rem 1.2rem;border:1px solid var(--line);border-left:6px solid var(--mag);border-radius:12px;background:var(--surface);display:flex;flex-wrap:wrap;gap:.8rem;align-items:center;justify-content:space-between}.due p{margin:0}
.vrow figcaption{font-family:"Barlow Semi Condensed",Arial,sans-serif;font-weight:600;text-align:center;margin-top:.35rem;font-size:1rem;line-height:1.25}
.vformula{text-align:center}
.vformula .big{font-family:"Barlow Semi Condensed",Arial,sans-serif;font-weight:700;font-size:clamp(2.2rem,7vw,3.6rem);color:var(--mag);margin-bottom:.7rem;line-height:1}
.vformula p{margin:.2rem 0;font-size:1.15rem}
.vformula .ex{margin-top:1rem;color:var(--muted)}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem;margin:1rem 0 .7rem}
.ctl{min-width:6.5rem}
.count{font-family:"Barlow Semi Condensed",Arial,sans-serif;font-weight:600;color:var(--muted);margin-left:auto}
.opts-row{display:flex;flex-wrap:wrap;gap:1rem;font-family:"Barlow Semi Condensed",Arial,sans-serif;font-weight:600;color:var(--muted)}
.opts-row select{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:6px;padding:.25rem .4rem;margin-left:.3rem;max-width:15rem}
.tr-h{font-size:1.2rem;margin-top:1.6rem}
.transcript{max-width:68ch}
.sq-hint{font-size:.92rem;margin:.5rem 0 0}
.qstop{margin-top:.8rem;padding:1rem 1.2rem;border:2px solid var(--mag);border-radius:12px;background:var(--mag-soft)}
.qs-tag{font-family:"Barlow Semi Condensed",Arial,sans-serif;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mag);margin:0 0 .3rem;font-size:.9rem}
.qs-q{font-size:1.25rem;font-weight:600;margin:0 0 .4rem}
.recall{margin-bottom:1rem}.recall ol{margin:.8rem 0 0;padding-left:1.3rem}.recall li{margin:.3rem 0;font-size:1.1rem}
.snt{cursor:pointer;border-radius:3px}
.snt:hover{text-decoration:underline;text-decoration-color:var(--line)}
.snt.on{background:var(--mag-soft);box-shadow:0 0 0 3px var(--mag-soft)}
.endbox{margin-top:1.5rem;padding:1.2rem;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.vfig{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:1.3rem;align-items:center;width:100%;height:100%;min-height:0}
.vfig-art{min-height:0;height:100%;display:flex;align-items:center;justify-content:center}
.visual .vfig-art svg.dg:not(.fg){height:auto;max-height:100%}
.visual .vfig-art svg.fg{width:100%;height:auto;max-height:100%;aspect-ratio:11/10;border-radius:12px;display:block}
.vfig-txt{min-width:0;display:flex;align-items:center}
.vfig .vpoints,.vfig .vscript{font-size:clamp(1rem,1.8vw,1.2rem)}
.vfig .callout{width:100%}
@media (max-width:719px){.vfig{grid-template-columns:1fr;height:auto}.vfig-art{height:auto}.visual .vfig-art svg.fg{max-height:340px;width:auto;max-width:100%}}
.vfig.top{grid-template-columns:1fr;grid-template-rows:auto auto;gap:.7rem;height:auto;align-content:center}
.visual:has(.vfig.top){flex:1 0 auto}
@media (min-width:720px){.slide:has(.vfig.top){aspect-ratio:auto;min-height:calc(min(900px,100vw - 2rem)*9/16)}}
.vfig.top .vfig-art{height:auto}
.visual .vfig.top .vfig-art svg.fg{aspect-ratio:64/15;max-height:150px;width:100%}
.vfig.top .vtable{font-size:.95em}
.askbox{margin-top:1rem;padding:1rem 1.2rem;border:1px solid var(--line);border-radius:12px;background:var(--surface);max-width:68ch}
.askbox h2{font-size:1.3rem;margin-bottom:.3rem}.askbox h3{font-size:1.05rem;margin:1rem 0 .3rem}
.askbox textarea{width:100%;font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:.6rem .7rem;margin:.6rem 0;resize:vertical}
.ask-note{font-size:.9rem;margin-top:.7rem}.ask-list{margin:0;padding-left:1.2rem}.ask-list li{margin:.25rem 0}
.linkish{font:inherit;color:var(--mag);background:none;border:0;padding:0;text-align:left;text-decoration:underline;cursor:pointer}.linkish.del{color:var(--muted);font-size:.85rem;margin-left:.4rem}
.s-land{fill:var(--land);stroke:var(--muted);stroke-width:.7}
.dg text{font-family:"Barlow Semi Condensed",Arial,sans-serif}
.s-ink{fill:var(--ink)}.s-mut{fill:var(--muted)}.s-mag{fill:var(--mag)}.s-on{fill:var(--mag-ink)}.s-bg{fill:var(--shoal)}
.s-surfb{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.s-magst{stroke:var(--mag);fill:none}.s-st{stroke:var(--ink);fill:none}.s-lst{stroke:var(--line);fill:none}
.s-lt{fill:#e9f0f4}.s-hull{fill:#7f95a6}.s-rd{fill:#ff8a80}.s-gn{fill:#7ee2a0}
.vtable-wrap{width:100%;overflow-x:auto;align-self:stretch;display:flex;align-items:center}
.vtable{margin:0;font-size:clamp(.88rem,1.7vw,1.08rem);line-height:1.35}
.vtable th,.vtable td{padding:.45rem .55rem;vertical-align:top}
.vtable td:first-child{font-family:"Barlow Semi Condensed",Arial,sans-serif;font-weight:600}
.rv-item{transition:opacity .45s ease}
.rv-item.dim{opacity:.12}
.stage.day.dayhide{opacity:0}.ldpair .stage.day{transition:opacity .45s ease}
.callout{align-self:stretch;display:flex;flex-direction:column;justify-content:center;padding:1rem 1.4rem;border-left:5px solid var(--mag);background:var(--mag-soft);border-radius:10px}
.ctag{font-family:"Barlow Semi Condensed",Arial,sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--mag);font-size:.95rem;margin:0 0 .7rem}
.callout ul{margin:0;padding-left:1.2rem;font-size:clamp(1.1rem,2.4vw,1.5rem);line-height:1.5}
.callout li{margin-bottom:.45rem}
@media (prefers-reduced-motion: no-preference){.opt,.btn,.chip{transition:background-color .15s,border-color .15s}}
.prog h2{margin-top:1.8rem}.prog-top{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:.8rem;margin:1rem 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.8rem 1rem;display:flex;flex-direction:column}
.stat .big{font-family:"Barlow Semi Condensed",Arial,sans-serif;font-weight:700;font-size:2.4rem;line-height:1;color:var(--mag)}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}.chip{min-width:2.6rem;padding:.3rem .4rem;border:1.5px solid var(--line);border-radius:8px;text-align:center;text-decoration:none;font-family:"Barlow Semi Condensed",Arial,sans-serif;font-weight:600;color:var(--ink);background:var(--surface)}
.chip.fin{background:var(--mag);border-color:var(--mag);color:var(--mag-ink)}.chip small{display:block;font-size:.72rem;font-weight:500}
.plain{padding-left:1.2rem}.plain li{margin:.3rem 0}.record{display:none}
@media print{header,nav,.site-foot,.prog>*:not(.record){display:none!important}.record{display:block;color:#000}.record table{width:100%;border-collapse:collapse;margin:.4rem 0 1rem}.record th,.record td{border:1px solid #999;padding:.25rem .5rem;text-align:left;font-size:.9rem}.record .disc{margin-top:1.5rem;font-size:.9rem;border-top:1px solid #999;padding-top:.6rem}body{background:#fff}}
body.render>header,body.render nav,body.render .site-foot{display:none!important}body.render{background:var(--paper);margin:0;padding:0}body.render main{max-width:none;padding:0;margin:0}

</style>

<body>

/* ---------- Storage (per-browser) ---------- */
let store={stats:{},misses:[]};
try{const s=localStorage.getItem("oupv-v1");if(s){const p=JSON.parse(s);if(p&&p.stats)store=p;}}catch(e){}
function save(){try{localStorage.setItem("oupv-v1",JSON.stringify(store));}catch(e){}updateBadge();}
function record(id,ok){
  const s=store.stats[id]||[0,0,0];s[0]++;if(ok)s[1]++;s[2]=ok?1:0;store.stats[id]=s;
  const sr=store.sr||(store.sr={}),o=sr[id]||{b:0},DAY=864e5;if(ok){o.due=Date.now()+[1,2,4,8,16,32][o.b]*DAY;o.b=Math.min(5,o.b+1);}else{o.b=0;o.due=Date.now()+6e5;}sr[id]=o;
  const i=store.misses.indexOf(id);
  if(!ok&&i<0)store.misses.push(id);
  if(ok&&i>=0)store.misses.splice(i,1);
  save();
}
function dueList(){const sr=store.sr||{},now=Date.now();return BANK.filter(x=>sr[x.id]&&sr[x.id].due<=now);}
function updateBadge(){const b=document.getElementById("badge");const n=store.misses.filter(id=>BANK.some(x=>x.id===id)).length;b.hidden=!n;b.textContent=n;}

/* ---------- Helpers ---------- */
const main=document.getElementById("main");
let timer=null,S=null,quizMod="A",quizLen=10,quizAuto=false;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pickQ(m,n){return shuffle(BANK.filter(x=>m==="A"||x.m===m)).slice(0,n);}
function ri(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function fmtTime(ms){const s=Math.max(0,Math.round(ms/1000));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}

/* ---------- Render mode for video (scripts/video.js): index.html?render=1#render-<lesson>-<slide>-<builds> ----------
   Draws one slide state, or a title card, at 1920x1080 with no navigation. Sets body[data-frame] when ready. */
const RENDER=new URLSearchParams(location.search).get("render")==="1";
function stillFigs(root){if(RENDER||(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches))root.querySelectorAll("svg").forEach(s=>{try{s.pauseAnimations();s.setCurrentTime(0);}catch(e){}});}
function renderFrame(spec){
  document.documentElement.dataset.theme="light";document.body.classList.add("render");
  const c=spec.match(/^card-(intro|outro)-(.+)$/),m=spec.match(/^(.+)-(\d+)-(\d+)$/);
  const les=LESSONS.find(l=>l.id===(c?c[2]:m?m[1]:""));
  if(!les){main.innerHTML="";document.body.dataset.frame=spec;return;}
  const n=LESSONS.filter(l=>l.m===les.m).indexOf(les)+1,where=`${MODS[les.m].name}, lesson ${n}`;
  if(c){main.innerHTML=`<div class="rframe card"><p class="tag">${c[1]==="intro"?"Six-Pack Prep":"End of lesson"}</p><h1>${c[1]==="intro"?les.t:"Now take the lesson check"}</h1><p class="rsub">${c[1]==="intro"?where:les.t}</p><p class="rdisc">Practice material. Not an official U.S. Coast Guard examination or approved course.</p></div>`;}
  else{const s=les.slides[+m[2]-1],k=+m[3];
    main.innerHTML=`<div class="rframe"><div class="slide"><h2>${s.h}</h2><div class="visual">${visual(s.v)}</div></div><div class="lower"><span>${where}</span><span>${les.t}</span></div></div>`;
    const items=[...main.querySelectorAll(".rv-item")];if(/\[\+\]/.test(s.say))items.forEach((el,i)=>el.classList.toggle("dim",i>=k));
    stillFigs(main);const sl=main.querySelector(".slide");sl.style.zoom=Math.min(1.85,940/sl.offsetHeight);}
  (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>requestAnimationFrame(()=>{document.body.dataset.frame=spec;}));
}

/* ---------- Router ---------- */
const VIEWS={home,quiz,test,cards,drills,misses,lessons,progress};
function route(){

  else{if(!VIEWS[h])h="home";VIEWS[h]();}
  document.querySelectorAll("nav a").forEach(a=>a.setAttribute("aria-current",a.getAttribute("href")==="#"+h?"page":"false"));
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);

/* ---------- Home ---------- */
function rose(){
  let ticks="",labels="";
  for(let d=0;d<360;d+=5){
    const r1=d%30===0?86:d%10===0?91:95,a=(d-90)*Math.PI/180;
    ticks+=`<line x1="${(100+r1*Math.cos(a)).toFixed(1)}" y1="${(100+r1*Math.sin(a)).toFixed(1)}" x2="${(100+100*Math.cos(a)).toFixed(1)}" y2="${(100+100*Math.sin(a)).toFixed(1)}"/>`;
    if(d%30===0)labels+=`<text x="${(100+76*Math.cos(a)).toFixed(1)}" y="${(100+76*Math.sin(a)+3).toFixed(1)}">${d}</text>`;
  }
  return `<svg class="rose" viewBox="-4 -4 208 208" aria-hidden="true"><circle cx="100" cy="100" r="100" fill="none" stroke="currentColor" stroke-width="1.2"/><circle cx="100" cy="100" r="64" fill="none" stroke="currentColor" stroke-width=".8"/><g stroke="currentColor" stroke-width="1">${ticks}</g>${labels}<polygon points="100,42 108,100 100,158 92,100" fill="currentColor" opacity=".9"/><polygon points="42,100 100,94 158,100 100,106" fill="currentColor" opacity=".35"/><circle cx="100" cy="100" r="3" fill="var(--paper)"/></svg>`;
}

    const qs=BANK.filter(x=>x.m===m);const seen=qs.filter(x=>store.stats[x.id]).length;const ok=qs.filter(x=>store.stats[x.id]&&store.stats[x.id][2]).length;
    return `<div class="mod"><div><h3>${info.name}</h3><div class="meta">${ok} of ${qs.length} answered right on the latest try. ${seen} seen. Pass mark ${info.pass}%.</div></div><button class="btn ghost" data-mod="${m}">Practice</button><div class="track"><span style="width:${(ok/qs.length*100).toFixed(0)}%"></span></div></div>`;

  ${(()=>{const n=dueList().length;return n?`<div class="due"><p><strong>${n} question${n===1?"":"s"} due for review today.</strong> Reviewing just before you’d forget is what makes it stick.</p><button class="btn" id="rev">Review now</button></div>`:"";})()}
  <section><h2>Your progress</h2><p class="muted">${LESSONS.filter(l=>(store.done||[]).includes(l.id)).length} of ${LESSONS.length} lessons finished.</p><div class="mods">${rows}</div></section>
  <section class="tips"><h2>Before exam day</h2><ul>
  <li>Rules of the Road needs 90%. Drill lights, shapes and sound signals daily until they’re instant.</li>
  <li>Read the first word of every rules question: INLAND, INTERNATIONAL or BOTH changes the answer.</li>
  <li>Do plotting on a real training chart with parallel rulers and dividers, not just here.</li>
  <li>Aim for 90% on Rules and 80% everywhere else on two practice tests in a row before you sit the exam.</li></ul></section>
  <p><button class="link" id="reset">Clear my progress</button></p>`;
  main.querySelectorAll("[data-mod]").forEach(b=>b.onclick=()=>{quizMod=b.dataset.mod;quizAuto=true;location.hash="quiz";});
  const rv=document.getElementById("rev");if(rv)rv.onclick=()=>startSession(shuffle(dueList()).slice(0,20),{mode:"learn",title:"Spaced review",key:"review"});
  const r=document.getElementById("reset");let armed=false;
  r.onclick=()=>{if(!armed){armed=true;r.textContent="Click again to clear all progress";return;}store={stats:{},misses:[]};save();home();};
}

/* ---------- Quiz ---------- */
function quiz(){
  if(quizAuto){quizAuto=false;return startSession(pickQ(quizMod,quizLen),{mode:"learn",title:quizMod==="A"?"Mixed quiz":MODS[quizMod].name,key:"quiz"});}
  const mods=[["A","All modules"],...Object.entries(MODS).map(([k,v])=>[k,v.name])];
  main.innerHTML=`<section><h1>Quiz</h1><p class="lede">Instant feedback and an explanation after every answer. Missed questions are saved for review.</p>${resumeHTML("quiz")}
  <p class="field-label">Module</p><div class="chips" id="modchips">${mods.map(([k,n])=>`<button class="chip" data-k="${k}" aria-pressed="${k===quizMod}">${n}</button>`).join("")}</div>
  <p class="field-label">Length</p><div class="chips" id="lenchips">${[10,25].map(n=>`<button class="chip" data-n="${n}" aria-pressed="${n===quizLen}">${n} questions</button>`).join("")}</div>
  <button class="btn" id="go">Start quiz</button></section>`;
  main.querySelectorAll("#modchips .chip").forEach(c=>c.onclick=()=>{quizMod=c.dataset.k;quiz();});
  main.querySelectorAll("#lenchips .chip").forEach(c=>c.onclick=()=>{quizLen=+c.dataset.n;quiz();});
  document.getElementById("go").onclick=()=>startSession(pickQ(quizMod,quizLen),{mode:"learn",title:quizMod==="A"?"Mixed quiz":MODS[quizMod].name,key:"quiz"});wireResume();
}

  <table><thead><tr><th>Module</th><th>Questions</th><th>Pass mark</th></tr></thead><tbody>
  <tr><td>Rules of the Road</td><td>10</td><td>90% (9 of 10)</td></tr><tr><td>Navigation General</td><td>6</td><td>70%</td></tr><tr><td>Deck General & Safety</td><td>5</td><td>70%</td></tr><tr><td>Chart Plotting</td><td>4</td><td>70%</td></tr></tbody></table>

/* ---------- Misses ---------- */
function misses(){
  const list=BANK.filter(x=>store.misses.includes(x.id));
  if(!list.length){main.innerHTML=`<section><h1>Missed questions</h1><p class="lede">Nothing here yet. Questions you get wrong in quizzes and practice tests collect here until you answer them correctly.</p><a class="btn" href="#quiz">Start a quiz</a></section>`;return;}
  const by=Object.keys(MODS).map(m=>[m,list.filter(x=>x.m===m).length]).filter(x=>x[1]);
  main.innerHTML=`<section><h1>Missed questions</h1><p class="lede">${list.length} question${list.length>1?"s":""} to review. Answer one correctly and it leaves this list.</p>
  <table><tbody>${by.map(([m,n])=>`<tr><td>${MODS[m].name}</td><td>${n}</td></tr>`).join("")}</tbody></table>
  <button class="btn" id="go">Review ${list.length} missed question${list.length>1?"s":""}</button></section>`;
  document.getElementById("go").onclick=()=>startSession(shuffle(list),{mode:"learn",title:"Reviewing misses",key:"misses"});

/* ---------- Session engine ---------- */
function tickTimer(){if(!S||!S.end)return;const left=S.end-Date.now();const el=document.getElementById("clock");if(el)el.textContent=fmtTime(left);if(left<=0)finish();}
function saveSess(){if(!S)return;store.sess=S.done?null:{key:S.key,ids:S.items.map(it=>it.q.id),orders:S.items.map(it=>it.order),picks:S.items.map(it=>it.pick),i:S.i,mode:S.mode,title:S.title,end:S.end};save();}
function resumeSess(sv){if(!sv||!sv.ids)return false;const items=sv.ids.map((id,k)=>{const q=BANK.find(x=>x.id===id);return q?{q,order:sv.orders[k],pick:sv.picks[k]}:null;});if(items.some(x=>!x)||!items.length)return false;S={items,i:Math.min(sv.i,items.length-1),mode:sv.mode,title:sv.title,end:sv.end,done:false,key:sv.key};clearInterval(timer);if(S.end)timer=setInterval(tickTimer,1000);renderQ();return true;}
function resumeHTML(key){const s=store.sess;if(!s||s.key!==key||(s.end&&s.end<Date.now()))return "";return `<div class="endbox" style="margin:0 0 1.4rem"><p style="margin:0 0 .6rem">You have an unfinished ${key==="test"?"practice test":"quiz"}, at question ${s.i+1} of ${s.ids.length}.</p><button class="btn" id="resume">Resume where you left off</button></div>`;}
function wireResume(){const b=document.getElementById("resume");if(b)b.onclick=()=>{if(!resumeSess(store.sess)){store.sess=null;save();}};}
function startSession(list,opt){
  S={items:list.map(q=>({q,order:shuffle(q.opts.map((_,i)=>i)),pick:null})),i:0,mode:opt.mode,title:opt.title,end:opt.minutes?Date.now()+opt.minutes*60000:null,done:false,key:opt.key||null};
  clearInterval(timer);
  if(S.end)timer=setInterval(tickTimer,1000);
  renderQ();
}
function renderQ(){
  const it=S.items[S.i],q=it.q,exam=S.mode==="exam",last=S.i===S.items.length-1;
  main.innerHTML=`<section class="session">
  <div class="sess-top"><span>${S.title}</span><span>${S.i+1} of ${S.items.length}</span>${S.end?`<span class="clock" id="clock">${fmtTime(S.end-Date.now())}</span>`:""}</div>
  <div class="progress"><span style="width:${(S.i/S.items.length*100).toFixed(1)}%"></span></div>
  <p class="tag">${MODS[q.m].name}</p>
  <h2 class="qtext">${q.text}</h2>
  <div class="opts">${it.order.map((oi,k)=>`<button class="opt" data-oi="${oi}"><span class="key">${"ABCD"[k]}</span><span>${q.opts[oi]}</span></button>`).join("")}</div>
  <div class="fb" id="fb" aria-live="polite"></div>
  <div class="sess-nav">${exam?`<button class="btn ghost" id="prev" ${S.i===0?"disabled":""}>Previous</button>`:""}<button class="btn" id="next" ${!exam&&it.pick===null?"hidden":""}>${last?(exam?"Finish test":"See results"):"Next question"}</button></div></section>`;
  main.querySelectorAll(".opt").forEach(b=>b.onclick=()=>choose(+b.dataset.oi));
  document.getElementById("next").onclick=()=>{if(last)finish();else{S.i++;renderQ();}};
  const p=document.getElementById("prev");if(p)p.onclick=()=>{S.i--;renderQ();};
  paint();saveSess();
}
function paint(){
  const it=S.items[S.i];
  main.querySelectorAll(".opt").forEach(b=>{
    const oi=+b.dataset.oi;b.className="opt";
    if(S.mode==="exam"){if(it.pick===oi)b.classList.add("picked");}
    else if(it.pick!==null){if(oi===0)b.classList.add("correct");else if(oi===it.pick)b.classList.add("wrong");b.disabled=true;}
  });
  if(S.mode!=="exam"&&it.pick!==null){
    const ok=it.pick===0;
    document.getElementById("fb").innerHTML=`<p class="verdict ${ok?"ok":"bad"}">${ok?"Correct.":"Not quite."}</p><p>${ok?"":`The answer is: ${it.q.opts[0]}. `}${it.q.exp}</p>`;
    document.getElementById("next").hidden=false;
  }
}
function choose(oi){
  const it=S.items[S.i];
  if(S.mode!=="exam"){if(it.pick!==null)return;it.pick=oi;record(it.q.id,oi===0);paint();document.getElementById("next").focus();}
  else{it.pick=oi;paint();}
  saveSess();
}
function finish(){
  if(!S||S.done)return;
  clearInterval(timer);S.done=true;saveSess();
  if(S.mode==="exam")S.items.forEach(it=>record(it.q.id,it.pick===0));
  const by={};S.items.forEach(it=>{const b=by[it.q.m]||(by[it.q.m]={n:0,c:0});b.n++;if(it.pick===0)b.c++;});
  const c=S.items.filter(it=>it.pick===0).length,missed=S.items.filter(it=>it.pick!==0),exam=S.mode==="exam";
  logResult(S,c);
  const allPass=Object.entries(by).every(([m,b])=>b.c/b.n*100>=MODS[m].pass);
  main.innerHTML=`<section class="session"><h1>${exam?(allPass?"You passed every module":"Not there yet"):"Quiz complete"}</h1>

let HORN=null;
function playSignal(pat){
  try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;HORN=HORN||new AC();if(HORN.state==="suspended")HORN.resume();
    if(HORN._g){try{HORN._g.gain.cancelScheduledValues(0);HORN._g.gain.value=0;HORN._g.disconnect();}catch(e){}}
    const g=HORN.createGain(),f=HORN.createBiquadFilter();f.type="lowpass";f.frequency.value=900;g.gain.value=0;f.connect(g);g.connect(HORN.destination);HORN._g=g;
    const o=[155,233,311].map(hz=>{const x=HORN.createOscillator();x.type="sawtooth";x.frequency.value=hz;x.connect(f);x.start();return x;});
    let at=HORN.currentTime+.05;[...pat].forEach(c=>{const d=c==="P"?4.5:1;g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(.16,at+.06);g.gain.setValueAtTime(.16,at+d-.08);g.gain.linearRampToValueAtTime(0,at+d);at+=d+1;});

}

let D={type:"ct",streak:0,best:0,prob:null,answered:false};

  D.answered=false;

    const c=ri(0,359),dev=ri(-6,6)||2,v=ri(-14,14)||-5,m=norm(c+dev),t=norm(m+v);
    D.prob=D.type==="ct"?{ask:`Compass course ${deg(c)}. Deviation ${corr(dev)}. Variation ${corr(v)}. What is the true course?`,ans:t,kind:"deg",unit:"degrees true",
      steps:`Correcting (compass toward true): add east, subtract west.<br>Compass ${deg(c)} ${sg(dev)} ${Math.abs(dev)}° deviation = magnetic ${deg(m)}.<br>Magnetic ${deg(m)} ${sg(v)} ${Math.abs(v)}° variation = true ${deg(t)}.`}
     :{ask:`True course ${deg(t)}. Variation ${corr(v)}. Deviation ${corr(dev)}. What compass course do you steer?`,ans:c,kind:"deg",unit:"degrees compass",
      steps:`Uncorrecting (true toward compass): subtract east, add west.<br>True ${deg(t)} ${sg(-v)} ${Math.abs(v)}° variation = magnetic ${deg(m)}.<br>Magnetic ${deg(m)} ${sg(-dev)} ${Math.abs(dev)}° deviation = compass ${deg(c)}.`};
  }else if(D.type!=="std"){newProb2();}else{

 else if(t==="sd"){const h=[0.5,1,1.5,2,3,4][ri(0,5)],dr=[1,1.5,2,2.4,3,3.6,4.5,6][ri(0,7)],dir=5*ri(0,71),drift=Math.round(dr/h*10)/10,askSet=Math.random()<.5;D.prob={ask:`${h} hours after your last fix, your new fix lies ${dr} nm from your DR position, bearing ${deg(dir)}T from it. What is the ${askSet?"set":"drift, in knots"}?`,ans:askSet?dir:drift,tol:.06,kind:askSet?"deg":"num",unit:askSet?"degrees true":"knots",steps:`Set is the direction from the DR to the fix: ${deg(dir)}T.<br>Drift = distance ÷ time = ${dr} ÷ ${h} ≈ ${drift} knots.`};}

    if(D.answered){newProb();renderDrill();return;}
    const v=p.kind==="time"?parseTime(inp.value):parseFloat(inp.value.replace(/[°,]/g,""));if(isNaN(v)){document.getElementById("fb").innerHTML=`<p class="muted">Type a number, then check.</p>`;return;}
    const ok=p.kind==="deg"?norm(Math.round(v))===p.ans:Math.abs(v-p.ans)<=p.tol;
    D.answered=true;if(ok){D.streak++;D.best=Math.max(D.best,D.streak);}else D.streak=0;
    document.getElementById("fb").innerHTML=`<p class="verdict ${ok?"ok":"bad"}">${ok?"Correct.":`Not quite. The answer is ${p.kind==="deg"?deg(p.ans):p.kind==="time"?hm(p.ans):p.ans+" "+p.unit}.`}</p><div class="steps">${p.steps}</div>`;
    document.getElementById("check").textContent="Next problem";
    document.querySelector(".streak").textContent=`Streak: ${D.streak}. Best this session: ${D.best}.`;
  };
  document.getElementById("check").onclick=check;
  inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();check();}});
  document.getElementById("skip").onclick=()=>{newProb();renderDrill();};
}

// Say why a recording didn't play, so a fallback to the device voice is never silent.
function audioWhy(key,err){const u=`${AUDIO_BASE}${key}.mp3?r=${Date.now()}`;const say=s=>notice(`The recording for this slide didn’t play (${s}), so your device’s voice is reading it. Reload the page to try again.`);if(!window.fetch){say(err||"unknown");return;}fetch(u,{method:"HEAD",cache:"no-store"}).then(r=>say(r.ok?(err||"the browser couldn’t play the file"):`server answered ${r.status}`)).catch(()=>say(err||"no connection"));}
function narrSrc(t){const e=document.getElementById("narrsrc");if(e)e.textContent=t;}
function speak(noFile){
  if(!PL.les)return;const tok=++PL.tok;if(synth)synth.cancel();if(PL.audio)try{PL.audio.pause();}catch(e){}
  const ss=splitS(cur().say);
  const useFile=AUDIO_BASE&&!noFile&&!PL.silent&&!(PL.missing&&PL.missing[`${PL.les.id}-${PL.i+1}`]);
  narrSrc(PL.silent?"":useFile?"Recorded narration":"Device voice");if(!useFile&&!PL.silent){const w=document.getElementById("voicewrap");if(w)w.hidden=false;}
  if(useFile){playFile(tok,ss);return;}
  const next=()=>{if(tok!==PL.tok)return;PL.sent++;step();};
  const step=()=>{
    if(tok!==PL.tok||!PL.playing)return;
    if(PL.sent>=ss.length){hl(-1);reveal(999);
      if(PL.i<PL.les.slides.length-1){setTimeout(()=>{if(tok!==PL.tok||!PL.playing)return;PL.i++;PL.sent=0;renderSlide();speak();},900);}
      else{PL.playing=false;setPP();}
      return;}
    hl(PL.sent);reveal(PL.sent);
    if(askStop(PL.sent,()=>{if(tok===PL.tok){PL.pz=PL.sent+":"+tok;step();}}))return;
    if(/\[pause\]/.test(ss[PL.sent])&&PL.pz!==PL.sent+":"+tok){PL.pz=PL.sent+":"+tok;setTimeout(()=>{if(tok===PL.tok)step();},750);return;}
    const text=clean(ss[PL.sent]);
    if(PL.silent||!synth){setTimeout(next,Math.max(1500,text.split(/\s+/).length*60000/(160*PL.rate)));return;}
    const u=new SpeechSynthesisUtterance(text);
    u.rate=PL.rate;if(PL.voice){u.voice=PL.voice;u.lang=PL.voice.lang;}else u.lang="en-US";
    let started=false,wd=null;
    const fail=why=>{if(tok!==PL.tok)return;clearTimeout(wd);PL.tok++;try{synth.cancel();}catch(e){}speechFailed(why);};
    wd=setTimeout(()=>{if(!started)fail("no sound started");},6000);
    u.onstart=()=>{started=true;clearTimeout(wd);document.getElementById("nospeech").hidden=true;};
    u.onend=()=>{if(tok!==PL.tok)return;clearTimeout(wd);if(!started)return fail("voice ended without speaking");next();};
    u.onerror=e=>{if(tok!==PL.tok)return;if(e.error==="interrupted"||e.error==="canceled")return;fail(e.error||"speech error");};
    PL.u=u;try{synth.resume();}catch(e){}synth.speak(u);
  };
  setTimeout(step,80);
}
document.addEventListener("keydown",e=>{
  if(!document.querySelector(".player")||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;
  if(e.key==="ArrowRight"){go(1);}else if(e.key==="ArrowLeft"){go(-1);}
  else if(e.key===" "&&e.target===document.body){e.preventDefault();document.getElementById("pp").click();}
});

/* ---------- My progress, backup and restore, study record, offline (Task 5; all in the browser) ---------- */
function logResult(S,c){
  store.hist=store.hist||[];
  store.hist.push({t:Date.now(),k:S.key||S.mode,title:S.title||(S.mode==="exam"?"Practice test":"Quiz"),c,n:S.items.length});
  if(store.hist.length>300)store.hist.shift();save();
}
function progress(){
  const done=store.done||[],hist=store.hist||[],d=t=>new Date(t).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});
  const best={};hist.filter(h=>String(h.k).startsWith("check-")).forEach(h=>{const id=h.k.slice(6),p=Math.round(h.c/h.n*100);if(!(id in best)||p>best[id])best[id]=p;});
  const tests=hist.filter(h=>h.k==="test"||h.k==="exam");
  const topic=LESSONS.map(l=>{const qs=BANK.filter(x=>x.tag===l.id&&store.stats[x.id]);const a=qs.reduce((t,x)=>t+store.stats[x.id][0],0),c=qs.reduce((t,x)=>t+store.stats[x.id][1],0);return {l,a,p:a?Math.round(c/a*100):null};}).filter(x=>x.a>=3).sort((x,y)=>x.p-y.p).slice(0,6);
  const worst=BANK.map(x=>({x,w:store.stats[x.id]?store.stats[x.id][0]-store.stats[x.id][1]:0})).filter(o=>o.w>0).sort((a,b)=>b.w-a.w).slice(0,8);
  const answered=Object.keys(store.stats).filter(id=>BANK.some(x=>x.id===id)).length;
  main.innerHTML=`<section class="prog"><h1>My progress</h1><p class="lede">Everything here is stored only in this browser. Back it up to move it to another device.</p>
  <div class="prog-top"><div class="stat"><span class="big">${done.length}</span><span>of ${LESSONS.length} lessons finished</span></div><div class="stat"><span class="big">${answered}</span><span>of ${BANK.length} questions tried</span></div><div class="stat"><span class="big">${tests.length}</span><span>practice tests taken</span></div></div>
  <h2>Lessons and lesson checks</h2>
  ${Object.entries(MODS).map(([m,info])=>{const ls=LESSONS.filter(l=>l.m===m);return `<h3 class="mod-h">${info.name}: ${ls.filter(l=>done.includes(l.id)).length} of ${ls.length}</h3><div class="chips">${ls.map((l,i)=>`<a class="chip${done.includes(l.id)?" fin":""}" href="#lesson-${l.id}" title="${esc(l.t)}">${i+1}${l.id in best?`<small>${best[l.id]}%</small>`:""}</a>`).join("")}</div>`;}).join("")}
  <p class="muted" style="margin-top:.6rem">Filled = lesson finished. The percentage is your best lesson-check score.</p>
  <h2>Practice tests</h2>${tests.length?`<table class="vtable"><thead><tr><th>Date</th><th>Score</th></tr></thead><tbody>${tests.slice(-10).reverse().map(h=>`<tr><td>${d(h.t)}</td><td>${h.c} of ${h.n} (${Math.round(h.c/h.n*100)}%)</td></tr>`).join("")}</tbody></table>`:`<p class="muted">None yet. <a href="#test">Take a practice test</a>.</p>`}
  <h2>Weakest topics</h2>${topic.length?`<ul class="plain">${topic.map(o=>`<li><a href="#lesson-${o.l.id}">${o.l.t}</a>: ${o.p}% correct over ${o.a} answers</li>`).join("")}</ul>`:`<p class="muted">Answer a few lesson-check questions and your weakest topics will show here.</p>`}
  <h2>Questions you miss most</h2>${worst.length?`<ol class="plain">${worst.map(o=>`<li>${o.x.text} <span class="muted">(missed ${o.w}×)</span></li>`).join("")}</ol><p><a class="btn ghost" href="#misses">Practice your misses</a></p>`:`<p class="muted">No misses recorded yet.</p>`}
  <h2>Back up and restore</h2><p>Progress has no account behind it. To carry it to another phone or computer, back it up here and restore it there.</p>
  <div class="row"><button class="btn" id="bk">Back up progress</button><button class="btn ghost" id="rs">Restore progress</button><input type="file" id="rsf" accept="application/json,.json" hidden></div><p class="muted" id="bkmsg" aria-live="polite"></p>
  <h2>Study record</h2><p>Print or save as PDF a summary of the lessons you’ve finished and your scores.</p><div class="row"><button class="btn ghost" id="pr">Print study record</button></div>
  <h2>Use it offline</h2><p id="offmsg">${"serviceWorker" in navigator&&location.protocol==="https:"?"Save the lessons’ narration on this device so the course works without a signal.":"Offline saving works when the course is opened from its website address."}</p><div class="row"><button class="btn ghost" id="off" ${"serviceWorker" in navigator&&location.protocol==="https:"?"":"disabled"}>Save narration for offline use</button></div>
  <div id="record" class="record"><h1>Six-Pack Prep: personal study record</h1><p>Printed ${d(Date.now())}</p><p><strong>${done.length} of ${LESSONS.length}</strong> lessons finished. <strong>${answered} of ${BANK.length}</strong> questions tried.</p>
   ${Object.entries(MODS).map(([m,info])=>`<h2>${info.name}</h2><table><thead><tr><th>Lesson</th><th>Finished</th><th>Best lesson check</th></tr></thead><tbody>${LESSONS.filter(l=>l.m===m).map(l=>`<tr><td>${l.t}</td><td>${done.includes(l.id)?"Yes":"No"}</td><td>${l.id in best?best[l.id]+"%":"Not taken"}</td></tr>`).join("")}</tbody></table>`).join("")}
   <h2>Practice tests</h2>${tests.length?`<table><thead><tr><th>Date</th><th>Score</th></tr></thead><tbody>${tests.map(h=>`<tr><td>${d(h.t)}</td><td>${h.c} of ${h.n} (${Math.round(h.c/h.n*100)}%)</td></tr>`).join("")}</tbody></table>`:"<p>None taken.</p>"}
   <p class="disc">This is a personal record of self-study with practice material. It is not a U.S. Coast Guard credential, certificate, course approval or proof of training, and it does not satisfy any licensing requirement.</p></div></section>`;
  const msg=t=>{document.getElementById("bkmsg").textContent=t;};
  document.getElementById("bk").onclick=()=>{const blob=new Blob([JSON.stringify({app:"six-pack-prep",v:1,saved:new Date().toISOString(),data:store})],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="six-pack-progress-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);msg("Saved a backup file to your downloads.");};
  const f=document.getElementById("rsf");document.getElementById("rs").onclick=()=>f.click();
  f.onchange=()=>{const file=f.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result),dta=o&&o.app==="six-pack-prep"?o.data:null;if(!dta||typeof dta.stats!=="object"||!Array.isArray(dta.misses))throw 0;
    if(!confirm("Replace the progress in this browser with the backup from "+String(o.saved).slice(0,10)+"?"))return;store=dta;save();progress();document.getElementById("bkmsg").textContent="Progress restored.";}catch(e){msg("That file isn’t a Six-Pack Prep backup.");}};r.readAsText(file);f.value="";};
  document.getElementById("pr").onclick=()=>window.print();
  document.getElementById("off").onclick=async()=>{const m=document.getElementById("offmsg"),b=document.getElementById("off");b.disabled=true;
    try{const c=await caches.open("spp-audio-v1");let ok=0,n=0;const urls=[];LESSONS.forEach(l=>l.slides.forEach((s,i)=>{urls.push(`audio/${l.id}-${i+1}.mp3`,`audio/${l.id}-${i+1}.timing.json`);}));
      for(const u of urls){n++;try{if(!(await c.match(u))){const r=await fetch(u);if(r.ok)await c.put(u,r);else continue;}ok++;}catch(e){}if(n%10===0)m.textContent=`Saving narration: ${Math.round(n/urls.length*100)}%`;}
      m.textContent=ok?`Saved ${Math.round(ok/2)} narrated slides on this device. The course now works offline.`:"No narration could be saved. Check your connection and try again.";}catch(e){m.textContent="This browser couldn’t save files for offline use.";}b.disabled=false;};
}
if("serviceWorker" in navigator&&location.protocol==="https:")window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});});
