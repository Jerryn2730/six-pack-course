<style>
:root{

  --mag:#A3195B; --mag-ink:#FFFFFF; --mag-soft:#F6E0EB;
  --ok:#1C6E45; --ok-soft:#DCEFE4; --bad:#A8231C; --bad-soft:#F8E0DE;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --land:#3A3829; --paper:#0B141B; --shoal:#14242F; --surface:#111D27; --ink:#DCE7EE; --muted:#97AAB8; --line:#28404F;
    --mag:#E2649F; --mag-ink:#1A0610; --mag-soft:#3A1529;
    --ok:#62C995; --ok-soft:#133224; --bad:#F2877F; --bad-soft:#3A1715;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --land:#3A3829; --paper:#0B141B; --shoal:#14242F; --surface:#111D27; --ink:#DCE7EE; --muted:#97AAB8; --line:#28404F;
  --mag:#E2649F; --mag-ink:#1A0610; --mag-soft:#3A1529;
  --ok:#62C995; --ok-soft:#133224; --bad:#F2877F; --bad-soft:#3A1715;
  color-scheme: dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Source Serif 4",Georgia,"Times New Roman",serif;font-size:1.0625rem;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3,.ui,button,.btn,nav{font-family:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif}
h1{font-size:clamp(2.1rem,6vw,3.4rem);line-height:1.02;font-weight:700;margin:0 0 .5rem;letter-spacing:-.01em}
h2{font-size:1.6rem;line-height:1.15;font-weight:600;margin:0 0 .6rem}
h3{font-size:1.2rem;font-weight:600;margin:0 0 .3rem}
p{margin:0 0 1rem}
a{color:var(--mag)}
:focus-visible{outline:3px solid var(--mag);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-inner{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:1rem;padding:.55rem 1rem}
.brand{display:flex;align-items:center;gap:.5rem;font-weight:700;font-size:1.2rem;color:var(--ink);text-decoration:none;white-space:nowrap}
.brand svg{width:26px;height:26px;color:var(--mag)}
nav{display:flex;gap:.25rem;overflow-x:auto;scrollbar-width:none;flex:1}
nav::-webkit-scrollbar{display:none}
nav a{font-weight:600;font-size:1.02rem;color:var(--muted);text-decoration:none;padding:.4rem .65rem;border-radius:6px;white-space:nowrap}
nav a:hover{color:var(--ink);background:var(--shoal)}
nav a[aria-current="page"]{color:var(--ink);background:var(--shoal)}
.badge{display:inline-block;min-width:1.3em;padding:0 .35em;margin-left:.3em;border-radius:99px;background:var(--mag);color:var(--mag-ink);font-size:.8rem;text-align:center}

main{max-width:960px;margin:0 auto;padding:1.75rem 1rem 4rem}
.lede{font-size:1.15rem;color:var(--muted);max-width:60ch}
.muted{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;font-weight:600;font-size:1.08rem;border:2px solid var(--mag);background:var(--mag);color:var(--mag-ink);padding:.55rem 1.1rem;border-radius:8px;cursor:pointer;text-decoration:none;min-height:44px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--mag)}
.btn[disabled]{opacity:.4;cursor:default}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.95rem;padding:0}

.hero{display:grid;grid-template-columns:1fr auto;gap:2rem;align-items:center;padding:1rem 0 2.5rem;border-bottom:1px solid var(--line);margin-bottom:2rem}
.rose{width:220px;height:220px;color:var(--mag)}
.rose text{font-family:"Barlow Semi Condensed",Arial,sans-serif;font-size:9px;fill:currentColor;text-anchor:middle}
@media (max-width:680px){.hero{grid-template-columns:1fr}.rose{width:150px;height:150px;order:-1}}

.mods{display:grid;gap:0;border-top:1px solid var(--line);margin-bottom:2.5rem}
.mod{display:grid;grid-template-columns:1fr auto;gap:.4rem 1rem;align-items:center;padding:1rem 0;border-bottom:1px solid var(--line)}
.mod .meta{color:var(--muted);font-size:.95rem}
.track{grid-column:1 / -1;height:8px;background:var(--shoal);border-radius:4px;overflow:hidden}
.track span{display:block;height:100%;background:var(--mag)}

.tips ul{padding-left:1.2rem;max-width:62ch}
.tips li{margin-bottom:.5rem}

.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin:0 0 1.2rem}
.chip{font-weight:600;font-size:1rem;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:.4rem .85rem;border-radius:99px;cursor:pointer;min-height:40px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.field-label{font-family:"Barlow Semi Condensed",Arial,sans-serif;font-weight:600;color:var(--muted);margin:0 0 .4rem}

.session{max-width:680px}
.sess-top{display:flex;justify-content:space-between;gap:1rem;font-family:"Barlow Semi Condensed",Arial,sans-serif;font-weight:600;color:var(--muted);margin-bottom:.5rem}
.clock{color:var(--ink);font-variant-numeric:tabular-nums}
.progress{height:4px;background:var(--shoal);border-radius:2px;margin-bottom:1.6rem;overflow:hidden}
.progress span{display:block;height:100%;background:var(--mag)}
.tag{font-family:"Barlow Semi Condensed",Arial,sans-serif;font-weight:600;color:var(--mag);margin:0 0 .3rem}
.qtext{font-family:"Source Serif 4",Georgia,serif;font-weight:600;font-size:1.3rem;line-height:1.4;margin-bottom:1.2rem}
.opts{display:grid;gap:.55rem}
.opt{display:flex;gap:.8rem;align-items:flex-start;text-align:left;width:100%;font-family:"Source Serif 4",Georgia,serif;font-size:1.05rem;line-height:1.45;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:.75rem .9rem;cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--mag)}
.opt .key{font-family:"Barlow Semi Condensed",Arial,sans-serif;font-weight:700;color:var(--muted);min-width:1.1em}
.opt.picked{border-color:var(--mag);background:var(--mag-soft)}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.fb{margin-top:1.1rem}
.verdict{font-family:"Barlow Semi Condensed",Arial,sans-serif;font-weight:700;font-size:1.2rem;margin:0 0 .3rem}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.sess-nav{display:flex;justify-content:flex-end;gap:.6rem;margin-top:1.4rem}

.score{font-family:"Barlow Semi Condensed",Arial,sans-serif;font-size:clamp(2.6rem,9vw,4rem);font-weight:700;line-height:1;margin:.2rem 0 .4rem}
table{width:100%;border-collapse:collapse;margin:1rem 0 2rem;font-size:1rem}
th,td{text-align:left;padding:.55rem .4rem;border-bottom:1px solid var(--line)}
th{font-family:"Barlow Semi Condensed",Arial,sans-serif;font-weight:600;color:var(--muted)}
.pass{color:var(--ok);font-weight:600}.fail{color:var(--bad);font-weight:600}
.miss{padding:1rem 0;border-bottom:1px solid var(--line)}
.miss p{margin:.2rem 0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1rem;max-width:520px}
.stage{background:#04070B;border-radius:10px;display:flex;justify-content:center;align-items:center;padding:.5rem}
.stage.day{background:linear-gradient(#B9D3E2,#DCE9F0)}
.stage svg{width:100%;max-width:340px;height:auto;display:block}
.ctx{font-family:"Barlow Semi Condensed",Arial,sans-serif;font-weight:600;color:var(--muted);margin:.7rem 0 0}
.back{margin-top:.9rem}
.back h2{font-size:1.4rem}
.card-actions{display:flex;gap:.6rem;margin-top:1rem}
.card-actions .btn{flex:1}

.problem{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1.2rem;max-width:620px}
.problem .qtext{margin-bottom:1rem}
.answer-row{display:flex;gap:.6rem;flex-wrap:wrap}
.answer-row input{font:inherit;font-size:1.2rem;width:9rem;padding:.5rem .7rem;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);min-height:44px}
.steps{margin-top:1rem;line-height:1.75}
.streak{font-family:"Barlow Semi Condensed",Arial,sans-serif;font-weight:600;color:var(--muted);margin:1rem 0 0}
.formula{font-family:"Barlow Semi Condensed",Arial,sans-serif;font-size:1.1rem;background:var(--shoal);border-radius:8px;padding:.6rem .9rem;display:inline-block;margin-bottom:1rem}
.les-list{list-style:none;padding:0;margin:0 0 2rem;border-top:1px solid var(--line)}
.les-list a{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:.2rem 1rem;padding:.85rem .2rem;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.les-list a:hover .lt{color:var(--mag)}
.lt{font-family:"Barlow Semi Condensed",Arial,sans-serif;font-weight:600;font-size:1.2rem}
.lm{color:var(--muted);font-size:.95rem}
.lm .fin{color:var(--ok);font-weight:600}
.mod-h{margin-top:1.6rem}
.lcov{font-weight:500;color:var(--muted);white-space:nowrap}
.player{max-width:900px}
.back-link{font-family:"Barlow Semi Condensed",Arial,sans-serif;font-weight:600;text-decoration:none}
.les-title{font-size:clamp(1.8rem,5vw,2.6rem);margin-bottom:1rem}
.slide{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1rem 1.2rem;display:flex;flex-direction:column;min-height:320px}
@media (min-width:720px){.slide{aspect-ratio:16/9}}
.slide h2{font-size:1.5rem;margin-bottom:.5rem}
.visual{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.visual svg.dg{width:100%;height:100%;max-height:440px}
.vpoints,.vscript{margin:0;font-size:clamp(1.05rem,2.2vw,1.35rem);line-height:1.45;align-self:stretch;display:flex;flex-direction:column;justify-content:center;gap:.55rem;max-width:62ch}
.vpoints{padding-left:1.3rem}.vscript{padding-left:1.6rem}
.vpoints li::marker,.vscript li::marker{color:var(--mag);font-weight:700}
.vrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:.8rem;width:100%}
.vrow figure{margin:0}
.hear{margin-top:.35rem;font:inherit;font-size:.85rem;font-weight:600;color:var(--mag);background:var(--surface);border:1.5px solid var(--mag);border-radius:999px;padding:.15rem .7rem;cursor:pointer}
.hookq{color:#fff;font-family:"Barlow Semi Condensed",Arial,sans-serif;font-weight:600;font-size:clamp(1.3rem,4vw,1.8rem);text-align:center;padding:1.6rem 1rem;line-height:1.25}
.due{margin:0 0 1.6rem;padding:1rem 1.2rem;border:1px solid var(--line);border-left:6px solid var(--mag);border-radius:12px;background:var(--surface);display:flex;flex-wrap:wrap;gap:.8rem;align-items:center;justify-content:space-between}.due p{margin:0}
.vrow figcaption{font-family:"Barlow Semi Condensed",Arial,sans-serif;font-weight:600;text-align:center;margin-top:.35rem;font-size:1rem;line-height:1.25}
.vformula{text-align:center}
.vformula .big{font-family:"Barlow Semi Condensed",Arial,sans-serif;font-weight:700;font-size:clamp(2.2rem,7vw,3.6rem);color:var(--mag);margin-bottom:.7rem;line-height:1}
.vformula p{margin:.2rem 0;font-size:1.15rem}
.vformula .ex{margin-top:1rem;color:var(--muted)}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem;margin:1rem 0 .7rem}
.ctl{min-width:6.5rem}
.count{font-family:"Barlow Semi Condensed",Arial,sans-serif;font-weight:600;color:var(--muted);margin-left:auto}
.opts-row{display:flex;flex-wrap:wrap;gap:1rem;font-family:"Barlow Semi Condensed",Arial,sans-serif;font-weight:600;color:var(--muted)}
.opts-row select{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:6px;padding:.25rem .4rem;margin-left:.3rem;max-width:15rem}
.tr-h{font-size:1.2rem;margin-top:1.6rem}
.transcript{max-width:68ch}
.snt{cursor:pointer;border-radius:3px}
.snt:hover{text-decoration:underline;text-decoration-color:var(--line)}
.snt.on{background:var(--mag-soft);box-shadow:0 0 0 3px var(--mag-soft)}
.endbox{margin-top:1.5rem;padding:1.2rem;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.vfig{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:1.3rem;align-items:center;width:100%;height:100%;min-height:0}
.vfig-art{min-height:0;height:100%;display:flex;align-items:center;justify-content:center}
.visual .vfig-art svg.dg:not(.fg){height:auto;max-height:100%}
.visual .vfig-art svg.fg{width:100%;height:auto;max-height:100%;aspect-ratio:11/10;border-radius:12px;display:block}
.vfig-txt{min-width:0;display:flex;align-items:center}
.vfig .vpoints,.vfig .vscript{font-size:clamp(1rem,1.8vw,1.2rem)}
.vfig .callout{width:100%}
@media (max-width:719px){.vfig{grid-template-columns:1fr;height:auto}.vfig-art{height:auto}.visual .vfig-art svg.fg{max-height:340px;width:auto;max-width:100%}}
.vfig.top{grid-template-columns:1fr;grid-template-rows:auto auto;gap:.7rem;height:auto;align-content:center}
.visual:has(.vfig.top){flex:1 0 auto}
@media (min-width:720px){.slide:has(.vfig.top){aspect-ratio:auto;min-height:calc(min(900px,100vw - 2rem)*9/16)}}
.vfig.top .vfig-art{height:auto}
.visual .vfig.top .vfig-art svg.fg{aspect-ratio:64/15;max-height:150px;width:100%}
.vfig.top .vtable{font-size:.95em}
.askbox{margin-top:1rem;padding:1rem 1.2rem;border:1px solid var(--line);border-radius:12px;background:var(--surface);max-width:68ch}
.askbox h2{font-size:1.3rem;margin-bottom:.3rem}.askbox h3{font-size:1.05rem;margin:1rem 0 .3rem}
.askbox textarea{width:100%;font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:.6rem .7rem;margin:.6rem 0;resize:vertical}
.ask-note{font-size:.9rem;margin-top:.7rem}.ask-list{margin:0;padding-left:1.2rem}.ask-list li{margin:.25rem 0}
.linkish{font:inherit;color:var(--mag);background:none;border:0;padding:0;text-align:left;text-decoration:underline;cursor:pointer}.linkish.del{color:var(--muted);font-size:.85rem;margin-left:.4rem}
.s-land{fill:var(--land);stroke:var(--muted);stroke-width:.7}
.dg text{font-family:"Barlow Semi Condensed",Arial,sans-serif}
.s-ink{fill:var(--ink)}.s-mut{fill:var(--muted)}.s-mag{fill:var(--mag)}.s-on{fill:var(--mag-ink)}.s-bg{fill:var(--shoal)}
.s-surfb{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.s-magst{stroke:var(--mag);fill:none}.s-st{stroke:var(--ink);fill:none}.s-lst{stroke:var(--line);fill:none}
.s-lt{fill:#e9f0f4}.s-hull{fill:#7f95a6}.s-rd{fill:#ff8a80}.s-gn{fill:#7ee2a0}
.vtable-wrap{width:100%;overflow-x:auto;align-self:stretch;display:flex;align-items:center}
.vtable{margin:0;font-size:clamp(.88rem,1.7vw,1.08rem);line-height:1.35}
.vtable th,.vtable td{padding:.45rem .55rem;vertical-align:top}
.vtable td:first-child{font-family:"Barlow Semi Condensed",Arial,sans-serif;font-weight:600}

.rv-item.dim{opacity:.12}
.callout{align-self:stretch;display:flex;flex-direction:column;justify-content:center;padding:1rem 1.4rem;border-left:5px solid var(--mag);background:var(--mag-soft);border-radius:10px}
.ctag{font-family:"Barlow Semi Condensed",Arial,sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--mag);font-size:.95rem;margin:0 0 .7rem}
.callout ul{margin:0;padding-left:1.2rem;font-size:clamp(1.1rem,2.4vw,1.5rem);line-height:1.5}
.callout li{margin-bottom:.45rem}
@media (prefers-reduced-motion: no-preference){.opt,.btn,.chip{transition:background-color .15s,border-color .15s}}
.prog h2{margin-top:1.8rem}.prog-top{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:.8rem;margin:1rem 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.8rem 1rem;display:flex;flex-direction:column}
.stat .big{font-family:"Barlow Semi Condensed",Arial,sans-serif;font-weight:700;font-size:2.4rem;line-height:1;color:var(--mag)}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}.chip{min-width:2.6rem;padding:.3rem .4rem;border:1.5px solid var(--line);border-radius:8px;text-align:center;text-decoration:none;font-family:"Barlow Semi Condensed",Arial,sans-serif;font-weight:600;color:var(--ink);background:var(--surface)}
.chip.fin{background:var(--mag);border-color:var(--mag);color:var(--mag-ink)}.chip small{display:block;font-size:.72rem;font-weight:500}
.plain{padding-left:1.2rem}.plain li{margin:.3rem 0}.record{display:none}
@media print{header,nav,.site-foot,.prog>*:not(.record){display:none!important}.record{display:block;color:#000}.record table{width:100%;border-collapse:collapse;margin:.4rem 0 1rem}.record th,.record td{border:1px solid #999;padding:.25rem .5rem;text-align:left;font-size:.9rem}.record .disc{margin-top:1.5rem;font-size:.9rem;border-top:1px solid #999;padding-top:.6rem}body{background:#fff}}
body.render>header,body.render nav,body.render .site-foot{display:none!important}body.render{background:var(--paper);margin:0;padding:0}body.render main{max-width:none;padding:0;margin:0}

.rframe.card{gap:18px;text-align:center}.rframe.card .tag{font-size:34px}.rframe.card h1{font-size:104px;max-width:1500px;line-height:1.05;margin:0}.rframe.card .rsub{font-size:44px;color:var(--muted);margin:0}.rframe.card .rdisc{font-size:26px;color:var(--muted);margin-top:60px}
.site-foot{max-width:900px;margin:40px auto 0;padding:16px 16px 28px;border-top:1px solid var(--line);color:var(--muted);font-size:.85rem;text-align:center}

</style>

const COURSE={"modules":{"R":{"name":"Rules of the Road","pass":90},"N":{"name":"Navigation General","pass":70},"D":{"name":"Deck General & Safety","pass":70},"P":{"name":"Chart Plotting","pass":70}},"lessons":[{"id":"rules-01","module":"R","title":"Where the rules apply","status":"draft-unverified","covers":"Rules 1 and 2, annexes","slides":[{"heading":"Welcome aboard","visual":{"k":"callout","tag":"Welcome aboard","lines":["Rules of the Road: the module that needs 90%","15 lessons, Rules 1 through 38 and the annexes","A short lesson check after every lesson"],"fig":"passmark"},"script":"Welcome aboard. I’m glad you’re here. Over the next fifteen lessons, we’re going to work through the Navigation Rules together, the part of the captain’s exam that trips up more people than any other. [+] Here’s why. Every other module needs seventy percent to pass. This one needs ninety. Out of fifty questions, you can miss only about five. [+] So we’ll cover every rule, from Rule one through Rule thirty-eight, plus the annexes the exam pulls from, [+] and after each lesson there’s a short check so you can make sure it stuck. [pause] Don’t worry about memorizing everything today. Just get comfortable with how the rules are built. The memorizing comes later, and I’ll give you plenty of tricks for it.","video":"Instructor on a charter boat’s flybridge at the dock, early morning."},{"heading":"Picture this","visual":{"k":"callout","tag":"Picture this","lines":["5:30 a.m.: you leave the dock in Tampa Bay","You run out past Egmont Key into the Gulf","Somewhere on that run, the rules changed"],"fig":"tampabay"},"script":"Let’s start with a picture. [+] It’s five-thirty in the morning, and you’re leaving the dock in Tampa Bay with four anglers aboard. [+] You run down the bay, out past Egmont Key, and into the open Gulf to fish a ledge. [+] Here’s my question. Somewhere on that run, the rules you were following changed. Did you notice? [pause] Most captains never do, because the differences are small. But they’re real, and the exam loves them. In the bay, you were under the Inland rules. Out in the Gulf, you were under the International rules. So let’s find that line.","video":"Drone shot: a charter boat running down Tampa Bay at dawn and out past Egmont Key."},{"heading":"Two sets of rules","visual":{"k":"table","head":["","International (COLREGS)","Inland"],"rows":[["Where","High seas and connected waters, seaward of the demarcation lines","U.S. inland waters, shoreward of the demarcation lines"],["Source","1972 international convention","U.S. law, 33 CFR Part 83"],["Applies to","All vessels on those waters","All vessels on U.S. inland waters, and U.S. vessels on Canadian Great Lakes waters"]],"fig":"twobooks"},"script":"There are two rule books, and they’re mostly identical. [+] The International rules, usually called the COLREGS, govern the high seas and the waters connected to them. [+] They come from a 1972 treaty, while the Inland rules are American law, covering our harbors, bays, rivers and the Intracoastal Waterway. [+] Each set applies to every vessel on its waters, whatever flag she flies. [pause] So where’s the line? It’s called the COLREGS demarcation line, and it’s printed on your chart as a dashed magenta line, usually stretched across the mouth of a harbor or inlet. In Florida, you cross it every time you head out an inlet. Here’s some homework: find it on your local chart this week. It makes all of this real.","video":"Chart close-up: a dashed magenta COLREGS demarcation line across a Florida inlet."},{"heading":"Rule 1: what can sit alongside the rules","visual":{"k":"points","items":["Special local rules for harbors, rivers and lakes, conforming as closely as possible","Extra station or signal lights for warships, convoys and fishing fleets","Traffic separation schemes adopted by IMO","Vessels of special construction comply as closely as possible"],"fig":"rule1"},"script":"Rule one also tells you what can sit alongside these rules, and there are four things to know. [+] First, local authorities can make special rules for a particular harbor, river or lake. But those rules must conform as closely as possible to the Navigation Rules. They can add to them, not throw them out. [+] Second, governments can allow extra lights and shapes for warships, convoys, and fishing fleets working together, and extra whistle signals for warships and convoys. So if you see an odd light on a Navy ship, that’s why. [+] Third, traffic separation schemes, the highway lanes for big ships, are adopted internationally. We’ll cover them in lesson four. [+] And fourth, a vessel of unusual construction that can’t place her lights exactly as required may use the closest alternative her government approves. Inland, that’s called a certificate of alternative compliance.","video":"Navy ship at a Florida port at dusk, showing unusual extra lights."},{"heading":"Rule 2: the rule above all rules","visual":{"k":"points","items":["No rule excuses neglect of ordinary seamanship","Have due regard to all dangers and special circumstances","Depart from the rules when needed to avoid immediate danger","The rules say who keeps clear, not who has a “right of way”"],"fig":"rule2"},"script":"Now, Rule two. If you remember only one rule from this whole course, make it this one. [+] Rule two says nothing in the rules excuses you from the consequences of neglecting ordinary seamanship. In plain English: the rule book is not a shield. [+] You must pay attention to every danger and every special circumstance, including what the other boat can and can’t do. [+] And sometimes, to avoid immediate danger, you have to depart from the rules. That isn’t just allowed, it’s expected. [pause] Here’s how I think about it. Picture yourself as the stand-on boat, holding your course, while a tug pushing a barge clearly isn’t turning. If you hold your course right into that barge, you followed the rules, and you’ll still be found at fault. [+] Notice too that the rules almost never say right of way. They say who keeps out of the way, and who stands on. That’s a mindset, not a privilege.","video":"A tug pushing a barge in a channel while a small boat holds course toward it, then turns away."},{"heading":"The annexes","visual":{"k":"table","head":["Annex","Covers"],"rows":[["I","Positioning and technical details of lights and shapes"],["II","International: extra signals for fishing vessels fishing close together. Inland: now in Rule 26"],["III","Technical details of sound signal appliances"],["IV","Distress signals"],["V","Inland only: pilot rules, covering law enforcement lights and public safety activities"]],"fig":"annexes"},"script":"The rules end with annexes, and yes, the exam asks about them. Let me give you a one-line handle on each. [+] Annex one is the engineering annex: exactly where lights go, how far apart, how bright. [+] Annex two covers extra signals for fishing boats working close together, like trawlers in a fleet. That annex is International only. In the Inland rules, the same signals now sit inside Rule twenty-six, and Annex two is left empty. [+] Annex three is the technical spec for whistles, bells and gongs. [+] Annex four is the big one for you: distress signals. We’ll spend real time on those in lesson fourteen. [+] And the Inland rules add Annex five, the pilot rules, which cover the blue lights on law enforcement boats and public safety activities.","video":"Montage: a masthead light being mounted, a ship’s whistle, a red hand flare, a law enforcement boat’s blue light."},{"heading":"Four exam habits","visual":{"k":"points","items":["Find INLAND, INTERNATIONAL or BOTH first","Watch vessel lengths: 7, 12, 20, 50 and 100 m","“In sight of one another” or restricted visibility?","Choose the answer that matches the rule’s wording"],"fig":"lengths"},"script":"Before we move on, here are four habits that will save you points on every rules question. [+] First, find the word Inland, International or Both at the start of the question, and answer for that rule book. Circle it if you’re on paper. [+] Second, watch vessel lengths. Seven, twelve, twenty, fifty and one hundred meters are the magic numbers, and rules change at each one. [+] Third, ask yourself: are these boats in sight of each other, or are we in fog? Different rules apply, and you’ll see why in lesson eight. [+] And fourth, when two answers both sound reasonable, pick the one that matches the rule’s actual wording. The exam is written straight from the rule book, not from what people do at the dock. [pause] That’s lesson one. Next, we’ll nail down the definitions, the vocabulary every other rule depends on.","video":"Close-up of a pencil circling the word INLAND on a printed exam question."}]},{"id":"rules-02","module":"R","title":"Definitions that decide answers","status":"draft-unverified","covers":"Rule 3","slides":[{"heading":"Why definitions matter","visual":{"k":"callout","tag":"Why this matters","lines":["Every rule depends on Rule 3’s definitions","Many exam questions are definitions in disguise","Get these right and later lessons get easier"],"fig":"defmap"},"script":"Today’s lesson might sound dry, definitions, but stay with me, because this is where a lot of easy points live. [+] Every rule we’ll study depends on the words defined in Rule three. Is that boat sailing or power-driven? Is she underway? Is she engaged in fishing? [+] A huge number of exam questions are really definition questions in disguise. [+] Get these words right, and every later lesson gets easier. So let’s go through them the way a captain would, with real examples.","video":"Instructor at the helm, Rule 3 text visible in the handbook on the console."},{"heading":"Kinds of vessels","visual":{"k":"points","items":["Vessel: every watercraft, including non-displacement craft, WIG craft and seaplanes","Power-driven vessel: propelled by machinery","Sailing vessel: under sail, with any engine not being used","Seaplane: an aircraft designed to maneuver on the water"],"fig":"vesselkinds"},"script":"First, what counts as a vessel? [+] Pretty much anything that floats and can carry people or things across the water: boats, ships, barges, hovercraft, even seaplanes and wing-in-ground craft. [+] A power-driven vessel is anything propelled by machinery. Simple. [+] A sailing vessel is under sail, with one important catch: any engine she has must not be in use. [pause] So here’s a classic exam question. A sailboat is heading out the pass with every sail up, and her engine is running to help her along. What is she? [pause] She’s a power-driven vessel. The moment that engine turns the prop, the rules treat her like any other powerboat. [+] And a seaplane is simply an aircraft designed to maneuver on the water.","video":"A sailboat motoring out a Florida pass with sails up and engine running."},{"heading":"“Engaged in fishing”","visual":{"k":"points","items":["Nets, lines, trawls or other gear that restrict maneuverability","Does NOT include trolling lines","A charter boat trolling or drifting with rods out is power-driven","A trawler heading home with gear stowed is power-driven","Anchored with clients’ rods out: still not “engaged in fishing”"],"fig":"fishing"},"script":"Now one that matters to you as a charter captain: engaged in fishing. [+] Under the rules, it means fishing with nets, lines, trawls or other gear that restricts your ability to maneuver. [+] And here’s the key: it does not include trolling lines. [pause] So picture your morning. You’ve got four lines out, trolling for kingfish along the beach. Are you engaged in fishing? [+] No. Legally you’re just a power-driven vessel. You get no special privileges, and you keep clear of sailboats like any other powerboat. [+] Meanwhile, the shrimp boat working her nets nearby is engaged in fishing. But when that same shrimper stows her nets and heads home, she’s an ordinary power-driven vessel too. [+] And what if you’re anchored over a wreck with your clients’ lines down? Same answer. Rods and reels don’t restrict your ability to maneuver, so you’re simply a power-driven vessel at anchor. You show anchor lights, not fishing lights. It’s about what the gear is doing, not what kind of boat it is. It isn’t about commercial or recreational either. The only test is whether the gear restricts her maneuverability.","video":"Split screen: a charter boat trolling four lines beside a shrimp boat working its nets."},{"heading":"Broken or busy?","visual":{"k":"table","head":["","Not under command","Restricted in ability to maneuver"],"rows":[["Cause","An exceptional circumstance","The nature of her work"],["Think","Broken","Busy"],["Examples","Engine failure, jammed rudder","Dredging; buoy, cable or pipeline work; surveying; diving; a tow that limits her course"]],"fig":"brokenbusy"},"script":"These two get mixed up all the time, so let’s separate them. [+] Not under command is about cause: some exceptional circumstance, like a failed engine or a jammed rudder, means the vessel can’t maneuver as the rules require. [+] So the word to remember is broken. [+] Restricted in her ability to maneuver is about work: the job she’s doing keeps her from getting out of the way. Dredging, laying cable, servicing a buoy, diving operations, surveying, or a tow that pins her to her course. [pause] Here’s my trick. Ask yourself: is she broken, or is she busy? Broken means not under command. Busy means restricted.","video":"A disabled sportfisher drifting with no power, then a dredge working in a channel."},{"heading":"Underway, or making way?","visual":{"k":"points","items":["Constrained by draft: International only; a big ship limited by depth and channel width","Underway: not at anchor, made fast to the shore, or aground","Making way: moving through the water under her own power","Drifting over a wreck: underway, but not making way"],"fig":"underway"},"script":"Next, a category that only exists offshore. [+] Constrained by her draft is International only. It’s a big ship whose draft, compared with the depth and width of the water, means she really can’t deviate from her course. You won’t find it in the Inland rules at all. [+] Now, underway. A vessel is underway if she’s not at anchor, not made fast to the shore, and not aground. [+] Making way means actually moving through the water under her own power. [pause] So imagine you shut down to drift over a wreck. You’re not anchored, not tied up, and not aground. [+] You’re underway, but not making way. As you’ll see later, both your lights and your fog signals depend on that difference.","video":"A charter boat drifting with engines off over a wreck, anglers bottom fishing."},{"heading":"In sight, and visibility","visual":{"k":"points","items":["Length and breadth: length overall and greatest breadth","In sight of one another: seen with the eyes, not electronics","Restricted visibility: fog, mist, snow, heavy rain, sandstorms; not darkness","A radar or AIS contact in fog is NOT “in sight”"],"fig":"insight"},"script":"A few more precise phrases. [+] Length and breadth mean length overall and greatest breadth. Nothing fancy. [+] In sight of one another means one vessel can actually be seen visually from the other. Eyes, not electronics. [+] Restricted visibility means visibility reduced by fog, mist, falling snow, heavy rain, sandstorms or anything similar. Notice what’s not on that list: darkness. A clear night is not restricted visibility. [+] And here’s the one that catches people. If you see a target on your radar or AIS in thick fog, you are not in sight of that vessel. That single fact decides which steering rules apply, and we’ll lean on it heavily in lesson eight.","video":"A radar screen showing a target in fog, then the same boat emerging from the fog."},{"heading":"Inland-only definitions","visual":{"k":"points","items":["Inland waters: navigable U.S. waters shoreward of the demarcation lines","Great Lakes: including connecting and tributary waters","Western Rivers: the Mississippi system, with the Atchafalaya and Red Rivers","When a question names these waters, expect a special rule"],"fig":"westernrivers"},"script":"Finally, the Inland rules add a few definitions of their own. [+] Inland waters are the navigable waters of the United States shoreward of the demarcation lines. [+] The Great Lakes include their connecting and tributary waters. [+] The Western Rivers are the Mississippi River system, including the Atchafalaya and the Red River. [+] When a question mentions any of these places, expect a special rule. You may never run a charter on the Mississippi, but the exam will still ask about it. [pause] That’s our vocabulary. Next, we’ll put it to work with the duties every vessel has in any visibility: lookout, safe speed, and judging the risk of collision.","video":"Map animation highlighting U.S. inland waters, the Great Lakes and the Mississippi river system."}]},{"id":"rules-03","module":"R","title":"Lookout, safe speed and risk of collision","status":"draft-unverified","covers":"Rules 4 to 8","slides":[{"heading":"The lookout","visual":{"k":"points","items":["Rules 4 to 10 apply in any condition of visibility","Lookout by sight and hearing, at all times","Use every available means: radar, AIS, radio","Goal: a full appraisal of the situation and the risk"],"fig":"lookout"},"script":"Let’s start with the duty that shows up in nearly every collision report: the lookout. [+] Rules four through ten apply in any visibility, clear or foggy, day or night. [+] Rule five says every vessel shall at all times keep a proper lookout, by sight and by hearing. [+] And by all available means. If you have radar, AIS and a VHF, they’re part of your lookout. [+] The goal is a full appraisal of the situation and the risk of collision. [pause] Now be honest with yourself. On a busy charter, with a fish on, a tangled line, and a customer asking a question, who’s keeping the lookout? If the answer is nobody, that’s exactly the gap where accidents happen.","video":"A busy charter cockpit: fish on, lines tangled, and the captain glancing forward."},{"heading":"Rule 6: safe speed","visual":{"k":"points","items":["Visibility","Traffic density, including fishing boats","Your stopping distance and turning ability","Background lights at night","Wind, sea, current and nearby hazards","Draft compared to available depth"],"fig":"stopping"},"script":"Rule six is safe speed, and the first thing to know is that there’s no number in it. Safe speed means you can take proper action to avoid a collision, and stop within a distance that fits the conditions. So you weigh the factors. [+] Visibility, obviously. [+] Traffic density, including clusters of fishing boats. [+] Your own boat’s maneuverability: how fast she stops, how tightly she turns. [+] At night, background lights. Try picking out a running light against the condo lights of Clearwater Beach. [+] The state of the wind, sea and current, and nearby hazards. [+] And your draft compared to the depth of the water. [pause] Twenty knots might be perfectly safe in the open Gulf at noon, and reckless in the Intracoastal at dusk.","video":"Night view from a helm: a boat’s running lights almost lost against the condo lights of Clearwater Beach."},{"heading":"Safe speed with radar","visual":{"k":"points","items":["Radar’s characteristics, efficiency and limitations","Limits of the range scale in use","Sea state, rain and interference hiding targets","Small boats and floating objects may go undetected","How many vessels radar shows, and how they move","A better measure of visibility, using radar ranges"],"fig":"clutter"},"script":"If you have radar, Rule six adds six more factors, and they boil down to one idea: radar is a tool with limits. [+] Know your radar’s characteristics, efficiency and limitations. [+] Know what the range scale you’ve selected can and can’t show you. [+] Sea state, rain and interference can hide targets in clutter. [+] Small boats, logs and other floating objects may not show up until they’re close. [+] Radar tells you how many vessels are around and how they’re moving. [+] And it can give you a more exact measure of visibility, by showing how far away that boat is that you can just barely see. [pause] The exam trap is assuming radar lets you go faster. It doesn’t. It just gives you better information for judging what’s safe.","video":"Radar display with sea clutter turned up, hiding a small boat target, then clutter reduced."},{"heading":"Rule 7: is there a risk of collision?","visual":{"k":"dg","f":"bearing"},"script":"Rule seven is about one question: is there a risk of collision? And it starts with a powerful sentence: if there’s any doubt, the risk shall be deemed to exist. Doubt means yes. [pause] So how do you judge it? Look at the diagram. You’re the boat at the bottom, heading up the page, and another boat is crossing from your right. Each dashed line is a bearing taken a minute or so apart. See how the lines stay parallel? The bearing isn’t changing, while the distance shrinks. That’s the classic sign of a collision course. [pause] You can do this with your eyes, too. Line the other boat up with a stanchion or a corner of your windshield. If it stays in that spot while it gets bigger, you’re on a collision course. One warning: with a very large ship, a tow, or anything very close, risk can exist even when the bearing is changing.","video":"Bow-mounted camera: another boat holding the same spot against the windshield frame as it grows larger."},{"heading":"Captain’s example: one glance isn’t enough","visual":{"k":"callout","tag":"Captain’s example","lines":["Fog off Port Everglades","One radar glance: a target 3 miles ahead","Plot it for a few minutes before you decide"],"fig":"radarplot"},"script":"Rule seven also covers radar, so here’s a scenario. [+] Imagine you’re heading out of Port Everglades on a rare foggy morning. [+] You glance at the radar and see a target about three miles ahead. One look tells you almost nothing: where it’s going, how fast, whether it’ll pass clear. [+] Rule seven says radar must be used properly, with long-range scanning for early warning, and radar plotting or equivalent systematic observation. Mark the target, watch it for a few minutes, and see how it moves. [pause] And the rule adds a sentence worth memorizing: assumptions shall not be made on the basis of scanty information, especially scanty radar information. One glance is scanty. A plot is information.","video":"Fog over the Port Everglades entrance; radar screen with a target being marked every minute."},{"heading":"Rule 8: how to act","visual":{"k":"points","items":["Positive, made in ample time, with good seamanship","Large enough to be obvious by eye or radar","Avoid a series of small alterations","A course change alone may be best, if early, substantial and safe"],"fig":"action"},"script":"Once you’ve decided there’s a risk, Rule eight tells you how to act. [+] Your action should be positive, made in ample time, and with good seamanship. [+] It should be big enough to be obvious, whether the other captain is watching with his eyes or on radar. A five degree nudge is invisible. A forty degree turn tells a story. [+] Which is why the rule says to avoid a series of small alterations. [+] And if you have sea room, a course change alone is often your best move, as long as it’s early, substantial, and doesn’t just set you up for another close call with someone else. [pause] Think of it like driving: signal clearly, commit, and don’t weave.","video":"Overhead drone: one boat makes a bold 40-degree turn while another weaves with small course changes."},{"heading":"Passing clear, and “not to impede”","visual":{"k":"points","items":["Pass at a safe distance; keep checking until finally past and clear","Slow, stop or back down to buy time","“Not to impede”: act early to leave plenty of room","That duty continues even when risk of collision develops"],"fig":"impede"},"script":"Two more parts of Rule eight. [+] Your action must get you past at a safe distance, and you keep checking that it’s working until the other vessel is finally past and clear. [+] If you need more time to figure things out, slow down, stop, or back down. Slowing down is always on the menu, and it buys you time. [+] Rule eight also defines a phrase you’ll meet again and again: not to impede. A vessel required not to impede another must act early, leaving plenty of room. [+] And that duty doesn’t disappear just because the boats get close and a risk of collision develops. [pause] That’s lesson three. Next time, we’ll head into narrow channels and the big-ship highways called traffic separation schemes, where small boats like ours have special duties.","video":"A small boat slowing and turning early to give a ship in the channel plenty of room."}]},{"id":"rules-04","module":"R","title":"Narrow channels and traffic separation schemes","status":"draft-unverified","covers":"Rules 9 and 10","slides":[{"heading":"Rule 9: keep to starboard, don’t impede","visual":{"k":"dg","f":"nchannel"},"script":"Today we head into the tightest water you’ll run: narrow channels. Think of the dredged ship channel into Tampa Bay, or the cut at Port Everglades. Rule nine is the rule for these places, and it starts simply. [pause] A vessel following a narrow channel keeps as near to the outer edge on her starboard side as is safe and practicable. In other words, stay to the right, just like on the road. So when two boats meet in a channel, each holds her own right side, and they pass port to port. Now look at the diagram, and find the small boat off to the side. Here’s the part that matters most to you. A vessel of less than twenty meters, or any sailing vessel, shall not impede a vessel that can safely navigate only within the channel. Your charter boat is well under twenty meters. That ship coming down the channel can’t go anywhere else. You can. So you give her room, and you do it early."},{"heading":"Fishing, crossing and anchoring in channels","visual":{"k":"points","items":["Fishing vessels shall not impede any vessel navigating within the channel","Don’t cross if it impedes a vessel that must stay in the channel","That vessel may sound the danger signal if in doubt","Avoid anchoring in a narrow channel"],"fig":{"t":"td","els":[["r",0,150,440,100],["m",40,142,"Channel"],["h",120,200,90,"s-ink",2.2],["i","net",330,100,1.3],["t",330,60,"Fishing: don’t impede"],["h",250,310,0,"s-mut",0.7],["t",250,364,"Crossing? Wait for her to pass"],["i","anchor",370,200,1],["n",370,200]]}},"script":"Rule nine has three more duties, and every one of them applies to a charter boat. [+] First, a vessel engaged in fishing shall not impede any other vessel navigating within a narrow channel. Notice that word, any. Even a true fishing vessel with her nets down gives way to channel traffic here. [+] Second, crossing. You must not cross a narrow channel if crossing would impede a vessel that can safely navigate only within it. So picture this. You’re on one side of the ship channel, the bite is on the other side, and a tanker is coming down. Do you dart across her bow? [pause] No. You wait. [+] And if that ship’s captain is in doubt about what you’re doing, he’ll tell you with the danger signal: at least five short blasts. If you ever hear five short blasts from a ship, assume they’re meant for you. [+] Third, every vessel shall avoid anchoring in a narrow channel, if the circumstances allow. Anchoring up to fish in the ship channel is exactly what this rule is written for."},{"heading":"Overtaking and bends","visual":{"k":"points","items":["Overtaking that needs the other vessel’s help requires signals and agreement","The vessel being overtaken acts to permit safe passing","Rule 13 still makes the overtaking vessel keep clear","Blind bend: one prolonged blast, answered by one prolonged blast"],"fig":{"t":"rows","items":[["snd:-","Blind bend","One prolonged blast, answered by one prolonged blast"],["yes","Agree first","If she must help you pass, signal and get agreement"],["boat","Overtaking vessel","Still keeps clear under Rule 13"]]}},"script":"Now, overtaking in a channel. Out in open water, you can pass another boat without asking her for anything. In a narrow channel, sometimes you can’t get by unless she moves over. [+] When that’s the case, the overtaking vessel signals her intention with the whistle signals from Rule thirty-four. We’ll learn those signals in lesson thirteen. [+] The vessel being overtaken, if she agrees, answers and takes steps to permit safe passing. If she’s in doubt, she sounds the danger signal instead, and you stay behind her. [+] And here’s the exam point. Even after she agrees, Rule thirteen still applies. The overtaking vessel keeps clear until she’s past. Agreement is permission to pass, not a transfer of responsibility. [pause] [+] One more piece: bends. When you’re nearing a bend, or any spot where something could hide another vessel, navigate with particular alertness and caution, and sound one prolonged blast. Any vessel around the bend that hears you answers with one prolonged blast of her own. Remember it this way: one long blast says, I’m coming around the corner."},{"heading":"Inland Rule 9: downbound vessels","visual":{"k":"points","items":["Great Lakes, Western Rivers and specified waters only","A downbound power-driven vessel with a following current has right of way","She proposes the manner and place of passage","She initiates the maneuvering signals","The upbound vessel holds as necessary to permit safe passing"],"fig":{"t":"td","els":[["r",150,0,140,400],["a","M40,70 V160","s-st"],["m",40,52,"Current"],["h",220,90,180,"s-ink",1.4],["t",302,84,"Downbound","start",17,"s-mag"],["m",302,104,"Right of way","start"],["m",302,122,"Proposes passage","start"],["h",220,320,0,"s-mut",1.2],["t",302,314,"Upbound","start"],["m",302,334,"Holds as needed","start"]]}},"script":"Here’s where the two rule books split, and it’s a favorite exam question. [+] The Inland version of Rule nine adds a special rule for the Great Lakes, the Western Rivers, and other waters the Coast Guard specifies. You won’t find it in the International rules. [+] On those waters, a power-driven vessel heading downbound with a following current has the right of way over an upbound vessel. Yes, right of way. This is one of the very few places where the rules actually use those words. [+] The downbound vessel proposes the manner and place of passage. [+] And she initiates the maneuvering signals. [+] The upbound vessel, the one working against the current, holds as necessary to permit safe passing. Why? Think about a towboat pushing barges down the Mississippi with the current behind her. Can she stop? Can she hold still and wait? [pause] She can’t. The current is carrying her along. The upbound boat can simply ease her throttles and hold her place. So the vessel with less control gets the say. You may never run a river, but when a question says downbound with a following current, you’ll know who’s in charge."},{"heading":"Rule 10: traffic separation schemes","visual":{"k":"dg","f":"tss"},"script":"On to Rule ten, traffic separation schemes. Picture a divided highway laid out on the water. Look at the diagram: a lane for each direction, with a separation zone between them like a median. You’ll find these off busy ports and in crowded straits, and they’re built for the big ships. But the rule binds everyone who goes near them. If you use a scheme, travel in the proper lane, in the general direction of traffic for that lane. Keep clear of the separation line or zone. Join or leave at the end of a lane when you can. And if you have to come in from the side, do it at as small an angle as practicable, the way you merge onto an interstate. [pause] Crossing is the opposite. Avoid crossing the lanes if you can. But if you’re obliged to cross, do it on a heading as close as practicable to a right angle to the traffic flow. Here’s the trick for keeping them straight. Merge at a small angle. Cross at a right angle. And one more thing: a scheme doesn’t excuse anyone from the other rules. They all still apply inside it."},{"heading":"Rule 10: who uses what","visual":{"k":"points","items":["Through traffic stays out of inshore traffic zones","Under 20 m, sailing and fishing vessels may use inshore zones","Under 20 m and sailing vessels don’t impede power vessels in a lane","Fishing vessels don’t impede vessels following a lane","Avoid anchoring in a scheme or near its ends","Not using the scheme? Avoid it by a wide margin"],"fig":{"t":"td","els":[["m",220,44,"Traffic lanes: through traffic"],["r",0,56,440,66],["a","M400,89 H60"],["r",0,122,440,24,"s-mag",0.22],["r",0,146,440,66],["a","M60,179 H240"],["h",330,179,90,"s-ink",1.5],["r",0,222,440,104,"s-bg",0.45],["t",220,248,"Inshore traffic zone"],["i","boat",110,282,0.9],["i","sail",220,280,0.9],["i","net",330,282,0.9],["m",220,316,"Under 20 m, sailing and fishing vessels may use it"],["r",0,340,440,60,"s-land"],["m",220,376,"Coast"]]}},"script":"So who goes where? [+] Through traffic doesn’t use the inshore traffic zone when it can safely use the lane next to it. The inshore zone is for local traffic. [+] But there are exceptions, and you’re one of them. Vessels of less than twenty meters, sailing vessels, and vessels engaged in fishing may use the inshore zone. So may any vessel going to or from a place inside it, or avoiding immediate danger. [+] Now the duties. A vessel of less than twenty meters, or a sailing vessel, shall not impede the safe passage of a power-driven vessel following a lane. [+] And a vessel engaged in fishing shall not impede any vessel following a lane. Sound familiar? It’s the same idea as Rule nine: small boats, sailboats and fishing boats stay out of the big ships’ way. [+] Avoid anchoring in a scheme, or near its ends. [+] And if you’re not using the scheme, avoid it by as wide a margin as practicable. [pause] Let’s wrap up. In a narrow channel: keep right, don’t impede, don’t cross in front of a ship, and don’t anchor. On the rivers, downbound with a following current is in charge. In a traffic scheme, merge at a small angle, cross at a right angle, and leave the lanes to the ships. Next time, we’ll take up the first of the steering rules: sailing vessels meeting each other, and what the rules mean by overtaking."}]},{"id":"rules-05","module":"R","title":"Sailing vessels and overtaking","status":"draft-unverified","covers":"Rules 11 to 13","slides":[{"heading":"Rule 11: vessels in sight","visual":{"k":"points","items":["Rules 11 to 18 apply only to vessels in sight of one another","In restricted visibility and not in sight, Rule 19 applies instead","Radar contact alone doesn’t make vessels “in sight”"],"fig":{"t":"cmp","a":["","In sight: Rules 11 to 18","eye","The steering and sailing rules for vessels that can see each other"],"b":["","Not in sight: Rule 19","fog","Restricted visibility. A radar contact alone isn’t “in sight”"]}},"script":"Welcome back. Today we start the steering rules proper: who keeps out of whose way. But before any of them, Rule eleven sets a condition, and it’s one sentence long. [+] Rules eleven through eighteen apply only to vessels in sight of one another. Remember that phrase from lesson two? In sight means seen with the eyes. [+] So if you’re in fog and the other vessel isn’t in sight, none of today’s rules apply. There’s no stand-on vessel and no give-way vessel. Rule nineteen takes over instead, and we’ll get to it in lesson eight. [+] And a radar contact alone never makes two vessels in sight. Here’s a quick test. You’re running in thick fog, and your radar shows a boat crossing ahead from your right. Are you the give-way vessel? [pause] No. Nobody is. You can’t see her, so the crossing rule doesn’t apply. Hold on to that idea, because the exam asks it a dozen different ways."},{"heading":"Rule 12: two sailing vessels","visual":{"k":"points","items":["Wind on different sides: the boat with wind on her port side keeps clear","Wind on the same side: the windward boat keeps clear","Port-tack boat can’t tell the other’s tack: she keeps clear","Windward side: opposite the side the mainsail is carried"],"fig":{"t":"td","els":[["t",20,30,"Wind on different sides","start"],["a","M220,40 V92","s-st"],["m",232,70,"Wind","start"],["i","sail",110,124,1.5],["t",110,174,"Port tack: keeps clear","middle",16,"s-mag"],["i","sail",330,124,1.5],["m",330,174,"Starboard tack"],["p","M10,200 H430","s-lst"],["t",20,232,"Wind on the same side","start"],["a","M20,292 H72","s-st"],["m",20,272,"Wind","start"],["i","sail",160,292,1.5],["t",160,344,"Windward: keeps clear","middle",16,"s-mag"],["i","sail",340,292,1.5],["m",340,344,"Leeward"]]}},"script":"You may never work a sailboat, but you’ll share the water with plenty of them, and Rule twelve is tested. It decides between two sailing vessels, and it comes down to where the wind is. [+] First, when each boat has the wind on a different side, the one with the wind on her port side keeps out of the way. Sailors call that being on port tack. So, port tack keeps clear. [+] Second, when both boats have the wind on the same side, the boat to windward keeps out of the way of the boat to leeward. Windward is the boat closer to where the wind is coming from. [+] Third, the doubt rule. If you have the wind on your port side, and you see a sailboat to windward but can’t tell which side she has the wind on, you keep out of the way. When in doubt, the port-tack boat gives way. [+] And how do you know which side is windward? For this rule, it’s the side opposite to the one where the mainsail is carried. On a square-rigged vessel, it’s the side opposite her largest fore-and-aft sail. [pause] So a boat with her mainsail out to starboard has the wind on her port side. She’s on port tack, and she keeps clear."},{"heading":"Rule 13: overtaking","visual":{"k":"dg","f":"overtake"},"script":"Now the rule that beats almost every other rule: overtaking. Rule thirteen opens with a strong phrase. Notwithstanding anything in Rules four through eighteen, any vessel overtaking any other shall keep out of the way of the vessel being overtaken. Any vessel. Any other. So what counts as overtaking? Look at the diagram. You’re overtaking when you come up on another vessel from a direction more than twenty-two and a half degrees abaft her beam. That’s the shaded zone behind her. [pause] At night, there’s an easy way to know. From that zone, you can see only her sternlight, and neither of her sidelights. One white light ahead of you, and you’re closing on it? You’re overtaking, and you keep clear. And because this rule overrides the others, the kind of boat doesn’t matter. A sailboat overtaking a powerboat keeps clear. A fishing vessel overtaking anyone keeps clear."},{"heading":"Overtaking: the fine print","visual":{"k":"points","items":["In doubt? Assume you’re overtaking","A later change of bearing doesn’t make it a crossing","Keep clear until finally past and clear","Overtaking overrides Rules 4 to 18"],"fig":{"t":"rows","items":[["q","In doubt?","Assume you’re overtaking"],["turn","Bearing changes later","Still overtaking, never a crossing"],["yes","Until past and clear","The overtaking vessel keeps clear"]]}},"script":"Rule thirteen has some fine print, and the exam loves it. [+] First, if you’re in any doubt whether you’re overtaking, assume that you are, and act accordingly. Doubt means keep clear. [+] Second, once you’re overtaking, you stay the overtaking vessel. Any later change in the bearing between the two boats doesn’t turn it into a crossing situation. So picture this. You come up astern of a slow cruiser off Clearwater. As you pull alongside, she’s on your beam, on your port side. In a crossing situation, a boat on your port side would have to keep clear of you. Does that make you the stand-on vessel now? [pause] No. You started as the overtaking vessel, and you’re still the overtaking vessel. [+] You keep clear until you’re finally past and clear. Notice those words. Getting your bow just ahead of hers isn’t enough. [+] And remember the opening phrase: overtaking overrides everything in Rules four through eighteen."},{"heading":"Overtaking meets the pecking order","visual":{"k":"points","items":["Power overtaking sail: power keeps clear","Sail overtaking power: sail keeps clear","Fishing vessel overtaking anyone: the fishing vessel keeps clear","Coming up from astern? The overtaking vessel keeps clear"],"fig":{"t":"rows","items":[["boat","Power overtaking sail","Power keeps clear"],["sail","Sail overtaking power","Sail keeps clear"],["net","Fishing vessel overtaking","The fishing vessel keeps clear"]]}},"script":"Let’s test Rule thirteen against the pecking order. You’ll meet that properly in lesson seven, but the short version is that power normally gives way to sail, and sail gives way to vessels engaged in fishing. [+] So, a powerboat overtaking a sailboat. Who keeps clear? The powerboat. Both rules agree, so that one’s easy. [+] Now flip it. A sailboat, flying along in a good breeze, comes up astern of a slow powerboat. Who keeps clear? [pause] The sailboat. She’s overtaking, and overtaking overrides the pecking order. [+] It’s the same with a fishing vessel overtaking anyone. She keeps clear. [+] So here’s your exam habit. Whenever a question describes one vessel coming up on another from astern, stop looking at what kind of vessels they are. The overtaking vessel keeps clear. Every time. [pause] That’s lesson five. The steering rules apply only in sight. Between sailboats, port tack and the windward boat keep clear. And anyone overtaking keeps clear until she’s finally past. Next time, we’ll cover the two situations you’ll meet most often in a powerboat: head-on and crossing."}]},{"id":"rules-06","module":"R","title":"Head-on, crossing, give-way and stand-on","status":"draft-unverified","covers":"Rules 14 to 17","slides":[{"heading":"Rule 14: head-on","visual":{"k":"dg","f":"headon"},"script":"Today’s lesson covers the two situations you’ll face most in a powerboat, plus the duties that go with them. We start with the simplest: head-on. Rule fourteen applies when two power-driven vessels meet on reciprocal or nearly reciprocal courses, with a risk of collision. Look at the diagram. What does each boat do? [pause] Each alters course to starboard, so they pass port to port. Both of them. In a head-on situation, there’s no stand-on vessel. How do you know you’re head-on? You see the other vessel ahead, or nearly ahead. At night, you’d see her masthead lights in a line, or nearly in a line, or both of her sidelights at once. Red and green together, coming at you, means turn right. And if you’re in any doubt whether it’s a head-on situation, assume that it is, and act accordingly. Here’s a memory hook: when you meet, go right, and show her your red."},{"heading":"Inland: rivers","visual":{"k":"points","items":["Great Lakes, Western Rivers and specified waters only","Meeting: a downbound power vessel with a following current has right of way","She proposes the manner of passage and initiates the signals","A power vessel crossing a river keeps clear of power vessels going up or down it"],"fig":{"t":"td","els":[["r",0,130,440,120],["a","M30,108 H120","s-st"],["m",30,92,"Current","start"],["h",140,190,90,"s-ink",1.5],["t",150,280,"Downbound: right of way","middle",16,"s-mag"],["h",360,190,-90,"s-mut",1.1],["m",360,236,"Upbound"],["h",330,336,0,"s-mut",0.9],["t",316,384,"Crossing vessel keeps clear","middle",16]]}},"script":"The Inland rules add two river rules here, and they belong together. [+] Both apply only on the Great Lakes, the Western Rivers, and other waters the Coast Guard specifies. [+] First, meeting. You saw this in lesson four for narrow channels, and Rule fourteen repeats it. A power-driven vessel heading downbound with a following current has the right of way over an upbound vessel. [+] She proposes the manner of passage, and she initiates the maneuvering signals. [+] Second, crossing. On those same waters, a power-driven vessel crossing a river keeps out of the way of a power-driven vessel going up or down it. It doesn’t matter which side she’s on. Think of a ferry crossing the Mississippi. A towboat is coming down the river on the ferry’s port side. Under the ordinary crossing rule, who would give way? [pause] The towboat would, because the ferry is on her starboard side. But this is a river, so the ferry keeps clear. The traffic running the river comes first."},{"heading":"Rule 15: crossing","visual":{"k":"dg","f":"crossing"},"script":"Now the crossing situation, Rule fifteen, and it’s the one you’ll use every single day. Two power-driven vessels are crossing, with a risk of collision. Which one keeps out of the way? The vessel that has the other on her own starboard side. Look at the diagram. The lower boat sees the other boat off to her right. So she’s the give-way vessel. And the rule adds one more thing: if the circumstances allow, she avoids crossing ahead of the other vessel. So her best move is usually a clear turn to starboard, passing behind the other boat. [pause] Here’s the memory trick, and it works at night. If you’re looking at the other boat’s red sidelight, red means stop. You’re the give-way vessel. If you’re looking at her green sidelight, green means go. You’re the stand-on vessel, and you hold your course and speed. Red, give way. Green, stand on. Just remember that it only works for two power-driven vessels in sight of each other."},{"heading":"Rules 16 and 17: the duties","visual":{"k":"table","head":["Stage","Stand-on vessel"],"rows":[["Risk of collision develops","SHALL keep course and speed"],["Give-way vessel clearly isn’t acting","MAY act by her own maneuver alone"],["Give-way vessel alone can’t avoid collision","SHALL take the action that best aids to avoid collision"]],"fig":{"t":"band","items":[["num:1","Keep course and speed","Risk of collision develops"],["num:2","May act alone","She clearly isn’t acting"],["num:3","Shall act","She can’t avoid it alone"]]}},"script":"So what are the duties? Rule sixteen is the give-way vessel’s, and it’s short. Take early and substantial action to keep well clear. Early. Substantial. Well clear. Rule seventeen is the stand-on vessel’s, and it comes in three stages. [+] Stage one. When risk of collision develops, the stand-on vessel shall keep her course and speed. That’s not stubbornness. It’s what lets the other captain predict what you’ll do. [+] Stage two. As soon as it becomes apparent that the give-way vessel isn’t taking appropriate action, the stand-on vessel may act to avoid collision by her own maneuver alone. May. It’s allowed, not required. This is the moment for five short blasts. [+] Stage three. When she’s so close that the give-way vessel alone can’t avoid the collision, the stand-on vessel shall take whatever action will best help avoid it. Shall. Now it’s required. [pause] So the pattern is: shall hold, may act, shall act. The exam tests the difference between may and shall, so lock that pattern in."},{"heading":"Rule 17: two more details","visual":{"k":"points","items":["Crossing: a stand-on power vessel avoids turning to port for a vessel on her own port side","Stand-on action never relieves the give-way vessel","Keep course and speed means predictable, not reckless"],"fig":{"t":"td","els":[["t",220,34,"Stand-on vessel acting alone"],["m",220,56,"Don’t turn to port for a vessel on your port side"],["h",70,180,90,"s-mut",1],["m",70,150,"Give-way vessel"],["h",220,310,0,"s-ink",1.1],["m",220,366,"You: stand-on"],["a","M208,278 C196,238 150,226 112,224","s-st"],["n",140,200],["a","M232,278 C244,238 290,226 340,224"],["y",352,198]]}},"script":"Two more details of Rule seventeen, and then a thought of my own. [+] First, when a power-driven stand-on vessel acts on her own in a crossing situation, she should not, if the circumstances allow, turn to port for a vessel on her own port side. Why not? Picture it. The other boat is on your port side, and she’s late, but she finally turns to starboard to go behind you. If you turn to port at the same moment, you turn straight into her. So turn to starboard, or slow down, or stop. [+] Second, nothing the stand-on vessel does relieves the give-way vessel of her obligation. She’s still responsible for keeping out of the way. [+] And here’s my thought. Keeping your course and speed means being predictable. It doesn’t mean being reckless. Rule two is still there, and no captain was ever praised for standing on into a collision. [pause] That’s lesson six. Head-on: both turn to starboard. Crossing: the boat with the other on her starboard side gives way. And for the stand-on vessel: shall hold, may act, shall act. Next time, we’ll climb the pecking order and see who gives way to whom when the vessels aren’t alike."}]},{"id":"rules-07","module":"R","title":"Responsibilities between vessels","status":"draft-unverified","covers":"Rule 18","slides":[{"heading":"Rule 18: the ladder","visual":{"k":"dg","f":"ladder"},"script":"So far, every steering rule has been about two boats of the same kind. Today’s question is different. What happens when a powerboat meets a sailboat, or a sailboat meets a trawler with her nets down? Rule eighteen answers it with what I call the ladder. Look at the screen, and read it from the bottom up. [pause] Each vessel keeps out of the way of the vessels above her. A power-driven vessel underway keeps out of the way of four kinds of vessel: one not under command, one restricted in her ability to maneuver, one engaged in fishing, and a sailing vessel. Power-driven sits on the bottom rung, and that’s where your charter boat lives. So here’s the plain truth. Most days, almost everything out there that isn’t another powerboat has priority over you. The logic of the ladder is simple: the less a vessel can maneuver, the higher she stands."},{"heading":"Up the ladder","visual":{"k":"points","items":["Sailing vessels keep clear of: NUC, RAM, fishing","Fishing vessels keep clear, as far as possible, of: NUC, RAM","NUC and RAM sit at the top"],"fig":{"t":"rows","items":[["shapes:ball,ball","NUC and RAM","Top of the ladder"],["net","Fishing keeps clear of","NUC and RAM, as far as possible"],["sail","Sailing keeps clear of","NUC, RAM and fishing"]]}},"script":"Let’s climb it one rung at a time. [+] A sailing vessel underway keeps out of the way of three: a vessel not under command, a vessel restricted in her ability to maneuver, and a vessel engaged in fishing. So a sailboat gives way to a working trawler. Many sailors forget that one. [+] Next rung. A vessel engaged in fishing, when underway, keeps out of the way of a vessel not under command and a vessel restricted in her ability to maneuver. But listen to the wording: so far as possible. Her gear limits what she can do, and the rule admits it. [+] And at the top sit the vessel not under command and the vessel restricted in her ability to maneuver. Nobody is listed above them, because by definition they can’t easily get out of anyone’s way. [pause] Remember the trick from lesson two? Broken, or busy. Broken or busy sits at the top. Then fishing, then sail, then power."},{"heading":"Constrained by draft","visual":{"k":"points","items":["International only","Any vessel except NUC or RAM avoids impeding a CBD vessel","The CBD vessel navigates with particular caution","“Not impeding” means acting early, not stand-on or give-way"],"fig":{"t":"rows","items":[["dots:rrr","Three red lights","Constrained by draft, at night"],["shapes:cyl","A cylinder","Constrained by draft, by day"],["txt:INTL","International only","The Inland rules have no such vessel"]]}},"script":"There’s one more vessel to place, and she only exists offshore. [+] Constrained by her draft is International only. You won’t find her in the Inland rules. [+] Under the International rules, any vessel other than one not under command, or one restricted in her ability to maneuver, shall, if the circumstances allow, avoid impeding the safe passage of a vessel constrained by her draft. That’s a deep ship in a channel she can’t leave, showing the signals of Rule twenty-eight. [+] In return, the constrained vessel has a duty of her own. She navigates with particular caution, with full regard to her special condition. [+] Now notice the words avoid impeding. Remember from Rule eight what that means? [pause] It means acting early to leave her sea room. It isn’t the same thing as give-way and stand-on. So if an exam question asks who is the stand-on vessel here, be careful. The rule doesn’t use those words."},{"heading":"When the ladder doesn’t apply","visual":{"k":"points","items":["Rule 9: small and sailing vessels don’t impede ships in a narrow channel","Rule 10: the same applies in traffic lanes","Rule 13: the overtaking vessel always keeps clear","Example: a sailboat in a ship channel must not impede a tanker"],"fig":{"t":"td","els":[["t",220,50,"The ladder doesn’t apply here"],["m",220,74,"A sailboat must not impede a tanker in a channel"],["r",0,150,440,100],["m",50,142,"Ship channel"],["h",130,200,90,"s-ink",2.4],["i","sail",320,194,1.2],["a","M344,226 C364,262 376,286 386,318"]]}},"script":"Now for the trap. Rule eighteen opens with six words that the exam loves: except where Rules nine, ten and thirteen otherwise require. So the ladder has three exceptions. [+] Rule nine, narrow channels. A sailing vessel, or any vessel under twenty meters, shall not impede a vessel that can navigate only within the channel. [+] Rule ten, traffic separation schemes. The same idea applies to vessels following a traffic lane. [+] And Rule thirteen, overtaking. The overtaking vessel always keeps clear, whatever she is. [+] So try this one. A sailboat is tacking up the ship channel in Tampa Bay, and a loaded tanker is coming down it. On the ladder, sail stands above power. Who has to stay out of the way? [pause] The sailboat. She must not impede the tanker, because Rule nine overrides the ladder. Here’s your exam habit. Before you apply the ladder, check the question for three things: a narrow channel, a traffic lane, or overtaking."},{"heading":"Seaplanes and WIG craft","visual":{"k":"points","items":["Seaplane on the water: keep well clear of all vessels","If risk of collision exists, a seaplane follows the steering rules","WIG craft taking off, landing or flying near the surface: keep clear of all vessels","WIG craft on the water: follow the rules as a power-driven vessel"],"fig":{"t":"rows","items":[["seaplane","Seaplane on the water","Keeps well clear of all vessels"],["seaplane","WIG craft, flying low","Keeps well clear of all vessels"],["boat","WIG craft on the water","Follows the rules as a power-driven vessel"]]}},"script":"Last, two unusual craft that Rule eighteen also covers. [+] A seaplane on the water shall, in general, keep well clear of all vessels and avoid impeding their navigation. Think of it this way: she can leave by air, so she stays out of the way on the water. [+] But where risk of collision exists, she follows the steering rules like everyone else. [+] A wing-in-ground craft, when taking off, landing, or flying near the surface, keeps well clear of all other vessels and avoids impeding their navigation. [+] And when she’s operating on the water surface, she follows the rules as a power-driven vessel. [pause] That’s lesson seven. The ladder, from the top: broken or busy, then fishing, then sail, then power. Constrained by draft is International only. And narrow channels, traffic lanes and overtaking override the ladder. Next time, we go where none of this applies: into the fog, and Rule nineteen."}]},{"id":"rules-08","module":"R","title":"Conduct in restricted visibility","status":"draft-unverified","covers":"Rule 19","slides":[{"heading":"Rule 19: when it applies","visual":{"k":"points","items":["Vessels not in sight of one another","In or near an area of restricted visibility","No stand-on or give-way vessel","Every vessel shares the duty to avoid collision"],"fig":{"t":"cmp","a":["","In sight","eye","Stand-on and give-way rules apply"],"b":["","Not in sight, in or near fog","fog","No stand-on vessel. Every vessel must avoid collision"]}},"script":"Picture a January morning on Tampa Bay. You leave the dock in sunshine, and half a mile out, the world turns white. You can’t see your own bow rail. Which steering rules apply now? [pause] Not the ones we’ve been studying. This is Rule nineteen, and it’s one of the most tested rules in the book. [+] It applies to vessels not in sight of one another. [+] And it applies when you’re navigating in or near an area of restricted visibility. Notice the words or near. You can be in clear air, running alongside a fog bank, and Rule nineteen still applies to you and to whatever is inside that bank. [+] Now the big idea. Under Rule nineteen, there is no stand-on vessel and no give-way vessel. None. The crossing rule, the head-on rule and the ladder are all switched off. [+] Instead, every vessel shares the same duty to avoid a close-quarters situation. Nobody gets to hold her course and wait for the other boat to act."},{"heading":"Speed and readiness","visual":{"k":"points","items":["Safe speed adapted to the visibility","Power-driven vessels keep engines ready for immediate maneuver","Apply Rules 4 to 10 with the visibility in mind","Sound fog signals, keep lights on, plot radar targets"],"fig":{"t":"tiles","items":[["gauge","Safe speed for the visibility"],["engine","Engines ready to maneuver"],["horn","Sound fog signals"],["radar","Plot radar targets"]]}},"script":"So what does the rule ask of you? Start with speed and readiness. [+] Every vessel shall proceed at a safe speed adapted to the conditions of restricted visibility. That’s Rule six, with the fog pressed down hard on it. [+] A power-driven vessel shall have her engines ready for immediate maneuver. No autopilot and a cup of coffee. A hand near the throttles. [+] And every vessel applies Rules four through ten with the visibility in mind: the lookout, safe speed, risk of collision, and action to avoid it. [+] So here’s what that looks like on your boat. Slow down. Put someone forward to listen, away from the engine noise. Sound your fog signals. Turn your navigation lights on, even at noon. And if you have radar, plot every target, don’t just glance at it. [pause] One more thing your passengers won’t like: quiet on deck. In fog, your ears are a navigation instrument."},{"heading":"Radar-only contacts","visual":{"k":"dg","f":"r19"},"script":"Here’s the heart of Rule nineteen, and it’s for the boat with radar. If you detect another vessel by radar alone, you must work out whether a close-quarters situation is developing, or a risk of collision exists. If it is, you take avoiding action in ample time. And if that action is a change of course, there are two things to avoid, so far as possible. Look at the left picture. First: avoid altering course to port for a vessel forward of your beam, unless you’re overtaking her. Now the right picture. Second: avoid altering course toward a vessel that’s abeam or abaft your beam. [pause] Put those together and the pattern is simple. For a target ahead of you, don’t turn left. For a target beside or behind you, don’t turn toward her. So for a vessel ahead, a substantial turn to starboard is usually the safe choice. And slowing down, or stopping, is always allowed."},{"heading":"Hearing a fog signal","visual":{"k":"points","items":["Hear a fog signal apparently forward of your beam?","Or can’t avoid close quarters with a vessel forward of the beam?","Reduce to the minimum speed that keeps you on course","Take all way off if necessary","Navigate with extreme caution until the danger is over"],"fig":{"t":"td","els":[["wg",220,236,170,-90,90,"var(--mag)",0.12],["l","M30,236 H410"],["m",410,254,"Beam","end"],["h",220,242,0,"s-ink",1.5],["i","horn",120,120,1.3],["t",220,38,"Fog signal forward of your beam?"],["t",220,330,"Slow to bare steerageway","middle",17,"s-mag"],["m",220,354,"Stop if you must. Extreme caution until it’s over"]]}},"script":"Now the second half of the rule, and this one is for every vessel, radar or not. It’s about what you hear. [+] Suppose you hear a fog signal, and it seems to come from forward of your beam. [+] Or suppose you simply can’t avoid a close-quarters situation with a vessel forward of your beam. [+] Then you shall reduce your speed to the minimum at which you can keep your course. Bare steerageway. [+] If necessary, you take all your way off. You stop. [+] And in any event, you navigate with extreme caution until the danger of collision is over. The only exception is when you’ve already determined that no risk of collision exists. [pause] Notice one small word in the rule: apparently. The signal is apparently forward of your beam. Why would the rule say that? Because sound plays tricks in fog. It bends, it echoes, and it can seem to come from the wrong direction. So when you hear a horn ahead, don’t guess, and don’t turn. Slow down first."},{"heading":"Handing over to the other rules","visual":{"k":"points","items":["Once you sight each other, Rules 11 to 18 apply","Radar alone never makes you “in sight”","No assumptions on scanty radar information","Fog signals are in Rule 35, lesson 14"],"fig":{"t":"rows","items":[["fog","Not in sight","Rule 19 governs"],["eye","You sight each other","Rules 11 to 18 take over"],["radar","Radar alone","Never counts as “in sight”"]]}},"script":"Last, how does Rule nineteen hand back to the other rules? [+] The moment two vessels actually sight one another, the rules for vessels in sight take over: Rules eleven through eighteen. A stand-on vessel and a give-way vessel exist again. So picture a boat breaking out of the fog tw
