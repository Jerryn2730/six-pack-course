"Damage over $75,000"],["oil","Harm to the environment"]]}},"script":"This is the last Deck lesson, and it’s about being a professional when something has gone wrong. As a commercial operator, you must report marine casualties to the Coast Guard. So what counts? [+] An unintended grounding, or striking a bridge. [+] A loss of propulsion, steering or control that reduces your ability to maneuver. [+] Anything that affects seaworthiness, like a fire or flooding. [+] A death, or an injury that needs professional medical treatment beyond first aid. [+] Property damage over seventy-five thousand dollars, or significant harm to the environment. So try this. You touch a sandbar on the way in, back off without damage, and nobody’s hurt. Do you have to report it? [pause] Yes. It’s an unintended grounding. The rule doesn’t ask how hard you hit. When in doubt, report it."},{"heading":"How to report","visual":{"k":"points","items":["Notify the nearest Coast Guard unit immediately","File Form CG-2692 within 5 days","Serious marine incidents also require drug and alcohol testing","Keep your logbook, photos and witness names","Recreational boating accidents are reported to the state instead"],"fig":{"t":"rows","items":[["radio","Notify the Coast Guard","Immediately"],["doc","Form CG-2692","Within 5 days"],["bottle","Serious marine incident","Drug and alcohol testing too"]]}},"script":"And here’s how you report. [+] First, notify the nearest Coast Guard sector or station immediately. That means as soon as the emergency itself is under control. [+] Then file the written report, Form C G twenty-six ninety-two, within five days. [+] If it’s a serious marine incident, for instance one with a death or a serious injury, drug and alcohol testing is required as well. Remember the clock from lesson one? [pause] Alcohol within two hours. [+] Keep your evidence: logbook entries, photographs, and the names of witnesses. Write it while it’s fresh. [+] And one distinction for the exam. These rules are for commercial vessels. Accidents on recreational boats are reported to the state instead."},{"heading":"Drawbridges","visual":{"k":"points","items":["Request an opening: one prolonged and one short blast, or by radio","Florida bridges usually monitor VHF channel 9","Bridge answers one prolonged and one short: it will open","Five short blasts: it can’t open now","Many bridges open only on a schedule: check 33 CFR 117"],"fig":{"t":"rows","items":[["snd:-.","Request an opening","One prolonged, one short"],["snd:-.","Bridge will open","It answers with the same signal"],["snd:.....","Can’t open now","Five short blasts"],["txt:VHF 9","Florida bridges","Usually monitor channel 9"]]}},"script":"Florida’s waterways are full of drawbridges, and they have a little language of their own. [+] To ask for an opening, sound one prolonged blast followed by one short. Or just call the bridge tender on the radio. [+] In Florida, most bridges monitor VHF channel nine. [+] If the bridge is going to open, it answers with the same signal: one prolonged and one short. [+] And if it can’t open right now? [pause] Five short blasts. Sound familiar? It’s the danger signal. It means, don’t come ahead. [+] Many bridges only open on a schedule, say on the hour and the half hour. The schedules are in the federal regulations and in the Coast Pilot, so look them up before you go. And hold well back until the span is fully open. A current can carry you into a half-open bridge faster than you’d believe."},{"heading":"Security zones and other rules","visual":{"k":"points","items":["You’re responsible for your wake and any damage it causes","Naval vessels: minimum speed within 500 yd; no closer than 100 yd","Security zones around cruise ships, tankers and ports","Florida: boating under the influence and reckless operation laws","Comply promptly with Coast Guard and FWC boardings"],"fig":{"t":"td","els":[["t",220,34,"Naval vessel protection zone"],["raw","\u003ccircle cx='220' cy='216' r='150' class='s-magst' stroke-width='2' stroke-dasharray='7 6'/>\u003ccircle cx='220' cy='216' r='62' fill='#d93025' opacity='.14'/>\u003ccircle cx='220' cy='216' r='62' fill='none' stroke='#d93025' stroke-width='2.5'/>"],["i","ship",220,214,1.6],["t",220,176,"100 yd: keep out","middle",14],["t",220,340,"500 yd: minimum speed","middle",15,"s-mag"]]}},"script":"A handful of other rules that catch charter captains. [+] Your wake. You’re legally responsible for it, and for any damage or injury it causes. Slow down near docks, small boats and anchored vessels. [+] Naval vessels. Within five hundred yards of a large American naval vessel, you operate at minimum speed. And you may not come within one hundred yards without permission. Five hundred, slow. One hundred, stay out. [+] Many Florida ports enforce security zones around cruise ships, tankers and port facilities. [+] Florida law covers boating under the influence and reckless operation. And remember your own limit as a commercial operator. What was it? [pause] Zero point zero four. [+] And when the Coast Guard or the Fish and Wildlife Conservation Commission signals you to stop for a boarding, comply promptly and politely."},{"heading":"Running a professional operation","visual":{"k":"points","items":["Keep a log: trips, passengers, weather, incidents, maintenance","Keep your credential, medical and drug-testing records current","Carry commercial charter insurance, not a recreational policy","Use a pre-departure checklist on every trip","Cancel when conditions exceed your limits"],"fig":{"t":"tiles","items":[["book","Keep a log"],["card","Credential, medical and drug tests current"],["doc","Commercial charter insurance"],["yes","Pre-departure checklist, every trip"]]}},"script":"That completes Deck General and Safety. Let me leave you with the habits that separate a professional from someone who just has a license. [+] Keep a log of every trip: passengers, weather, incidents, maintenance. [+] Keep your credential, your medical certificate and your drug-testing enrollment current. Put the dates on a calendar. [+] Carry commercial charter insurance. A recreational policy usually won’t cover you the moment a passenger pays. [+] Use a pre-departure checklist on every single trip, even the hundredth. [+] And above all, know your limits and your boat’s limits, and cancel when conditions exceed them. Will you lose that day’s money? [pause] Yes. And your customers will book again, because you’re the captain who brought them home. Now take the lesson check, then the Deck General quiz, until you’re scoring eighty percent or better. Well done, Captain."}]},{"id":"plot-01","module":"P","title":"Tools, the training chart and the compass rose","status":"draft-unverified","slides":[{"heading":"Your plotting kit","visual":{"k":"points","items":["Parallel rulers or a course plotter","Dividers for measuring distance","Sharp pencils, an eraser, and a calculator if allowed","Training chart 1210-Tr: Martha’s Vineyard to Block Island","Practice with the same tools you’ll use on test day"],"fig":{"t":"tiles","items":[["rulers","Parallel rulers or a course plotter"],["dividers","Dividers"],["pencil","Sharp pencils and an eraser"],["chart","Training chart 1210-Tr"]]}},"script":"Welcome to Chart Plotting, the hands-on module. On the exam you’ll work problems on a real training chart, usually NOAA chart twelve ten T R, which covers Martha’s Vineyard to Block Island. Yes, even in Florida. You’ll need parallel rulers or a course plotter, a pair of dividers, sharp pencils, an eraser and, if your exam allows it, a simple calculator. Buy the chart and tools now, bring your own to the exam, and practice with the same ones, so your hands know them by test day."},{"heading":"Walking parallel rulers","visual":{"k":"dg","f":"pararulers"},"script":"To find the direction of a line on the chart, line up one edge of the parallel rulers with the line. Then walk the rulers across the chart, holding one ruler down firmly while you swing the other, until an edge passes through the small cross at the center of the compass rose. Read the direction where that edge crosses the rose, on the side in your direction of travel, not the reciprocal side one hundred eighty degrees away. To lay down a course, reverse the process: set the rulers on the rose at your course, then walk them to your position and draw the line."},{"heading":"Reading the compass rose","visual":{"k":"points","items":["Outer ring: true directions","Inner ring: magnetic directions","Center: variation, its year, and the annual change","Use the rose nearest your work","Most exam work is done in true, then converted"],"fig":{"t":"td","els":[["raw","\u003ccircle cx='220' cy='200' r='150' class='s-st' stroke-width='1.5'/>\u003ccircle cx='220' cy='200' r='100' class='s-magst' stroke-width='1.5'/>\u003cpath d='M220.0,50.0 L220.0,64.0' class='s-st' stroke-width='2'/>\u003cpath d='M194.1,103.4 L197.2,115.0' class='s-magst' stroke-width='2'/>\u003cpath d='M246.0,52.3 L244.8,59.2' class='s-st' stroke-width='1'/>\u003cpath d='M211.3,100.4 L211.8,106.4' class='s-magst' stroke-width='1'/>\u003cpath d='M271.3,59.0 L268.9,65.6' class='s-st' stroke-width='1'/>\u003cpath d='M228.7,100.4 L228.2,106.4' class='s-magst' stroke-width='1'/>\u003cpath d='M295.0,70.1 L288.0,82.2' class='s-st' stroke-width='2'/>\u003cpath d='M245.9,103.4 L242.8,115.0' class='s-magst' stroke-width='2'/>\u003cpath d='M316.4,85.1 L311.9,90.5' class='s-st' stroke-width='1'/>\u003cpath d='M262.3,109.4 L259.7,114.8' class='s-magst' stroke-width='1'/>\u003cpath d='M334.9,103.6 L329.5,108.1' class='s-st' stroke-width='1'/>\u003cpath d='M277.4,118.1 L273.9,123.0' class='s-magst' stroke-width='1'/>\u003cpath d='M349.9,125.0 L337.8,132.0' class='s-st' stroke-width='2'/>\u003cpath d='M290.7,129.3 L282.2,137.8' class='s-magst' stroke-width='2'/>\u003cpath d='M361.0,148.7 L354.4,151.1' class='s-st' stroke-width='1'/>\u003cpath d='M301.9,142.6 L297.0,146.1' class='s-magst' stroke-width= doc","Label everything","As you go"],["north","Work in true","Convert at the end"],["target","Answer precisely","Nearest degree and tenth of a mile"]]}},"script":"Plotting rewards neatness. Keep your pencil sharp, because a thick line on a coast chart can hide a tenth of a mile. Label every line and position as you draw it, so you can find your work again in a multi-part problem. Work in true directions and convert to magnetic or compass only at the end. Exam answers are usually to the nearest degree and the nearest tenth of a mile, with choices close together. If your answer doesn’t match any choice, go back and find the step that went wrong rather than guessing."}]},{"id":"plot-02","module":"P","title":"Plotting and reading positions","status":"draft-unverified","slides":[{"heading":"Reading a position","visual":{"k":"dg","f":"latlong"},"script":"To read a position, measure its latitude on the side scale and its longitude on the top or bottom scale. For latitude, set the dividers from the point to the nearest parallel of latitude, carry them to the side scale and count the minutes, or lay a straightedge horizontally from the point to the scale. For longitude, measure from the nearest meridian to the point, and read the minutes on the top or bottom scale. In west longitude, the numbers increase to the left, and in north latitude, they increase upward. Getting that direction wrong is a common mistake."},{"heading":"Plotting a position","visual":{"k":"script","lines":["Plot 41°18.5′N, 71°35.0′W","Find 41°18.5′ on the side scale; lay a straightedge across","Find 71°35.0′ on the top scale; set dividers from the nearest meridian","Mark where they meet with a dot and a small circle","Write the time beside it"],"fig":{"t":"td","els":[["raw","\u003crect x='70' y='70' width='330' height='270' class='s-surfb'/>\u003cpath d='M70,340.0 h-10' class='s-st' stroke-width='1.3'/>\u003cpath d='M70.0,70 v-10' class='s-st' stroke-width='1.3'/>\u003cpath d='M70,326.5 h-5' class='s-st' e into tenths, so positions are written in degrees, minutes and tenths of a minute: forty-one degrees, eighteen point five minutes means eighteen and a half minutes. Don’t confuse that with eighteen minutes, fifty seconds, an older format. Count the small tick marks carefully, since scales at different latitudes may be divided differently. Always write latitude first, with north or south, then longitude, with east or west."},{"heading":"Worked example: reading a light’s position","visual":{"k":"script","lines":["Lay a straightedge from the light to the side scale","Latitude reads 41°10.2′N","Measure from the 71°30′W meridian to the light: 4.6′ west","Longitude: 71°30′ + 4.6′ = 71°34.6′W","Answer: 41°10.2′N, 71°34.6′W"],"fig":{"t":"td","els":[["raw","\u003crect x='70' y='70' width='330' height='270' class='s-surfb'/>\u003cpath d='M70,340.0 h-10' class='s-st' stroke-width='1.3'/>\u003cpath d='M70.0,70 v-10' class='s-st' stroke-width='1.3'/>\u003cpath d='M70,326.5 h-5' class='s-st' stroke-width='1.3'/>\u003cpath d='M86.5,70 v-5' class='s-st' stroke-width='1.3'/>\u003cpath d='M70,313.0 h-5' class='s-st' stroke-width='1.3'/>\u003cpath d='M103.0,70 v-5' class='s-st' stroke-width='1.3'/>\u003cpath d='M70,299.5 h-5' class='s-st' stroke-width='1.3'/>\u003cpath d='M119.5,70 v-5' class='s-st' stroke-width='1.3'/>\u003cpath d='M70,286.0 h-5' class='s-st' stroke-width='1.3'/>\u003cpath d='M136.0,70 v-5' class='s-st' stroke-width='1.3'/>\u003cpath d='M70,272.5 h-10' class='s-st' stroke-width='1.3'/>\u003cpath d='M152.5,70 v-10' class='s-st' stroke-width='1.3'/>\u003cpath d='M70,259.0 h-5' class='s-st' stroke-width='1.3'/>\u003cpath d='M169.0,70 v-5' class='s-st' stroke-width='1.3'/>\u003cpath d='M70,245.5 h-5' class='s-st' stroke-width='1.3'/>\u003cpath d='M185.5,70 v-5' class='s-st' stroke-width='1.3'/>\u003cpath d='M70,232.0 h-5' class='s-st' stroke-width='1.3'/>\u003cpath d='M202.0,70 v-5' class='s-st' stroke-width='1.3'/>\u003cpath d='M70,218.5 h-5' class='s-st' stroke-width= ally to the side scale, and read forty-one degrees, ten point two minutes north. Next, measure with the dividers from the nearest meridian, seventy-one degrees thirty minutes west, to the light. Carry that to the top scale, and it spans four point six minutes. Because the light is west of the meridian, and west longitude increases to the west, add: seventy-one degrees thirty-four point six minutes west. The answer is forty-one degrees ten point two north, seventy-one degrees thirty-four point six west."}]},{"id":"plot-03","module":"P","title":"Laying courses and measuring distance","status":"draft-unverified","slides":[{"heading":"Labeling a course line","visual":{"k":"dg","f":"courselabel"},"script":"Every line you draw gets a label, so you and an examiner can follow your work. Write the course above the line, with a C, the three-digit direction, and T for true or M for magnetic. Write the speed below the line with an S. Mark each position along the track with its symbol, a circle for a fix and a half circle for a dead reckoning position, and write the time beside it, using the twenty-four hour clock. Here, a boat leaves an eight hundred fix on course zero six eight true at twelve knots, with DR positions at nine and ten hundred."},{"heading":"Laying a course, step by step","visual":{"k":"script","lines":["Draw a line from departure to destination","Walk the rulers to the rose; read the true course","Measure the length with dividers on the latitude scale","Long legs: set dividers to a round distance and step it off","Label course above, speed below; add the ETA at the destination"],"fig":{"t":"tiles","items":[["pencil","Draw the line"],["rulers","Walk to the rose: true course"],["dividers","Measure on the latitude scale"],["doc","Label: course above, speed below"]]}},"script":"To lay a course, draw a straight line from your departure point to your destination, checking that it doesn’t cross land or shoals. Walk the parallel rulers to the nearest rose and read the true course on the outer ring. Measure the length of the line with dividers on the latitude scale. For a leg longer than your dividers can span, set them to a round number like one or five miles and step along the line, then measure the leftover piece. Label the line, and write your estimated time of arrival at the destination."},{"heading":"Distance pitfalls","visual":{"k":"points","items":["1′ of latitude = 1 nm, measured at the side","Use the part of the scale level with your work","Never use the longitude scale","Step carefully: small errors add up on long legs","Answers are usually to the nearest tenth of a mile"],"fig":{"t":"cmp","a":["yes","Latitude scale, at the side","dividers","1 minute = 1 nautical mile. Use the part level with your work"],"b":["no","Longitude scale","no","Never measure distance on it"]}},"script":"The most common distance errors are measuring on the longitude scale, which gives an answer that’s much too large at Florida or New England latitudes, and using the latitude scale far from where you’re working. A third is careless stepping with the dividers, where small errors add up on a long leg. Work carefully, and give distances to the nearest tenth of a nautical mile."},{"heading":"Worked example","visual":{"k":"script","lines":["From buoy “1” to bell “2”","Parallel rulers give 068°T","Dividers span 5.3′ of latitude: 5.3 nm","At 12 knots: 60 × 5.3 ÷ 12 = 26.5 min","Depart 0900: ETA about 0927"],"fig":{"t":"td","els":[["raw","\u003cpath d='M408,60 V24 M400,34 L408,22 L416,34' class='s-st' stroke-width='2'/>\u003ctext x='408' y='76' text-anchor='middle' font-size='13' font-weight='600' class='s-mut'>N\u003c/text>"],["p","M80,270 L348.9,161.4","s-st",2.5],["raw","\u003ccircle cx='80' cy='270' r='8' class='s-magst' stroke-width='2.5'/>\u003ccircle cx='80' cy='270' r='2.2' class='s-mag'/>\u003ccircle cx='348.9' cy='161.4' r='8' class='s-magst' stroke-width='2.5'/>\u003ccircle cx='348.9' cy='161.4' r='2.2' class='s-mag'/>"],["m",80,300,"Depart 0900"],["m",348.9,141.4,"ETA 0927"],["raw","\u003cg transform='rotate(-22 214.4 215.7)'>\u003ctext x='214.4' y='203.7' text-anchor='middle' font-size='16' font-weight='700' class='s-mag'>C 068°T\u003c/text>\u003ctext x='214.4' y='239.7' text-anchor='middle' font-size='16' font-weight='700' class='s-mag'>S 12\u003c/text>\u003c/g>"],["t",220,40,"Buoy “1” to bell “2”"],["t",220,340,"5.3 nm at 12 knots","middle",15],["m",220,362,"60 × 5.3 ÷ 12 = 26.5 minutes"]]}},"script":"Here’s a complete leg. You’re going from buoy one to bell two. Walking the parallel rulers to the rose gives a true course of zero six eight. The dividers span five point three minutes on the latitude scale beside the line, so the distance is five point three nautical miles. At twelve knots, the time is sixty times five point three, divided by twelve, about twenty-six and a half minutes. Departing at nine hundred, you’ll arrive at about nine twenty-seven."}]},{"id":"plot-04","module":"P","title":"Speed, time, distance and fuel","status":"draft-unverified","slides":[{"heading":"60 D Street","visual":{"k":"formula","f":"60 × D = S × T","rows":["Time (minutes) = 60 × D ÷ S","Distance (nm) = S × T ÷ 60","Speed (knots) = 60 × D ÷ T"],"ex":"Example: 12 nm at 8 knots takes 60 × 12 ÷ 8 = 90 minutes","fig":{"t":"td","els":[["raw","\u003ccircle cx='220' cy='190' r='130' class='s-surfb'/>\u003cpath d='M90,190 H350 M220,190 V320' class='s-st' stroke-width='2.5'/>"],["t",220,150,"60 × D","middle",40,"s-mag"],["t",156,262,"S","middle",44],["t",284,262,"T","middle",44],["m",220,362,"Cover the one you want; the rest is the formula"]]}},"script":"Speed, time and distance problems are free points if you know one formula: sixty times distance equals speed times time. Remember it as sixty D street. Distance is in nautical miles, speed in knots, and time in minutes. To find time, multiply sixty by the distance and divide by the speed. To find distance, multiply speed by time and divide by sixty. To find speed, multiply sixty by the distance and divide by the time. Twelve miles at eight knots takes sixty times twelve, divided by eight, or ninety minutes."},{"heading":"Time arithmetic","visual":{"k":"script","lines":["Use the 24-hour clock: 1:30 p.m. is 1330","0945 + 50 minutes = 1035 (carry at 60, not 100)","1.75 hours = 1 hour 45 minutes","105 minutes = 1 hour 45 minutes","Multi-leg trips: add the time for each leg"],"fig":{"t":"rows","items":[["clock","24-hour clock","1:30 p.m. is 1330"],["calc","Carry at 60, not 100","0945 + 50 minutes = 1035"],["clock","Decimal hours","1.75 hours = 1 hour 45 minutes"]]}},"script":"Many wrong answers come from time arithmetic, not navigation. Use the twenty-four hour clock, so one thirty in the afternoon is thirteen thirty. When you add minutes, remember there are sixty minutes in an hour, not one hundred: nine forty-five plus fifty minutes is ten thirty-five. Convert decimal hours by multiplying the decimal by sixty, so one point seven five hours is one hour forty-five minutes. For trips with several legs, work out each leg’s time separately and add them."},{"heading":"Finding your ETA","visual":{"k":"script","lines":["Depart 0815; run 22 nm at 16 knots","T = 60 × 22 ÷ 16 = 82.5 min ≈ 1 h 23 min","ETA = 0815 + 1:23 = 0938","Speed changes? Recompute from your latest position","Current changes your speed over ground, and your ETA"],"fig":{"t":"td","els":[["p","M60,180 H380","s-st",3],["raw","\u003ccircle cx='60' cy='180' r='9' class='s-mag'/>\u003ccircle cx='380' cy='180' r='9' class='s-mag'/>"],["t",60,150,"0815","middle",20],["m",60,214,"Depart"],["t",380,150,"0938","middle",20,"s-mag"],["m",380,214,"ETA"],["i","boat",220,160,1.2],["t",220,260,"22 nm at 16 knots","middle",16],["m",220,286,"60 × 22 ÷ 16 = 82.5 minutes"],["m",220,306,"about 1 hour 23 minutes"]]}},"script":"To find an estimated time of arrival, work out the running time and add it to your departure time. Departing at eight fifteen, running twenty-two miles at sixteen knots takes sixty times twenty-two, divided by sixteen, about eighty-two and a half minutes, or one hour twenty-three minutes. Your ETA is nine thirty-eight. If your speed changes, recompute from your latest position. And remember that current changes your speed over the ground, so a head current makes you late."},{"heading":"Fuel planning","visual":{"k":"script","lines":["42 nm out at 14 knots: 3 hours each way","Burning 18 gal/h: 54 gal one way","Rule of thirds: one third out, one third back, one third reserve","Carry 3 × 54 = 162 gallons","Rough seas and heavy loads burn more: stay conservative"],"fig":{"t":"td","els":[["t",220,50,"Rule of thirds"],["x",30,100,124,90,"#A3195B"],["x",158,100,124,90,"#D98BB0"],["x",286,100,124,90,"#F2C230"],["t",92,150,"Out","middle",18,"s-on"],["t",220,150,"Back","middle",18],["t",348,150,"Reserve","middle",18],["m",92,216,"54 gal"],["m",220,216,"54 gal"],["m",348,216,"54 gal"],["t",220,280,"Carry 3 × 54 = 162 gallons","middle",17,"s-mag"],["m",220,306,"3 hours each way at 18 gallons an hour"]]}},"script":"Fuel planning uses the rule of thirds: plan to use one third of your fuel going out, one third coming back, and keep one third in reserve. Say your spot is forty-two miles out, you cruise at fourteen knots, and you burn eighteen gallons an hour. The run out takes three hours and uses fifty-four gallons. By the rule of thirds, you need three times fifty-four, or one hundred sixty-two gallons aboard. Rough seas, head winds and heavy loads all burn more fuel, so be conservative."},{"heading":"Speed through the water vs over the ground","visual":{"k":"points","items":["Knotmeter or log: speed through the water","GPS: speed over ground","The difference is current along your track","Exam problems usually give speed through the water","Find speed over ground from successive fixes"],"fig":{"t":"td","els":[["i","boat",70,110,1.6],["a","M110,110 H390"],["t",250,92,"Speed through the water","middle",15],["m",250,134,"Knotmeter or log"],["a","M390,200 H310","s-st"],["m",350,226,"Current against you"],["a","M110,290 H310"],["t",210,272,"Speed over ground","middle",15,"s-mag"],["m",210,314,"What the GPS shows"]]}},"script":"Two speeds matter. A knotmeter or log measures your speed through the water. GPS shows your speed over the ground. The difference between them is the current along your track: with a fair current you go faster over the ground, and with a foul current, slower. Exam problems usually give you the boat’s speed through the water, and ask you to find speed over the ground, or speed made good, from fixes or a current diagram."}]},{"id":"plot-05","module":"P","title":"Compass corrections on the chart","status":"draft-unverified","slides":[{"heading":"The correction chain","visual":{"k":"dg","f":"chain"},"script":"Plotting problems constantly convert between true, magnetic and compass. Remember the chain: true, variation, magnetic, deviation, compass, or True Virgins Make Dull Companions. Going down the chain, from true toward compass, add west and subtract east. Going up the chain, from compass toward true, add east and subtract west. Write each step on paper with its sign, because a single sign error is the most common wrong answer on the plotting exam."},{"heading":"From a plotted course to the course to steer","visual":{"k":"script","lines":["Plotted course: 068°T","Variation (updated): 14°W","068 + 14 = 082° magnetic","Deviation on 082° from the card: 2°E","082 − 2 = 080° compass: steer 080"],"fig":{"t":"rows","items":[["north","True 068°","The plotted course"],["globe","+ 14°W variation","082° magnetic"],["magnet","− 2°E deviation","080° compass: steer 080"]]}},"script":"Here’s the most common conversion. You’ve plotted a course of zero six eight true. The training chart area has variation of about fourteen degrees west. Going from true toward magnetic, add west: zero six eight plus fourteen is zero eight two magnetic. Look up the deviation for that heading on the deviation card, two degrees east. Going from magnetic toward compass, subtract east: zero eight two minus two gives zero eight zero. That’s the course you steer."},{"heading":"Plotting a compass bearing","visual":{"k":"script","lines":["Steering 080° by ship’s compass; deviation 2°E on that heading","Light bears 015° by ship’s compass","015 + 2 = 017° magnetic (deviation for your heading)","017 − 14 = 003° true","Draw a line through the light at 003°; you lie along its reciprocal, 183°"],"fig":{"t":"td","els":[["raw","\u003cpath d='M408,60 V24 M400,34 L408,22 L416,34' class='s-st' stroke-width='2'/>\u003ctext x='408' y='76' text-anchor='middle' font-size='13' font-weight='600' class='s-mut'>N\u003c/text>"],["raw","\u003ccircle cx='236' cy='80' r='6' class='s-mag'/>\u003ccircle cx='236' cy='80' r='12' class='s-mag' opacity='.25'/>"],["p","M236,80 L222.9,329.7","s-st",2.5],["h",225,289.7,80,"s-ink",0.9],["m",258,85,"Light","start"],["t",20,150,"015° C + 2°E","start",15],["m",20,170,"= 017° magnetic","start"],["t",20,204,"017° − 14°W","start",15],["m",20,224,"= 003° true","start"],["t",262,200,"LOP 003°T","start",15,"s-mag"],["m",262,220,"You’re on the 183°","start"],["m",262,238,"line from the light","start"]]}},"script":"To plot a bearing taken with the ship’s compass, first convert it to true, using the deviation for the boat’s heading, not for the bearing. Steering zero eight zero by compass, with two degrees east deviation, you see a light bearing zero one five by compass. Add east: zero one seven magnetic. Subtract fourteen west: zero zero three true. Now draw a line through the light in that direction. Your boat lies somewhere along that line, on the side toward you, which runs from the light along the reciprocal, one eight three."},{"heading":"Updating variation","visual":{"k":"script","lines":["Rose: 14°45′W (2010), annual increase 2′","Years: 2026 − 2010 = 16","Change: 16 × 2′ = 32′ increase","14°45′ + 32′ = 15°17′W","Use about 15°W"],"fig":{"t":"big","ic":"compass","v":"15°W","cap":"14°45′W in 2010, plus 16 years × 2′ = 15°17′W","sub":"Update the rose’s variation to the current year"}},"script":"The variation printed in the rose applies to the year shown, so update it. Suppose the rose says fourteen degrees forty-five minutes west in twenty ten, increasing two minutes a year. In twenty twenty-six, sixteen years have passed. Sixteen times two minutes is thirty-two minutes of increase. Fourteen forty-five plus thirty-two minutes is fifteen degrees seventeen minutes west, or about fifteen degrees west. Note that many exam questions simply give you the variation to use, so read the question carefully before doing this step."},{"heading":"Common traps","visual":{"k":"points","items":["Bearings: use the deviation for the boat’s heading","Signs: add west going toward compass; add east going toward true","Reading the wrong side of the rose: 180° off","Mixing true and magnetic in one problem","Answer in what the question asks: true, magnetic or compass"],"fig":{"t":"rows","items":[["magnet","Deviation","Use the boat’s heading, even for bearings"],["turn","180° off?","You read the wrong side of the rose"],["north","True, magnetic or compass?","Answer in what the question asks"]]}},"script":"Watch for these traps. Use the deviation for the boat’s heading when correcting a bearing. Get the signs right: going toward compass, add west; going toward true, add east. Reading the wrong side of the rose puts your answer exactly one hundred eighty degrees off, and that wrong answer is often one of the choices. Don’t mix true and magnetic in the same calculation. And give your answer in whatever the question asks for: true, magnetic or compass."}]},{"id":"plot-06","module":"P","title":"Lines of position and fixes","status":"draft-unverified","slides":[{"heading":"Lines of position","visual":{"k":"points","items":["A bearing to a charted object","A range: two charted objects in line","A distance circle: a radar range to a charted point","A depth contour: a rough check","Label: time above the line, bearing below"],"fig":{"t":"tiles","items":[["eye","A bearing to a charted object"],["flag","A range: two objects in line"],["radar","A radar distance circle"],["depth","A depth contour: a rough check"]]}},"script":"A line of position, or L O P, is a line somewhere along which your boat must be. The most common is a bearing to a charted object, like a lighthouse or tower, converted to true and drawn through the object. Two charted objects in line, a range, give a very accurate L O P with no compass error at all. A radar range to a charted point gives a circle of position around it. Even a depth contour can serve as a rough L O P. Label each one with the time above the line and the true bearing below it."},{"heading":"Two-bearing fix","visual":{"k":"dg","f":"fix"},"script":"One L O P tells you you’re somewhere on a line. Two L O Ps taken at the same time cross at a point, and that point is a fix. Choose objects whose bearings are about sixty to ninety degrees apart, because when lines cross at a shallow angle, a small bearing error moves the fix a long way. Take the bearings quickly, one after the other, so the boat hasn’t moved much between them. Mark the fix with a small circle and the time."},{"heading":"Three bearings and the cocked hat","visual":{"k":"dg","f":"cockedhat"},"script":"A third bearing checks the other two. Because of small errors, three bearings rarely meet at exactly one point. Instead, they form a small triangle, called a cocked hat. Plot your fix in the middle of the triangle. If the triangle is large, something is wrong: a misidentified landmark, a misread compass, a bearing plotted from the wrong side, or a forgotten correction. Recheck before trusting it. The ideal is three objects about one hundred twenty degrees apart."},{"heading":"Worked example","visual":{"k":"script","lines":["1015: light bears 340°T; tower bears 065°T","Through the light, draw a line toward you: 160°T","Through the tower, draw a line toward you: 245°T","They cross at your 1015 fix: circle and label it","Read the fix’s latitude and longitude"],"fig":{"t":"td","els":[["raw","\u003cpath d='M408,60 V24 M400,34 L408,22 L416,34' class='s-st' stroke-width='2'/>\u003ctext x='408' y='76' text-anchor='middle' font-size='13' font-weight='600' class='s-mut'>N\u003c/text>"],["p","M135.0,101.5 L215.4,322.3","s-st",2],["p","M358.6,206.0 L159.2,299.0","s-st",2],["raw","\u003ccircle cx='135.0' cy='101.5' r='6' class='s-mag'/>\u003ccircle cx='135.0' cy='101.5' r='12' class='s-mag' opacity='.25'/>\u003ccircle cx='358.6' cy='206.0' r='7' class='s-st' stroke-width='2.5'/>\u003ccircle cx='358.6' cy='206.0' r='2' class='s-ink'/>\u003ccircle cx='200' cy='280' r='10' class='s-magst' stroke-width='2.5'/>\u003ccircle cx='200' cy='280' r='2.2' class='s-mag'/>"],["m",119,105.5,"Light","end"],["m",358.6,190,"Tower"],["t",128,190,"160°T","end",14,"s-mag"],["t",300,216,"245°T","middle",14,"s-mag"],["t",218,308,"1015 fix","start",15],["m",220,372,"Draw each line from the object back toward you"]]}},"script":"At ten fifteen you take two bearings: a light bears three four zero true, and a tower bears zero six five true. Through the light, draw a line along the bearing. Your boat is on the side toward you, along the reciprocal, one six zero. Through the tower, draw the second line; your boat is along its reciprocal, two four five. The lines are eighty-five degrees apart, nearly ideal, and they cross at your ten fifteen fix. Circle it, label it, and read its latitude and longitude from the scales."},{"heading":"Other kinds of fixes","visual":{"k":"points","items":["Bearing and radar range on one object: an excellent fix","Radar ranges to two objects: two circles cross","A range plus a bearing","GPS fix: mark it with a triangle","Cross-check every fix with another source"],"fig":{"t":"td","els":[["raw","\u003ccircle cx='150' cy='150' r='7' class='s-st' stroke-width='2.5'/>\u003ccircle cx='150' cy='150' r='2' class='s-ink'/>\u003ccircle cx='150' cy='150' r='130' class='s-magst' stroke-width='2' stroke-dasharray='6 5'/>\u003ccircle cx='262.6' cy='215.0' r='10' class='s-magst' stroke-width='2.5'/>\u003ccircle cx='262.6' cy='215.0' r='2.2' class='s-mag'/>\u003cpath d='M330,330 L346,358 H314 Z' class='s-magst' stroke-width='2.5'/>\u003ccircle cx='330' cy='348' r='2' class='s-mag'/>"],["p","M150,150 L297.2,235.0","s-st",2],["t",20,340,"Bearing + radar range","start",16],["m",20,360,"on one object: an excellent fix","start"],["m",278.6,207,"Fix","start"],["m",330,384,"GPS fix: a triangle"]]}},"script":"Fixes don’t have to come from two bearings. A bearing and a radar range on the same object make an excellent fix, because the two lines cross at right angles. Radar ranges to two separate objects give two circles that cross. A range line plus a bearing on another object works well. An electronic fix from GPS is marked with a small triangle. Whatever the method, cross-check every fix against another source, like the depth, before you trust it."}]},{"id":"plot-07","module":"P","title":"Dead reckoning and estimated positions","status":"draft-unverified","slides":[{"heading":"Plotting symbols","visual":{"k":"dg","f":"symbols"},"script":"Plotting uses standard symbols. A fix, from two or more good lines of position, is a small circle. A dead reckoning position, from course and speed alone, is a half circle drawn on the course line. An estimated position, a DR improved with other information such as current or a single line of position, is a small square. An electronic fix, such as from GPS, is often shown as a triangle. Write the time beside every position, followed by fix, D R or E P."},{"heading":"When to plot a DR","visual":{"k":"points","items":["Every hour, on the hour","At every course or speed change","At the time of every fix or running fix","At the time of a single line of position","Start a new DR track from every fix"],"fig":{"t":"rows","items":[["clock","Every hour, on the hour",""],["turn","At every course or speed change",""],["target","At every fix or line of position",""],["right","A new DR track from every fix",""]]}},"script":"Dead reckoning follows a few standard rules. Plot a DR position every hour on the hour, at every change of course or speed, at the time of every fix or running fix, and at the time you obtain a single line of position. Whenever you get a fix, start a new DR track from it, because the fix is better information than your old DR. These rules come from Bowditch, the standard navigation reference, and exam problems follow them."},{"heading":"DR versus EP versus fix","visual":{"k":"points","items":["DR: course and speed only; no current or wind","EP: the DR adjusted with the best other information","EP from one LOP: the point on the LOP nearest the DR","Fix: two or more good LOPs at the same time","Trust a fix over an EP, and an EP over a DR"],"fig":{"t":"rows","items":[["num:1","Fix","Two or more good LOPs at one time. Trust it most"],["num:2","Estimated position","The DR adjusted with other information"],["num:3","DR","Course and speed only"]]}},"script":"Know the difference between these positions. A DR uses only the course steered and the speed through the water, ignoring current and wind. An estimated position improves on the DR with any other information, such as a known current or a single line of position. With one L O P, the E P is the point on that line nearest your DR position. A fix uses two or more good lines of position taken at the same time. In order of reliability: trust a fix over an E P, and an E P over a DR."},{"heading":"Worked example: a DR track","visual":{"k":"script","lines":["0800 fix; course 125°T, speed 10 knots","0900 DR: 10 nm from the fix along 125°T","0930: change course to 160°T; DR 5 nm further along 125°T","1000 DR: 5 nm from the 0930 DR along 160°T","A fix at any time starts a new DR track"],"fig":{"t":"td","els":[["raw","\u003cpath d='M408,60 V24 M400,34 L408,22 L416,34' class='s-st' stroke-width='2'/>\u003ctext x='408' y='76' text-anchor='middle' font-size='13' font-weight='600' class='s-mut'>N\u003c/text>"],["p","M60,90 L244.3,219.0 L270.0,289.5","s-st",2.5],["raw","\u003ccircle cx='60' cy='90' r='8' class='s-magst' stroke-width='2.5'/>\u003ccircle cx='60' cy='90' r='2.2' class='s-mag'/>\u003cpath d='M173.9,176.0 A9,9 0 0 1 191.9,176.0' class='s-st' stroke-width='2.5'/>\u003ccircle cx='182.9' cy='176.0' r='2.2' class='s-ink'/>\u003cpath d='M235.3,219.0 A9,9 0 0 1 253.3,219.0' class='s-st' stroke-width='2.5'/>\u003ccircle cx='244.3' cy='219.0' r='2.2' class='s-ink'/>\u003cpath d='M261.0,289.5 A9,9 0 0 1 279.0,289.5' class='s-st' stroke-width='2.5'/>\u003ccircle cx='270.0' cy='289.5' r='2.2' class='s-ink'/>"],["m",74,78,"0800 fix","start"],["m",196.9,168,"0900 DR","start"],["m",258.3,211,"0930 DR","start"],["m",284,295.5,"1000 DR","start"],["t",70,190,"C 125°T","start",15,"s-mag"],["t",70,210,"S 10","start",15,"s-mag"],["t",180,290,"C 160°T","start",15,"s-mag"],["m",220,380,"A fix at any time starts a new DR track"]]}},"script":"Here’s a DR track. You leave an eight hundred fix on course one two five true at ten knots. At nine hundred, plot a DR ten miles along that course. At nine thirty you change course, so plot a DR there, five more miles along one two five. From that nine thirty DR, draw the new course line at one six zero true, and at ten hundred plot a DR five miles along it. Label each position with its time. If you get a fix along the way, start a fresh DR track from the fix."},{"heading":"Why DR still matters","visual":{"k":"points","items":["Keep a log of courses, speeds and times","Your chartplotter track is not a DR","If GPS fails, your last fix plus DR gets you home","A DR shows how much current is pushing you","Practice on calm days and compare with GPS"],"fig":{"t":"rows","items":[["book","Keep a log","Courses, speeds and times"],["warn","If GPS fails","Your last fix plus DR gets you home"],["current","DR compared with GPS","Shows how the current is pushing you"]]}},"script":"With GPS on every boat, why learn dead reckoning? Because electronics fail. If your GPS or power quits, your last fix plus a DR from your logged courses and speeds is how you get home. Keep a written log of course, speed and the times of every change. Your chartplotter track only records where you went; it isn’t a DR. And comparing your DR with a GPS fix shows you exactly how much the current is setting you, which helps you plan the rest of the trip."}]},{"id":"plot-08","module":"P","title":"Running fixes and bow angles","status":"draft-unverified","slides":[{"heading":"The running fix","visual":{"k":"dg","f":"runningfix"},"script":"Sometimes only one landmark is in sight. A running fix uses it twice. Take a bearing and plot the line of position. Keep running on a steady course and speed, and later take a second bearing on the same or another object. Then advance the first L O P: move it parallel to itself, in the direction of your course, by the distance you ran between bearings. Where the advanced line crosses the second L O P is your running fix. Its accuracy depends on your course and speed being right, so unknown current between bearings creates error."},{"heading":"Worked example","visual":{"k":"script","lines":["0900: light bears 020°T; course 090°T at 12 knots","0930: the same light bears 330°T","Run between bearings: 12 × 30 ÷ 60 = 6 nm along 090°T","Advance the 0900 LOP 6 nm toward 090°T, keeping it parallel","The 0930 running fix is where it crosses the 0930 LOP"],"fig":{"t":"td","els":[["raw","\u003cpath d='M408,60 V24 M400,34 L408,22 L416,34' class='s-st' stroke-width='2'/>\u003ctext x='408' y='76' text-anchor='middle' font-size='13' font-weight='600' class='s-mut'>N\u003c/text>"],["p","M50,310 H400","s-st",2.5],["p","M154.9,131.6 L76.2,347.7","s-st",2],["p","M154.9,131.6 L277.4,343.8","s-st",2],["l","M322.9,131.6 L244.2,347.7","s-magst"],["raw","\u003ccircle cx='154.9' cy='131.6' r='6' class='s-mag'/>\u003ccircle cx='154.9' cy='131.6' r='12' class='s-mag' opacity='.25'/>\u003cpath d='M81,310 A9,9 0 0 1 99,310' class='s-st' stroke-width='2.5'/>\u003ccircle cx='90' cy='310' r='2.2' class='s-ink'/>\u003ccircle cx='258' cy='310' r='10' class='s-magst' stroke-width='2.5'/>\u003ccircle cx='258' cy='310' r='2.2' class='s-mag'/>"],["a","M100,332 H246"],["t",174,356,"Run 6 nm","middle",14,"s-mag"],["m",154.9,113.6,"Light"],["m",84,214,"0900 LOP"],["m",300,200,"0900 LOP,","start"],["m",300,218,"advanced","start"],["m",248,252,"0930","end"],["t",274,300,"0930 running fix","start",14],["m",60,300,"C 090°T","start"]]}},"script":"Let’s work one. At nine hundred, steering zero nine zero true at twelve knots, a light bears zero two zero true. Plot that L O P. At nine thirty, the same light bears three three zero true. Plot the second L O P. In thirty minutes at twelve knots, you ran six miles along zero nine zero. Pick any point on the nine hundred L O P, measure six miles from it in the direction zero nine zero, and draw a line through that point parallel to the original L O P. Where it crosses the nine thirty L O P is your nine thirty running fix, labeled R fix."},{"heading":"Bow and beam bearings","visual":{"k":"dg","f":"doubling"},"script":"Some special bearings give your distance off without plotting. The bow and beam bearing is the easiest. Note the time when a light is forty-five degrees off your bow, and again when it’s abeam, ninety degrees off the bow. The distance you ran between those two times equals your distance off the light when abeam. This works because the bearings form a right triangle with two equal sides. It’s a quick way to check your distance off a light or a headland."},{"heading":"Doubling the angle on the bow","visual":{"k":"table","head":["First bearing","Second bearing","Result"],"rows":[["45° on the bow","90° (abeam)","Distance off abeam = distance run"],["30° on the bow","60° on the bow","Distance off at the 2nd bearing = distance run"],["22.5° on the bow","45° on the bow","Distance off when abeam ≈ 0.7 × distance run"],["Any angle","Twice that angle","Distance off at the 2nd bearing = distance run"]],"fig":{"t":"band","items":[["txt:45/90","Bow and beam","Distance off abeam = distance run"],["txt:30/60","Doubling the angle","Distance off = distance run"],["txt:22½/45","Seven-tenths rule","Off abeam ≈ 0.7 × distance run"]]}},"script":"Bow and beam is one case of a general rule called doubling the angle on the bow. Whenever an object’s angle on the bow doubles, the distance run between the two bearings equals your distance from the object at the second bearing. With thirty and sixty degrees, the distance run equals your distance off at the sixty degree bearing. A useful extra: with twenty-two and a half and forty-five degrees, your distance off when you pass abeam will be about seven tenths of the distance run, which warns you early if you’ll pass too close."},{"heading":"Worked example","visual":{"k":"script","lines":["Speed 10 knots","1012: light 30° on the bow; 1030: 60° on the bow","Run: 18 min at 10 knots = 3 nm","Distance off at 1030 = 3 nm","Plot it: 3 nm from the light along the 1030 bearing line"],"fig":{"t":"td","els":[["p","M40,300 H410","s-st",2.5],["p","M70,300 L295,170.1","s-st",2],["p","M220,300 L295,170.1","s-magst",3],["raw","\u003ccircle cx='295' cy='170.1' r='6' class='s-mag'/>\u003ccircle cx='295' cy='170.1' r='12' class='s-mag' opacity='.25'/>\u003cpath d='M61,300 A9,9 0 0 1 79,300' class='s-st' stroke-width='2.5'/>\u003ccircle cx='70' cy='300' r='2.2' class='s-ink'/>\u003cpath d='M211,300 A9,9 0 0 1 229,300' class='s-st' stroke-width='2.5'/>\u003ccircle cx='220' cy='300' r='2.2' class='s-ink'/>"],["m",70,330,"1012"],["m",220,330,"1030"],["t",126,290,"30°","middle",15],["t",252,290,"60°","middle",15],["t",145,356,"Run: 3 nm","middle",15],["t",290,236,"3 nm off","start",15,"s-mag"],["t",220,44,"Doubling the angle on the bow"],["m",220,66,"Distance off = distance run"]]}},"script":"Here’s doubling the angle at work. Running at ten knots, you see a light thirty degrees on the bow at ten twelve, and sixty degrees on the bow at ten thirty. In eighteen minutes at ten knots, you ran three miles. So at ten thirty you were three miles from the light. Combine that distance with the ten thirty bearing, and you have a fix: measure three miles from the light along the reciprocal of the bearing, and mark your position."}]},{"id":"plot-09","module":"P","title":"Current: set, drift and course to steer","status":"draft-unverified","slides":[{"heading":"Finding set and drift","visual":{"k":"dg","f":"setdrift"},"script":"When your fix doesn’t match your dead reckoning position, the difference is current, along with any wind effect or steering error. The set is the direction from the DR position to the fix at the same time. The drift is the distance between them divided by the hours since your last fix. Notice the direction: always from the DR toward the fix. Measuring from the fix back to the DR gives the reciprocal, exactly one hundred eighty degrees wrong, and that wrong answer is almost always one of the choices."},{"heading":"Worked example: set and drift","visual":{"k":"script","lines":["0800 fix; course 045°T at 8 knots","1000 DR: 16 nm along 045°T","1000 fix lies 2.4 nm from the DR, bearing 120°T from it","Set 120°T; drift 2.4 ÷ 2 = 1.2 knots","Actual track: measure from the 0800 fix to the 1000 fix"],"fig":{"t":"td","els":[["raw","\u003cpath d='M408,60 V24 M400,34 L408,22 L416,34' class='s-st' stroke-width='2'/>\u003ctext x='408' y='76' text-anchor='middle' font-size='13' font-weight='600' class='s-mut'>N\u003c/text>"],["p","M60,330 L286.3,103.7","s-st",2.5],["l","M60,330 L327.9,127.7","s-magst"],["raw","\u003ccircle cx='60' cy='330' r='8' class='s-magst' stroke-width='2.5'/>\u003ccircle cx='60' cy='330' r='2.2' class='s-mag'/>\u003cpath d='M277.3,103.7 A9,9 0 0 1 295.3,103.7' class='s-st' stroke-width='2.5'/>\u003ccircle cx='286.3' cy='103.7' r='2.2' class='s-ink'/>\u003ccircle cx='327.9' cy='127.7' r='8' class='s-magst' stroke-width='2.5'/>\u003ccircle cx='327.9' cy='127.7' r='2.2' class='s-mag'/>"],["a","M295.0,108.7 L319.2,122.7"],["m",76,336,"0800 fix","start"],["m",272.3,95.7,"1000 DR","end"],["m",341.9,133.7,"1000 fix","start"],["t",110,200,"C 045°T","start",15],["t",110,220,"S 8","start",15],["t",250,250,"Set 120°T","start",16,"s-mag"],["t",250,272,"Drift 1.2 knots","start",16,"s-mag"],["m",250,292,"2.4 nm ÷ 2 hours","start"]]}},"script":"You leave an eight hundred fix steering zero four five true at eight knots. At ten hundred your DR is sixteen miles along that course, but a ten hundred fix lies two point four miles from the DR, in the direction one two zero true. The set is one two zero true, the direction from DR to fix. The drift is two point four miles divided by two hours, one point two knots. To find what you actually made good, measure the line from the eight hundred fix to the ten hundred fix: that’s your track and speed over the ground."},{"heading":"Course to steer","visual":{"k":"dg","f":"currentvector"},"script":"To counter a known current, draw a current diagram. Draw your intended track from the start toward your destination. From the start, draw the current vector: its set and its drift for one hour. From the end of the current vector, set your dividers to your boat speed, and swing an arc until it crosses the intended track. The line from the end of the current vector to that crossing is your course to steer. The distance from the start to the crossing, along the track, is your speed made good."},{"heading":"Worked example: course to steer","visual":{"k":"script","lines":["Intended track 090°T; boat speed 10 knots","Current sets 180°T at 2 knots, pushing you south","Draw 2 nm of current toward 180° from the start","From its end, swing 10 nm to meet the track","Steer about 078°T; speed made good about 9.8 knots"],"fig":{"t":"td","els":[["raw","\u003cpath d='M408,60 V24 M400,34 L408,22 L416,34' class='s-st' stroke-width='2'/>\u003ctext x='408' y='76' text-anchor='middle' font-size='13' font-weight='600' class='s-mut'>N\u003c/text>"],["l","M60,150 H410"],["a","M60,150 L60,210","s-st"],["a","M60,214 L367.5,152"],["raw","\u003ccircle cx='60' cy='150' r='8' class='s-magst' stroke-width='2.5'/>\u003ccircle cx='60' cy='150' r='2.2' class='s-mag'/>"],["m",240,138,"Intended track 090°T"],["m",72,190,"Current","start"],["m",72,208,"180°T, 2 kn","start"],["t",230,222,"Steer 078°T at 10 knots","middle",15,"s-mag"],["t",220,320,"Speed made good: about 9.8 knots","middle",15],["m",220,344,"Draw the current first, then swing your speed to the track"]]}},"script":"Here are numbers. You want to make good a track of zero nine zero true at a boat speed of ten knots, and the current sets one eight zero at two knots, pushing you south. From the start, draw two miles toward one eight zero. From that point, swing ten miles until you hit the track line. The line you just swung runs about zero seven eight true, so you steer zero seven eight, crabbing about twelve degrees into the current. Your speed along the track, the speed made good, is about nine point eight knots."},{"heading":"Quick current rules","visual":{"k":"points","items":["Current directly with you: add drift to your speed","Directly against you: subtract it","Across your track: steer up-current","Wind leeway acts like a current","Recheck with fixes and adjust"],"fig":{"t":"rows","items":[["right","Current with you","Add the drift to your speed"],["current","Current against you","Subtract it"],["turn","Across your track","Steer up-current"],["wind","Wind leeway","Acts like a current"]]}},"script":"A few quick rules. A current directly with you adds its drift to your speed, and one directly against you subtracts it, so ten knots against a two knot current makes eight over the ground. A cross current needs a course correction into the current, found with the vector diagram. Wind pushing the boat sideways, called leeway, acts just like a current. And current predictions are only estimates, so keep taking fixes and adjusting your course to steer."}]},{"id":"plot-10","module":"P","title":"Putting it together: a full exam problem","status":"draft-unverified","slides":[{"heading":"How the plotting exam works","visual":{"k":"points","items":["A set of questions worked on the training chart","70% to pass","Questions often build on each other","An early mistake can carry through","Keep a scratch sheet with every step"],"fig":{"t":"big","ic":"chart","v":"70%","cap":"to pass the plotting exam","sub":"Questions build on each other: keep a scratch sheet of every step"}},"script":"The plotting exam is a set of questions you work on the training chart, and you need seventy percent to pass. The questions often build on each other, like a real voyage: you plot a departure, lay a course, take bearings, find a fix, work out the current, and compute an arrival time. That means an early mistake can carry through several answers. Keep a scratch sheet showing every step, so you can find an error quickly. Let’s walk through a complete problem."},{"heading":"Step 1: departure and course","visual":{"k":"script","lines":["0700: depart a charted buoy; read its position","Lay the course to the next mark: 068°T","Variation 15°W, deviation 2°E: 068 + 15 − 2 = 081° compass","Distance 9.6 nm at 12 knots: 48 minutes","ETA: 0748"],"fig":{"t":"td","els":[["raw","\u003cpath d='M408,60 V24 M400,34 L408,22 L416,34' class='s-st' stroke-width='2'/>\u003ctext x='408' y='76' text-anchor='middle' font-size='13' font-weight='600' class='s-mut'>N\u003c/text>"],["p","M80,270 L348.9,161.4","s-st",2.5],["raw","\u003ccircle cx='80' cy='270' r='8' class='s-magst' stroke-width='2.5'/>\u003ccircle cx='80' cy='270' r='2.2' class='s-mag'/>\u003ccircle cx='348.9' cy='161.4' r='8' class='s-magst' stroke-width='2.5'/>\u003ccircle cx='348.9' cy='161.4' r='2.2' class='s-mag'/>"],["m",80,300,"0700"],["m",348.9,141.4,"ETA 0748"],["raw","\u003cg transform='rotate(-22 214.4 215.7)'>\u003ctext x='214.4' y='203.7' text-anchor='middle' font-size='16' font-weight='700' class='s-mag'>C 068°T\u003c/text>\u003ctext x='214.4' y='239.7' text-anchor='middle' font-size='16' font-weight='700' class='s-mag'>S 12\u003c/text>\u003c/g>"],["t",220,40,"Step 1: the course"],["t",220,340,"068 + 15°W − 2°E = 081° compass","middle",15],["m",220,362,"9.6 nm at 12 knots = 48 minutes"]]}},"script":"Step one. At seven hundred you depart from a charted buoy, and the first question asks for its latitude and longitude, which you read from the scales. Next, lay a course to the next mark and read zero six eight true from the rose. The question gives variation fifteen west and deviation two east, so the compass course is zero six eight plus fifteen minus two: zero eight one. The leg measures nine point six miles; at twelve knots, that’s forty-eight minutes, for an ETA of seven forty-eight."},{"heading":"Step 2: a fix and the current","visual":{"k":"script","lines":["0730: light bears 352°T; tower bears 108°T: plot the fix","0730 DR: 6 nm along 068°T from the 0700 position","Fix lies 0.8 nm from the DR, bearing 160°T from it","Set 160°T; drift 0.8 ÷ 0.5 = 1.6 knots","You’re being set south of your track"],"fig":{"t":"td","els":[["raw","\u003cpath d='M408,60 V24 M400,34 L408,22 L416,34' class='s-st' stroke-width='2'/>\u003ctext x='408' y='76' text-anchor='middle' font-size='13' font-weight='600' class='s-mut'>N\u003c/text>"],["p","M50,310 L328.2,197.6","s-st",2.5],["p","M262.5,101.7 L288.9,289.9","s-st",1.6],["p","M392.8,285.7 L240.6,236.3","s-st",1.6],["raw","\u003ccircle cx='50' cy='310' r='8' class='s-magst' stroke-width='2.5'/>\u003ccircle cx='50' cy='310' r='2.2' class='s-mag'/>\u003cpath d='M263.5,220.1 A9,9 0 0 1 281.5,220.1' class='s-st' stroke-width='2.5'/>\u003ccircle cx='272.5' cy='220.1' r='2.2' class='s-ink'/>\u003ccircle cx='283.4' cy='250.2' r='9' class='s-magst' stroke-width='2.5'/>\u003ccircle cx='283.4' cy='250.2' r='2.2' class='s-mag'/>\u003ccircle cx='262.5' cy='101.7' r='6' class='s-mag'/>\u003ccircle cx='262.5' cy='101.7' r='12' class='s-mag' opacity='.25'/>\u003ccircle cx='392.8' cy='285.7' r='7' class='s-st' stroke-width='2.5'/>\u003ccircle cx='392.8' cy='285.7' r='2' class='s-ink'/>"],["m",54,338,"0700"],["m",260.5,210.1,"0730 DR","end"],["m",269.4,266.2,"0730 fix","end"],["m",280.5,105.7,"Light","start"],["m",392.8,309.7,"Tower"],["t",220,40,"Step 2: fix and current"],["t",220,362,"Set 160°T, drift 1.6 knots","middle",16,"s-mag"],["m",220,384,"0.8 nm in half an hour"]]}},"script":"Step two. At seven thirty you take two bearings, a light at three five two true and a tower at one zero eight true, and plot the fix where the lines cross. Your seven thirty DR is six miles along zero six eight from your departure, since you’ve run half an hour at twelve knots. The fix lies point eight miles from the DR, bearing one six zero true from it. So the current sets one six zero true, with a drift of point eight miles divided by half an hour, or one point six knots."},{"heading":"Step 3: correct for the current","visual":{"k":"script","lines":["From the 0730 fix, lay a new course to the mark","Draw a current diagram with set 160°T, drift 1.6 knots","Find the course to steer and speed made good","Convert the course to compass for the helmsman","Recompute the ETA using speed made good"],"fig":{"t":"steps","items":["New course from the 0730 fix","Current diagram: set 160°T, drift 1.6 knots","Course to steer and speed made good","Convert to compass; recompute the ETA"]}},"script":"Step three. From the seven thirty fix, lay a new course line to the mark. Then draw a current diagram, with the current setting one six zero at one point six knots, to find the course to steer that keeps you on that line, and your speed made good along it. Convert the course to steer to a compass course, using the variation and the deviation for the new heading. Finally, measure the remaining distance and divide by the speed made good, not your boat speed, to get the new ETA."},{"heading":"Final exam tips","visual":{"k":"points","items":["Read each question twice: true, magnetic or compass?","Use the variation the question gives you","Show your work so you can find mistakes","Off by 180°? You read the wrong side of the rose","Drill every day in Plotting drills"],"fig":{"t":"rows","items":[["eye","Read each question twice","True, magnetic or compass?"],["doc","Show your work","So you can find mistakes"],["turn","Off by 180°?","Wrong side of the rose"],["target","Drill every day","In Plotting drills"]]}},"script":"That’s the end of the course. A few final tips. Read every question twice and note whether it asks for true, magnetic or compass. Use the variation the question gives you, rather than the chart’s rose, when one is given. Show your work so you can find mistakes. If your answer is off by exactly one hundred eighty degrees, you read the wrong side of the rose or reversed a set. And use the plotting drills in this app every day until the calculations are automatic. You’ve now covered every module of the exam. Good luck, Captain."}]}],"questions":[{"id":"R1","module":"R","text":"(BOTH) The white light showing over an arc of 225° is the:","options":["Masthead light","Sternlight","Anchor light","Towing light"],"explanation":"The masthead light shines from dead ahead to 22.5° abaft each beam: 225° total."},{"id":"R2","module":"R","text":"(INLAND) A power-driven vessel leaving a dock or berth sounds:","options":["1 prolonged blast","1 short blast","2 short blasts","5 short blasts"],"explanation":"Inland Rule 34(g): one prolonged blast when leaving a dock or berth."},{"id":"R3","module":"R","text":"(BOTH) The danger or doubt signal is:","options":["At least 5 short, rapid blasts","3 short blasts","1 prolonged blast","2 prolonged blasts"],"explanation":"Rule 34(d): at least five short and rapid blasts when you don’t understand the other vessel’s intentions."},{"id":"R4","module":"R","text":"(BOTH) In a crossing situation, the stand-on vessel shall:","options":["Keep her course and speed","Slow down","Turn to port","Sound 5 short blasts"],"explanation":"Rule 17: the stand-on vessel keeps course and speed, though she may act if the give-way vessel isn’t taking action."},{"id":"R5","module":"R","text":"(BOTH) Your power boat is overtaking a vessel engaged in fishing. Who keeps clear?","options":["Your boat, the overtaking vessel","The fishing vessel","Whichever is larger","Neither"],"explanation":"Rule 13 overrides Rule 18: the overtaking vessel always keeps clear."},{"id":"R6","module":"R","text":"(BOTH) All-round green over white lights indicate a vessel:","options":["Trawling","Piloting","Towing","Aground"],"explanation":"“Green over white, trawling tonight.”"},{"id":"R7","module":"R","text":"(BOTH) The day shape for a vessel at anchor is:","options":["One ball","One cone","Two balls","A diamond"],"explanation":"Rule 30: one ball in the fore part of the vessel."},{"id":"R8","module":"R","text":"(INTERNATIONAL) Two short blasts mean:","options":["I am altering my course to port","I intend to leave you on my starboard side","I am operating astern propulsion","I agree to be overtaken"],"explanation":"International signals announce action being taken. Two short = altering course to port."},{"id":"R9","module":"R","text":"(BOTH) In fog you hear two prolonged blasts every 2 minutes. It is:","options":["A power-driven vessel underway but stopped","A sailing vessel","A vessel at anchor","A vessel aground"],"explanation":"Rule 35(b): two prolonged blasts = power-driven vessel underway, not making way."},{"id":"R10","module":"R","text":"(BOTH) Which is NOT a factor in determining safe speed?","options":["The vessel’s year of registration","Visibility","Traffic density","Draft compared to available depth"],"explanation":"Rule 6 lists visibility, traffic, maneuverability, background lights, wind, sea, current and draft vs depth."},{"id":"R11","module":"R","text":"(INLAND) Meeting head-on, one short blast means:","options":["I intend to leave you on my port side","I am altering course to starboard","I intend to leave you on my starboard side","I am in doubt"],"explanation":"Inland signals state intentions and need an answer. One short = port-to-port passing."},{"id":"R12","module":"R","text":"(BOTH) Two sailing vessels are crossing with the wind on different sides. Which keeps clear?","options":["The one with the wind on her port side","The one with the wind on her starboard side","The larger one","The one to leeward"],"explanation":"Rule 12: the vessel with the wind on the port side keeps clear."},{"id":"R13","module":"R","text":"(BOTH) A vessel under 20 m in a narrow channel shall not:","options":["Impede a vessel that can safely navigate only within the channel","Use her engine","Anchor","Sound signals"],"explanation":"Rule 9(b)."},{"id":"R14","module":"R","text":"(BOTH) All-round lights red, white, red in a vertical line mean a vessel:","options":["Restricted in her ability to maneuver","Not under command","Acting as a pilot","Aground"],"explanation":"Red-white-red = RAM. Day shape: ball, diamond, ball."},{"id":"R15","module":"R","text":"(BOTH) Each sidelight shows over an arc of:","options":["112.5°","90°","135°","225°"],"explanation":"From dead ahead to 22.5° abaft the beam on its own side."},{"id":"R16","module":"R","text":"(INTERNATIONAL) Three all-round red lights in a vertical line mean a vessel:","options":["Constrained by her draft","Aground","Towing","Engaged in mine clearance"],"explanation":"Constrained by draft exists only in the International rules. Day shape: a cylinder."},{"id":"R17","module":"R","text":"(BOTH) A vessel under 100 m at anchor in fog sounds:","options":["A rapid bell for about 5 seconds every minute","1 prolonged blast every 2 minutes","3 short blasts every minute","2 prolonged blasts every minute"],"explanation":"Rule 35(g)."},{"id":"R18","module":"R","text":"(BOTH) At night you’re approaching a vessel and can see only her white sternlight. You are:","options":["Overtaking, and must keep clear","The stand-on vessel","In a crossing situation","Meeting head-on"],"explanation":"Seeing only the sternlight means you’re more than 22.5° abaft her beam: overtaking."},{"id":"R19","module":"R","text":"(INLAND) On the Western Rivers, which power-driven vessel has the right of way?","options":["The one proceeding downbound with the current","The one proceeding upbound","The larger one","The one on the left"],"explanation":"Inland Rule 14(d) and 9(a)(ii): the downbound vessel has the right of way and proposes the manner of passing."},{"id":"R20","module":"R","text":"(BOTH) Risk of collision is deemed to exist when:","options":["The compass bearing doesn’t change appreciably and the range decreases","The other vessel is larger","It’s nighttime","The other vessel sounds one blast"],"explanation":"Rule 7(d)."},{"id":"R21","module":"R","text":"(BOTH) Two all-round red lights in a vertical line indicate a vessel:","options":["Not under command","Restricted in her ability to maneuver","Engaged in fishing","Constrained by her draft"],"explanation":"“Red over red, the captain is dead.” Sidelights are added when making way."},{"id":"R22","module":"R","text":"(BOTH) All-round red over white lights indicate a vessel:","options":["Engaged in fishing other than trawling","Trawling","Acting as a pilot","At anchor"],"explanation":"“Red over white, fishing tonight.”"},{"id":"R23","module":"R","text":"(BOTH) All-round white over red lights indicate:","options":["A pilot vessel on duty","A fishing vessel","A vessel aground","A vessel not under command"],"explanation":"“White over red, pilot ahead.”"},{"id":"R24","module":"R","text":"(BOTH) Your power boat and a sailboat under sail alone are crossing. Who gives way?","options":["Your power boat","The sailboat","The vessel on the other’s starboard side","Neither; both alter to starboard"],"explanation":"Rule 18: a power-driven vessel keeps clear of a sailing vessel (unless the sailboat is overtaking)."},{"id":"R25","module":"R","text":"(BOTH) Two power-driven vessels meet head-on. What do they do?","options":["Both alter course to starboard","Both alter course to port","The larger one stands on","The one with the current stands on"],"explanation":"Rule 14: each alters course to starboard and passes port to port."},{"id":"R26","module":"R","text":"(BOTH) Two power-driven vessels are crossing. The give-way vessel is the one that:","options":["Has the other on her own starboard side","Has the other on her own port side","Is faster","Is smaller"],"explanation":"Rule 15."},{"id":"R27","module":"R","text":"(BOTH) A vessel is overtaking when coming up on another from a direction more than:","options":["22.5° abaft the other vessel’s beam","45° abaft the beam","10° off the bow","90° off the bow"],"explanation":"Rule 13(b)."},{"id":"R28","module":"R","text":"(BOTH) The sternlight shows over an arc of:","options":["135°","112.5°","225°","360°"],"explanation":"Rule 21(c)."},{"id":"R29","module":"R","text":"(BOTH) The towing light is:","options":["Yellow, with the same arc as the sternlight","White, all-round","Red, all-round","Yellow, all-round"],"explanation":"Rule 21(d): yellow, 135°, placed above the sternlight."},{"id":"R30","module":"R","text":"(BOTH) A sailing vessel also using her engine shows by day:","options":["A cone, point down","A cone, point up","One ball","A diamond"],"explanation":"Rule 25(e). She is a power-driven vessel under the rules."},{"id":"R31","module":"R","text":"(BOTH) A vessel aground shows at night:","options":["Anchor light(s) plus two all-round red lights in a vertical line","Three all-round red lights","Red over white all-round lights","Only her sidelights"],"explanation":"Rule 30(d). Day shape: three balls."},{"id":"R32","module":"R","text":"(INTERNATIONAL) In a narrow channel, the signal “I intend to overtake you on your starboard side” is:","options":["2 prolonged blasts followed by 1 short","1 short blast","2 short blasts","2 prolonged blasts followed by 2 short"],"explanation":"Rule 34(c). The vessel being overtaken agrees with prolonged-short-prolonged-short."},{"id":"R33","module":"R","text":"(BOTH) A prolonged blast lasts about:","options":["4 to 6 seconds","1 second","2 seconds","10 seconds"],"explanation":"Rule 32."},{"id":"R34","module":"R","text":"(BOTH) In restricted visibility, a sailing vessel underway sounds every 2 minutes:","options":["1 prolonged followed by 2 short blasts","1 prolonged blast","2 prolonged blasts","5 short blasts"],"explanation":"Rule 35(c), also used by fishing, towing, NUC and RAM vessels."},{"id":"R35","module":"R","text":"(INLAND) Passing agreements may be made by radio on the bridge-to-bridge channel:","options":["VHF channel 13","VHF channel 16","VHF channel 22A","VHF channel 9"],"explanation":"Inland Rule 34(h)."},{"id":"R36","module":"R","text":"(BOTH) Action taken to avoid collision should be:","options":["Positive, made in ample time, and large enough to be readily apparent","A series of small course changes","Taken only after sounding the danger signal","Taken only by the stand-on vessel"],"explanation":"Rule 8."},{"id":"N1","module":"N","text":"Red nun buoys carry:","options":["Even numbers","Odd numbers","Letters only","No numbers"],"explanation":"Red marks are even-numbered; green marks are odd."},{"id":"N2","module":"N","text":"An isolated danger mark is colored:","options":["Black with red horizontal bands","Red and white vertical stripes","Yellow","Green and red bands"],"explanation":"It sits on a small danger with navigable water all around. Topmark: two black balls."},{"id":"N3","module":"N","text":"A tidal current flowing toward shore is called:","options":["Flood","Ebb","Slack","Stand"],"explanation":"Flood runs toward land; ebb runs away from it."},{"id":"N4","module":"N","text":"Deviation is caused by:","options":["The boat’s own magnetic influences","Earth’s magnetic field","Current","Leeway"],"explanation":"Deviation varies with heading and is found on the boat’s deviation card."},{"id":"N5","module":"N","text":"A light described as “Oc” is:","options":["Lit longer than it is dark","Dark longer than it is lit","Equal light and dark","Morse code “A”"],"explanation":"Occulting = mostly on with brief eclipses."},{"id":"N6","module":"N","text":"Neap tides occur at:","options":["First and third quarter moons","New moon","Full moon","The equinoxes"],"explanation":"Neap tides have the smallest range. Spring tides come at new and full moon."},{"id":"N7","module":"N","text":"The light on a safe water mark is:","options":["White, Morse code “A”","Green flashing","Red quick flashing","Yellow fixed"],"explanation":"Safe water marks are red and white vertical stripes with a white Mo(A) light."},{"id":"N8","module":"N","text":"A green daybeacon is shaped like a:","options":["Square","Triangle","Diamond","Circle"],"explanation":"Green squares; red triangles."},{"id":"N9","module":"N","text":"Depths on U.S. charts are measured from:","options":["Mean lower low water","Mean high water","Mean sea level","Highest astronomical tide"],"explanation":"MLLW, so actual depth is usually at least what’s charted."},{"id":"N10","module":"N","text":"On the ICW, a yellow square on any mark means:","options":["Treat it as a green (port-hand) mark","Treat it as a red mark","It’s a special mark","Danger"],"explanation":"Yellow square = can; yellow triangle = nun, regardless of the mark’s own color."},{"id":"N11","module":"N","text":"Under the rule of twelfths, the tide rises fastest during:","options":["Hours 3 and 4","Hours 1 and 2","Hours 5 and 6","Evenly throughout"],"explanation":"1/12, 2/12, 3/12, 3/12, 2/12, 1/12."},{"id":"N12","module":"N","text":"A rapidly falling barometer means:","options":["An approaching storm","Clearing weather","Fog","No change"],"explanation":"Rapid falls signal a strong low-pressure system and rising wind."},{"id":"N13","module":"N","text":"Entering a harbor from sea, you see green can buoy “7.” You leave it on your:","options":["Port side","Starboard side","Either side","Bow"],"explanation":"Red right returning, so green stays on your left."},{"id":"N14","module":"N","text":"A buoy with red and white vertical stripes marks:","options":["Safe water, often a channel entrance","An isolated danger","A preferred channel","A special area"],"explanation":"Safe water marks have navigable water all around."},{"id":"N15","module":"N","text":"On the ICW, a green can buoy with a yellow triangle should be treated as:","options":["A red mark","A green mark","A special mark","An isolated danger"],"explanation":"Where ICW and another channel share marks, the yellow symbol tells ICW traffic which side."},{"id":"N16","module":"N","text":"A light described as “Q R” is:","options":["Red, quick flashing, about 60 flashes per minute","Red, fixed","Red, flashing every 4 seconds","Red, occulting"],"explanation":"Q = quick flashing."},{"id":"N17","module":"N","text":"Spring tides occur at:","options":["New and full moon","First and third quarter moons","Only in spring","The solstices"],"explanation":"Sun and moon align, giving the largest range."},{"id":"N18","module":"N","text":"Magnetic variation is found:","options":["On the chart’s compass rose","On the deviation card","In the Light List","In the tide tables"],"explanation":"The rose shows variation, the year, and the annual change."},{"id":"N19","module":"N","text":"A preferred channel mark should be treated as:","options":["The color of its top band","The color of its bottom band","A safe water mark","An isolated danger"],"explanation":"The top band shows which side of the preferred channel it marks."},{"id":"N20","module":"N","text":"In the Northern Hemisphere, with your back to the wind, low pressure is:","options":["To your left","To your right","Directly behind you","Directly ahead"],"explanation":"Buys Ballot’s law."},{"id":"N21","module":"N","text":"“Fl G 4s” on a chart means:","options":["A green light flashing every 4 seconds","4 green flashes in a row","Green, visible 4 miles","Green, 4 ft high"],"explanation":"Characteristic, color, then period."},{"id":"N22","module":"N","text":"Following the ICW “returning” direction on Florida’s Atlantic coast, you are heading:","options":["South","North","East","West"],"explanation":"The ICW convention runs clockwise around the U.S.: south along the Atlantic coast, then west along the Gulf."},{"id":"N23","module":"N","text":"A sea breeze typically:","options":["Blows from sea toward land on warm afternoons","Blows from land toward sea at night","Only occurs in winter","Is caused by tides"],"explanation":"Land heats faster than water, drawing cooler sea air ashore."},{"id":"D1","module":"D","text":"A Class C fire involves:","options":["Energized electrical equipment","Wood and paper","Gasoline","Combustible metals"],"explanation":"De-energize first; use CO2 or dry chemical."},{"id":"D2","module":"D","text":"The VHF distress, safety and calling channel is:","options":["16","9","13","22A"],"explanation":"Channel 16. DSC distress alerts go out on channel 70."},{"id":"D3","module":"D","text":"The best first treatment for a hypothermic person is to:","options":["Remove wet clothes and gently warm the core","Rub their arms and legs","Give them alcohol","Put them straight into a hot shower"],"explanation":"Rewarm the core gently; rubbing limbs or rapid warming can send cold blood to the heart."},{"id":"D4","module":"D","text":"An OUPV holder may carry at most how many passengers for hire on an uninspected vessel?","options":["6","4","12","150"],"explanation":"That limit is where the “six-pack” name comes from."},{"id":"D5","module":"D","text":"Moving weight higher on a boat:","options":["Decreases stability","Increases stability","Has no effect","Only affects trim"],"explanation":"A higher center of gravity reduces the righting arm."},{"id":"D6","module":"D","text":"“PASS” for using an extinguisher stands for:","options":["Pull, Aim, Squeeze, Sweep","Point, Activate, Spray, Stop","Pull, Activate, Sweep, Stop","Push, Aim, Spray, Sweep"],"explanation":"Aim at the base of the fire."},{"id":"D7","module":"D","text":"“Pan-pan” is used for:","options":["An urgent situation without immediate danger to life","Grave and imminent danger","Navigation warnings","Routine traffic"],"explanation":"Mayday is distress; pan-pan is urgency; securité is safety."},{"id":"D8","module":"D","text":"Oil spills must be reported to:","options":["The National Response Center","The local marina","The EPA website","The state FWC only"],"explanation":"National Response Center: 1-800-424-8802."},{"id":"D9","module":"D","text":"The MARPOL garbage placard is required on boats:","options":["26 ft and over","16 ft and over","40 ft and over","Only over 100 GT"],"explanation":"So is the oil discharge placard."},{"id":"D10","module":"D","text":"The preferred anchor scope in normal conditions is:","options":["7:1","2:1","3:1","15:1"],"explanation":"5:1 minimum, 7:1 preferred, more in heavy weather."},{"id":"D11","module":"D","text":"A gasoline fire in the bilge is fought with:","options":["Dry chemical, CO2 or foam","A solid stream of water","Sand only","Any extinguisher rated Class A"],"explanation":"Class B, flammable liquids. Water spreads it."},{"id":"D12","module":"D","text":"Water depth 12 ft, bow 3 ft above the water. How much rode for 7:1 scope?","options":["105 ft","84 ft","63 ft","120 ft"],"explanation":"(12 + 3) × 7 = 105 ft."},{"id":"D13","module":"D","text":"Free surface effect in a partly filled tank:","options":["Reduces stability","Increases stability","Has no effect","Only matters in port"],"explanation":"Sloshing liquid acts like raising the center of gravity."},{"id":"D14","module":"D","text":"A friend voluntarily chips in his share of the actual fuel cost of a fishing trip. Under federal law he is:","options":["Not a passenger for hire: voluntary sharing of actual expenses isn’t consideration","A passenger for hire","Crew","A charter customer"],"explanation":"46 U.S.C. 2101 excludes voluntary sharing of a voyage’s actual expenses from “consideration.” A required payment as a condition of the trip would make him a passenger for hire."},{"id":"D15","module":"D","text":"A passenger has hot, red, dry skin and is confused. This is most likely:","options":["Heat stroke, a medical emergency","Heat exhaustion","Seasickness","Hypothermia"],"explanation":"Cool them immediately and call for help."},{"id":"D16","module":"D","text":"Plastic may be thrown overboard:","options":["Never, anywhere","Beyond 12 nm","Beyond 25 nm","If ground into small pieces"],"explanation":"MARPOL Annex V prohibits discharging plastic everywhere."},{"id":"D17","module":"D","text":"“Mayday” means:","options":["Grave and imminent danger requiring immediate help","Urgent but not immediate danger","A navigation safety message","A request for a radio check"],"explanation":"Repeat it three times, then give vessel, position, problem and number aboard."},{"id":"D18","module":"D","text":"A modern EPIRB transmits on:","options":["406 MHz","121.5 MHz only","156.8 MHz","2182 kHz"],"explanation":"Register it with NOAA so rescuers know who you are."},{"id":"D19","module":"D","text":"The first actions when someone falls overboard are:","options":["Shout, point and keep eyes on them, and throw flotation","Stop the engine and wait","Call the Coast Guard before anything else","Turn away from the side they fell"],"explanation":"Then press MOB on the GPS and maneuver back, swinging the stern clear."},{"id":"D20","module":"D","text":"Carrying 7 or more passengers for hire requires:","options":["An inspected vessel with a Certificate of Inspection and a Master license","An OUPV Near Coastal license","Only an extra life raft","A Florida charter license"],"explanation":"The OUPV limit is 6 passengers on uninspected vessels."},{"id":"D21","module":"D","text":"A written waste management plan is required on o
