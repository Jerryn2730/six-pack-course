o hundred yards off your starboard bow. You can see her now. You’re in a crossing situation, and you’re the give-way vessel. [+] But radar alone never makes you in sight. [+] And Rule seven’s warning applies with full force here: no assumptions on scanty radar information. [+] The fog signals themselves are in Rule thirty-five, and we’ll learn them in lesson fourteen. [pause] That’s lesson eight. In or near fog, and not in sight, nobody stands on. Radar target ahead: don’t turn to port. Fog signal forward of the beam: slow to bare steerageway, and stop if you must. Next time, we start the lights, beginning with the ones on your own boat."}]},{"id":"rules-09","module":"R","title":"Lights: arcs, ranges and power-driven vessels","status":"draft-unverified","covers":"Rules 20 to 23","slides":[{"heading":"Rule 20: when lights and shapes apply","visual":{"k":"points","items":["Lights: sunset to sunrise, in all weather","Also in restricted visibility, and whenever necessary","No other lights that could be mistaken for them or spoil the lookout","Shapes: by day","Technical details: Annex I"],"fig":{"t":"cmp","a":["","Sunset to sunrise","moon","Lights, in all weather. Also by day in restricted visibility"],"b":["","By day","sun","Shapes"]}},"script":"Welcome to the lights. For the next four lessons, we’ll learn to read a vessel in the dark: what she is, which way she’s heading, and what she’s doing. It starts with Rule twenty, which tells you when the light rules apply. [+] Lights are shown from sunset to sunrise, and in all weathers. [+] They’re also shown from sunrise to sunset in restricted visibility, and you may show them any other time you think it’s necessary. So in a daytime fog bank or a black squall, your lights go on. [+] During those hours, you show no other lights that could be mistaken for the required ones, that spoil their visibility, or that interfere with keeping a proper lookout. Here’s the one that catches charter captains. Those bright deck lights you rig for night fishing? If they blind your own lookout, or drown out your sidelights, they break this rule. [+] Shapes are the daytime version, and the shape rules apply by day. [+] And the technical details, exactly where each light goes, are in Annex one."},{"heading":"Rule 21: the lights defined","visual":{"k":"dg","f":"arcs"},"script":"Before we read anyone else’s lights, we need the vocabulary, and that’s Rule twenty-one. Look at the diagram as I go around the boat. The masthead light is white, on the centerline, and it shines over two hundred twenty-five degrees: from dead ahead to twenty-two and a half degrees abaft the beam on each side. The sidelights are green to starboard and red to port. Each one covers one hundred twelve and a half degrees, from dead ahead to twenty-two and a half degrees abaft the beam on its own side. On a vessel under twenty meters, they can be combined in one lantern. The sternlight is white, and it covers the remaining one hundred thirty-five degrees aft. [pause] Now add them up. Two sidelights make two hundred twenty-five degrees, the same as the masthead light. Add the sternlight’s one hundred thirty-five, and you have the full circle, three hundred sixty. That’s why you see either her sidelights or her sternlight, never both. Three more. A towing light is yellow, with the same arc as a sternlight. An all-round light shows through the full three hundred sixty degrees. And a flashing light flashes one hundred twenty times a minute or more."},{"heading":"Rule 22: visibility ranges (nautical miles)","visual":{"k":"table","head":["Light","50 m and over","12 to 50 m","Under 12 m"],"rows":[["Masthead","6","5 (3 if under 20 m)","2"],["Sidelights","3","2","1"],["Sternlight","3","2","2"],["Towing","3","2","2"],["All-round","3","2","2"]],"fig":{"t":"band","items":[["txt:50 m+","Longest ranges","Masthead light 6 miles"],["txt:12–50 m","Middle","Masthead 5 miles, or 3 if under 20 m"],["txt:\u003c12 m","Shortest","Masthead light 2 miles"]]}},"script":"Rule twenty-two is pure numbers: how far away each light must be visible. I won’t pretend there’s a way around memorizing it, but there is a pattern. Bigger vessel, brighter lights. Look at the table as it builds. [+] The masthead light is always the strongest. Six miles on a vessel of fifty meters or more. Five miles from twelve to fifty meters, but only three miles if she’s under twenty meters. And two miles under twelve meters. [+] Sidelights: three miles, two miles, and one mile. That one-mile sidelight on a small boat is the shortest range in the whole table. [+] The sternlight: three miles, two, and two. [+] The towing light matches the sternlight: three, two, and two. [+] And all-round lights are the same again: three, two, and two. [pause] So here’s the handle. On a big ship, the masthead is six and everything else is three. In the middle group, the masthead is five, or three under twenty meters, and everything else is two. On a small boat, everything is two, except the sidelights, which are one."},{"heading":"Rule 23: power-driven vessels underway","visual":{"k":"lights","items":[[[["w",100,40],["g",70,112],["r",130,112]],"Under 50 m, head-on"],[[["w",140,62],["w",65,34],["g",150,114]],"50 m and over, starboard side"],[[["w",100,50],["g",70,114],["r",130,114]],"Under 12 m option"]]},"script":"Now let’s put lights on a boat. Rule twenty-three covers a power-driven vessel underway, and she shows a masthead light forward, sidelights, and a sternlight. [+] Here’s a vessel under fifty meters, coming straight at you. You see one white masthead light, with red and green below it. Red and green together means she’s head-on. [+] Now a vessel of fifty meters or more, showing you her starboard side. She must carry a second masthead light, behind the first and higher. A smaller vessel may carry one, but doesn’t have to. Why does it matter? Those two white lights work like a range. The lower one is forward, so it points the way she’s heading. And when the two lights start to close up or open out, she’s turning. [+] And here’s the option for boats under twelve meters: one all-round white light, plus sidelights. That’s probably what’s on your center console right now. [pause] So tonight at the dock, look at your own boat. Which arrangement do you carry?"},{"heading":"Rule 23: special cases","visual":{"k":"points","items":["Air-cushion vessel, non-displacement mode: all-round flashing yellow","WIG craft near the surface: high-intensity all-round flashing red","Under 7 m with max speed 7 knots: all-round white, sidelights if practicable","Under 12 m: masthead or all-round light may be off the centerline","Inland, Great Lakes: all-round white may replace second masthead light and sternlight"],"fig":{"t":"rows","items":[["dots:y","Air-cushion vessel","All-round flashing yellow"],["dots:r","WIG craft near the surface","High-intensity flashing red"],["dots:w","Under 7 m and 7 knots","One all-round white light"],["txt:\u003c12 m","Under 12 m","Masthead light may be off the centerline"]]}},"script":"A few special cases to finish, and each one is a favorite exam question. [+] An air-cushion vessel, when she’s operating in the non-displacement mode, adds an all-round flashing yellow light. Hovercraft, flashing yellow. [+] A wing-in-ground craft, when taking off, landing or flying near the surface, adds a high-intensity all-round flashing red light. [+] Next, the smallest powerboats. Under the International rules, a power-driven vessel under seven meters, whose top speed is no more than seven knots, may show just an all-round white light, and sidelights too if practicable. Seven meters, seven knots. [+] On a boat under twelve meters, the masthead light or all-round white light doesn’t have to be exactly on the centerline, if that isn’t practicable. [+] And one for the Inland rules. On the Great Lakes, a power-driven vessel may carry an all-round white light in place of the second masthead light and the sternlight. [pause] That’s lesson nine. Lights from sunset to sunrise and in restricted visibility. Masthead two twenty-five, sidelights one twelve and a half, sternlight one thirty-five. And for ranges, think six and three, five and two, two and one. Next time: the lights of vessels that are towing."}]},{"id":"rules-10","module":"R","title":"Towing and pushing","status":"draft-unverified","covers":"Rule 24","slides":[{"heading":"Rule 24: towing astern","visual":{"k":"lights","items":[[[["y",100,72],["w",100,95]],"From astern"],[[["w",85,45],["w",85,68],["g",125,118]],"Tow 200 m or less"],[[["w",85,30],["w",85,53],["w",85,76],["g",125,118]],"Tow over 200 m"]]},"script":"Florida’s waters are full of tugs: fuel barges on the Intracoastal, dredge pipe in the inlets, big ocean tows off the coast. A tow is the most dangerous thing you can misread at night, because there may be hundreds of feet of cable between the tug and whatever she’s pulling. Rule twenty-four tells you how to spot one. [+] Start from astern. A vessel towing astern shows a yellow towing light directly above her white sternlight. Yellow over white, towing tonight. If you’re coming up behind those two lights, something is trailing behind her, between you and the tug. [+] Now from ahead. A power-driven vessel towing astern shows two masthead lights in a vertical line, plus sidelights. Two white lights stacked means a tow of two hundred meters or less. [+] And when the tow is longer than two hundred meters, she shows three masthead lights in a vertical line. How is that length measured? [pause] From the stern of the towing vessel to the after end of the tow. By day, a tow over two hundred meters is marked with a diamond shape, on both the towing vessel and the tow. And a tug of fifty meters or more still carries her other masthead light as well."},{"heading":"Pushing ahead and towing alongside","visual":{"k":"lights","items":[[[["w",100,30],["w",100,52],["g",55,115],["r",145,115]],"Pushing ahead, head-on"],[[["w",100,95]],"International, from astern"],[[["y",100,70],["y",100,92]],"Inland, from astern"]]},"script":"Not every tow is behind the tug. On the Intracoastal you’ll mostly see barges pushed ahead, or lashed alongside. First, one special case. When a pushing vessel and the vessel she pushes are rigidly connected as a composite unit, they count as one power-driven vessel, and show ordinary Rule twenty-three lights. Otherwise, here’s what you’ll see. [+] From ahead, a vessel pushing ahead or towing alongside shows two masthead lights in a vertical line, and sidelights. [+] From astern is where the two rule books split. Under the International rules, she shows a sternlight. One white light. [+] Under the Inland rules, she shows two yellow towing lights in a vertical line instead. So picture yourself overtaking something big and slow on the Intracoastal at night, and all you see is two yellow lights, one above the other. What is it? [pause] A towboat pushing ahead or towing alongside, under Inland rules. And one more Inland detail: on the Western Rivers and certain other waters, a vessel pushing ahead or towing alongside shows sidelights and the two towing lights, with no masthead lights at all."},{"heading":"Lights on the tow itself","visual":{"k":"lights","items":[[[["g",55,112],["y",100,98],["r",145,112]],"Inland: barge pushed ahead, head-on"],[[["g",100,110],["w",165,104]],"Vessel towed astern, starboard side"]]},"script":"Now the other end of the towline: what does the tow itself show? [+] Start with a barge being pushed ahead. Under the International rules, she shows sidelights at her forward end. Under the Inland rules, she shows sidelights and a special flashing light at the forward end. That special flashing light is yellow, it flashes fifty to seventy times a minute, and it shines forward over an arc of between one hundred eighty and two hundred twenty-five degrees. So a flashing yellow light low on the water, with a red and a green beside it, is the front of a pushed barge. And the tug may be a long way behind it. [+] A vessel or object towed astern shows sidelights and a sternlight, just like any vessel without a masthead light, plus a diamond by day if the tow is over two hundred meters. [pause] Two more. A vessel towed alongside shows a sternlight, and sidelights at her forward end. And any number of vessels pushed or towed alongside in a group are lit as if they were one vessel."},{"heading":"Special towing situations","visual":{"k":"points","items":["A tow that severely restricts her course: add the RAM lights and shapes","Partly submerged objects: all-round white lights at the ends, diamond aft","Can’t light the tow? Take all possible measures to show its presence","Rescue tows needn’t show towing lights if impracticable, but illuminate the towline"],"fig":{"t":"rows","items":[["shapes:ball,diamond,ball","Tow restricts her course","Add the RAM lights and shapes"],["shapes:diamond","Partly submerged object","White lights at the ends, a diamond aft"],["bulb","Can’t light the tow?","Do everything possible to show it’s there"],["tow","Rescue tow","Light up the towline"]]}},"script":"Four special situations to finish the towing rule. [+] First, a tow that severely restricts the tug’s ability to deviate from her course. She adds the lights and shapes of a vessel restricted in her ability to maneuver, on top of her towing lights. Remember the ladder: that moves her up near the top. [+] Second, things that are hard to see. An inconspicuous, partly submerged vessel or object being towed, like a fuel bladder, shows all-round white lights at its ends, more if it’s very wide, and a diamond shape at the after end. [+] Third, what if the tow simply can’t be lit that way? Then all possible measures shall be taken to light it, or at least to show that it’s there. [+] And fourth, this one is about you. Say a friend’s boat breaks down at dusk and you take her in tow. You’re not a towing vessel, and you don’t carry towing lights. Are you breaking the rule? [pause] No. A vessel not normally engaged in towing needn’t show towing lights when it’s impracticable. But you must show the connection between the two boats, for example by lighting up the towline. That’s lesson ten. Yellow over white from astern, two or three white lights stacked from ahead, and two yellow lights for an Inland pusher. Next time: sailboats and fishing vessels."}]},{"id":"rules-11","module":"R","title":"Sailing and fishing vessels","status":"draft-unverified","covers":"Rules 25 and 26","slides":[{"heading":"Rule 25: sailing vessels","visual":{"k":"lights","items":[[[["g",70,115],["r",130,115]],"Under sail, head-on"],[[["g",94,30],["r",106,30]],"Tricolor at masthead"],[[["r",100,32],["g",100,55],["g",70,115],["r",130,115]],"Optional red over green"]]},"script":"Tonight’s lights belong to the two kinds of vessel that stand above you on the ladder: sail and fishing. If you can’t recognize them in the dark, you can’t give way to them. We’ll start with Rule twenty-five, sailing vessels. [+] A sailing vessel underway shows sidelights and a sternlight. And that’s all. What’s missing? [pause] The masthead light. No white light forward. So red and green with no white above them is a boat under sail, coming at you. [+] On a sailing vessel under twenty meters, those three lights can be combined in one lantern at or near the top of the mast. Sailors call it a tricolor. It’s high up, so it shows over the waves. [+] And a sailing vessel may add two all-round lights at or near the masthead: red over green. Red over green, sailing machine. She shows those along with her sidelights and sternlight. But she can’t show them together with the tricolor lantern."},{"heading":"Small sailboats, rowing and motorsailing","visual":{"k":"points","items":["Sail under 7 m: sidelights and sternlight if practicable","Otherwise a white torch or lantern, shown in time to prevent collision","Rowing boats: sailing lights, or the white torch","Motorsailing by day: a cone, point down","Inland: under 12 m, that cone is optional"],"fig":{"t":"rows","items":[["sail","Sail under 7 m","Sidelights and sternlight if practicable"],["bulb","Or a white torch or lantern","Shown in time to prevent collision"],["shapes:coneDown","Motorsailing by day","A cone, point down"]]}},"script":"Now the small stuff, and one daytime shape. [+] A sailing vessel under seven meters shows sidelights and a sternlight if practicable. [+] If she doesn’t, she must have an electric torch or a lighted lantern ready, showing a white light, and show it in enough time to prevent collision. So that single white light waving at you off the beach at dusk may be a little daysailer, telling you she’s there. [+] A vessel under oars may show the sailing lights. If not, she needs that same white torch or lantern ready. [+] Now the shape. By day, a vessel under sail that’s also being propelled by her engine shows a cone, point down, forward where it can best be seen. Why would she bother? [pause] Because with her sails up she looks like a sailboat, but under the rules she’s a power-driven vessel. The cone tells you the truth. [+] And the Inland difference: under the Inland rules, a vessel under twelve meters isn’t required to show that cone, but may."},{"heading":"Rule 26: fishing vessels","visual":{"k":"lights","items":[[[["g",100,40],["w",100,63],["g",70,115],["r",130,115]],"Trawling, head-on"],[[["r",100,40],["w",100,63],["r",125,115]],"Other fishing, port side"],[[["r",100,40],["w",100,62],["w",152,92]],"Gear out over 150 m"]]},"script":"Rule twenty-six covers vessels engaged in fishing, and remember from lesson two what that means: gear that restricts her maneuverability. These lights apply whether she’s underway or at anchor. [+] A trawler shows two all-round lights: green over white. Green over white, trawling tonight. She also carries a masthead light behind and above the green one, though a trawler under fifty meters doesn’t have to. Off this coast, that’s your shrimp boat. [+] A vessel fishing any other way shows red over white. Red over white, fishing tonight. [+] And when her gear reaches out more than one hundred fifty meters from her, she adds an all-round white light in the direction of the gear. So which side do you pass on? [pause] The other side. Stay away from that white light. One more thing for both kinds. When she’s making way through the water, she adds sidelights and a sternlight. No sidelights means she’s fishing but not making way."},{"heading":"Fishing day shapes","visual":{"k":"shapes","items":[[["coneDown","coneUp"],"Fishing: two cones, points together"],[["coneUp"],"Gear over 150 m: cone, point up, toward the gear"]]},"script":"By day, fishing vessels use shapes. [+] A vessel engaged in fishing shows two cones with their points together, one above the other. It looks like an hourglass. [+] And when her gear extends more than one hundred fifty meters, she adds a single cone, point up, in the direction of the gear. Same idea as the white light at night: it points to where the gear is. [pause] Now the other half of the rule, and it’s a favorite on the exam. When a fishing vessel isn’t engaged in fishing, she shows only the ordinary lights or shapes for a vessel of her length. So think of a shrimper steaming home before dawn with her nets stowed. What does she show? Plain power-driven lights. And what privileges does she have over you? None. She’s just another power-driven vessel."},{"heading":"Annex II: fishing close together","visual":{"k":"table","head":["Signal","Meaning"],"rows":[["Two white, vertical","Trawler shooting her nets"],["White over red","Trawler hauling her nets"],["Two red, vertical","Net fast on an obstruction"],["Searchlight forward and toward partner","Pair trawling"],["Two yellow, flashing alternately","Purse seiner hampered by her gear"]],"fig":{"t":"band","items":[["dots:ww","Shooting nets",""],["dots:wr","Hauling nets",""],["dots:rr","Net fast on an obstruction",""],["dots:yy","Purse seiner hampered","Flashing alternately"]]}},"script":"Last, the extra signals for fishing vessels working close together. In the International rules they’re in Annex two. In the Inland rules they now sit inside Rule twenty-six itself. They’re optional, they’re carried lower than the main fishing lights, and they’re visible at least a mile. The exam asks you to match each signal to its meaning, so let’s go down the table. [+] A trawler shooting her nets, putting them out: two white lights in a vertical line. [+] A trawler hauling her nets, bringing them in: white over red. [+] A trawler whose net has come fast on an obstruction: two red lights in a vertical line. Two reds usually means trouble, and here the trouble is a snagged net. [+] Vessels pair trawling may each aim a searchlight forward and toward the other boat of the pair. [+] And a purse seiner hampered by her gear may show two yellow lights in a vertical line, flashing alternately. [pause] That’s lesson eleven. Sail: sidelights and sternlight, no masthead light, and red over green if she likes. Trawling: green over white. Other fishing: red over white. Next time, the vessels at the top of the ladder, and the lights of boats at anchor and aground."}]},{"id":"rules-12","module":"R","title":"Restricted, pilot, anchored and aground","status":"draft-unverified","covers":"Rules 27 to 31","slides":[{"heading":"Rule 27: NUC and RAM","visual":{"k":"lights","items":[[[["r",100,45],["r",100,68]],"NUC, not making way"],[[["r",100,40],["r",100,63],["g",125,115]],"NUC, making way"],[[["w",100,20],["r",100,48],["w",100,70],["r",100,92],["g",70,122],["r",130,122]],"RAM, making way"]]},"script":"Today we light the top of the ladder: the broken and the busy. Remember them? Not under command, and restricted in her ability to maneuver. Rule twenty-seven gives each a signal you can’t mistake. [+] A vessel not under command shows two all-round red lights in a vertical line. By day, two balls. Red over red, the captain is dead. It’s a grim little rhyme, but you won’t forget it. In this picture she isn’t making way, so the two red lights are all she shows. [+] When she is making way, she adds sidelights and a sternlight. But no masthead light. [+] A vessel restricted in her ability to maneuver shows three all-round lights in a vertical line: red, white, red. By day, a ball, a diamond, and a ball. When she’s making way, she adds masthead lights, sidelights and a sternlight. And at anchor, she shows her restricted lights plus her anchor lights. [pause] So here’s how to read any of these. The special lights tell you her condition. The ordinary lights tell you whether she’s moving."},{"heading":"Dredges and divers","visual":{"k":"lights","items":[[[["r",100,24],["w",100,44],["r",100,64],["r",45,64],["r",45,86],["g",155,64],["g",155,86]],"Dredge: pass on the green side"]]},"script":"Dredges work Florida’s inlets and channels all year, and they’re restricted vessels with one extra job: telling you which side is safe. [+] Look at the picture. A vessel dredging or doing underwater work shows her red, white, red lights. Then, on the side where the obstruction is, two all-round red lights in a vertical line, or two balls by day. And on the side where you may pass, two all-round green lights in a vertical line, or two diamonds by day. So which side do you take? [pause] The green side. Green means go, just like a traffic light. Now, diving. A boat engaged in diving operations that’s too small to show all of that shows the red, white, red lights, and a rigid replica of the International Code flag A, at least one meter high, visible all around. In Florida you’ll also see the state’s red and white diver-down flag. Either one means the same thing to you: slow down and stay well clear."},{"heading":"Mine clearance and small vessels","visual":{"k":"points","items":["Mine clearance: three all-round green lights, or three balls","Dangerous to approach within 1000 m","Under 12 m, except divers: NUC and RAM signals not required","These are not distress signals"],"fig":{"t":"rows","items":[["num:3","Mine clearance","Three all-round green lights, or three balls"],["txt:1000 m","Stay clear","Dangerous to approach within 1000 meters"],["no","Not distress signals","These signals mark work, not an emergency"]]}},"script":"A few more points from Rule twenty-seven. [+] A vessel engaged in mine clearance shows three all-round green lights, or three balls by day: one near the foremast head, and one at each end of the fore yard. So they form a triangle, not a line. [+] And they mean it’s dangerous to come within one thousand meters of her. That’s more than half a mile, all the way around. [+] Now a break for small boats. Vessels under twelve meters, except those engaged in diving operations, aren’t required to show the not-under-command or restricted signals. [+] And one thing people get wrong. None of these are distress signals. So suppose you see two red lights, one above the other, on a ship drifting offshore. Is she calling for help? [pause] No. She’s telling you she can’t get out of your way. If she needs help, she’ll use the distress signals in lesson fourteen."},{"heading":"Rules 28 and 29: draft and pilots","visual":{"k":"lights","items":[[[["r",100,35],["r",100,58],["r",100,81]],"Constrained by draft"],[[["w",100,40],["r",100,63],["g",70,115],["r",130,115]],"Pilot, underway"],[[["w",100,40],["r",100,62],["w",160,92]],"Pilot, at anchor"]]},"script":"Two shorter rules now. [+] Rule twenty-eight is International only. A vessel constrained by her draft may show, along with her ordinary power-driven lights, three all-round red lights in a vertical line. By day, a cylinder. You met her on the ladder in lesson seven. And you’ll never see those lights on Inland waters, because that category doesn’t exist there. [+] Rule twenty-nine is the pilot boat. A pilot vessel on pilotage duty shows two all-round lights at or near the masthead: white over red. White over red, pilot ahead. Underway, she adds sidelights and a sternlight. [+] At anchor, she keeps the white over red and adds her anchor light or lights. And when she’s not on pilotage duty, she shows only the ordinary lights for a vessel of her length. [pause] Now be careful with the rhymes, because two of them are mirror images. White over red is a pilot. Red over white is fishing. So ask yourself which color is on top."},{"heading":"Rule 30: anchored and aground","visual":{"k":"lights","items":[[[["w",100,96]],"Under 50 m at anchor"],[[["w",50,55],["w",150,85]],"50 m and over at anchor"],[[["w",45,62],["r",105,40],["r",105,63],["w",160,82]],"Aground"]]},"script":"Rule thirty: at anchor, and aground. You’ll use this one yourself every time you anchor up at night. [+] A vessel under fifty meters at anchor may show a single all-round white light, where it can best be seen. That’s your anchor light. [+] A larger vessel shows two: an all-round white light in the fore part, and a second one at or near the stern, lower than the forward one. And a vessel of one hundred meters or more must also light up her decks with her working lights. So a big ship at anchor is lit up like a parking lot, on purpose. [+] A vessel aground shows her anchor lights, plus two all-round red lights in a vertical line. [pause] Now the day shapes. One ball in the fore part means at anchor. Three balls in a vertical line means aground. Here’s how I remember aground. Two red lights say she can’t maneuver. The anchor lights say she isn’t moving. Put them together, and she’s stuck on the bottom."},{"heading":"Exemptions and seaplanes","visual":{"k":"points","items":["Under 7 m at anchor, away from channels, fairways and anchorages: no anchor light or shape required","Under 12 m aground: no aground lights or shapes required","Inland: under 20 m in a special anchorage area: no anchor light or shape","Rule 31: seaplanes show lights as close as possible to the rules"],"fig":{"t":"rows","items":[["txt:\u003c7 m","Anchored clear of channels","No anchor light or shape required"],["txt:\u003c12 m","Aground","No aground lights or shapes required"],["txt:\u003c20 m","Inland special anchorage","No anchor light or shape"],["seaplane","Seaplanes","As close to the rules as possible"]]}},"script":"A few exemptions to finish, and they’re worth easy points. [+] A vessel under seven meters at anchor doesn’t need an anchor light or shape, as long as she’s not in or near a narrow channel, a fairway, an anchorage, or anywhere other vessels normally navigate. [+] A vessel under twelve meters aground doesn’t need the aground lights or shapes. [+] And an Inland one: a vessel under twenty meters at anchor in a special anchorage area designated by the Coast Guard doesn’t need an anchor light or shape. You’ll find those areas marked on the chart. [+] Finally, Rule thirty-one. A seaplane or wing-in-ground craft that can’t show lights and shapes exactly as required shows them as closely as she can. [pause] That’s lesson twelve, and it finishes the lights. Red over red: not under command. Red, white, red: restricted. Pass a dredge on the green side. White over red: pilot. One white light or one ball: at anchor. Next time, we stop looking and start listening: sound signals."}]},{"id":"rules-13","module":"R","title":"Sound signals when in sight","status":"draft-unverified","covers":"Rules 32 to 34","slides":[{"heading":"Rules 32 and 33: blasts and equipment","visual":{"k":"table","head":["Length","Required"],"rows":[["Under 12 m","Some means of making an efficient sound signal"],["12 m and over","Whistle"],["20 m and over","Whistle and bell"],["100 m and over","Whistle, bell and gong"]],"fig":{"t":"band","items":[["horn","Under 12 m","Any efficient sound signal"],["horn","12 m and over","Whistle"],["bell","20 m and over","Whistle and bell"],["gong","100 m and over","Whistle, bell and gong"]]}},"script":"For four lessons we’ve been reading lights. Today we use our ears. Sound signals are how two captains talk when they’re too far apart to shout, and the exam asks about them constantly. Rule thirty-two gives us the vocabulary. A whistle is any device that can make the required blasts. Your horn counts. A short blast lasts about one second. A prolonged blast lasts four to six seconds. Short, one second. Prolonged, four to six. Rule thirty-three then says what you must carry, and it goes by length. [+] Under twelve meters, you needn’t carry a whistle or a bell, but you must have some means of making an efficient sound signal. That’s most of us. A horn, or even a canister air horn, does the job. [+] Twelve meters and over: a whistle. [+] Twenty meters and over: a whistle and a bell. [+] One hundred meters and over: a whistle, a bell, and a gong, with a tone that can’t be confused with the bell. [pause] So the pattern is twelve, twenty, one hundred: whistle, then bell, then gong."},{"heading":"International maneuvering signals","visual":{"k":"sounds","items":[["S","Altering course to starboard"],["SS","Altering course to port"],["SSS","Operating astern propulsion"]]},"script":"Now the maneuvering signals, and we’ll take the International rules first, because they’re the simpler idea. Under the International rules, when vessels are in sight of one another, a power-driven vessel that maneuvers tells everyone what she’s doing, as she does it. [+] One short blast: I am altering my course to starboard. [+] Two short blasts: I am altering my course to port. [+] Three short blasts: I am operating astern propulsion. Here’s how I keep them straight. One syllable, star-board comes first, so one blast. Port is the other, so two. And three means my engines are going astern. Notice the wording: I am altering. It’s a statement of action, not a question, so no reply is required. [pause] A vessel may back these up with a light: an all-round white light, flashing the same pattern. Each flash is about one second, with about a second between flashes, and at least ten seconds between signals."},{"heading":"Inland maneuvering signals","visual":{"k":"table","head":["","International","Inland"],"rows":[["1 short","I am altering course to starboard","I intend to leave you on my port side"],["2 short","I am altering course to port","I intend to leave you on my starboard side"],["3 short","Operating astern propulsion","Operating astern propulsion"],["When","Whenever maneuvering in sight","Meeting or crossing within half a mile"],["Reply","None required","Same signal to agree, or danger signal"],["Light","White, optional","White or yellow, with the whistle"]],"fig":{"t":"band","items":[["snd:.","1 short","I intend to leave you on my port side"],["snd:..","2 short","I intend to leave you on my starboard side"],["snd:...","3 short","Operating astern propulsion"]]}},"script":"Same blasts, different meaning. This slide is the single biggest Inland difference on the exam, so let’s take the table one row at a time. [+] One short blast. International: I am altering course to starboard. Inland: I intend to leave you on my port side. [+] Two short blasts. International: I am altering course to port. Inland: I intend to leave you on my starboard side. [+] Three short blasts mean the same in both: I am operating astern propulsion. [+] When are they used? International, whenever you maneuver in sight of another vessel. Inland, when power-driven vessels are meeting or crossing within half a mile of each other. [+] The reply. International, none is required. Inland, the other vessel answers. If she agrees, she sounds the same signal back, and both of you take steps to pass. If she doubts it’s safe, she sounds the danger signal. [+] And the light. International, it’s white. Inland, it may be white or yellow, and it’s flashed in time with the whistle. [pause] So remember it like this. Offshore, I’m telling you. Inshore, I’m asking you. International signals are statements. Inland signals are proposals that need an answer."},{"heading":"Overtaking signals","visual":{"k":"sounds","items":[["PPS","Intl: on your starboard side"],["PPSS","Intl: on your port side"],["PSPS","Intl: agreement"]]},"script":"Overtaking signals split the same way. Look at the three International signals on screen. They’re used in a narrow channel or fairway, when the vessel ahead has to help you get by. [+] Two prolonged blasts, then one short: I intend to overtake you on your starboard side. [+] Two prolonged, then two short: I intend to overtake you on your port side. See the logic? The two long blasts say overtaking. The short ones are the same one for starboard and two for port. [+] And if the vessel ahead agrees, she answers: prolonged, short, prolonged, short. [pause] Now the Inland version, which is simpler. It applies between power-driven vessels in sight of one another in any waters, not just channels. One short blast: I intend to overtake you on your starboard side. Two short blasts: on your port side. The vessel being overtaken answers with the same signal if she agrees, or the danger signal if she doesn’t."},{"heading":"Danger, bends and berths","visual":{"k":"sounds","items":[["SSSSS","Danger or doubt"],["P","Bend; Inland, leaving a berth"]]},"script":"Three more signals, and the first one could save your life. [+] The danger signal. When vessels in sight are approaching each other, and one doesn’t understand the other’s intentions, or doubts she’s doing enough to avoid a collision, she immediately sounds at least five short, rapid blasts. Five or more. It can be backed up with at least five short, rapid flashes of a light. So when should you use it? [pause] The moment you’re in doubt. Not after. It doesn’t mean you’re angry, and it doesn’t mean you’re right. It means: I don’t understand what you’re doing. [+] Next, one prolonged blast. You met it in lesson four: a vessel nearing a bend, or a place where other vessels may be hidden, sounds one prolonged blast, and any vessel around the bend answers with one prolonged blast. Under the Inland rules, one prolonged blast has a second use: a power-driven vessel leaving a dock or berth sounds it. And one small detail. If a ship has whistles more than one hundred meters apart, she uses only one of them for maneuvering signals."},{"heading":"Radio agreements","visual":{"k":"points","items":["Inland: agreement by radiotelephone means whistle signals aren’t required","No agreement? Exchange whistle signals, and they prevail","Bridge-to-bridge calls: VHF 13 in most areas","International: radio doesn’t replace required whistle signals"],"fig":{"t":"cmp","a":["","Inland","radio","Agree by radio and whistle signals aren’t required"],"b":["","International","horn","Radio never replaces the required whistle signals"]}},"script":"Last, the radio. Most passing arrangements on the Intracoastal today are made on VHF, and the two rule books treat that differently. [+] Under the Inland rules, a vessel that reaches agreement by radiotelephone isn’t obliged to sound the whistle signals, though she still may. [+] But if agreement isn’t reached, whistle signals shall be exchanged in good time, and the whistle signals prevail. [+] Those calls are usually made on channel thirteen, the bridge-to-bridge channel. [+] Under the International rules, there’s no such exemption. So picture yourself offshore, beyond the demarcation line. You and a freighter agree on the radio to pass port to port, and you turn to starboard. Do you still sound one short blast? [pause] Yes. Offshore, the radio never replaces the whistle. That’s lesson thirteen. Short is one second, prolonged is four to six. One, two, three: starboard, port, astern. International signals tell, Inland signals ask. And five short blasts means doubt. Next time: fog signals and distress signals."}]},{"id":"rules-14","module":"R","title":"Fog signals, attention signals and distress","status":"draft-unverified","covers":"Rules 35 to 37, Annex IV","slides":[{"heading":"Rule 35: underway in restricted visibility","visual":{"k":"sounds","items":[["P","Power, making way"],["PP","Power, underway but stopped"],["PSS","NUC, RAM, CBD, sail, fishing, towing"],["PSSS","Manned vessel being towed"]]},"script":"Back into the fog. In lesson eight, we learned what to do when you hear a fog signal. Today, we learn what those signals are, and what you sound yourself. Rule thirty-five applies in or near an area of restricted visibility, by day or by night. Underway, every signal is repeated at intervals of not more than two minutes. [+] A power-driven vessel making way sounds one prolonged blast. That’s you, running slowly home in the fog: one long blast, every two minutes. [+] A power-driven vessel underway but stopped, not making way, sounds two prolonged blasts, with about two seconds between them. [+] Then comes one signal shared by a whole group: one prolonged blast followed by two short. It’s sounded by a vessel not under command, restricted in her ability to maneuver, constrained by her draft, sailing, engaged in fishing, or towing or pushing. Sound familiar? [pause] It’s almost everybody above you on the ladder. So one long and two short means: I’m hampered, stay clear. [+] And a vessel being towed, or the last vessel of the tow, if she’s manned, sounds one prolonged and three short, right after the tug’s signal if practicable. A composite pushing unit simply sounds the signals of a power-driven vessel."},{"heading":"At anchor and aground","visual":{"k":"table","head":["Situation","Signal, at least every minute"],"rows":[["At anchor, under 100 m","Bell rung rapidly about 5 seconds"],["At anchor, 100 m and over","Bell forward, then gong aft, about 5 seconds each"],["Optional warning at anchor","1 short, 1 prolonged, 1 short blast"],["Fishing or RAM at anchor","1 prolonged, 2 short (every 2 minutes)"],["Aground","3 strokes, rapid bell, 3 strokes"]],"fig":{"t":"band","items":[["bell","At anchor","Rapid bell, about 5 seconds"],["gong","100 m and over","Bell forward, then gong aft"],["snd:bbb","Aground","3 strokes, rapid bell, 3 strokes"]]}},"script":"Now the vessels that aren’t moving. At anchor, the interval is shorter: not more than one minute. [+] A vessel at anchor, under one hundred meters, rings her bell rapidly for about five seconds. [+] A vessel of one hundred meters or more rings the bell in the fore part, and then immediately sounds the gong in the after part, about five seconds each. Bell forward, gong aft, so you can hear how long she is. [+] A vessel at anchor may also sound three blasts, one short, one prolonged, one short, to warn an approaching vessel of her position. [+] But a vessel engaged in fishing at anchor, or a restricted vessel working at anchor, doesn’t ring the bell. She sounds one prolonged and two short instead, the same hampered signal she’d use underway, every two minutes. [+] And a vessel aground gives the bell signal with something extra: three separate, distinct strokes on the bell before the rapid ringing, and three more after. [pause] So in fog, a rapid bell means a vessel at anchor. And three strokes, a rapid bell, and three strokes means she’s aground, so don’t follow her in."},{"heading":"Small vessels and pilots","visual":{"k":"points","items":["12 to 20 m: bell signals not required at anchor or aground","If not given, make another efficient sound signal every 2 minutes","Under 12 m: Rule 35 signals not required, but an efficient sound signal every 2 minutes","Pilot vessel on duty may add four short blasts","Inland: under 20 m in a special anchorage area needs no anchor signal"],"fig":{"t":"rows","items":[["txt:12–20 m","12 to 20 m","Bell signals not required"],["txt:\u003c12 m","Under 12 m","An efficient sound signal every 2 minutes"],["snd:....","Pilot vessel on duty","May add four short blasts"]]}},"script":"Small vessels get some relief, and since you run one, learn this slide well. [+] A vessel of twelve meters or more, but under twenty, isn’t obliged to give the bell signals at anchor or aground. [+] But if she doesn’t, she must make some other efficient sound signal, at intervals of not more than two minutes. [+] A vessel under twelve meters isn’t obliged to give any of the Rule thirty-five signals. But she has the same duty: some other efficient sound signal, at least every two minutes. So are you excused from making noise in fog because your boat is small? [pause] No. You’re excused from the exact signal, not from being heard. My advice is to sound the proper one anyway. One prolonged blast every two minutes costs you nothing. [+] A pilot vessel on pilotage duty may add an identity signal of four short blasts. [+] And the Inland rules add one exemption: a vessel under twenty meters at anchor in a special anchorage area needn’t sound the anchor signal."},{"heading":"Rule 36: attracting attention","visual":{"k":"points","items":["Any light or sound that can’t be mistaken for a required signal","Or a searchlight aimed toward the danger, without embarrassing any vessel","Never use strobe or other high-intensity flashing lights"],"fig":{"t":"cmp","a":["yes","Allowed","bulb","A light or sound that can’t be mistaken, or a searchlight toward the danger"],"b":["no","Never","warn","Strobes or other high-intensity flashing lights"]}},"script":"Rule thirty-six is short. It’s about getting another vessel’s attention when you need it. [+] Any vessel may make a light or sound signal to attract attention, as long as it can’t be mistaken for any signal the rules already use. [+] Or she may direct the beam of her searchlight toward the danger, in a way that doesn’t embarrass any vessel. Embarrass is an old word here. It means to dazzle or hamper. So where do you never point a spotlight? [pause] Into another boat’s wheelhouse. You’d blind the very person you need to see you. Shine it at the hazard, or onto your own sails or deck. [+] And one thing to avoid: high-intensity flashing or revolving lights, such as strobes. A light used to attract attention also shouldn’t be mistakable for an aid to navigation."},{"heading":"Rule 37 and Annex IV: distress signals","visual":{"k":"points","items":["Gun or explosive signal about every minute","Continuous sounding of any fog-signal apparatus","Red star rockets or shells, one at a time","SOS by any method; “Mayday” by voice radio","Code flags N over C; a square flag with a ball above or below it","Flames on the vessel; red parachute or hand flares; orange smoke","Slowly raising and lowering outstretched arms","DSC distress alert, EPIRB, dye marker"],"fig":{"t":"tiles","items":[["flare","Red flares and rockets"],["smoke","Orange smoke"],["radio","Mayday, SOS, DSC alert"],["epirb","EPIRB"],["horn","Continuous fog signal"],["person","Arms slowly raised and lowered"]]}},"script":"Now the list I most want you to know cold, and not only for the exam. Rule thirty-seven says a vessel in distress, needing help, uses the signals in Annex four. Follow the list on screen. [+] A gun or other explosive signal, fired about once a minute. [+] A continuous sounding of any fog-signal apparatus. Your horn, held down. [+] Rockets or shells throwing red stars, fired one at a time at short intervals. [+] The signal SOS, by any method, and the spoken word Mayday by radio. [+] The code flags November over Charlie, or a square flag with a ball, or anything like a ball, above or below it. [+] Flames on the vessel, a red parachute flare or red hand flare, and orange smoke. [+] Slowly and repeatedly raising and lowering your arms, outstretched to each side. That one needs no equipment at all. [+] And the modern ones: a digital selective calling distress alert, an EPIRB signal, and a dye marker. [pause] Look for the pattern. Red and orange. Continuous sound. And anything that says Mayday or SOS."},{"heading":"Distress: Inland and misuse","visual":{"k":"points","items":["Inland adds: high-intensity white light flashing 50 to 70 times a minute","Use distress signals only to show distress and need of help","Don’t use signals that could be confused with them","Exam favorite: which of these is NOT a distress signal?"],"fig":{"t":"cmp","a":["yes","Inland adds","light","A white light flashing 50 to 70 times a minute"],"b":["no","Misuse","warn","Use distress signals only for real distress"]}},"script":"Two last points on distress. [+] The Inland rules add one more signal: a high-intensity white light flashing at regular intervals, fifty to seventy times a minute. [+] Second, these signals are for one purpose only: to show distress and the need for help. Using them for anything else is prohibited. [+] So is using any signal that might be confused with them. [+] Which brings us to a favorite exam question. It lists four signals and asks which one is not a distress signal. So try it. Orange smoke, a continuously sounding fog horn, three short blasts, or a red hand flare. Which one doesn’t belong? [pause] Three short blasts. That’s astern propulsion. Watch for a green flare or a white flare too. Neither is a distress signal. That’s lesson fourteen. In fog: one prolonged for power making way, two for stopped, one and two short for the hampered vessels. A rapid bell at anchor. And for distress, think red, orange, continuous, Mayday. Next time, our last Rules lesson, we pull together every Inland and International difference."}]},{"id":"rules-15","module":"R","title":"Inland vs International, and bridge-to-bridge radio","status":"draft-unverified","covers":"Inland and International differences","slides":[{"heading":"Differences: sound signals","visual":{"k":"table","head":["Topic","International","Inland"],"rows":[["1 and 2 short blasts","Action being taken","Intention, needs agreement"],["When required","Whenever maneuvering in sight","Meeting or crossing within half a mile"],["Overtaking signals","Narrow channels: 2 prolonged + short(s)","Any waters: 1 or 2 short"],["Radio agreement","Doesn’t replace whistle","Replaces whistle signals"],["Leaving a berth","No signal","1 prolonged blast"],["Maneuvering light","White","White or yellow"]],"fig":{"t":"band","items":[["txt:INTL","International","Signals say what I am doing"],["txt:INLAND","Inland","Signals propose, and she must agree"]]}},"script":"This is the last Rules lesson, and it’s the one that turns a pass into a comfortable pass. The two rule books are nearly the same, so the exam hunts for the places where they aren’t. Remember your first habit from lesson one? Find the word Inland, International or Both before you answer. Today we gather every difference into two tables. First, sound signals. [+] One and two short blasts. International: they announce action being taken. Inland: they propose an intention, and need agreement. [+] When they’re required. International: whenever a power-driven vessel maneuvers in sight of another. Inland: when power-driven vessels meet or cross within half a mile. [+] Overtaking signals. International: in narrow channels, starting with two prolonged blasts. Inland: in any waters, just one or two short. [+] Radio agreement. International: it doesn’t replace the whistle. Inland: it does. [+] Leaving a berth. International: no signal. Inland: one prolonged blast. [+] And the maneuvering light. International: white. Inland: white or yellow. [pause] If you remember one line, make it this: offshore I tell you, inshore I ask you."},{"heading":"Differences: vessels and lights","visual":{"k":"table","head":["Topic","International","Inland"],"rows":[["Constrained by draft","Exists: 3 red lights, cylinder","Doesn’t exist"],["Pushing ahead, from astern","Sternlight","Two yellow towing lights"],["Barge pushed ahead","Sidelights","Sidelights + special flashing yellow light"],["Great Lakes power vessel","Normal lights","All-round white may replace after masthead light and sternlight"],["Rivers","No special rule","Downbound has right of way; crossing vessel keeps clear"],["Under 20 m, special anchorage","Anchor light required","No anchor light or signal needed"],["Motorsailing cone, under 12 m","Required","Optional"],["Extra distress signal","None","White light flashing 50 to 70 per minute"]],"fig":{"t":"band","items":[["dots:rrr","International only","Constrained by draft"],["dots:yy","Inland only","Two yellow towing lights when pushing ahead"]]}},"script":"Now the differences in vessels and lights. There are eight, and you’ve met every one of them already. [+] Constrained by draft exists only in the International rules: three red lights, or a cylinder. Inland, there’s no such vessel. [+] A vessel pushing ahead, seen from astern. International: a sternlight. Inland: two yellow towing lights. [+] The barge she pushes. International: sidelights. Inland: sidelights plus a special flashing yellow light. [+] On the Great Lakes, a power-driven vessel may carry an all-round white light in place of the after masthead light and sternlight. [+] Rivers. On the Great Lakes and Western Rivers, the downbound vessel with a following current has the right of way, and a vessel crossing the river keeps clear. The International rules have nothing like it. [+] A vessel under twenty meters in a special anchorage area. Inland, she needs no anchor light or signal. [+] The motorsailing cone on a vessel under twelve meters. International: required. Inland: optional. [+] And distress. Inland adds the white light flashing fifty to seventy times a minute. [pause] Notice the theme. Nearly every Inland difference is about rivers, towboats, or small boats in sheltered water. That’s what makes the Inland waters different."},{"heading":"The Bridge-to-Bridge Radiotelephone Act","visual":{"k":"points","items":["Power-driven vessels 20 m and over","Vessels 100 gross tons and over carrying passengers for hire","Towing vessels 26 ft and over; dredges and floating plant near a channel","Keep a listening watch on VHF 13 in most areas, in English","Most six-packs aren’t required, but monitor 13 and 16 near ship channels"],"fig":{"t":"rows","items":[["txt:20 m+","Power-driven vessels","20 meters and over"],["people","Passenger vessels for hire","100 gross tons and over"],["tug","Towing vessels","26 feet and over"],["txt:VHF 13","Listening watch","Channel 13 in most areas"]]}},"script":"One more law lives beside the rules, and it explains why the tugs and ships are always talking on channel thirteen. It’s the Vessel Bridge-to-Bridge Radiotelephone Act. It requires certain vessels on American waters to keep a listening watch on the bridge-to-bridge channel, so that captains can speak to each other directly. Who has to? [+] Power-driven vessels of twenty meters or more. [+] Vessels of one hundred gross tons or more carrying one or more passengers for hire. [+] Towing vessels of twenty-six feet or more, and dredges and floating plant working in or near a channel. [+] The watch is kept on VHF channel thirteen in most areas, and the person keeping it must be able to communicate in English. [+] So is your six-pack boat required to take part? [pause] In most cases, no. But here’s my advice. Any time you’re near a ship channel, keep one radio on thirteen and one on sixteen. When a tug captain says, I’ll see you on one whistle, you’ll know he means port to port, and you’ll know he’s talking to you."},{"heading":"Getting to 90%","visual":{"k":"points","items":["Drill lights, shapes and signals daily with the flashcards","Retake every lesson check until you score 100%","Take the Rules quiz until you score 90% twice in a row","Read the rules once more in the handbook before the exam"],"fig":{"t":"big","ic":"target","v":"90%","cap":"Drill daily. Retake each check to 100%. Quiz to 90% twice in a row."}},"script":"That’s it. You’ve now covered every rule in the Rules of the Road module, and I want to leave you with a plan, because knowing the rules and scoring ninety percent aren’t quite the same thing. [+] First, drill the lights, shapes and sound signals every day with the flashcards in this app. They’re pure memory, and memory fades without practice. Five minutes a day beats an hour on Sunday. [+] Second, retake every lesson check until you score one hundred percent. Not ninety. One hundred. [+] Third, take the Rules of the Road quiz until you score at least ninety percent twice in a row. Once could be luck. [+] And fourth, in the week before your exam, read the rules once more in the Coast Guard handbook, Inland and International side by side, watching for the differences we just covered. [pause] You started this module wondering where the rules change on a run out of Tampa Bay. Now you know exactly where, and why, and what changes. Good luck, Captain."}]},{"id":"nav-01","module":"N","title":"Latitude, longitude and the chart","status":"draft-unverified","slides":[{"heading":"Position: latitude and longitude","visual":{"k":"dg","f":"latlong"},"script":"Welcome to Navigation General. This module answers three questions a captain asks all day. Where am I? What’s the water doing? And what’s the weather about to do? It covers more ground than any other part of the exam, so we’ll take it one piece at a time, and we start with the most basic piece: position. Look at the diagram. Latitude measures how far north or south of the equator you are, from zero to ninety degrees. Longitude measures how far east or west you are of the prime meridian at Greenwich, from zero to one hundred eighty. Each degree divides into sixty minutes. On the chart, latitude is read on the side scales, and longitude on the top and bottom. So which do you write first? [pause] Latitude. Always. And here’s an easy check. All of Florida is north latitude and west longitude. If your answer says east, something went wrong."},{"heading":"The nautical mile and the knot","visual":{"k":"points","items":["1 minute of latitude = 1 nautical mile, about 6,076 ft","A statute mile is 5,280 ft; a nautical mile is about 15% longer","1 knot = 1 nautical mile per hour (never “knots per hour”)","A minute of longitude shrinks toward the poles: never measure distance with it"],"fig":{"t":"td","els":[["t",20,40,"1 minute of latitude = 1 nautical mile","start"],["r",20,80,400,38,"s-mag"],["t",32,105,"Nautical mile: about 6,076 ft","start",15,"s-on"],["r",20,134,348,38],["t",32,159,"Statute mile: 5,280 ft","start",15],["m",20,196,"A nautical mile is about 15% longer","start"],["i","gauge",70,290,1.7],["t",130,282,"1 knot","start",24,"s-mag"],["m",130,306,"1 nautical mile per hour","start"],["m",130,326,"Never “knots per hour”","start"]]}},"script":"Now the units, and one of them is the most useful fact in all of chart work. [+] One minute of latitude equals one nautical mile. About six thousand seventy-six feet. So the side of your chart is a ruler. [+] A statute mile, the one on highway signs, is five thousand two hundred eighty feet. So a nautical mile is about fifteen percent longer. [+] A knot is one nautical mile per hour. It’s already a speed. So what’s wrong with saying knots per hour? [pause] You’d be saying miles per hour per hour. Just say knots. [+] And one warning. A minute of longitude is only a mile long at the equator. It shrinks as you go toward the poles. So never measure distance on the top or bottom scale. Distance comes from the side, and only from the side."},{"heading":"The Mercator projection","visual":{"k":"points","items":["Most nautical charts use the Mercator projection","Straight lines are rhumb lines: constant direction","The latitude scale stretches toward the poles","Measure distance at the latitude where you’re working"],"fig":{"t":"td","els":[["t",220,30,"Mercator projection"],["p","M40,350 H400 M40,312 H400 M40,268 H400 M40,216 H400 M40,154 H400 M40,80 H400","s-lst",1.6],["p","M60,56 V360 M130,56 V360 M200,56 V360 M270,56 V360 M340,56 V360","s-lst",1.6],["p","M70,340 L380,100","s-magst",3.5],["t",214,206,"Rhumb line","end",15,"s-mag"],["m",214,224,"one constant direction","end"],["m",220,388,"Latitude scale stretches toward the poles"]]}},"script":"The earth is round and your chart is flat, so every chart cheats a little. The question is how. [+] Most nautical charts use the Mercator projection. [+] Its great gift is this: a straight line on the chart is a rhumb line, a line of one constant direction. You draw a line, read its direction, and steer it. That’s why navigators love it. [+] The price is stretch. To keep directions true, the latitude scale gets longer as you move away from the equator. [+] So on a chart that covers a lot of latitude, a mile measured near the top is drawn longer than a mile near the bottom. What do you do about that? [pause] Measure distance on the part of the latitude scale that’s level with where you’re working. Not at the top of the chart, and not at the bottom. Right beside your line."},{"heading":"Chart scale and chart types","visual":{"k":"table","head":["Chart type","Scale","Used for"],"rows":[["Sailing","Smaller than 1:600,000","Offshore passage planning"],["General","1:150,000 to 1:600,000","Coastwise navigation well offshore"],["Coast","1:50,000 to 1:150,000","Inshore coastal work, entering bays"],["Harbor","Larger than 1:50,000","Harbors, anchorages, small waterways"],["Small-craft","1:40,000 and larger","Strip and folio charts, like the ICW"]],"fig":{"t":"band","items":[["globe","Small scale","Big area, little detail: sailing and general charts"],["target","Large scale","Small area, lots of detail: harbor charts"]]}},"script":"Chart scale confuses people, because large and small seem backward. Scale is the ratio of a distance on the chart to the same distance on the earth. One to forty thousand is a larger scale than one to eighty thousand. Why? Each inch covers less ground, so it shows more detail. Here’s the handle: large scale, large detail, small area. Now the chart types, from the smallest scale to the largest. [+] Sailing charts, for planning offshore passages. [+] General charts, for coastwise navigation well offshore. [+] Coast charts, for inshore work and entering bays. [+] Harbor charts, for harbors, anchorages and small waterways. [+] And small-craft charts, like the strip charts that follow the Intracoastal Waterway. [pause] So which chart do you use? Always the largest scale available for the water you’re in. More detail is never a problem."},{"heading":"Read the title block first","visual":{"k":"points","items":["Chart number, title and scale","Soundings in feet, fathoms or meters, at mean lower low water","Horizontal datum: NAD 83, matching WGS 84 on your GPS","Heights and clearances above mean high water","Edition date: keep it corrected"],"fig":{"t":"rows","items":[["doc","Number, title, scale",""],["depth","Soundings","Feet, fathoms or meters, at MLLW"],["globe","Datum","NAD 83 matches WGS 84 on your GPS"],["bridge","Heights","Above mean high water"],["clock","Edition date","Keep the chart corrected"]]}},"script":"Before you trust any chart, read its title block. It takes a minute, and it tells you what all the numbers mean. [+] The chart number, the title and the scale. [+] The units for soundings: feet, fathoms or meters. Get that one wrong and a six on the chart could be six feet, or thirty-six. And the depths are measured from a low-water level, usually mean lower low water. [+] The horizontal datum, normally the North American Datum of nineteen eighty-three. For practical purposes it matches the WGS eighty-four datum in your GPS. If the two don’t match, your plotted position is off. [+] Heights are different. Lights, landmarks and bridge clearances are measured above mean high water. Why would depths use low water and bridges use high water? [pause] Both are the cautious choice. [+] And the edition date. Keep the chart corrected. That’s lesson one. Latitude first. A minute of latitude is a mile. Large scale, large detail. Next time: reading the symbols."}]},{"id":"nav-02","module":"N","title":"Reading chart symbols","status":"draft-unverified","slides":[{"heading":"Chart colors","visual":{"k":"points","items":["Buff or tan: land","Green: areas that cover and uncover with the tide","Blue: shallower water","White: deeper water","Magenta: lights, aids, cables and restricted areas"],"fig":{"t":"td","els":[["x",20,14,96,62,"#EADFC0"],["t",136,52,"Land","start"],["x",20,90,96,62,"#B9D7A8"],["t",136,116,"Covers and uncovers","start"],["m",136,136,"with the tide","start"],["x",20,166,96,62,"#BFE0F2"],["t",136,204,"Shallower water","start"],["x",20,242,96,62,"#FFFFFF"],["t",136,280,"Deeper water","start"],["x",20,318,96,62,"#A3195B"],["t",136,344,"Lights, aids, cables,","start"],["t",136,364,"restricted areas","start"]]}},"script":"A chart is a picture written in code. Today we learn the code. The key to all of it is a booklet called Chart Number One, which explains every symbol and abbreviation, and the exam draws straight from it. Start with color, because color tells you the most at a glance. [+] Buff or tan is land. [+] Green marks areas that cover and uncover with the tide: mud flats and oyster bars that are dry at low water. [+] Blue is shallower water. [+] White is deeper water. That one feels backward, doesn’t it? On a chart, the blue is where you run aground. [+] And magenta, that purplish red, is used for lights, aids to navigation, cables, and restricted areas. Why magenta? [pause] It stands out, even under a red night-light at the helm. When you see it, something there matters."},{"heading":"Soundings, contours and the bottom","visual":{"k":"points","items":["Soundings: depths below chart datum, usually MLLW","Depth contours join points of equal depth","Bottom: S sand, M mud, Sh shells, Rk rock, Co coral, G gravel","Qualifiers: hrd hard, sft soft, fne fine, crs coarse","Charted depths can be out of date, especially near inlets"],"fig":{"t":"td","els":[["r",0,0,440,400,"s-bg"],["f","M0,0 H70 Q120,200 60,400 H0 Z","s-land"],["p","M150,0 Q200,200 140,400 M240,0 Q290,200 230,400 M340,0 Q390,200 330,400","s-lst",2.2],["t",118,90,"4","middle",16],["t",128,250,"5","middle",16],["t",208,150,"9","middle",16],["t",216,320,"11","middle",16],["t",302,100,"18","middle",16],["t",308,270,"21","middle",16],["t",396,180,"34","middle",16],["m",118,180,"S"],["m",216,230,"M"],["m",308,190,"Sh"],["t",230,36,"Depth contours","start",15,"s-mag"],["m",220,388,"Soundings: depths below chart datum (MLLW)"]]}},"script":"Now the numbers and lines in the water. [+] Soundings are the small numbers scattered over the water. Each is a depth below the chart datum, usually mean lower low water. [+] Depth contours are lines that join points of equal depth, so you can see the edge of a shoal or a channel at a glance. [+] Small letters describe the bottom. S is sand, M is mud, S h is shells, R k is rock, C o is coral, and G is gravel. [+] Qualifiers go with them: h r d for hard, s f t for soft. Why would you care what the bottom is made of? [pause] Anchoring. Sand and mud hold an anchor well. Rock and coral don’t. [+] And one caution. A charted depth is only as good as the last survey, and bottoms move. Near Florida’s inlets, they move a lot."},{"heading":"Hazards","visual":{"k":"table","head":["Symbol or note","Meaning"],"rows":[["Rock that does not cover","Always above water; height above MHW"],["Rock that covers and uncovers","Exposed at low tide"],["Rock awash","At the surface at chart datum"],["Sunken rock (cross)","Always submerged; may be dangerous"],["Wreck","Hull symbol if visible, crossed lines if submerged"],["Obstn","Obstruction"],["PA, PD, ED, Rep","Position approximate, position doubtful, existence doubtful, reported"]],"fig":{"t":"band","items":[["warn","Rocks","Bare, covering and uncovering, awash or sunken"],["boat","Wrecks","Visible or submerged"],["q","PA, PD, ED, Rep","Position or existence is uncertain"]]}},"script":"Next, the things that can put a hole in your boat. Go down the table. [+] A rock that does not cover is always above water. Its height is given above mean high water. [+] A rock that covers and uncovers shows at low tide and hides at high tide. [+] A rock awash sits right at the surface at chart datum. [+] A sunken rock, marked with a cross, is always under water, and may be dangerous. [+] A wreck is drawn as a little hull if part of it shows, and as crossed lines if it’s submerged. [+] O b s t n means an obstruction. [+] And then the qualifiers. P A is position approximate. P D is position doubtful. E D is existence doubtful. Rep means reported, but not confirmed. So how do you treat a hazard marked existence doubtful? [pause] As if it’s there. Every one of them is real until you’ve proved otherwise."},{"heading":"Regulated areas and landmarks","visual":{"k":"points","items":["Anchorage and special anchorage areas","Cable and pipeline areas: no anchoring or dragging gear","Restricted areas, danger zones, security zones","Bridges: type, horizontal and vertical clearance","Landmarks: tanks, towers, stacks, spires"],"fig":{"t":"tiles","items":[["anchor","Anchorage areas"],["no","Cable and pipeline areas: no anchoring"],["warn","Restricted, danger and security zones"],["bridge","Bridges: type and clearances"]]}},"script":"Charts also show where the rules change, usually in magenta. [+] Anchorage areas are outlined. In a special anchorage area, remember, small vessels can anchor without an anchor light under the Inland rules. [+] Cable and pipeline areas. What don’t you do there? [pause] Anchor, or drag any gear along the bottom. [+] Restricted areas, danger zones and security zones each have their own rules, explained in the chart notes and the Coast Pilot. [+] Bridges are shown with their type and two clearances: horizontal, the width between the piers, and vertical, the height. [+] And landmarks: tanks, towers, stacks, spires. They’re there for you to take bearings on. A small circle with a dot marks the exact position. Capital letters mean the landmark is conspicuous."},{"heading":"Chart notes and electronic charts","visual":{"k":"points","items":["Read every note before using a chart","Notes cover regulations, cautions and datums","Raster charts: images of paper charts","ENCs: vector data; details can hide when zoomed out","Always use the most current edition"],"fig":{"t":"cmp","a":["","Raster chart","chart","An image of the paper chart"],"b":["","ENC (vector chart)","grid","Data in layers. Zoom in, or details can hide"]}},"script":"Two last things about charts. [+] First, read every note printed on a chart before you navigate with it. [+] The notes cover regulations, cautions about shoaling or unreliable aids, and the datums. They’re the fine print, and they’re there for a reason. Second, electronic charts, which come in two kinds. [+] Raster charts are scanned pictures of the paper chart. They look exactly like it. [+] Electronic navigational charts, or E N Cs, are vector data that your plotter draws for itself. They’re powerful, but they have one trap. When you zoom out, what happens to the detail? [pause] It disappears. A rock can vanish from the screen. So zoom in along your whole route before you run it. [+] And whichever kind you use, make sure it’s the current edition. That’s lesson two. Blue is shallow. Magenta matters. Treat doubtful hazards as real. And zoom in. Next time: buoys."}]},{"id":"nav-03","module":"N","title":"Lateral aids to navigation","status":"draft-unverified","slides":[{"heading":"Red, right, returning","visual":{"k":"dg","f":"channel"},"script":"Every channel in America is marked on one idea, and it fits in three words. Red, right, returning. Keep the red marks on your right side when you’re returning. But returning from where? From seaward, heading in. Or heading upstream. And along the coast, where there’s no in or out, it means traveling clockwise around the country: south down the Atlantic coast, north up Florida’s Gulf coast, then west along the Gulf. Look at the diagram. The red buoys are nuns, with pointed tops, and they carry even numbers. The green buoys are cans, flat on top, with odd numbers. And the numbers get bigger as you head in. [pause] So you’re running out of the channel toward the Gulf, and there’s a red nun ahead. Which side do you leave it on? Your left. Going out, everything reverses. Red, right, returning, and only returning."},{"heading":"Lights on lateral marks","visual":{"k":"points","items":["Red marks show red lights; green marks show green lights","Rhythms: flashing, occulting, quick, isophase","Quick flashing: sharp turn, junction or special caution","Lighted buoys are pillars or spars: read color and number","Preferred channel: composite group flashing (2+1)"],"fig":{"t":"rows","items":[["dots:r","Red marks","Red lights"],["dots:g","Green marks","Green lights"],["txt:Q","Quick flashing","Sharp turn, junction or special caution"],["txt:2+1","Preferred channel","Composite group flashing"]]}},"script":"At night you can’t see shapes or numbers, so the lights have to carry the message. [+] The rule is simple. Red marks show red lights. Green marks show green lights. [+] The rhythm can be flashing, occulting, quick, or isophase. [+] A quick-flashing light means pay attention. It usually marks a sharp turn, a junction, or a spot that needs special caution. [+] Lighted buoys usually aren’t nun or can shaped. They’re pillars or spars. So how do you tell red from green in daylight? [pause] By color and number, not shape. [+] And a preferred channel mark, where a channel splits, shows a special rhythm: composite group flashing, two flashes and then one, in the color of its top band. One more tip. Unlighted buoys carry reflective tape in their own color. A spotlight will pick them out."},{"heading":"Daybeacons","visual":{"k":"points","items":["Fixed dayboards on piles","Red triangles, even numbers: keep on your right returning","Green squares, odd numbers: keep on your left returning","More reliable in position than buoys","Often in shallow water: don’t cut close"],"fig":{"t":"td","els":[["raw","\u003cline x1='120' y1='150' x2='120' y2='290' class='s-st' stroke-width='6'/>\u003cpolygon points='120,50 182,160 58,160' fill='#C8312A'/>\u003ctext x='120' y='142' text-anchor='middle' font-size='36' font-weight='700' fill='#fff'>4\u003c/text>\u003cline x1='320' y1='150' x2='320' y2='290' class='s-st' stroke-width='6'/>\u003crect x='268' y='58' width='104' height='102' fill='#1E8A4C'/>\u003ctext x='320' y='124' text-anchor='middle' font-size='36' font-weight='700' fill='#fff'>3\u003c/text>"],["p","M30,290 H410","s-magst",2.5],["t",120,326,"Red triangle, even","middle",16],["m",120,348,"On your right returning"],["t",320,326,"Green square, odd","middle",16],["m",320,348,"On your left returning"]]}},"script":"In Florida’s bays and along the Intracoastal, most of the marks you’ll steer by aren’t buoys at all. They’re daybeacons. [+] A daybeacon is a fixed mark: a signboard, called a dayboard, on a pile. [+] Red ones are triangles with even numbers. Keep them on your right, returning. [+] Green ones are squares with odd numbers. Keep them on your left, returning. So triangles are like nuns, and squares are like cans. [+] Because a daybeacon is driven into the bottom, it can’t drag. It’s more reliable in position than a buoy. [+] But here’s the catch. Where does a pile have to stand? [pause] In shallow water, right at the edge of the channel, or beyond it. So don’t shave it close. Give every daybeacon a reasonable berth, especially at low water."},{"heading":"Ranges","visual":{"k":"dg","f":"range"},"script":"The best aid in any channel is a range, because it tells you exactly where the centerline is. Look at the diagram. A range is two fixed marks. The front one is lower and nearer. The rear one is higher and farther away. When the two line up, one above the other, you’re on the centerline. And when they don’t? Say the rear mark shows to the right of the front one. You’re to the left of the line. So steer right, until they close up again. Here’s the handle: follow the rear mark. [pause] A range gives you something else for free. The chart prints the range’s true direction, so every time you’re lined up, you can check your compass. One caution. A range line keeps going after the channel ends. Use it only within the charted channel, or it will lead you straight aground."},{"heading":"Don’t trust buoys blindly","visual":{"k":"points","items":["Buoys can drag, sink, capsize or be off station","Lights can fail and colors fade","Use buoys as a guide, not a fixed position","Report discrepancies to the Coast Guard","Private aids (PATONs) follow the same colors and shapes"],"fig":{"t":"td","els":[["t",220,46,"A guide, not a fixed position"],["raw","\u003ccircle cx='140' cy='180' r='26' class='s-magst' stroke-width='2' stroke-dasharray='5 4'/>"],["m",140,228,"Charted position"],["a","M168,188 L262,214","s-st"],["i","buoyR",300,222,1.7],["t",300,276,"Off station","middle",16,"s-mag"],["m",220,350,"Buoys drag, sink, capsize and lose their lights"]]}},"script":"After all that, a warning from the Coast Guard itself. Don’t trust buoys blindly. [+] A buoy is a floating object on a chain. It can drag in a storm, get hit by a barge, capsize, or sink. [+] Lights fail, and colors fade. [+] So use buoys as a guide, never as a fixed position. What do you check them against? [pause] The chart, the depth sounder, and your GPS. If the buoy and the chart disagree, believe the water depth. [+] If you find an aid off station or not working, report it to the Coast Guard. [+] And know about private aids, called PATONs, put out by marinas and property owners. They follow the same colors and shapes, but they may not be maintained to the same standard. That’s lesson three. Red, right, returning. Nuns even, cans odd. Follow the rear mark. And trust the water, not the buoy. Next time: the marks that aren’t red or green."}]},{"id":"nav-04","module":"N","title":"Other marks, the ICW and state markers","status":"draft-unverified","slides":[{"heading":"Non-lateral marks","visual":{"k":"dg","f":"special"},"script":"Not every mark is telling you which side to pass on. Some are saying something else, and you need to read those too. Look at the three on screen. The safe water mark has red and white vertical stripes, often a red ball on top, and a white light flashing Morse code A: short, long. It means there’s good water all around it. You’ll often find one at the seaward end of a channel. The isolated danger mark is the opposite. It’s black with red bands, with two black balls on top, and a white light flashing in groups of two. It sits right on top of a small hazard, with safe water around it. Two balls, two flashes. And the yellow special marks show things like anchorages, cable areas and spoil areas. [pause] One more: a preferred channel mark has horizontal red and green bands. Which color do you obey? The top one."},{"heading":"The Intracoastal Waterway","visual":{"k":"dg","f":"icw"},"script":"The Intracoastal Waterway runs the length of Florida’s Atlantic coast and along much of the Gulf coast, so you’ll use it constantly. Its marks carry a small yellow symbol, and that symbol is what you steer by. Look at the diagram. A yellow triangle means: treat this mark as red. A yellow square means: treat it as green. No matter what color the mark itself is. Why would the mark’s own color ever disagree? [pause] Because the waterway sometimes shares a channel with an inlet. The same buoy is green for a boat coming in from the sea, but it may be on the red side for a boat following the waterway. So on the Intracoastal, look for the yellow. And returning, on the waterway, means going clockwise around the country: south down the Atlantic side, then north and west along the Gulf."},{"heading":"State waterway markers","visual":{"k":"dg","f":"regmarkers"},"script":"On lakes, rivers and many Florida state waters, you’ll see a different family: white markers with orange symbols. They’re regulatory markers, and each shape has a meaning. Look at the diagram. An orange diamond means danger: a rock, a shoal, a stump. The hazard is written inside. A diamond with a cross in it means keep out. Swimming areas and dams. An orange circle means a controlled area: a speed limit, idle speed, or no wake. In Florida, where will you see those most? [pause] In manatee zones. And an orange square gives information, like directions or distances. One more that isn’t orange at all: a white buoy with a blue horizontal band is a mooring buoy. So remember the shapes. Diamond, danger. Crossed diamond, keep out. Circle, control. Square, information."},{"heading":"The Western Rivers system","visual":{"k":"points","items":["Buoys aren’t numbered: channels shift","Mileage boards show statute miles along the river","Passing daymarks: red triangles and green squares","Crossing daymarks: diamonds where the channel crosses the river"],"fig":{"t":"rows","items":[["river","No numbers on buoys","The channels shift"],["txt:MILE","Mileage boards","Statute miles along the river"],["shapes:diamond","Crossing daymarks","Diamonds where the channel crosses the river"]]}},"script":"One more system, for waters you may never see but the exam still asks about. The Western Rivers. That’s the Mississippi and its tributaries. The marks there are a modified version of what you know. [+] The buoys aren’t numbered. Why not? [pause] Because the channel keeps moving. A river shifts its sandbars from one month to the next, and the buoys are moved to follow. [+] Instead of numbers, there are mileage boards on the bank, showing the distance in statute miles from a fixed point. Statute miles, not nautical. [+] Passing daymarks, red triangles and green squares, mark the side of the channel along a bank. [+] And crossing daymarks, shaped like diamonds, show where the channel crosses from one bank to the other."},{"heading":"Summary: marks and their lights","visual":{"k":"table","head":["Mark","Colors","Light"],"rows":[["Lateral, starboard side","Red","Red"],["Lateral, port side","Green","Green"],["Preferred channel","Red and green bands","Composite Fl (2+1), top-band color"],["Safe water","Red and white vertical stripes","White, Morse A"],["Isolated danger","Black with
