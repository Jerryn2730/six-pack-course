fires"],["Water","A only","Never a solid stream on fuel or electrical fires"]],"fig":{"t":"band","items":[["ext","Dry chemical","Classes A, B, C"],["txt:CO2","Carbon dioxide","Classes B, C"],["wave","Foam","Classes A, B"],["fuel","Water","Class A only"]]}},"script":"Each extinguishing agent suits certain fires, so match the agent to the class. [+] Dry chemical, rated A B C or B C, is the one on most boats. It works on nearly everything. The price is a corrosive powder all over your boat. [+] Carbon dioxide works on fuel and electrical fires by displacing the oxygen. It leaves no mess. But it has short range, and in a closed space it can suffocate you too. [+] Clean agents are what you’ll usually find in a fixed engine-room system. [+] Foam smothers fuel fires by floating on top of them. [+] And water. It’s excellent on Class A fires. But what happens if you hit burning gasoline with a solid stream of water? [pause] You spread it. And on live electrical gear, water conducts the current right back to you. So water is for Class A only."},{"heading":"Fighting a fire","visual":{"k":"points","items":["Raise the alarm; life jackets on; passengers away from the fire","Position the boat so wind carries smoke and flames away","PASS: Pull, Aim at the base, Squeeze, Sweep","Keep an escape route behind you","Not out in seconds? Call Mayday and prepare to abandon"],"fig":{"t":"steps","items":["Pull the pin","Aim at the base of the fire","Squeeze the handle","Sweep from side to side"]}},"script":"So a fire breaks out. What do you do, and in what order? [+] First, raise the alarm, get life jackets on everyone, and move your passengers away from the fire. People first. [+] Second, use the boat. Turn so the wind carries the smoke and flames away from your people. Usually that means putting the fire downwind. [+] Third, the extinguisher, and here’s the word to remember: PASS. Pull the pin. Aim at the base of the fire. Squeeze the handle. Sweep from side to side. Why the base? [pause] Because that’s where the fuel is. Spraying the flames does nothing. [+] Keep an escape route behind you. Never let the fire get between you and the way out. [+] And know when to quit. A small boat fire grows fast. If it isn’t out in seconds, call Mayday and prepare to abandon."},{"heading":"Engine compartment fires","visual":{"k":"points","items":["Shut down engines, generator, blowers and fuel","Close vents and hatches to starve the fire","Don’t open the hatch: fresh air feeds it","Discharge the fixed system if it hasn’t fired","Wait at least 15 minutes before opening; extinguisher ready"],"fig":{"t":"steps","items":["Shut down engines, blowers and fuel","Close vents and hatches","Don’t open the hatch","Discharge the fixed system","Wait 15 minutes before opening"]}},"script":"The engine compartment fire is the most dangerous one on a small boat, and your instinct will be wrong. Your instinct says: open the hatch and look. Don’t. Here’s the drill. [+] Shut down the engines, the generator and the blowers, and close the fuel valves. [+] Close the vents and hatches to starve the fire of air. [+] And leave the hatch shut. What happens if you open it? [pause] A rush of fresh air, and the fire flares up in your face. [+] Discharge the fixed system, if it hasn’t gone off by itself. Many systems shut the engines down when they fire. [+] Then wait. At least fifteen minutes before you open that compartment, so it can cool and the fire can’t reignite. And when you do open it, have a portable extinguisher in your hand."},{"heading":"Electrical, galley and propane fires","visual":{"k":"points","items":["Electrical: kill the power, then CO2 or dry chemical","Galley grease: smother with a lid or fire blanket, never water","Propane: close the tank valve; vapor sinks into the bilge","Fire blanket for clothing and small galley fires"],"fig":{"t":"rows","items":[["bolt","Electrical","Kill the power, then CO2 or dry chemical"],["no","Galley grease","Smother it. Never water"],["fuel","Propane","Close the tank valve. Vapor sinks"]]}},"script":"Three more kinds of fire, each with its own trick. [+] Electrical. Kill the power first, at the battery switch or the breaker. Then use carbon dioxide or dry chemical. With the power off, it’s often just a small Class A fire. [+] Galley grease. Smother it with a lid or a fire blanket, and turn off the heat. Never water. Water turns to steam and throws burning grease across the cabin. [+] Propane. Close the valve at the tank. And remember that propane is heavier than air, so a leak sinks into the bilge just like gasoline vapor. If you smell it, ventilate before you touch a single switch. [+] And keep a fire blanket handy. It’s the fastest way to put out burning clothing, too. [pause] That’s lesson three. Heat, fuel, oxygen, chain reaction. A for ash, B for boil, C for current. PASS, aimed at the base. And never open the engine hatch for fifteen minutes. Next time: how to keep the fire from starting at all."}]},{"id":"deck-04","module":"D","title":"Fueling, fire prevention and carbon monoxide","status":"draft-unverified","slides":[{"heading":"Gasoline vapor","visual":{"k":"points","items":["Gasoline vapor is heavier than air and settles in the bilge","A small amount of vapor can cause a powerful explosion","Propane behaves the same way","Diesel is far less volatile, but still burns"],"fig":{"t":"td","els":[["t",220,50,"Gasoline vapor is heavier than air"],["raw","\u003cpath d='M80,110 H360 L328,290 Q220,336 112,290 Z' class='s-bg' style='stroke:var(--ink);stroke-width:2'/>\u003cellipse cx='220' cy='284' rx='92' ry='24' fill='#e8762b' opacity='.55'/>"],["a","M170,140 V236","s-st"],["a","M270,140 V236","s-st"],["m",220,180,"Vapor sinks"],["t",220,372,"It settles in the bilge","middle",17,"s-mag"]]}},"script":"Last time we fought the fire. Today we stop it from starting, and that begins with understanding one thing about gasoline. It isn’t the liquid that explodes. It’s the vapor. [+] Gasoline vapor is heavier than air. So where does it go? [pause] Down. It flows like water into the bilge and the low compartments, and it sits there, waiting for a spark from a switch, a pump or a starter. [+] And it doesn’t take much. A small amount of vapor can produce an explosion strong enough to destroy the boat. [+] Propane behaves the same way. It sinks too. [+] Diesel is far less volatile and much harder to light, which is one reason most commercial boats burn it. But once it’s lit, it still burns. Here’s the fact to carry with you: most boat explosions happen during fueling, or just after it."},{"heading":"Safe fueling, step by step","visual":{"k":"script","lines":["Moor securely; passengers ashore if practical","Stop engines and motors; no smoking or open flame","Close hatches, ports and cabin doors","Keep the nozzle touching the fill pipe; don’t overfill","Wipe up spills, open up, run the blower 4+ minutes and sniff the bilge"],"fig":{"t":"tiles","items":[["no","No smoking or open flame"],["engine","Engines and motors off"],["lock","Hatches, ports and doors closed"],["wind","Blower 4+ minutes, then sniff the bilge"]]}},"script":"So fuel the same careful way, every single time. Here’s the routine. [+] Moor the boat securely, and if it’s practical, put your passengers ashore. [+] Stop the engines and every electric motor. No smoking, no open flame. [+] Close the hatches, ports and cabin doors. Why close up? [pause] Because the vapor is heavier than air, and you don’t want it flowing below. [+] Keep the nozzle touching the fill pipe the whole time, which prevents a static spark. And don’t fill to the brim. Fuel expands as it warms. [+] When you’re done, wipe up any spills, open everything back up, run the blower for at least four minutes, and sniff the bilge and the engine space before you turn the key. Close up to fuel. Open up to start."},{"heading":"Carbon monoxide","visual":{"k":"points","items":["Colorless, odorless and deadly","Builds near the stern, the swim platform and enclosed cabins","“Station wagon effect”: exhaust drawn aboard while underway","Symptoms mimic seasickness: headache, nausea, dizziness","Install CO alarms; no one on the swim platform with engines or generator running"],"fig":{"t":"td","els":[["t",220,44,"Carbon monoxide"],["m",220,68,"Colorless, odorless and deadly"],["p","M10,246 H430","s-magst",2.5],["i","boat",250,214,3.4],["raw","\u003ccircle cx='130' cy='214' r='22' class='s-mut' opacity='.45'/>\u003ccircle cx='106' cy='194' r='16' class='s-mut' opacity='.35'/>\u003ccircle cx='150' cy='184' r='14' class='s-mut' opacity='.3'/>"],["a","M118,176 C120,140 160,128 204,140","s-st"],["t",220,310,"It builds at the stern","middle",17,"s-mag"],["m",220,334,"and the swim platform, and gets drawn aboard"]]}},"script":"Now a killer you can’t see or smell. Carbon monoxide. [+] It’s colorless, odorless, and deadly, and it’s in the exhaust of every engine and generator. [+] It collects near the stern, on and around the swim platform, and in enclosed cabins. [+] It can follow you, too. Underway, the airflow behind the boat can pull exhaust back aboard, especially with canvas up. That’s called the station wagon effect. [+] The early symptoms are headache, nausea and dizziness. What does that sound like on a boat? [pause] Seasickness. So when a passenger feels sick in the cabin with the generator running, don’t assume it’s the waves. Get them into fresh air. [+] Install and test carbon monoxide alarms in enclosed spaces. And nobody hangs on the swim platform with an engine or generator running. Ever."},{"heading":"Batteries and electrical systems","visual":{"k":"points","items":["Charging batteries give off explosive hydrogen","Ventilate and secure batteries; cover the terminals","Use marine-rated wiring, breakers and fuses","Shore power: inspect cords and connectors","Electric shock drowning: never swim near docks with shore power"],"fig":{"t":"rows","items":[["battery","Charging batteries","Give off explosive hydrogen. Ventilate"],["bolt","Shore power","Inspect cords and connectors"],["no","Electric shock drowning","Never swim near docks with shore power"]]}},"script":"Electrical systems start a great many boat fires, so a few rules. [+] Batteries give off hydrogen gas while they charge, and hydrogen is explosive. [+] So battery compartments need ventilation. The batteries must be secured so they can’t shift in a seaway, with the terminals covered. [+] Use marine-rated wiring, breakers and fuses. Household parts corrode and overheat. [+] Check your shore power cords and connectors. Brown or melted plastic means heat, and heat means a fire on its way. [+] And one danger most people have never heard of: electric shock drowning. Faulty wiring can put current into the water around a dock, especially in fresh or brackish water. A swimmer is paralyzed and drowns. So what’s the rule at any marina with shore power? [pause] Nobody swims there."},{"heading":"Good housekeeping","visual":{"k":"points","items":["Keep bilges clean and free of oil and fuel","Inspect fuel lines, clamps, vents and tanks regularly","Store rags, paints and solvents properly","Smoking only where it’s safe, if at all","Prevention is far easier than firefighting"],"fig":{"t":"tiles","items":[["pump","Clean, dry bilges"],["fuel","Inspect fuel lines and clamps"],["warn","Store rags and solvents properly"],["yes","Prevention beats firefighting"]]}},"script":"Most boat fires are preventable, and prevention is plain housekeeping. [+] Keep the bilges clean, with no oil or fuel in them. A clean bilge also shows you a new leak right away. [+] Inspect the fuel lines, hose clamps, tank vents and tanks for chafe, corrosion and weeping. [+] Store oily rags, paints and solvents in proper containers. An oily rag wadded up in a locker can heat up and light all by itself. [+] Allow smoking only where it’s safe, if you allow it at all. [+] And remember that a few minutes of looking at the dock is far easier than fighting a fire offshore with six passengers aboard. [pause] That’s lesson four. Vapor sinks. Close up to fuel, open up to start, four minutes on the blower. Carbon monoxide looks like seasickness. And nobody swims near shore power. Next time: what keeps a boat upright."}]},{"id":"deck-05","module":"D","title":"Stability","status":"draft-unverified","slides":[{"heading":"G, B and M","visual":{"k":"dg","f":"stability"},"script":"Why does a boat stay upright? And why, some days, doesn’t she? Today’s lesson answers both, and it comes down to three letters. Look at the diagram. G is the center of gravity. It’s where all the weight acts, and it pulls down. B is the center of buoyancy, the center of the underwater part of the hull, and it pushes up. Now heel the boat. What happens to B? [pause] It moves toward the low side, because more of the hull is underwater there. So now gravity pulls down in one place, and buoyancy pushes up in another, and together they twist the boat back upright. That’s the righting arm. The third letter is M, the metacenter: the point where the line straight up from B crosses the centerline. And the distance from G up to M is the metacentric height, G M. The bigger the G M, the more firmly she stands up."},{"heading":"What hurts stability","visual":{"k":"points","items":["Weight added high raises G","Free surface: sloshing liquid acts like raising G","Keep tanks full or empty, and bilges dry","Quick, snappy roll: stiff, large GM","Slow, lazy roll: tender, small GM"],"fig":{"t":"td","els":[["t",220,40,"Free surface acts like raising G"],["raw","\u003cg transform='rotate(12 120 190)'>\u003cpath d='M40,130 H200 L184,230 Q120,256 56,230 Z' class='s-bg' style='stroke:var(--ink);stroke-width:2'/>\u003crect x='85' y='180' width='70' height='40' class='s-mag'/>\u003c/g>\u003cg transform='rotate(12 320 190)'>\u003cpath d='M240,130 H400 L384,230 Q320,256 256,230 Z' class='s-bg' style='stroke:var(--ink);stroke-width:2'/>\u003crect x='285' y='180' width='70' height='40' fill='none' style='stroke:var(--ink);stroke-width:1.5'/>\u003cpolygon points='285,220 355,220 355,190 285,208' class='s-mag'/>\u003c/g>"],["y",76,292],["t",128,298,"Full tank","middle",16],["m",120,320,"Liquid can’t shift"],["n",272,292],["t",328,298,"Slack tank","middle",16],["m",320,320,"Liquid runs to the low side"],["m",220,372,"Keep tanks full or empty, and bilges dry"]]}},"script":"So what makes G M smaller? Anything that raises G. [+] Add weight high up, and G goes up. Passengers in a tower. Gear stacked on the cabin top. [+] The second enemy is sneakier: free surface. Liquid sloshing in a half-full tank runs to the low side when you heel, and it pushes you over further. It acts just like raising G. [+] So keep tanks either full or empty when you can, and keep the bilges dry. [+] Here’s the useful part. You can feel your stability through your feet. A quick, snappy roll means a stiff boat, with a large G M. [+] A slow, lazy roll, where she leans over and takes her time coming back, means a tender boat, with a small G M. And if your boat rolls lazier this afternoon than she did this morning, what’s that telling you? [pause] Something changed. Look for water."},{"heading":"Passengers and loading","visual":{"k":"points","items":["Passengers rushing to one rail can capsize a small boat","Keep heavy loads low and centered","Respect the capacity plate on small boats","Fuel, ice and fish change your loading during the day","Water on deck acts like free surface"],"fig":{"t":"cmp","a":["no","Everyone at one rail","people","Can capsize a small boat"],"b":["yes","Low and centered","boat","Keep heavy loads low. Respect the capacity plate"]}},"script":"On a charter, the biggest stability problem isn’t fuel or ice. It’s people. [+] Picture it. Somebody hooks a big kingfish on the port side, and all six passengers rush to the port rail to watch. On a small boat, that alone can swamp or capsize her. So what do you say before lines go in the water? [pause] Stay spread out. One or two at the rail, the rest stay put. [+] Keep heavy things, coolers, ice and gear, low and near the centerline. [+] On small boats, respect the capacity plate. [+] And remember that your loading changes all day. You burn off fuel, the ice melts, and the fish box fills up. The boat you bring home isn’t the boat you took out. [+] Finally, water trapped on deck is free surface, right where you can least afford it: up high."},{"heading":"Words to know","visual":{"k":"table","head":["Term","Meaning"],"rows":[["Heel","Temporary lean from wind, waves or a turn"],["List","Steady lean from off-center weight or flooding"],["Trim","Fore-and-aft balance: down by the bow or stern"],["Freeboard","Height from the waterline to the deck edge"],["Reserve buoyancy","Watertight volume above the waterline"]],"fig":{"t":"band","items":[["wind","Heel","Temporary lean"],["down","List","Steady lean: weight or flooding"],["turn","Trim","Fore-and-aft balance"],["up","Freeboard","Waterline to deck edge"]]}},"script":"Five words you need for the exam, and for talking to the Coast Guard on the radio. [+] Heel is a temporary lean, from wind, waves or a turn. [+] List is a steady lean, caused by weight off-center, or by flooding. So if your boat develops a list and nobody moved anything, what do you check? [pause] The bilge. An unexplained list means water is getting in. [+] Trim is the fore-and-aft balance. We say down by the bow or down by the stern. [+] Freeboard is the height from the waterline up to the deck edge. [+] And reserve buoyancy is the watertight volume above the waterline. It’s your margin, the thing that keeps you afloat as you take on load or water. Here’s how I keep the first two apart. Heel heals itself. A list lasts."},{"heading":"How boats capsize","visual":{"k":"points","items":["Overloading and weight carried high","Free surface and water in the boat","Sharp turns at speed","Following seas and broaching","Down-flooding through open hatches or a low transom"],"fig":{"t":"tiles","items":[["people","Overloading, weight carried high"],["wave","Free surface, water in the boat"],["turn","Sharp turns at speed"],["down","Down-flooding through openings"]]}},"script":"So how do small boats actually capsize? Almost never from one cause. It’s a stack of them. [+] Too much weight, or weight carried too high. [+] Free surface, and water already in the boat. [+] A sharp turn at speed. [+] A following sea that slews her sideways into a broach. [+] And down-flooding: water pouring in through an open hatch, or over a low transom. What’s the common thread? [pause] The boat was already near her limit before the last wave arrived. So keep weight low. Keep water out. Slow down in rough water. And keep your bow or your stern, never your beam, toward breaking seas. That’s lesson five. G pulls down, B pushes up, and G M is your stability. Snappy is stiff, lazy is tender. Heel heals, a list lasts. Next time: hulls, and keeping the water on the outside."}]},{"id":"deck-06","module":"D","title":"Hulls, watertight integrity and flooding","status":"draft-unverified","slides":[{"heading":"Hull types","visual":{"k":"points","items":["Displacement hulls push through the water; speed limited by length","Planing hulls rise onto the surface at speed","Semi-displacement hulls fall in between","Deep-V: smoother in chop; flat bottom: stable at rest, pounds in waves"],"fig":{"t":"td","els":[["t",220,40,"Hull shapes, seen from astern"],["raw","\u003cpath d='M34,90 H134 Q134,150 84,162 Q34,150 34,90 Z' class='s-ink'/>\u003cpath d='M170,90 H270 L220,162 Z' class='s-ink'/>\u003cpath d='M306,90 H406 L396,140 H316 Z' class='s-ink'/>"],["p","M10,112 H430","s-magst",2],["t",84,196,"Round","middle",16],["m",84,216,"Displacement"],["t",220,196,"Deep-V","middle",16],["m",220,216,"Smoother in chop"],["t",356,196,"Flat","middle",16],["m",356,216,"Stable, but pounds"],["t",220,290,"Displacement: speed limited by length","middle",15],["t",220,326,"Planing: rises onto the surface at speed","middle",15,"s-mag"]]}},"script":"A boat has one job above all others: keep the water on the outside. Today is about the hull that does it, and what to do when it doesn’t. We start with shape, because shape decides how a boat behaves. [+] A displacement hull pushes through the water. Her top speed, called hull speed, is limited by her waterline length, and no amount of horsepower will change it much. [+] A planing hull climbs up and skims on the surface once she has enough power and speed. That’s how most charter boats travel. [+] A semi-displacement hull falls in between. [+] Now look at the bottom itself. A deep-V cuts through chop and rides smoother. A flat bottom is very stable at rest and floats in shallow water, but what does she do in a head sea? [pause] She pounds. Every hull is a trade, and you should know which trade you bought."},{"heading":"Keeping the water out","visual":{"k":"points","items":["Close hatches, ports and doors in rough water","Keep scuppers and freeing ports clear","Inspect seacocks, hoses and double clamps below the waterline","Down-flooding through open hatches sinks boats fast"],"fig":{"t":"tiles","items":[["lock","Hatches, ports and doors closed"],["down","Scuppers and freeing ports clear"],["engine","Seacocks, hoses, double clamps"],["warn","Down-flooding sinks boats fast"]]}},"script":"Watertight integrity is a long phrase for a simple idea: don’t let the sea in. [+] In rough water, close the hatches, ports and doors. [+] Keep the scuppers and freeing ports clear. They’re the drains that let water on deck run back overboard. A scupper plugged with bait and leaves turns your cockpit into a bathtub. [+] Below the waterline, inspect every seacock, hose and fitting, and use double stainless clamps on every hose. Here’s a fact that surprises people. Where do most boats sink? [pause] At the dock. A hose splits or a fitting fails, and nobody’s aboard to notice. [+] And underway, the danger is down-flooding: water pouring through an open hatch in heavy seas. That can sink a boat in minutes."},{"heading":"Bilge pumps and alarms","visual":{"k":"points","items":["Automatic electric pumps with float switches","A high-water alarm you can hear at the helm","A manual pump as backup","Pump capacity drops with lift and hose length","Know where every through-hull is"],"fig":{"t":"rows","items":[["pump","Automatic electric pumps","With float switches"],["bell","High-water alarm","Loud enough to hear at the helm"],["pump","Manual pump","Your backup"]]}},"script":"Some water always gets in, so you need a reliable way to get it out. [+] Automatic electric pumps with float switches handle the everyday leaks and the rain. [+] A high-water alarm, loud enough to hear at the helm, tells you when something is wrong. Without one, how do you find out your bilge is filling? [pause] When the boat starts handling badly. And that’s late. [+] Carry a manual pump too, for the day the electrics fail. [+] Don’t trust the number on the pump’s label. Its capacity drops sharply with the height it has to lift the water, and with the length of the hose. Real output is much lower. [+] And most important of all: know where every through-hull on your boat is. You can’t close a seacock you can’t find."},{"heading":"Responding to flooding","visual":{"k":"script","lines":["Find the source: through-hulls, hoses, shaft seal, hull damage","Stop or slow it: close seacocks, drive soft wood plugs, stuff cushions or rags","Pump: every pump you have, plus buckets","Call for help early: Pan-pan, or Mayday if sinking","Life jackets on everyone; head for shallow water if close"],"fig":{"t":"tiles","items":[["eye","Find the source"],["lock","Stop or slow it"],["pump","Pump with everything you have"],["radio","Call for help early"]]}},"script":"Now the bad day. You open a hatch and see water over the floorboards. Work in this order. [+] First, find the source. Check the through-hulls, the hoses, the shaft seal, and the hull itself. [+] Second, stop it or slow it. Close the seacock. Drive a soft wood plug into a failed fitting. Stuff a cushion or rags into a hole. Here’s a tip worth more than any pump: tie a plug beside every through-hull now, so it’s there when you need it. [+] Third, pump, with everything you have, buckets included. [+] Fourth, call for help early. A pan-pan if you’re holding your own, a Mayday if you’re sinking. Why early? [pause] Because the radio stops working when the batteries go under. [+] And get life jackets on everyone. If the leak is winning and shallow water is close, head for it."},{"heading":"Following seas","visual":{"k":"points","items":["Broach: a following sea slews the boat sideways","Pitchpole: the bow digs in and the stern flips over","Run inlets on the back of a wave, not down its face","Raise trim tabs to keep the bow up"],"fig":{"t":"td","els":[["a","M300,60 H410","s-st"],["m",355,46,"Following sea"],["p","M0,230 Q110,120 220,230 T440,230","s-magst",3.5],["i","boat",62,180,1.5],["y",62,128],["t",90,290,"Ride the back","middle",16],["i","boat",172,184,1.5],["n",172,132],["t",220,330,"Don’t surf down the face","middle",16,"s-mag"],["m",220,366,"Broaching and pitchpoling start on the face"]]}},"script":"Last, the sea that comes from behind. Following seas are especially dangerous for small powerboats. [+] A broach happens when a wave from astern lifts your stern and slews the boat sideways. Now you’re beam-on, and the next wave can roll you. [+] In the worst case, the bow digs in and the stern goes over the top. That’s a pitchpole. [+] So when you run before big seas, or come in an inlet, where do you put the boat? [pause] On the back of a wave. Match its speed and stay there. Don’t surf down the face. [+] Raise the trim tabs to keep the bow up, and keep a hand on the throttle. That’s lesson six. Know your hull. Clear scuppers, double clamps, a plug at every through-hull. Find it, stop it, pump it, call early. And ride the back of the wave. Next time: making the boat go where you want her to."}]},{"id":"deck-07","module":"D","title":"Boat handling and docking","status":"draft-unverified","slides":[{"heading":"Propeller walk","visual":{"k":"dg","f":"propwalk"},"script":"Nothing shows a captain’s skill like the last fifty feet to the dock, with six passengers and a full marina watching. Today is about why a boat moves the way she does at low speed. Start with something most new captains never notice. A propeller doesn’t only push the boat ahead. It also shoves the stern sideways. That’s propeller walk. Look at the diagram. On a single-screw boat with a right-hand propeller, the stern kicks slightly to starboard going ahead. In reverse, it walks strongly to port. So think it through. You’re coming in to stop alongside, and you give her a burst of reverse. Which side would you rather have the dock on? [pause] The port side. That burst of reverse stops the boat and pulls your stern in toward the dock at the same time. Find out which way your boat walks before you need to know."},{"heading":"How boats steer","visual":{"k":"points","items":["Inboards steer by water flowing over the rudder","Little flow means little steering, especially astern","A short burst of power gives steering without much speed","Going ahead, a boat pivots about a third of its length from the bow","Outboards and sterndrives steer by aiming thrust"],"fig":{"t":"td","els":[["h",200,200,0,"s-ink",3.6],["raw","\u003ccircle cx='200' cy='166' r='8' class='s-mag'/>"],["t",232,160,"Pivot point","start",16,"s-mag"],["m",232,180,"about a third back","start"],["m",232,198,"from the bow","start"],["a","M232,290 C290,284 316,256 318,224"],["t",330,300,"Stern","middle",15],["t",330,318,"swings wide","middle",15]]}},"script":"Now, how does a boat actually steer? [+] An inboard boat steers by water flowing past the rudder, and most of that flow is prop wash. [+] So when there’s little flow, there’s little steering. Dead slow, she’s sluggish. In reverse, she barely answers at all. [+] The cure is a short burst of power with the rudder already over. That throws a slug of water against the rudder and kicks the stern across, without building much speed. [+] And here’s the thing that catches people. A boat doesn’t turn like a car. Going ahead, she pivots about a point roughly a third of her length back from the bow. So which end swings wide? [pause] The stern. Turn away from a dock too sharply, and your stern swings into it. [+] Outboards and sterndrives are different. They steer by aiming the propeller’s thrust, so they answer well even at low speed."},{"heading":"Twin screws","visual":{"k":"points","items":["Outboard-turning props cancel each other’s walk","One ahead, one astern: the boat spins in place","At low speed, steer with the engines; rudders centered","Use small bursts and neutral often"],"fig":{"t":"td","els":[["t",220,40,"Twin screws: spin in place"],["h",220,200,0,"s-ink",3],["a","M150,340 V282"],["m",150,362,"Port ahead"],["a","M290,282 V340"],["m",300,272,"Starboard astern"],["a","M150,110 Q220,62 290,110","s-st"]]}},"script":"Twin screws change everything, and once you learn them, you’ll never want one engine again. [+] Most twin-screw boats have counter-rotating propellers, so each one cancels the other’s walk. [+] Put one engine ahead and the other astern, and the boat spins in place. Which way? Think of a tank. Starboard engine ahead, port engine astern, and the bow swings to port. Swap them, and it swings to starboard. [+] Around the docks, center the rudders and leave the wheel alone. Steer with the engines. [+] And use small bursts, with plenty of neutral in between. What’s the commonest mistake with twins? [pause] Leaving them in gear. A boat keeps moving long after you take her out of gear, so click in, click out, and wait to see what she does."},{"heading":"Docking principles","visual":{"k":"points","items":["Approach slowly: never faster than you’re willing to hit the dock","Approach into the stronger of wind or current","Have fenders and lines rigged before you arrive","Use spring lines to hold or pivot the boat","Brief crew: fend off with fenders or a boat hook, never hands or feet"],"fig":{"t":"td","els":[["r",30,70,380,26,"s-mut"],["m",220,60,"Dock"],["a","M40,150 H130","s-st"],["m",40,134,"Wind or current","start"],["h",270,230,-40,"s-ink",1.7],["a","M246,202 L196,142"],["t",220,326,"Approach slowly, into the wind or current","middle",15,"s-mag"],["m",220,350,"Never faster than you’re willing to hit the dock"]]}},"script":"Good docking is nearly all planning, and very little of it is hand skill. [+] Approach slowly. The old rule is: never approach a dock faster than you’re willing to hit it. [+] Work out which is stronger, the wind or the current, and approach into it. Why into it? [pause] Because it acts as your brake. You keep steerage, and you can stop whenever you like. [+] Have your fenders and lines rigged before you arrive, not while you’re drifting down on the pilings. [+] Use a spring line. One spring made fast will hold the boat against the dock while you get the others on, or pivot her in or out. [+] And brief your crew and your passengers. Fend off with a fender or a boat hook. Never with hands or feet. A boat weighs tons, and it doesn’t stop for a foot."},{"heading":"Wind and current at the dock","visual":{"k":"points","items":["Wind blowing onto the dock: stop alongside and let it push you in","Wind blowing off the dock: steeper approach; get a bow line or spring on fast","Current from ahead: easiest; current from astern: approach with care","Leaving: spring out the stern or bow against a line"],"fig":{"t":"cmp","a":["","Wind onto the dock","right","Stop alongside and let it push you in"],"b":["","Wind off the dock","turn","Steeper approach. Get a bow line or spring on fast"]}},"script":"Wind and current decide which docking plan you use. [+] If the wind is blowing onto the dock, it’s the easy one. Stop parallel, a few feet off, and let the wind set you gently alongside. [+] If the wind is blowing off the dock, come in at a steeper angle, get a bow line or a spring on quickly, and use it to work her in. [+] Current from ahead is the easiest of all. Current from astern is the hard one, because it’s pushing you faster than you think. What should you do if you can? [pause] Turn around, and come in against it. [+] And leaving. Motor gently ahead against a bow spring with the wheel turned toward the dock. The stern swings out, and then you back away clear. That’s lesson seven. Prop walk: a right-hand prop walks to port in reverse. The stern swings wide. Slow, into the wind or current, lines ready. Next time: the lines themselves."}]},{"id":"deck-08","module":"D","title":"Lines, knots and dock lines","status":"draft-unverified","slides":[{"heading":"Line materials","visual":{"k":"table","head":["Material","Stretch","Floats?","Used for"],"rows":[["Nylon","High","No","Anchor rodes, dock lines, towlines"],["Polyester (Dacron)","Low","No","Halyards, sheets, low-stretch uses"],["Polypropylene","Moderate","Yes","Ring buoy lines, ski ropes; weakens in sun"],["Spectra or Dyneema","Very low","Yes","High-strength specialty lines"]],"fig":{"t":"band","items":[["rope","Nylon","Stretchy: rodes, dock lines"],["rope","Polyester","Low stretch"],["rope","Polypropylene","Floats; weakens in sun"],["rope","Dyneema","Very strong, floats"]]}},"script":"Every boat is held together, tied up and anchored with rope, and on a boat we call it line. Using the wrong line for the job is a quiet way to lose a boat. So start with what it’s made of. [+] Nylon is strong, and it stretches. That stretch soaks up shock loads, which makes nylon the choice for anchor rodes, dock lines and towlines. It doesn’t float. [+] Polyester, often sold as Dacron, is strong with very little stretch. It’s for halyards and sheets, where you don’t want any give. [+] Polypropylene floats. That’s why it’s on ring buoys and ski ropes. But it’s weaker, and the sun breaks it down. [+] And Spectra and Dyneema are the modern ones: extremely strong, very low stretch, and they float. So which one goes on your anchor? [pause] Nylon. You want that spring in the line when the boat surges."},{"heading":"Construction and care","visual":{"k":"points","items":["Three-strand: easy to splice, stretchy","Double braid: strong and smooth, easy on hands and winches","Protect against chafe with chafe gear","Rinse out salt; store out of the sun","A knot weakens a line far more than a splice"],"fig":{"t":"cmp","a":["","Three-strand","knot","Easy to splice, stretchy"],"b":["","Double braid","rope","Strong and smooth, easy on hands and winches"]}},"script":"Next, how the line is built, and how to keep it alive. [+] Three-strand twisted line is easy to splice and stretches well. That suits an anchor rode. [+] Double braid is strong and smooth, and kinder to your hands and your winches. That suits dock lines. [+] The great enemy of any line is chafe. Wherever a line passes through a chock or bends over an edge, protect it with chafe gear. [+] Rinse the salt out now and then, and store your lines out of the sun. [+] And here’s the one for the exam. A knot weakens a line far more than a splice does. How much? [pause] A knot can cost you a third of the strength or more. A good splice keeps most of it. So anything permanent gets spliced."},{"heading":"Dock lines","visual":{"k":"dg","f":"docklines"},"script":"Now let’s tie the boat up. Look at the diagram. A boat alongside is usually held by four lines or more, and each has a job. The bow line leads forward from the bow, and the stern line leads aft from the stern. Those two hold her in to the dock. The spring lines stop her moving along it. The bow spring runs from near the bow, aft to the dock, and it stops the boat surging forward. The stern spring runs from near the stern, forward to the dock, and it stops her moving back. A breast line runs straight across, to hold her close. [pause] One more thing, and it matters in Florida. Leave slack for the tide. What happens if you tie her up tight at high water and go home? The tide falls, and the boat ends up hanging from her own lines."},{"heading":"Knots every captain knows","visual":{"k":"table","head":["Knot","Use"],"rows":[["Bowline","A fixed loop that won’t slip and unties easily"],["Cleat hitch","Securing a line to a cleat"],["Clove hitch","A quick hitch to a piling or rail; can slip"],["Round turn and two half hitches","Secure attachment to a ring or post under load"],["Sheet bend","Joining two lines, even of different sizes"],["Figure-eight","A stopper knot at the end of a line"],["Rolling hitch","Taking the strain off another line"]],"fig":{"t":"band","items":[["knot","Bowline","A fixed loop"],["knot","Cleat hitch","Line to a cleat"],["knot","Sheet bend","Joins two lines"],["knot","Figure-eight","Stopper knot"]]}},"script":"There are hundreds of knots. A captain needs seven, and needs them without thinking. [+] The bowline: a fixed loop that won’t slip, and unties easily even after a heavy load. If you learn one knot, learn this one. [+] The cleat hitch: how you make a line fast to a cleat. [+] The clove hitch: a quick hitch around a piling or rail. It can slip, so back it up. [+] A round turn and two half hitches: a secure hold on a ring or a post, under load. [+] The sheet bend: joins two lines, even when they’re different sizes. [+] The figure-eight: a stopper knot in the end of a line, so it can’t run out through a block. [+] And the rolling hitch: it grips another line, so you can take the strain off it. [pause] Don’t just read these. Keep a short piece of line by your chair, and tie them until your hands know them."},{"heading":"Line safety","visual":{"k":"points","items":["Snap-back: a parting line can kill","Stay out of the path of a line under load","Never stand in a bight or loop of line","Use the right size line for the load","Inspect for chafe, stiffness and sun damage"],"fig":{"t":"td","els":[["t",220,44,"A parting line can kill"],["wg",60,200,330,62,118,"#d93025",0.14],["p","M60,200 H390","s-magst",4.5],["raw","\u003crect x='40' y='186' width='24' height='28' rx='4' class='s-ink'/>"],["t",250,160,"Snap-back zone","middle",16],["i","person",330,236,1],["n",330,236],["m",220,340,"Stay out of the line of pull"],["m",220,360,"Never stand in a bight or loop of line"]]}},"script":"A last word on line, and it’s about staying alive. A line under load stores a huge amount of energy, and stretchy nylon stores the most. [+] If that line parts, it snaps back like a whip, with enough force to kill. That’s called snap-back. [+] So keep yourself, and your passengers, out of the path of any line under strain. When does that happen on a charter boat? [pause] When you’re towing, and when the boat surges against her dock lines. [+] Never stand inside a bight, a loop of line lying on deck. If it comes tight, it takes your leg with it. [+] Use a line that’s big enough for the load. [+] And inspect your lines for chafe, stiffness and sun damage, and replace them before they fail. That’s lesson eight. Nylon stretches, polypropylene floats. Splice what’s permanent. Springs stop her surging. And stay out of the snap-back zone. Next time: anchoring."}]},{"id":"deck-09","module":"D","title":"Anchoring","status":"draft-unverified","slides":[{"heading":"Types of anchors","visual":{"k":"dg","f":"anchors"},"script":"If your engine quits a mile off the beach with the wind blowing onshore, one piece of gear stands between you and the surf. Your anchor. It’s safety equipment first, and a fishing tool second. Look at the four types on screen. A fluke anchor, often called a Danforth, is light, stows flat, and holds very well in sand and mud. That’s why you’ll see it on nearly every Florida fishing boat. Its weakness is grass and rock. A plow or claw holds in most bottoms, and resets itself if the wind shifts. A mushroom anchor works by suction in soft mud, and it’s for permanent moorings. And a grapnel hooks into rocks and wrecks. It’s popular for fishing structure, but it fouls easily, so rig it to break free. [pause] So which one for a sandy bottom off Clearwater? The fluke. Match the anchor to the bottom."},{"heading":"Rode and scope","visual":{"k":"dg","f":"scope"},"script":"The anchor is only half the system. The other half is the rode, everything between the anchor and the boat. Look at the diagram. Most small boats use a length of chain at the anchor, then nylon line. The chain keeps the pull low, along the bottom, and stands up to rocks and shells. The nylon stretches and absorbs the shock. Now the word that matters most: scope. It’s the ratio of the rode you let out, to the distance from your bow down to the bottom. Not just the water depth. The depth, plus the height of your bow above the water. Five to one is the minimum. Seven to one is better, and more in heavy weather. So try one. Fifteen feet of water, and your bow is three feet up. How much rode for seven to one? [pause] Eighteen feet, times seven. One hundred twenty-six feet."},{"heading":"Setting the anchor","visual":{"k":"script","lines":["Choose a spot with good bottom, shelter and room to swing","Head slowly into the wind or current and stop","Lower the anchor to the bottom; never throw it","Drift or back slowly while paying out scope","Set it with gentle reverse; take bearings or set a GPS anchor alarm"],"fig":{"t":"tiles","items":[["wind","Head into wind or current, and stop"],["anchor","Lower it. Never throw it"],["down","Back slowly, paying out scope"],["target","Set it, then take bearings"]]}},"script":"Now let’s set it. Do it the same way every time. [+] Choose your spot: good holding bottom, shelter from the wind you expect, and room to swing a full circle without hitting anything. [+] Head slowly into the wind or current, whichever is stronger, and stop over the spot. [+] Lower the anchor to the bottom. Never throw it. Why not? [pause] A thrown anchor lands in a pile of its own rode and fouls itself. [+] Let the boat drift back, or back down slowly, as you pay out your scope. [+] Then snub the line, let the anchor bite, and set it with gentle reverse. And you’re still not finished. Take bearings on two landmarks, or set a GPS anchor alarm. That’s how you’ll know if she starts to move."},{"heading":"Dragging and fouled anchors","visual":{"k":"points","items":["Signs of dragging: bearings change, the rode jerks, the boat lies differently","Let out more scope, or pick up and re-anchor","Always anchor from the bow, never the stern","A trip line on the crown frees a fouled anchor","Keep an anchor watch in changing weather"],"fig":{"t":"rows","items":[["compass","Bearings change","You’re dragging"],["anchor","More scope, or re-anchor",""],["no","Never from the stern","Always anchor from the bow"],["rope","Trip line on the crown","Frees a fouled anchor"]]}},"script":"How do you know your anchor is dragging? [+] Three signs. Your bearings or your GPS position keep changing. The rode jerks or vibrates in your hand. Or your boat lies at a different angle than the boats around you. [+] The cure is more scope, or pick up and anchor again. [+] Now the rule that has killed people who ignored it. Always anchor from the bow. Never from the stern. Why? [pause] Your transom is low and square. Anchored by the stern, the waves break straight over it, and a small boat can be swamped in minutes. [+] If your anchor hooks under a rock or a ledge, a trip line tied to its crown lets you pull it out backward. [+] And when the weather is changing, somebody stays up and keeps an anchor watch."},{"heading":"Where not to anchor","visual":{"k":"points","items":["Not in channels, cable areas or restricted areas","Show an anchor light at night and a ball by day","Florida Keys sanctuary: never on coral; use mooring buoys","Avoid seagrass where possible","Leave swing room for other boats"],"fig":{"t":"tiles","items":[["no","Not in channels or cable areas"],["shapes:ball","Ball by day, anchor light at night"],["warn","Never on coral: use mooring buoys"],["boat","Leave swing room for others"]]}},"script":"Finally, where not to anchor. [+] Not in navigation channels, cable or pipeline areas, or restricted areas, and not where you block other traffic. [+] At night show your anchor light, and by day a black ball. That’s Rule thirty, which you already know. [+] In the Florida Keys National Marine Sanctuary, anchoring on coral is prohibited. So what do you do at a popular reef? [pause] Pick up one of the mooring buoys. That’s what they’re there for. [+] Stay off seagrass where you can. [+] And leave room for the other boats to swing when the wind or tide turns. Everyone swings, but not everyone swings the same way. That’s lesson nine. Match the anchor to the bottom. Scope is seven to one, measured from the bow. Lower it, don’t throw it. And always from the bow. Next time: heavy weather, inlets and trouble."}]},{"id":"deck-10","module":"D","title":"Heavy weather, inlets, towing and groundings","status":"draft-unverified","slides":[{"heading":"Preparing for heavy weather","visual":{"k":"points","items":["Check the forecast; when in doubt, don’t go","Life jackets on everyone in rough conditions","Secure loose gear and close hatches","Slow down; take head seas at a slight angle","Keep passengers seated, low and centered"],"fig":{"t":"td","els":[["p","M20,70 q26,-16 52,0 t52,0 t52,0 t52,0 t52,0 t52,0 t52,0 M20,120 q26,-16 52,0 t52,0 t52,0 t52,0 t52,0 t52,0 t52,0 M20,170 q26,-16 52,0 t52,0 t52,0 t52,0 t52,0 t52,0 t52,0","s-magst",2.8],["h",220,260,22,"s-ink",1.9],["t",220,340,"Take head seas at a slight angle","middle",16,"s-mag"],["m",220,364,"Slow down. Everyone seated, low and centered"]]}},"script":"Every Florida captain eventually meets a day that turned out worse than the forecast. This lesson is about that day. [+] The best heavy-weather tactic is not to be out in it. Check the forecast, and when in doubt, don’t go. No fish is worth it, and neither is a refund. [+] If the weather catches you anyway, life jackets go on everyone. Before it’s rough, not during. [+] Secure the loose gear, and close the hatches and doors. [+] Slow down. Pounding into head seas at speed hurts people and breaks boats. So how do you take them? [pause] At a slight angle off the bow, at a speed that lets her ride up and over each wave. [+] And keep your passengers seated, low, and near the middle of the boat. That’s where the motion is least."},{"heading":"Inlets","visual":{"k":"points","items":["Inlets are where charter boats most often get into trouble","Strong ebb against an onshore wind builds breaking seas","Watch several sets before you commit","Running in: ride the back of a wave; don’t surf down the face","Wait for a better tide if you need to"],"fig":{"t":"td","els":[["r",0,200,150,200,"s-land"],["r",290,200,150,200,"s-land"],["r",150,170,14,150,"s-mut"],["r",276,170,14,150,"s-mut"],["a","M220,30 V110","s-st"],["m",232,60,"Onshore wind","start"],["a","M220,340 V214"],["m",220,366,"Ebb current"],["raw","\u003cpath d='M160,140 q15,-12 30,0 t30,0 t30,0 t30,0 M160,166 q15,-12 30,0 t30,0 t30,0 t30,0' stroke='#d93025' stroke-width='3' fill='none'/>"],["t",370,150,"Breaking","middle",15,"s-mag"],["t",370,168,"seas","middle",15,"s-mag"]]}},"script":"Now the most dangerous half mile of your whole trip: the inlet. [+] Florida’s inlets are where charter boats most often get into trouble. [+] The worst conditions come from one combination. A strong ebb current running out, against an onshore wind or swell coming in. What does that do to the waves? [pause] It stands them up and makes them break, right in the entrance. [+] So before you commit, stand off and watch several sets, until you understand the pattern. [+] Coming in, put the boat on the back of a wave, match its speed, and stay there. Don’t run down the face, where you can broach. [+] And if it looks bad, wait. Wait for slack water, wait for the flood, or use a different inlet. Coming home a little late beats not coming home."},{"heading":"Towing a disabled boat","visual":{"k":"dg","f":"towing"},"script":"Sooner or later someone will wave you down and ask for a tow. You’re allowed to help, but do it properly. Look at the diagram. Make the towline fast to strong points, with a bridle that spreads the load between two cleats. Not one small cleat, and never a rail. Use a long towline with a sag in it. The sag works like a spring and takes up the shock. Keep the speed low, well below planing. Keep everyone clear of the line. Remember snap-back from lesson eight? And keep a knife where you can reach it, to cut free in an emergency. [pause] Now the judgment call. In serious conditions, is towing always the right thing to do? No. Often the wiser move is to stand by, keep them company, and call a professional towing service or the Coast Guard."},{"heading":"Running aground","visual":{"k":"script","lines":["Stop the engine; check everyone for injuries","Check for leaks and damage before trying to move","Don’t back hard: you can suck sand into the cooling system or open a hole","Shift weight, kedge off with an anchor, or wait for the rising tide","An unintended grounding is a reportable marine casualty"],"fig":{"t":"tiles","items":[["engine","Stop the engine. Check for injuries"],["eye","Check for leaks before moving"],["no","Don’t back hard"],["tide","Shift weight, kedge off, or wait for the tide"]]}},"script":"Running aground. In Florida’s shallow water, there are captains who’ve done it, and captains who will. Here’s the drill. [+] Stop the engine, and check everyone for injuries. A sudden stop throws people. [+] Before you try to move, check the bilge and the hull for leaks and damage. Why first? [pause] Because if she’s holed, the shoal is holding you up. Back off into deep water, and you sink. [+] Don’t just back down hard. You’ll pull sand and mud into the cooling system, and you can make a small hole bigger. [+] Instead, shift weight. Or carry an anchor out to deeper water and pull yourself off. That’s called kedging. Or simply wait for the rising tide. [+] And remember the paperwork. An unintended grounding of a commercial vessel is a reportable marine casualty."},{"heading":"After a collision","visual":{"k":"points","items":["Check passengers and crew for injuries first","Assess damage and flooding on your boat","Render assistance to the other vessel’s people","Exchange names, vessel information and registration","Report it as required"],"fig":{"t":"steps","items":["Check everyone for injuries","Assess damage and flooding","Help the other vessel’s people","Exchange names and vessel information","Report it as required"]}},"script":"And the worst one: a collision. The order matters, so learn it as a list. [+] First, people. Check your passengers and crew for injuries. [+] Second, your boat. Check for damage and flooding. [+] Third, the other vessel. Federal law requires you to render assistance to the people affected, as far as you can without serious danger to your own vessel. [+] Fourth, exchange information: names, addresses, and vessel identification. Never leave the scene without doing that. [+] And fifth, report it as required. For you, that’s the Coast Guard, as a commercial marine casualty. [pause] That’s lesson ten. When in doubt, don’t go. Ebb against an onshore wind is the dangerous inlet. Tow with a bridle and a long line. Aground: check for leaks before you move. And after a collision, people first. Next time: the emergency you practice for and hope never to have, man overboard."}]},{"id":"deck-11","module":"D","title":"Man overboard and abandoning ship","status":"draft-unverified","slides":[{"heading":"The first seconds","visual":{"k":"points","items":["Shout “Man overboard!” and point, and keep pointing","Throw flotation right away","Press MOB on the GPS","Turn toward the side they fell from to swing the props away","Assign one spotter who never looks away"],"fig":{"t":"tiles","items":[["person","Shout, point, and keep pointing"],["ring","Throw flotation right away"],["txt:MOB","Press MOB on the GPS"],["turn","Turn toward the side they fell from"]]}},"script":"A passenger leans over the rail to see a fish, the boat lurches, and he’s gone. What you do in the next ten seconds decides how this ends. So let’s make it automatic. [+] Shout man overboard, point at him, and keep pointing. [+] Throw flotation right now. A ring buoy, a cushion, anything that floats. It gives him something to hold, and it marks the spot. [+] Hit the man overboard button on the GPS. [+] Turn the boat toward the side he fell from. Why toward him? [pause] Because turning toward him swings your stern, and your propellers, away from him. [+] And give one person a single job: eyes and arm on the man in the water, and never look away. A head in the waves disappears in seconds, and once you’ve lost sight of him, you may not find him again."},{"heading":"The Williamson turn","visual":{"k":"dg","f":"williamson"},"script":"Now you have to get back to him. There are several recovery turns, and the one the exam asks about is the Williamson turn. Look at the diagram. Its whole purpose is to bring you back down your own track, so it’s the right turn at night, or any time you’ve lost sight of the person. Here’s how it goes. One: rudder hard over, toward the side he fell from. Two: when you’re about sixty degrees off your original course, shift the rudder hard over the other way. Three: steady up on the reciprocal of your original course. Now you’re running back down your own wake, toward him. [pause] So when wouldn’t you use it? When he’s in sight and close. Then a quicker single turn, like the Anderson turn, gets you back faster. Williamson when you’ve lost him. A simple turn when you can see him."},{"heading":"Getting them back aboard","visual":{"k":"points","items":["Approach slowly, heading into the wind or sea","Put the engine in neutral close to the person","Recover over the side, never near the propeller","Use a ladder, sling or parbuckle","Treat for hypothermia and shock; get medical help"],"fig":{"t":"td","els":[["a","M220,30 V100","s-st"],["m",232,60,"Wind or sea","start"],["raw","\u003ccircle cx='254' cy='176' r='9' fill='#e8762b'/>\u003cpath d='M240,190 q14,-8 28,0' stroke='#e8762b' stroke-width='3' fill='none'/>"],["h",214,262,0,"s-ink",1.7],["t",220,330,"Approach slowly, into the wind or sea","middle",15,"s-mag"],["m",220,352,"Neutral when close. Recover over the side,"],["m",220,370,"never near the propeller"]]}},"script":"You’re back alongside. Getting him aboard is the hardest part. [+] Approach slowly, heading into the wind or sea if you can, so you can stop next to him under control. [+] Go to neutral well before you reach him. [+] Bring him aboard over the side. Never at the stern. Why not the stern, where the swim platform is? [pause] Because that’s where the propeller is. And never back down on a person in the water. [+] Use a boarding ladder, a sling, or a parbuckle rigged from a line or a net. A cold, tired, frightened person can’t climb, so plan on lifting him. [+] And once he’s aboard, you’re not finished. Treat him for hypothermia and shock, and get medical help. People have survived the water and died an hour later on deck."},{"heading":"Surviving in the water","visual":{"k":"points","items":["A life jacket is the difference between living and drowning","1-10-1: 1 minute of cold shock, 10 of useful movement, 1 hour to unconsciousness","HELP: knees to chest, arms crossed, if alone","Huddle together in a group","Stay with the boat if it floats; don’t swim for distant shore"],"fig":{"t":"rows","items":[["num:1","1 minute","Cold shock: control your breathing"],["num:10","10 minutes","Of useful movement"],["num:1","1 hour","Before unconsciousness"],["vest","Life jacket","The difference between living and drowning"]]}},"script":"What if it’s you in the water? Here’s what keeps you alive. [+] First, a life jacket. It’s the difference between living and drowning, and you can’t put one on after you’ve gone in. [+] Second, a rule called one, ten, one. One minute of cold shock, when you gasp and can’t control your breathing. Ten minutes of useful movement, before your muscles quit. And about one hour before hypothermia makes you unconscious. What does that tell you to do in the first minute? [pause] Nothing. Just float and get your breathing back. Florida’s water is warmer, which buys time, but not unlimited time. [+] If you’re alone, take the HELP position: knees to your chest, arms crossed. [+] In a group, huddle together. [+] And stay with the boat if it floats. Don’t swim for a distant shore. It’s always farther than it looks."},{"heading":"Abandoning ship","visual":{"k":"points","items":["Only when the boat is clearly lost","First: Mayday, DSC alert and EPIRB","Life jackets on; take a grab bag with radio, beacon and water","Step up into a life raft, not down","Stay together and near the boat’s last position"],"fig":{"t":"steps","items":["Mayday, DSC alert and EPIRB","Life jackets on; take the grab bag","Step UP into the life raft","Stay together, near the boat"]}},"script":"The last decision is the biggest: leaving the boat. [+] Abandon her only when she’s clearly lost. Even a swamped, capsized boat is far easier for a helicopter to find than a head in the water. [+] Before you go, call for help every way you have: Mayday by voice, the DSC distress button, and the EPIRB. [+] Life jackets on everyone, and take the grab bag: handheld radio, personal locator beacon, flares, water, medications. [+] There’s an old saying: step up into the life raft. What does it mean? [pause] Leave only when the boat is sinking out from under you. If you have to climb down into the raft, it’s too soon. [+] And stay together, near the boat’s last position. That’s where the search will start. That’s lesson eleven. Shout, point, throw. Williamson: sixty degrees, then reverse the rudder. Recover over the side. One, ten, one. And step up into the raft. Next time: calling for help."}]},{"id":"deck-12","module":"D","title":"Distress communications and rescue","status":"draft-unverified","slides":[{"heading":"Mayday, pan-pan, securité","visual":{"k":"script","lines":["Channel 16, or the DSC distress button first","“Mayday, Mayday, Mayday”","“This is Reel Time, Reel Time, Reel Time”","Position, nature of distress, help needed","Number aboard, boat description, then listen"],"fig":{"t":"big","ic":"radio","v":"MAYDAY ×3","cap":"Channel 16, or the red DSC button first","sub":"Then: who you are, where you are, what’s wrong, how many aboard"}},"script":"When things go wrong offshore, the radio is the most important tool on the boat, and most people have never practiced using it for real. There are three levels of urgent call. Mayday means grave and imminent danger to life or to the vessel: sinking, fire, a man overboard. Pan-pan means it’s urgent, but nobody’s life is in immediate danger. A dead engine, drifting offshore. And securité is a safety message, like a hazard to navigation. Now the Mayday itself. Follow the script on screen. [+] Channel sixteen. Or press the red DSC button first. [+] Say Mayday, three times. [+] Then, this is, and your boat’s name, three times. [+] Your position, what’s wrong, and what help you need. Why position first? [pause] If the radio dies ten seconds in, they still know where to look. [+] Then how many people are aboard, and a description of the boat. And then stop talking, and listen."},{"heading":"DSC and beacons","visual":{"k":"points","items":["DSC red button: sends MMSI and position on channel 70","Then follow up by voice on channel 16","EPIRB: 406 MHz, registered with NOAA; float-free or manual","PLB: a personal beacon worn by a person","Keep registrations and batteries current"],"fig":{"t":"rows","items":[["txt:DSC","Red distress button","Sends MMSI and position on channel 70"],["epirb","EPIRB","406 MHz, registered with NOAA"],["person","PLB","A personal beacon you wear"]]}},"script":"Modern equipment can call for help faster than you can talk. [+] A VHF radio with digital selective calling has a red distress button. Press it, and it sends an automatic alert, with your MMSI number and your GPS position, on channel seventy. [+] Then follow up by voice on channel sixteen. Here’s the catch. That button only sends your position if the radio is connected to a GPS, and it only identifies you if you registered an MMSI. Have you done both? [pause] Check tonight. [+] An EPIRB sends a distress signal on four hundred six megahertz to satellites, which pass your identity and position to the rescuers. It must be registered with NOAA. [+] A personal locator beacon does the same thing for one person, and you wear it. [+] And keep all of it current: the registrations, the batteries, and the hydrostatic release."},{"heading":"Radio procedures","visual":{"k":"points","items":["Use the phonetic alphabet: Alfa, Bravo, Charlie…","“Over” invites a reply; “Out” ends the call","Radio checks on a working channel or automated service, not 16","Call on 16 or 9, then move to a working channel","A false distress call is a federal crime"],"fig":{"t":"rows","items":[["txt:ABC","Phonetic alphabet","Alfa, Bravo, Charlie"],["radio","“Over” and “Out”","Over invites a reply. Out ends the call"],["txt:16","Call, then move","Shift to a working channel"],["warn","False distress call","A federal crime"]]}},"script":"Good radio habits make you sound like a professional, and more important, they make you understood. [+] Use the phonetic alphabet to spell things out. Alfa, Bravo, Charlie, Delta. On a crackling radio, B and D and E all sound alike. [+] Say over when you want a reply. Say out when the conversation is finished. And over and out together? [pause] It makes no sense. It means, reply to me, I’m finished. [+] Radio checks go on a working channel, or an automated radio-check service. Never on sixteen. [+] Make your first call on sixteen or nine, then move to a working channel to talk. Sixteen is for calling and for distress, not for chatting about the bite. [+] And never make a false distress call. It’s a federal crime, and it can cost you fines, prison, and the bill for the search."},{"heading":"Working with rescuers","visual":{"k":"points","items":["Follow the rescuers’ instructions exactly","Secure loose gear and canvas before a helicopter arrives","Let the basket or hook touch the water or deck first to discharge static","Never tie the hoist cable to the boat","Keep life jackets on and a light or flare ready"],"fig":{"t":"td","els":[["raw","\u003cellipse cx='200' cy='80' rx='48' ry='20' class='s-ink'/>\u003cpath d='M124,56 H276' class='s-st' stroke-width='4'/>\u003cpath d='M200,60 V56' class='s-st' stroke-width='4'/>\u003cpath d='M244,76 L318,66 V54' class='s-st' stroke-width='5'/>\u003cline x1='200' y1='100' x2='200' y2='236' class='s-st' stroke-width='2'/>\u003crect x='185' y='236' width='30' height='24' fill='none' style='stroke:var(--mag);stroke-width:3'/>"],["p","M10,262 H430","s-magst",2.5],["i","boat",336,248,1.7],["t",220,312,"Let the basket touch down first","middle",16,"s-mag"],["m",220,336,"It discharges static"],["m",220,360,"Never tie the hoist cable to the boat"]]}},"script":"Help is on the way. Now your job is to make the rescue easy. [+] Follow the rescuers’ instructions exactly. They may ask you to hold a particular course and speed. Do it, even if it seems odd. [+] Before a helicopter arrives, secure everything loose: gear, canvas, antennas. The rotor wash is like a hurricane. [+] When they lower the basket or the hook, don’t reach for it. Let it touch the water or the deck first. Why? [pause] A hovering helicopter builds up a powerful static charge, and it goes to ground through the first thing the cable touches. Don’t let that be you. [+] Never tie the hoist cable to your boat. If the helicopter has to move, it must be free. [+] And keep everyone in life jackets, with a light, a flare or a signal mirror ready to show them where you are."},{"heading":"Float plans","visual":{"k":"points","items":["Leave a float plan with a responsible person ashore","Who’s aboard, the boat, your route and return time","What to do, and whom to call, if you’re overdue","Update it if plans change; cancel it when you return"],"fig":{"t":"rows","items":[["people","Who’s aboard",""],["chart","Your route",""],["clock","Your return time",""],["radio","Whom to call if you’re overdue",""]]}},"script":"The cheapest piece of safety equipment you own costs nothing, and it stays ashore. It’s a float plan. Think about it. If you don’t come home tonight, who knows? And where would they tell the Coast Guard to look? [pause] A float plan answers both. [+] Leave it with a responsible person: your office, the marina, or family. [+] It says who’s aboard, what the boat looks like, where you’re going, and when you’ll be back. [+] It says what to do, and whom to call, if you’re overdue. [+] And it only works if you keep it honest. Update it when your plans change, and cancel it when you’re back. That’s lesson twelve. Mayday, pan-pan, securité. Position first. Red button, then channel sixteen. Let the basket touch down. And leave a float plan. Next time: first aid, for when the nearest doctor is an hour away."}]},{"id":"deck-13","module":"D","title":"First aid aboard","status":"draft-unverified","slides":[{"heading":"Priorities","visual":{"k":"points","items":["Make sure the scene is safe, then check responsiveness and breathing","Call for help early: VHF 16 or 911","CPR: hard and fast, 100 to 120 compressions a minute, about 2 inches deep","Use an AED if you carry one","Keep in-person CPR and first aid training current"],"fig":{"t":"big","ic":"heart","v":"100–120","cap":"Compressions a minute: hard, fast, about 2 inches deep","sub":"Scene safe, check breathing, call for help early"}},"script":"Twenty miles offshore, you are the ambulance. Help may be an hour away or more. So first aid isn’t optional for a charter captain, and your license requires the training. Here are the priorities, in order. [+] Make sure the scene is safe for you. Then check: does the person respond, and are they breathing normally? [+] Call for help early, on channel sixteen or by phone. The Coast Guard can put a doctor on the radio and arrange an evacuation. Don’t wait to see if it gets better. [+] If they aren’t breathing normally, start CPR. Push hard and fast in the center of the chest: one hundred to one hundred twenty compressions a minute, about two inches deep. How fast is that? [pause] About two a second. Faster than most people expect. [+] Use an AED if you carry one. [+] And keep your hands-on training current. You can’t learn CPR from a slide."},{"heading":"Bleeding and shock","visual":{"k":"points","items":["Firm, direct pressure first","Tourniquet for life-threatening limb bleeding; note the time","Shock: pale, cold, clammy, fast pulse","Lay them flat, keep them warm, raise the legs if uninjured","Nothing to eat or drink if seriously hurt"],"fig":{"t":"steps","items":["Firm, direct pressure","Tourniquet for life-threatening limb bleeding","Note the time","Shock: lay flat, keep warm, raise the legs"]}},"script":"Next, bleeding. Fishing boats are full of knives, hooks and gaffs. [+] For serious bleeding, the first step is always the same: firm, direct pressure on the wound, with a dressing. And keep pressing. Don’t lift it to look. [+] If it’s life-threatening bleeding from an arm or a leg, and pressure won’t stop it, use a tourniquet. High on the limb, tight enough to stop the bleeding, and write down the time. [+] Then watch for shock: a dangerous drop in circulation. What does it look like? [pause] Pale, cold, clammy skin, and a fast, weak pulse. [+] Lay the person flat, keep them warm, and raise the legs if they aren’t injured. [+] And give nothing to eat or drink to someone who’s seriously hurt."},{"heading":"Heat and cold","visual":{"k":"table","head":["Condition","Signs","Treatment"],"rows":[["Heat exhaustion","Pale, cool, sweaty skin; weak; nauseous","Shade, cool down, fluids, rest"],["Heat stroke","Hot skin, confusion, collapse","Emergency: cool aggressively, call for help"],["Hypothermia","Shivering, clumsy, confused","Remove wet clothes, insulate, warm the core gently"],["Sunburn and dehydration","Red skin, headache, thirst","Prevent with shade, sunscreen and water"]],"fig":{"t":"band","items":[["thermo","Heat exhaustion","Cool, sweaty skin: shade, fluids, rest"],["warn","Heat stroke","Hot skin, confusion: emergency"],["wave","Hypothermia","Shivering, clumsy: insulate, warm gently"]]}},"script":"In Florida, the sun injures more charter customers than anything else, so learn to tell these apart. [+] Heat exhaustion: pale, cool, sweaty skin, with weakness and nausea. Get them into shade, cool them, give fluids, and let them rest. [+] Heat stroke is a different animal. Hot skin, confusion, or collapse. So what’s the difference you look for? [pause] The skin and the mind. Cool and sweaty is exhaustion. Hot and confused is stroke, and stroke is an emergency. Cool them hard with water and fanning, and call for help immediately. [+] Hypothermia happens here too, after time in the water. Take off the wet clothes, insulate the person, and warm the core gently. Don’t rub the arms and legs, and no alcohol. [+] And prevention beats all of it: shade, sunscreen, and plenty of water, starting before anyone feels thirsty."},{"heading":"Marine injuries","visual":{"k":"points","items":["Fish hooks: leave one in near the eye or a joint and seek care","Stingray, catfish and lionfish spines: soak in water as hot as tolerable","Jellyfish: rinse with seawater, not fresh water","Cuts from fish, shells and coral: clean well; watch for Vibrio infection","Seasickness: fresh air, watch the horizon, stay on deck"],"fig":{"t":"rows","items":[["fish","Stingray and catfish spines","Soak in water as hot as tolerable"],["wave","Jellyfish","Rinse with seawater, not fresh water"],["aid","Cuts","Clean well. Watch for Vibrio"],["eye","Seasickness","Fresh air; watch the horizon"]]}},"script":"Now the injuries that come with fishing. [+] Fish hooks. Most you can deal with. But a hook in or near the eye, or deep in a joint, stays where it is. Secure it and go in. [+] Venomous spines: stingrays, catfish, lionfish. The pain is fierce. Soak the wound in water as hot as the person can stand without burning. Why hot water? [pause] Heat breaks down the venom. [+] Jellyfish stings. Rinse with seawater, not fresh water. Fresh water fires off the stinging cells that haven’t gone off yet. [+] Cuts from fish, shells and coral. Clean them well. Warm Florida water carries Vibrio bacteria, which can cause a serious infection, especially in people with liver disease or weak immune systems. [+] And seasickness. Keep them on deck, in fresh air, looking at the horizon. Below decks makes it worse."},{"heading":"Burns, fractures and head injuries","visual":{"k":"points","items":["Burns: cool running water for 10 to 20 minutes; cover loosely","Fractures: immobilize as found; check circulation beyond the injury","Head, neck or back injury: don’t move them unless necessary","Eyes: don’t rub; flush with clean water","Record what happened and what you did"],"fig":{"t":"rows","items":[["fuel","Burns","Cool running water, 10 to 20 minutes"],["aid","Fractures","Immobilize as found"],["person","Head, neck or back","Don’t move them unless you must"],["eye","Eyes","Don’t rub. Flush with clean water"]]}},"script":"A few more, and then the habit that protects you afterward. [+] Burns. Cool the area under cool running water for ten to twenty minutes, then cover it loosely with a clean dressing. No ice, no butter, no ointment. [+] A suspected fracture. Immobilize the limb the way you found it, and check the circulation beyond the injury. [+] A possible head, neck or back injury, say from a fall in rough seas. Keep them still, and don’t move them unless they’re in danger where they are. [+] Something in the eye. Don’t rub it. Flush it with clean water. [+] And when it’s over, write it down. What happened, what you saw, what you did, and when. Who needs that? [pause] The medical team, and your casualty report. That’s lesson thirteen. Call early. Direct pressure first. Cool and sweaty, or hot and confused. Hot water for spines, seawater for jellyfish. Next time: keeping the water clean."}]},{"id":"deck-14","module":"D","title":"Pollution prevention","status":"draft-unverified","slides":[{"heading":"Oil","visual":{"k":"points","items":["No discharge that causes a sheen or sludge","Report every spill to the National Response Center","1-800-424-8802","Never use soap or dispersants on a spill","Carry absorbent pads; no oily bilge water overboard"],"fig":{"t":"big","ic":"oil","v":"1-800-424-8802","cap":"National Response Center: report every spill","sub":"No discharge that causes a sheen. Never use soap on a spill"}},"script":"You make your living from clean water, and the law expects you to keep it that way. Start with oil. [+] The Clean Water Act prohibits discharging oil or oily waste in any amount that causes a film or sheen on the water, or sludge beneath it. Any sheen. That’s the test. [+] If a spill happens, report it right away to the National Response Center. [+] The number is one, eight hundred, four two four, eight eight zero two. [+] Now the mistake people make. You see a rainbow sheen behind the boat, and there’s a bottle of dish soap in the galley. Do you squirt it on? [pause] Never. Soap doesn’t remove the oil. It sinks it. And doing that is a violation in its own right. [+] So carry absorbent pads for spills and for the bilge, and never pump oily bilge water overboard."},{"heading":"Placards and plans","visual":{"k":"table","head":["Requirement","Applies to"],"rows":[["Oil discharge placard (5 × 8 in)","Boats 26 ft and over with machinery spaces"],["MARPOL Annex V garbage placard (4 × 9 in)","Boats 26 ft and over"],["Written waste management plan","Ocean-going boats 40 ft and over with a galley and berthing"]],"fig":{"t":"band","items":[["doc","Oil placard","Boats 26 ft and over"],["doc","Garbage placard","Boats 26 ft and over"],["book","Waste plan","Ocean-going, 40 ft and over"]]}},"script":"Next, the signs and paperwork. They’re easy points on the exam, because they’re pure numbers. [+] An oil discharge placard, at least five by eight inches, is required on boats twenty-six feet and over with machinery spaces. It goes in the machinery space, or at the bilge pump control. [+] A garbage placard, at least four by nine inches, is also required at twenty-six feet and over. It goes where your crew and passengers can read it. [+] And a written waste management plan is required on ocean-going boats of forty feet and over that have a galley and berthing. It says how garbage is collected, stored and disposed of, and who’s responsible. [pause] So the numbers to keep are twenty-six feet for the two placards, and forty feet for the plan."},{"heading":"Garbage: MARPOL Annex V","visual":{"k":"table","head":["Garbage","Rule"],"rows":[["Plastics, including fishing line and nets","Never overboard, anywhere"],["Food waste, ground","Only 3 nm or more from land"],["Food waste, not ground","Only 12 nm or more from land"],["Paper, glass, metal and most other garbage","Not overboard; bring it ashore"],["Inland waters and within 3 nm","Nothing overboard"]],"fig":{"t":"band","items":[["trash","Plastics","Never, anywhere"],["txt:3 nm","Ground food","3 nm or more out"],["txt:12 nm","Unground food","12 nm or more out"],["no","Inside 3 nm","Nothing overboard"]]}},"script":"The garbage rules come from an international treaty, MARPOL Annex five. [+] Plastics first. That includes fishing line, nets and bags. Where can you put plastic over the side? [pause] Nowhere. Never, at any distance from land. [+] Food waste is the only thing with a distance attached. If it’s ground up, three nautical miles or more from land. [+] If it isn’t ground, twelve nautical miles or more. [+] Paper, glass, metal and most other garbage don’t go overboard at all. Bring them ashore. [+] And inside three miles, or on inland waters, nothing goes over. Here’s the simple version for a charter boat. Bring everything back to the dock. Put a trash can where your customers can see it, and tell them about it in your safety briefing."},{"heading":"Sewage and marine sanitation devices","visual":{"k":"table","head":["Type","How it works","Discharge"],"rows":[["Type I","Flow-through treatment","Treated effluent, outside no-discharge zones; boats 65 ft and under"],["Type II","Higher-level treatment","Treated effluent, outside no-discharge zones"],["Type III","Holding tank","Pump out ashore, or untreated only beyond 3 nm"],["No-discharge zones","Florida Keys and other areas","No sewage at all, treated or not"]],"fig":{"t":"band","items":[["txt:I","Type I","Flow-through treatment"],["txt:II","Type II","Higher-level treatment"],["txt:III","Type III","Holding tank"]]}},"script":"Now sewage. If your boat has an installed toilet, she needs a Coast Guard certified marine sanitation device, and there are three types. [+] Type one is a flow-through device that treats the sewage. The treated effluent can be discharged, outside no-discharge zones. It’s limited to boats sixty-five feet and under. [+] Type two treats to a higher standard. Same rule: treated effluent, outside no-discharge zones. [+] Type three is a holding tank. You empty it at a pump-out station, or discharge it untreated only more than three miles offshore. [+] And then there are no-discharge zones, which include the whole Florida Keys sanctuary. What can you discharge there? [pause] Nothing. Treated or not. And the Y-valve has to be secured closed."},{"heading":"Protecting Florida’s waters","visual":{"k":"points","items":["Manatee zones: obey idle-speed and slow-speed signs","Seagrass: don’t prop-scar; it’s illegal in many areas","Florida Keys sanctuary rules on anchoring, fishing and discharges","Recycle fishing line: it kills birds, turtles and dolphins","Report spills, injured wildlife and violations: FWC 888-404-3922"],"fig":{"t":"tiles","items":[["gauge","Manatee zones: idle or slow speed"],["prop","Don’t prop-scar seagrass"],["rope","Recycle fishing line"],["radio","Report: FWC 888-404-3922"]]}},"script":"Last, the rules that are particular to Florida, and to the animals your customers came to see. [+] Manatee zones. Obey the idle-speed and slow-speed signs, and watch for manatees and sea turtles, especially in shallow water. [+] Seagrass. Running across a flat and cutting a prop scar destroys the nursery your fishery depends on, and it’s illegal in many areas. [+] If you work the Keys, know the sanctuary’s rules on anchoring, fishing and discharges. [+] Collect your used fishing line and recycle it. Loose line kills birds, turtles and dolphins. [+] And report spills, injured wildlife and violations to the Fish and Wildlife Conservation Commission, at eight eight eight, four zero four, three nine two two. [pause] That’s lesson fourteen. No sheen, no soap, call the National Response Center. Plastic never. Food at three and twelve miles. Type three is a holding tank. Next time, our last Deck lesson: reports, bridges and running a professional operation."}]},{"id":"deck-15","module":"D","title":"Casualty reports and other rules","status":"draft-unverified","slides":[{"heading":"Reportable marine casualties","visual":{"k":"points","items":["An unintended grounding, or striking a bridge","Loss of propulsion, steering or control that reduces maneuverability","Anything affecting seaworthiness, such as fire or flooding","A death, or an injury needing treatment beyond first aid","Property damage over $75,000, or significant harm to the environment"],"fig":{"t":"tiles","items":[["anchor","Unintended grounding"],["engine","Loss of propulsion or steering"],["ext","Fire or flooding"],["aid","Death, or injury beyond first aid"],["money",
