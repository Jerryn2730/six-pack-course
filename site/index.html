cean-going boats:","options":["40 ft and over with a galley and berthing","26 ft and over","Only over 100 GT","Of any size"],"explanation":"MARPOL Annex V requirement."},{"id":"D22","module":"D","text":"A marine casualty report on Form CG-2692 must be filed within:","options":["5 days","24 hours","30 days","90 days"],"explanation":"Notify the Coast Guard immediately; the written form follows within 5 days."},{"id":"D23","module":"D","text":"Nylon line is often chosen for anchor rode because it:","options":["Stretches and absorbs shock","Floats","Doesn’t stretch at all","Resists UV best"],"explanation":"Polyester stretches less; polypropylene floats."},{"id":"D24","module":"D","text":"A boat with a quick, snappy roll is described as:","options":["Stiff, with a large GM","Tender, with a small GM","Unstable","Down by the head"],"explanation":"A slow, lazy roll means low stability (tender)."},{"id":"P1","module":"P","text":"How long to run 18 nm at 12 knots?","options":["90 minutes","60 minutes","75 minutes","108 minutes"],"explanation":"T = 60 × 18 ÷ 12 = 90 minutes."},{"id":"P2","module":"P","text":"Compass course 135°, deviation 3°E, variation 7°W. What is the true course?","options":["131°","139°","145°","125°"],"explanation":"135 + 3 = 138° M. 138 − 7 = 131° T."},{"id":"P3","module":"P","text":"On a chart, distance is measured on the:","options":["Latitude scale","Longitude scale","Compass rose","Title block"],"explanation":"1 minute of latitude = 1 nautical mile."},{"id":"P4","module":"P","text":"At 20 knots for 24 minutes you cover:","options":["8 nm","6 nm","10 nm","12 nm"],"explanation":"D = 20 × 24 ÷ 60 = 8 nm."},{"id":"P5","module":"P","text":"One minute of latitude equals:","options":["1 nautical mile","1 statute mile","1 kilometer","6,000 ft exactly"],"explanation":"A nautical mile is about 6,076 ft."},{"id":"P6","module":"P","text":"True course 090°, variation 6°W, deviation 2°W. What compass course do you steer?","options":["098°","082°","086°","094°"],"explanation":"Uncorrecting, add west: 090 + 6 = 096° M; 096 + 2 = 098° C."},{"id":"P7","module":"P","text":"You ran 15 nm in 50 minutes. What was your speed?","options":["18 knots","12 knots","15 knots","20 knots"],"explanation":"S = 60 × 15 ÷ 50 = 18 knots."},{"id":"P8","module":"P","text":"After 3 hours, your fix is 4.5 nm at 180°T from your DR position. What are the set and drift?","options":["Set 180°T, drift 1.5 knots","Set 000°T, drift 1.5 knots","Set 180°T, drift 4.5 knots","Set 360°T, drift 3 knots"],"explanation":"Set is measured from DR to fix. Drift = 4.5 ÷ 3."},{"id":"P9","module":"P","text":"Running 42 nm out at 14 knots, burning 18 gal/hr. By the rule of thirds, how much fuel do you carry?","options":["162 gallons","54 gallons","108 gallons","126 gallons"],"explanation":"3 hours × 18 = 54 gal one way. One-third out, one-third back, one-third reserve: 162."},{"id":"P10","module":"P","text":"A light bears 45° off your bow at 1010 and is abeam at 1025. At 12 knots, how far off is it when abeam?","options":["3 nm","1.5 nm","6 nm","12 nm"],"explanation":"Bow-and-beam bearing: distance run (15 min at 12 kn = 3 nm) equals distance off."},{"id":"P11","module":"P","text":"Chart variation is 5°30′W (2020), decreasing 6′ per year. What do you use in 2026?","options":["About 4°54′W","About 6°06′W","5°30′W","About 5°24′W"],"explanation":"6 years × 6′ = 36′ decrease."},{"id":"P12","module":"P","text":"On a plot, a dead reckoning position is marked with:","options":["A half circle","A full circle","A triangle","A square"],"explanation":"A fix is a full circle; an estimated position is often a square."},{"id":"P13","module":"P","text":"For the most accurate two-bearing fix, the bearing lines should cross at about:","options":["60° to 90°","5° to 15°","150° to 180°","Any angle"],"explanation":"Shallow crossing angles magnify small bearing errors."},{"id":"R37","module":"R","text":"(INLAND) The Inland Navigation Rules apply to:","options":["All vessels on the inland waters of the United States","Only U.S.-flag vessels","Only vessels over 12 m","Only commercial vessels"],"explanation":"Inland Rule 1. They also apply to U.S. vessels on Canadian Great Lakes waters where they don’t conflict with Canadian law.","lessonTag":"rules-01"},{"id":"R38","module":"R","text":"On a chart, the boundary between Inland and International waters is the:","options":["COLREGS demarcation line","3-mile line","Territorial sea baseline","Intracoastal Waterway"],"explanation":"Demarcation lines are printed as dashed magenta lines and listed in 33 CFR Part 80.","lessonTag":"rules-01"},{"id":"R39","module":"R","text":"(BOTH) Rule 2 permits departure from the rules when:","options":["Necessary to avoid immediate danger","The other vessel is smaller","You are the stand-on vessel","Traffic is light"],"explanation":"Rule 2(b).","lessonTag":"rules-01"},{"id":"R40","module":"R","text":"(BOTH) Distress signals are described in:","options":["Annex IV","Annex I","Annex II","Annex III"],"explanation":"Annex IV lists the distress signals referred to in Rule 37.","lessonTag":"rules-01"},{"id":"R41","module":"R","text":"(BOTH) Additional signals for fishing vessels fishing in close proximity are in:","options":["Annex II","Annex I","Annex III","Annex IV"],"explanation":"Annex II covers trawlers shooting and hauling nets, nets fast on obstructions, and purse seiners.","lessonTag":"rules-01"},{"id":"R42","module":"R","text":"(BOTH) Special rules made by a local authority for a harbor or river must:","options":["Conform as closely as possible to the Navigation Rules","Override the Navigation Rules entirely","Apply only at night","Be approved by every vessel owner"],"explanation":"Rule 1(b).","lessonTag":"rules-01"},{"id":"R43","module":"R","text":"(BOTH) A vessel of special construction that can’t fully comply with the light rules shall:","options":["Comply as closely as possible, as her government determines","Show no lights","Show only an anchor light","Stay in port at night"],"explanation":"Rule 1(e). Inland, this is a certificate of alternative compliance.","lessonTag":"rules-01"},{"id":"R44","module":"R","text":"(BOTH) Under Rule 2, being the stand-on vessel:","options":["Doesn’t excuse you from acting to avoid collision","Lets you hold course in every situation","Means the other vessel is always at fault","Applies only on inland waters"],"explanation":"Nothing in the rules excuses neglect of ordinary seamanship.","lessonTag":"rules-01"},{"id":"R45","module":"R","text":"(BOTH) A sailboat with sails up and engine running is a:","options":["Power-driven vessel","Sailing vessel","Vessel restricted in her ability to maneuver","Vessel not under command"],"explanation":"A sailing vessel is under sail with propelling machinery, if fitted, not being used.","lessonTag":"rules-02"},{"id":"R46","module":"R","text":"(BOTH) A charter boat trolling lines is:","options":["A power-driven vessel, not “engaged in fishing”","A vessel engaged in fishing","A vessel restricted in her ability to maneuver","A vessel not under command"],"explanation":"Trolling lines don’t restrict maneuverability.","lessonTag":"rules-02"},{"id":"R47","module":"R","text":"(BOTH) A vessel is “underway” when she is not:","options":["At anchor, made fast to the shore, or aground","Moving through the water","Using her engine","Under command"],"explanation":"Rule 3(i). A drifting vessel is underway.","lessonTag":"rules-02"},{"id":"R48","module":"R","text":"(BOTH) A boat drifting with her engine off is:","options":["Underway but not making way","At anchor","Not underway","Making way"],"explanation":"She isn’t anchored, made fast or aground, but isn’t moving through the water under her own power.","lessonTag":"rules-02"},{"id":"R49","module":"R","text":"(BOTH) A vessel whose steering has failed is:","options":["Not under command","Restricted in her ability to maneuver","Constrained by her draft","Engaged in fishing"],"explanation":"An exceptional circumstance, not the nature of her work.","lessonTag":"rules-02"},{"id":"R50","module":"R","text":"(BOTH) A dredge working in a channel is:","options":["Restricted in her ability to maneuver","Not under command","Constrained by her draft","A power-driven vessel with no special status"],"explanation":"Dredging is listed in the definition of RAM.","lessonTag":"rules-02"},{"id":"R51","module":"R","text":"The category “constrained by her draft” exists:","options":["Only under International rules","Under both rule sets","Only under Inland rules","Only on the Western Rivers"],"explanation":"Inland rules have no constrained-by-draft category.","lessonTag":"rules-02"},{"id":"R52","module":"R","text":"(BOTH) Vessels are “in sight of one another” only when:","options":["One can be observed visually from the other","Each appears on the other’s radar","They are within 2 nautical miles","They can talk on VHF"],"explanation":"Rule 3(k).","lessonTag":"rules-02"},{"id":"R53","module":"R","text":"(BOTH) Which is NOT restricted visibility?","options":["Darkness on a clear night","Fog","A heavy rainstorm","Falling snow"],"explanation":"Restricted visibility comes from fog, mist, snow, heavy rain, sandstorms and similar causes.","lessonTag":"rules-02"},{"id":"R54","module":"R","text":"(BOTH) A vessel engaged in diving operations is classed as:","options":["Restricted in her ability to maneuver","Not under command","Engaged in fishing","Constrained by her draft"],"explanation":"Underwater operations are listed in the definition of RAM.","lessonTag":"rules-02"},{"id":"R55","module":"R","text":"(BOTH) Rules 4 through 10 apply:","options":["In any condition of visibility","Only in clear weather","Only in restricted visibility","Only at night"],"explanation":"Section I of the steering rules.","lessonTag":"rules-03"},{"id":"R56","module":"R","text":"(BOTH) A proper lookout must be kept:","options":["At all times","Only at night","Only in restricted visibility","Only when making way"],"explanation":"Rule 5.","lessonTag":"rules-03"},{"id":"R57","module":"R","text":"(BOTH) Safe speed is determined by:","options":["Conditions such as visibility, traffic and your vessel’s maneuverability","A posted speed limit only","Engine horsepower","The time of day"],"explanation":"Rule 6 lists factors, not a number.","lessonTag":"rules-03"},{"id":"R58","module":"R","text":"(BOTH) For vessels with operational radar, which is a safe-speed factor?","options":["The possibility that small vessels may not be detected at adequate range","The radar’s brand","The color of the radar display","How long you’ve owned the radar"],"explanation":"Rule 6(b).","lessonTag":"rules-03"},{"id":"R59","module":"R","text":"(BOTH) Assumptions shall not be made on the basis of:","options":["Scanty information, especially scanty radar information","Compass bearings","Radar plotting","Visual observation"],"explanation":"Rule 7(c).","lessonTag":"rules-03"},{"id":"R60","module":"R","text":"(BOTH) Risk of collision may exist even with an appreciable bearing change when approaching:","options":["A very large vessel, a tow, or any vessel at close range","A sailing vessel","Any vessel in daylight","A vessel at anchor"],"explanation":"Rule 7(d).","lessonTag":"rules-03"},{"id":"R61","module":"R","text":"(BOTH) An alteration of course alone may be the most effective action if it:","options":["Is made in good time, is substantial, and doesn’t create another close-quarters situation","Is small and gradual","Is made at the last moment","Follows five short blasts"],"explanation":"Rule 8(c).","lessonTag":"rules-03"},{"id":"R62","module":"R","text":"(BOTH) To avoid collision or gain time to assess the situation, a vessel shall if necessary:","options":["Slacken her speed or take all way off","Increase speed","Sound the bend signal","Anchor immediately"],"explanation":"Rule 8(e).","lessonTag":"rules-03"},{"id":"R63","module":"R","text":"(BOTH) A vessel required not to impede another shall:","options":["Take early action to leave sea room for the other’s safe passage","Stand on until the last moment","Sound the danger signal and hold course","Turn to port"],"explanation":"Rule 8(f).","lessonTag":"rules-03"},{"id":"R64","module":"R","text":"(BOTH) In a narrow channel, a vessel shall keep:","options":["As near the outer limit on her starboard side as is safe and practicable","In the center of the channel","On the port side of the channel","Wherever the water is deepest"],"explanation":"Rule 9(a).","lessonTag":"rules-04"},{"id":"R65","module":"R","text":"(BOTH) A sailing vessel in a narrow channel shall not:","options":["Impede a vessel that can safely navigate only within the channel","Tack","Use her engine","Show a tricolor light"],"explanation":"Rule 9(b).","lessonTag":"rules-04"},{"id":"R66","module":"R","text":"(BOTH) A vessel engaged in fishing in a narrow channel:","options":["Shall not impede any other vessel navigating within the channel","Has right of way over all vessels","May anchor anywhere","Must leave the channel at night"],"explanation":"Rule 9(c).","lessonTag":"rules-04"},{"id":"R67","module":"R","text":"(BOTH) Nearing a bend where other vessels may be hidden, you sound:","options":["One prolonged blast","Two short blasts","Five short blasts","Three prolonged blasts"],"explanation":"Rule 9(f). A vessel around the bend answers with one prolonged blast.","lessonTag":"rules-04"},{"id":"R68","module":"R","text":"(BOTH) Anchoring in a narrow channel:","options":["Should be avoided if circumstances admit","Is allowed anywhere","Is required in fog","Is allowed only for fishing vessels"],"explanation":"Rule 9(g).","lessonTag":"rules-04"},{"id":"R69","module":"R","text":"(INLAND) On the Western Rivers, a power-driven vessel proceeding upbound against the current:","options":["Holds as necessary to permit safe passing","Proposes the manner of passage","Has the right of way","Initiates the maneuvering signals"],"explanation":"Inland Rule 9: the downbound vessel has the right of way.","lessonTag":"rules-04"},{"id":"R70","module":"R","text":"(BOTH) A vessel obliged to cross a traffic lane does so:","options":["On a heading as nearly as practicable at right angles to the traffic flow","At a small angle to the traffic flow","Only at the end of the lane","Diagonally to save time"],"explanation":"Rule 10(c).","lessonTag":"rules-04"},{"id":"R71","module":"R","text":"(BOTH) Which vessels may use an inshore traffic zone?","options":["Vessels under 20 m, sailing vessels and fishing vessels","Only through traffic","Only vessels over 50 m","No vessels at all"],"explanation":"Rule 10(d).","lessonTag":"rules-04"},{"id":"R72","module":"R","text":"(BOTH) Joining a traffic lane from the side should be done:","options":["At as small an angle to the general direction of traffic as practicable","At right angles","Only at night","From the separation zone"],"explanation":"Rule 10(b).","lessonTag":"rules-04"},{"id":"R73","module":"R","text":"(BOTH) Rules 11 through 18 apply to vessels:","options":["In sight of one another","Detected only by radar","In restricted visibility, not in sight","At anchor"],"explanation":"Rule 11.","lessonTag":"rules-05"},{"id":"R74","module":"R","text":"(BOTH) Two sailing vessels have the wind on the same side. Which keeps clear?","options":["The vessel to windward","The vessel to leeward","The larger vessel","The faster vessel"],"explanation":"Rule 12.","lessonTag":"rules-05"},{"id":"R75","module":"R","text":"(BOTH) A port-tack vessel can’t tell which tack a vessel to windward is on. She shall:","options":["Keep out of the way of the other","Stand on","Sound five short blasts and stand on","Tack immediately"],"explanation":"Rule 12.","lessonTag":"rules-05"},{"id":"R76","module":"R","text":"(BOTH) For Rule 12, the windward side is:","options":["The side opposite to that on which the mainsail is carried","The side the mainsail is carried on","Always the starboard side","The side facing land"],"explanation":"Rule 12(b).","lessonTag":"rules-05"},{"id":"R77","module":"R","text":"(BOTH) A sailing vessel overtaking a power-driven vessel:","options":["Keeps out of the way","Is the stand-on vessel","Has right of way because she is sailing","Must sound one prolonged blast"],"explanation":"Rule 13 overrides Rule 18.","lessonTag":"rules-05"},{"id":"R78","module":"R","text":"(BOTH) In doubt whether you are overtaking, you shall:","options":["Assume you are overtaking and act accordingly","Assume it is a crossing","Stand on","Sound the bend signal"],"explanation":"Rule 13(c).","lessonTag":"rules-05"},{"id":"R79","module":"R","text":"(BOTH) After you begin overtaking, the bearing changes and you end up on the other vessel’s beam. You are:","options":["Still the overtaking vessel until finally past and clear","Now a crossing vessel","Now the stand-on vessel","Released from any duty"],"explanation":"Rule 13(d).","lessonTag":"rules-05"},{"id":"R80","module":"R","text":"(BOTH) At night, a vessel overtaking another would see:","options":["Only her sternlight, neither sidelight","Both sidelights","Her masthead light and one sidelight","Only her masthead light"],"explanation":"Rule 13(b).","lessonTag":"rules-05"},{"id":"R81","module":"R","text":"(BOTH) A head-on situation at night exists when you see the other vessel’s:","options":["Masthead lights in line and/or both sidelights","Sternlight only","Green sidelight only","Red sidelight only"],"explanation":"Rule 14(b).","lessonTag":"rules-06"},{"id":"R82","module":"R","text":"(BOTH) In a crossing situation, the give-way vessel shall, if circumstances admit:","options":["Avoid crossing ahead of the other vessel","Cross ahead quickly","Hold course and speed","Turn to port"],"explanation":"Rule 15.","lessonTag":"rules-06"},{"id":"R83","module":"R","text":"(BOTH) The give-way vessel shall:","options":["Take early and substantial action to keep well clear","Wait until the last moment","Make several small course changes","Sound three short blasts"],"explanation":"Rule 16.","lessonTag":"rules-06"},{"id":"R84","module":"R","text":"(BOTH) The stand-on vessel MAY act by her maneuver alone when:","options":["It becomes apparent the give-way vessel isn’t taking appropriate action","Risk of collision first develops","She sees the other’s green sidelight","She is larger"],"explanation":"Rule 17(a)(ii).","lessonTag":"rules-06"},{"id":"R85","module":"R","text":"(BOTH) The stand-on vessel SHALL act when:","options":["Collision can’t be avoided by the give-way vessel’s action alone","She first sights the other vessel","The give-way vessel sounds one blast","It is dark"],"explanation":"Rule 17(b).","lessonTag":"rules-06"},{"id":"R86","module":"R","text":"(BOTH) A power-driven stand-on vessel acting in a crossing situation should not, if circumstances permit:","options":["Alter course to port for a vessel on her own port side","Slow down","Sound the danger signal","Alter course to starboard"],"explanation":"Rule 17(c).","lessonTag":"rules-06"},{"id":"R87","module":"R","text":"(INLAND) On the Western Rivers, a power-driven vessel crossing the river keeps out of the way of:","options":["A power-driven vessel ascending or descending the river","Any sailing vessel","Any vessel at anchor","No one; she has right of way"],"explanation":"Inland Rule 15.","lessonTag":"rules-06"},{"id":"R88","module":"R","text":"(BOTH) In doubt whether a head-on situation exists, a vessel shall:","options":["Assume it does and act accordingly","Assume it is a crossing","Stand on","Turn to port"],"explanation":"Rule 14(c).","lessonTag":"rules-06"},{"id":"R89","module":"R","text":"(BOTH) A power-driven vessel underway keeps out of the way of:","options":["Vessels not under command, restricted, engaged in fishing, and sailing","Only vessels not under command","Only sailing vessels","Only larger vessels"],"explanation":"Rule 18(a), except where Rules 9, 10 and 13 otherwise require.","lessonTag":"rules-07"},{"id":"R90","module":"R","text":"(BOTH) A sailing vessel underway keeps out of the way of:","options":["A vessel engaged in fishing","A power-driven vessel crossing her bow","A seaplane on the water","A power-driven vessel overtaking her"],"explanation":"Rule 18(b).","lessonTag":"rules-07"},{"id":"R91","module":"R","text":"(BOTH) A vessel engaged in fishing keeps out of the way, so far as possible, of:","options":["A vessel restricted in her ability to maneuver","A sailing vessel","A power-driven vessel","A seaplane"],"explanation":"Rule 18(c).","lessonTag":"rules-07"},{"id":"R92","module":"R","text":"(INTERNATIONAL) Vessels other than NUC and RAM shall, if circumstances admit, avoid impeding:","options":["A vessel constrained by her draft","A sailing vessel","A seaplane","A pilot vessel"],"explanation":"Rule 18(d).","lessonTag":"rules-07"},{"id":"R93","module":"R","text":"(BOTH) Rule 18 applies except where which rules otherwise require?","options":["Rules 9, 10 and 13","Rules 5, 6 and 7","Rules 14 and 15","Rule 19 only"],"explanation":"Narrow channels, traffic separation schemes and overtaking.","lessonTag":"rules-07"},{"id":"R94","module":"R","text":"(BOTH) A sailing vessel overtaking a vessel engaged in fishing:","options":["Keeps clear, because she is overtaking","Stands on, because she is sailing","Has right of way","Must sound one short blast"],"explanation":"Rule 13 overrides Rule 18.","lessonTag":"rules-07"},{"id":"R95","module":"R","text":"(BOTH) A seaplane on the water shall, in general:","options":["Keep well clear of all vessels and avoid impeding them","Have right of way over all vessels","Be treated as a sailing vessel","Show NUC lights"],"explanation":"Rule 18(e).","lessonTag":"rules-07"},{"id":"R96","module":"R","text":"(INLAND) Which category does NOT exist under Inland rules?","options":["Constrained by her draft","Not under command","Restricted in ability to maneuver","Engaged in fishing"],"explanation":"Constrained by draft is International only.","lessonTag":"rules-07"},{"id":"R97","module":"R","text":"(BOTH) Rule 19 applies to vessels:","options":["Not in sight of one another, in or near restricted visibility","In sight of one another in fog","At anchor in fog","Only in traffic separation schemes"],"explanation":"Rule 19(a).","lessonTag":"rules-08"},{"id":"R98","module":"R","text":"(BOTH) In restricted visibility, a power-driven vessel shall:","options":["Have her engines ready for immediate maneuver","Stop her engines","Anchor","Increase speed to clear the area"],"explanation":"Rule 19(b).","lessonTag":"rules-08"},{"id":"R99","module":"R","text":"(BOTH) Under Rule 19:","options":["There is no stand-on or give-way vessel","The vessel to starboard stands on","Sailing vessels stand on","The larger vessel stands on"],"explanation":"Every vessel shares the duty to avoid collision.","lessonTag":"rules-08"},{"id":"R100","module":"R","text":"(BOTH) A vessel detected by radar alone is forward of your beam and not being overtaken. Avoid:","options":["An alteration of course to port","An alteration of course to starboard","Reducing speed","Sounding fog signals"],"explanation":"Rule 19(d)(i).","lessonTag":"rules-08"},{"id":"R101","module":"R","text":"(BOTH) A vessel detected by radar alone is abaft your beam. Avoid:","options":["An alteration of course toward it","Any change of speed","Sounding fog signals","Keeping a lookout"],"explanation":"Rule 19(d)(ii).","lessonTag":"rules-08"},{"id":"R102","module":"R","text":"(BOTH) Hearing a fog signal apparently forward of the beam (risk not ruled out), you shall:","options":["Reduce to the minimum speed at which you can keep your course","Increase speed","Turn hard to port","Sound five short blasts and hold speed"],"explanation":"Rule 19(e).","lessonTag":"rules-08"},{"id":"R103","module":"R","text":"(BOTH) If necessary after hearing a fog signal forward of the beam, a vessel shall:","options":["Take all her way off","Anchor immediately","Turn toward the signal","Turn off her navigation lights"],"explanation":"Rule 19(e).","lessonTag":"rules-08"},{"id":"R104","module":"R","text":"(BOTH) When two vessels in fog come into sight of one another:","options":["The rules for vessels in sight, 11 to 18, apply","Rule 19 continues to apply","Both must stop","The larger vessel must anchor"],"explanation":"Rule 19 applies only while they are not in sight.","lessonTag":"rules-08"},{"id":"R105","module":"R","text":"(BOTH) Navigation lights shall be shown:","options":["From sunset to sunrise, and in restricted visibility","Only from midnight to dawn","Only in fog","Only when making way"],"explanation":"Rule 20.","lessonTag":"rules-09"},{"id":"R106","module":"R","text":"(BOTH) The masthead light of a vessel 50 m or more must be visible at least:","options":["6 miles","5 miles","3 miles","2 miles"],"explanation":"Rule 22.","lessonTag":"rules-09"},{"id":"R107","module":"R","text":"(BOTH) Sidelights on a vessel under 12 m must be visible at least:","options":["1 mile","2 miles","3 miles","6 miles"],"explanation":"Rule 22.","lessonTag":"rules-09"},{"id":"R108","module":"R","text":"(BOTH) The masthead light of a vessel 12 m or more but under 20 m must be visible at least:","options":["3 miles","2 miles","5 miles","6 miles"],"explanation":"Rule 22.","lessonTag":"rules-09"},{"id":"R109","module":"R","text":"(BOTH) A second masthead light, abaft and higher than the forward one, is required on power-driven vessels:","options":["50 m or more in length","20 m or more","12 m or more","Of any length"],"explanation":"Rule 23. Vessels under 50 m may show one.","lessonTag":"rules-09"},{"id":"R110","module":"R","text":"(BOTH) A power-driven vessel under 7 m with a top speed of 7 knots or less may show:","options":["An all-round white light, and sidelights if practicable","No lights at all","Only sidelights","A flashing yellow light"],"explanation":"Rule 23.","lessonTag":"rules-09"},{"id":"R111","module":"R","text":"(BOTH) An air-cushion vessel in non-displacement mode adds:","options":["An all-round flashing yellow light","An all-round flashing red light","Two all-round red lights","A flashing blue light"],"explanation":"Rule 23.","lessonTag":"rules-09"},{"id":"R112","module":"R","text":"(BOTH) A “flashing light” flashes at:","options":["120 or more flashes per minute","60 flashes per minute","50 to 70 flashes per minute","10 flashes per minute"],"explanation":"Rule 21. Inland’s special flashing light is 50 to 70 per minute.","lessonTag":"rules-09"},{"id":"R113","module":"R","text":"(INLAND) On the Great Lakes, a power-driven vessel may show an all-round white light in place of:","options":["The second masthead light and the sternlight","The sidelights","The forward masthead light only","Her anchor light"],"explanation":"Inland Rule 23.","lessonTag":"rules-09"},{"id":"R114","module":"R","text":"(BOTH) A power-driven vessel towing astern, tow 200 m or less, shows:","options":["Two masthead lights in a vertical line","Three masthead lights in a vertical line","One masthead light","Two all-round red lights"],"explanation":"Rule 24.","lessonTag":"rules-10"},{"id":"R115","module":"R","text":"(BOTH) When the tow exceeds 200 m, the towing vessel shows:","options":["Three masthead lights in a vertical line","Two masthead lights","Four masthead lights","A yellow flashing light"],"explanation":"Rule 24.","lessonTag":"rules-10"},{"id":"R116","module":"R","text":"(BOTH) The length of a tow is measured:","options":["From the stern of the towing vessel to the after end of the tow","From the bow of the towing vessel to the stern of the tow","Along the towline only","From the towing light to the tow’s sternlight"],"explanation":"Rule 24.","lessonTag":"rules-10"},{"id":"R117","module":"R","text":"(BOTH) The towing light is:","options":["Yellow, above the sternlight, with the same arc","White, all-round, at the masthead","Red, all-round","Yellow, flashing, at the bow"],"explanation":"Rules 21 and 24.","lessonTag":"rules-10"},{"id":"R118","module":"R","text":"(BOTH) A diamond shape is shown when:","options":["The tow exceeds 200 m, on both the towing vessel and the tow","The tow is under 200 m","Only the tow is restricted","The tug is at anchor"],"explanation":"Rule 24.","lessonTag":"rules-10"},{"id":"R119","module":"R","text":"(INLAND) A power-driven vessel pushing ahead shows aft:","options":["Two towing lights in a vertical line","A sternlight","A towing light over a sternlight","No lights aft"],"explanation":"Inland Rule 24.","lessonTag":"rules-10"},{"id":"R120","module":"R","text":"(INLAND) A vessel being pushed ahead (not a composite unit) shows at the forward end:","options":["Sidelights and a special flashing light","Only sidelights","A masthead light","Two all-round red lights"],"explanation":"Inland Rule 24.","lessonTag":"rules-10"},{"id":"R121","module":"R","text":"(BOTH) A pushing vessel and pushed vessel rigidly connected as a composite unit show:","options":["The lights of a single power-driven vessel","Towing lights","No lights","RAM lights"],"explanation":"Rule 24.","lessonTag":"rules-10"},{"id":"R122","module":"R","text":"(BOTH) A vessel towing another in distress, unable to show towing lights, should:","options":["Indicate the relationship, such as by illuminating the towline","Cast off the tow","Show NUC lights","Sound continuous blasts"],"explanation":"Rule 24.","lessonTag":"rules-10"},{"id":"R123","module":"R","text":"(BOTH) A sailing vessel underway shows:","options":["Sidelights and a sternlight","A masthead light, sidelights and a sternlight","Two all-round red lights","Only an all-round white light"],"explanation":"Rule 25.","lessonTag":"rules-11"},{"id":"R124","module":"R","text":"(BOTH) A sailing vessel under 20 m may combine her sidelights and sternlight:","options":["In one lantern at or near the top of the mast","Only at the bow","Into an all-round white light","Never"],"explanation":"Rule 25.","lessonTag":"rules-11"},{"id":"R125","module":"R","text":"(BOTH) The optional all-round masthead lights of a sailing vessel are:","options":["Red over green, not shown with a tricolor","Green over red","White over red","Red over white"],"explanation":"Rule 25.","lessonTag":"rules-11"},{"id":"R126","module":"R","text":"(INLAND) A sailing vessel under 12 m, under sail and power by day:","options":["Isn’t required to show the cone, but may","Must show a cone, apex up","Must show two balls","Must show a diamond"],"explanation":"Inland Rule 25.","lessonTag":"rules-11"},{"id":"R127","module":"R","text":"(BOTH) A vessel engaged in trawling shows:","options":["Green over white all-round lights","Red over white all-round lights","White over red all-round lights","Two all-round green lights"],"explanation":"Rule 26.","lessonTag":"rules-11"},{"id":"R128","module":"R","text":"(BOTH) A vessel fishing (not trawling) with gear extending more than 150 m adds:","options":["An all-round white light in the direction of the gear","A red light at the stern","A second masthead light","A yellow flashing light"],"explanation":"Rule 26.","lessonTag":"rules-11"},{"id":"R129","module":"R","text":"(BOTH) A vessel engaged in fishing but not making way shows:","options":["Her fishing lights, without sidelights or sternlight","Only an anchor light","Sidelights and sternlight only","No lights"],"explanation":"Sidelights and sternlight are added only when making way.","lessonTag":"rules-11"},{"id":"R130","module":"R","text":"(BOTH) Under Annex II, a trawler hauling her nets may show:","options":["White over red","Two white lights","Two red lights","Two yellow flashing lights"],"explanation":"Shooting nets: two white. Net fast: two red.","lessonTag":"rules-11"},{"id":"R131","module":"R","text":"(BOTH) A sailing vessel under 7 m that doesn’t show sidelights and sternlight must:","options":["Have a white torch or lantern ready to show in time","Stay ashore at night","Show a red flare","Carry a gong"],"explanation":"Rule 25.","lessonTag":"rules-11"},{"id":"R132","module":"R","text":"(BOTH) A vessel not under command and making way shows:","options":["Two all-round red lights plus sidelights and sternlight","Two all-round red lights only","Red, white, red all-round lights","Three all-round red lights"],"explanation":"Rule 27.","lessonTag":"rules-12"},{"id":"R133","module":"R","text":"(BOTH) A vessel restricted in her ability to maneuver, at anchor, shows:","options":["Her RAM lights plus anchor lights","Only anchor lights","RAM lights plus sidelights","Two all-round red lights"],"explanation":"Rule 27.","lessonTag":"rules-12"},{"id":"R134","module":"R","text":"(BOTH) A dredge marks the side on which another vessel may pass with:","options":["Two all-round green lights in a vertical line","Two all-round red lights","One all-round white light","A yellow flashing light"],"explanation":"Rule 27. Two reds mark the obstruction.","lessonTag":"rules-12"},{"id":"R135","module":"R","text":"(BOTH) A small vessel engaged in diving operations shows a rigid replica of code flag A at least:","options":["1 m high","0.5 m high","2 m high","3 m high"],"explanation":"Rule 27.","lessonTag":"rules-12"},{"id":"R136","module":"R","text":"(BOTH) A vessel engaged in mine clearance means it is dangerous to approach within:","options":["1000 m","500 m","200 m","100 m"],"explanation":"Rule 27.","lessonTag":"rules-12"},{"id":"R137","module":"R","text":"(BOTH) A vessel 100 m or more at anchor must also:","options":["Illuminate her decks with working lights","Show a flashing yellow light","Sound a gong every 2 minutes","Show sidelights"],"explanation":"Rule 30.","lessonTag":"rules-12"},{"id":"R138","module":"R","text":"(BOTH) A vessel under 50 m at anchor may show:","options":["One all-round white light where it can best be seen","No lights","Two all-round red lights","Sidelights only"],"explanation":"Rule 30.","lessonTag":"rules-12"},{"id":"R139","module":"R","text":"(INLAND) A vessel under 20 m at anchor in a special anchorage area:","options":["Isn’t required to show anchor lights or a shape","Must show two anchor lights","Must ring a bell every minute","Must show a ball and a cone"],"explanation":"Inland Rule 30.","lessonTag":"rules-12"},{"id":"R140","module":"R","text":"(BOTH) A vessel under 12 m aground:","options":["Isn’t required to show the aground lights or shapes","Must show three balls","Must show two red lights and a flare","Must show a diamond"],"explanation":"Rule 30.","lessonTag":"rules-12"},{"id":"R141","module":"R","text":"(BOTH) A pilot vessel on duty, at anchor, shows:","options":["White over red all-round lights plus anchor light(s)","Only an anchor light","White over red plus sidelights","Red over white"],"explanation":"Rule 29.","lessonTag":"rules-12"},{"id":"R142","module":"R","text":"(BOTH) A vessel 20 m or more must carry:","options":["A whistle and a bell","Only a whistle","A whistle, bell and gong","No sound equipment"],"explanation":"Rule 33.","lessonTag":"rules-13"},{"id":"R143","module":"R","text":"(BOTH) A vessel 100 m or more must carry:","options":["A whistle, a bell and a gong","A whistle and bell only","Two whistles","A bell and gong only"],"explanation":"Rule 33.","lessonTag":"rules-13"},{"id":"R144","module":"R","text":"(INTERNATIONAL) A maneuvering light signal uses:","options":["An all-round white light, flashes about one second long","A yellow light","A red flashing light","A green light"],"explanation":"Rule 34(b).","lessonTag":"rules-13"},{"id":"R145","module":"R","text":"(INLAND) Maneuvering signals are required between power-driven vessels meeting or crossing within:","options":["Half a mile","1 mile","2 miles","100 meters"],"explanation":"Inland Rule 34(a).","lessonTag":"rules-13"},{"id":"R146","module":"R","text":"(INLAND) A vessel meeting you sounds one short blast and you agree. You:","options":["Sound one short blast and take steps to pass","Sound two short blasts","Sound one prolonged blast","Make no signal"],"explanation":"Inland Rule 34(a).","lessonTag":"rules-13"},{"id":"R147","module":"R","text":"(INLAND) Whistle signals aren’t required when:","options":["Agreement is reached by radiotelephone","It is daylight","Both vessels are under 20 m","Visibility is good"],"explanation":"Inland Rule 34(h).","lessonTag":"rules-13"},{"id":"R148","module":"R","text":"(INLAND) The signal for “I intend to overtake you on your port side” is:","options":["Two short blasts","One short blast","Two prolonged and two short blasts","One prolonged blast"],"explanation":"Inland Rule 34(c).","lessonTag":"rules-13"},{"id":"R149","module":"R","text":"(INTERNATIONAL) A vessel about to be overtaken signals agreement with:","options":["Prolonged, short, prolonged, short","One short blast","Two prolonged blasts","Five short blasts"],"explanation":"Rule 34(c).","lessonTag":"rules-13"},{"id":"R150","module":"R","text":"(BOTH) A vessel hearing the bend signal from around a bend answers with:","options":["One prolonged blast","One short blast","Five short blasts","Two prolonged blasts"],"explanation":"Rule 34(e).","lessonTag":"rules-13"},{"id":"R151","module":"R","text":"(INLAND) A maneuvering light may be:","options":["White or yellow","Red or green","Blue","Only white"],"explanation":"Inland Rule 34(b).","lessonTag":"rules-13"},{"id":"R152","module":"R","text":"(BOTH) Fog signals for vessels underway are sounded at intervals of not more than:","options":["2 minutes","1 minute","5 minutes","30 seconds"],"explanation":"Rule 35.","lessonTag":"rules-14"},{"id":"R153","module":"R","text":"(BOTH) A power-driven vessel underway but stopped sounds two prolonged blasts about how far apart?","options":["2 seconds","5 seconds","10 seconds","30 seconds"],"explanation":"Rule 35.","lessonTag":"rules-14"},{"id":"R154","module":"R","text":"(BOTH) A vessel engaged in fishing, at anchor in fog, sounds:","options":["One prolonged and two short blasts","Rapid ringing of the bell","Two prolonged blasts","One short, one prolonged, one short"],"explanation":"Rule 35.","lessonTag":"rules-14"},{"id":"R155","module":"R","text":"(BOTH) A vessel at anchor may additionally warn an approaching vessel with:","options":["One short, one prolonged, one short blast","Five short blasts","Two prolonged blasts","Three short blasts"],"explanation":"Rule 35.","lessonTag":"rules-14"},{"id":"R156","module":"R","text":"(BOTH) A vessel 100 m or more at anchor in fog sounds:","options":["The bell forward, then the gong aft","Only a gong","Only the whistle","The bell aft, then the gong forward"],"explanation":"Rule 35.","lessonTag":"rules-14"},{"id":"R157","module":"R","text":"(BOTH) A pilot vessel on duty in fog may add an identity signal of:","options":["Four short blasts","Three short blasts","One prolonged blast","Two short blasts"],"explanation":"Rule 35.","lessonTag":"rules-14"},{"id":"R158","module":"R","text":"(BOTH) Which is NOT a distress signal?","options":["Three short blasts","Orange smoke","SOS by flashing light","Slowly raising and lowering outstretched arms"],"explanation":"Three short blasts means operating astern propulsion.","lessonTag":"rules-14"},{"id":"R159","module":"R","text":"(INLAND) Inland rules add which distress signal?","options":["A high-intensity white light flashing 50 to 70 times a minute","A green star rocket","A blue flag","Three short blasts"],"explanation":"Inland Annex IV.","lessonTag":"rules-14"},{"id":"R160","module":"R","text":"(BOTH) To attract attention, a vessel may:","options":["Direct a searchlight beam toward the danger without embarrassing any vessel","Use a strobe light","Sound the bend signal","Show NUC lights"],"explanation":"Rule 36.","lessonTag":"rules-14"},{"id":"R161","module":"R","text":"(BOTH) A composite pushing unit in fog sounds:","options":["The signals of a power-driven vessel","One prolonged and three short blasts","The anchor signal","No signal"],"explanation":"Rule 35.","lessonTag":"rules-14"},{"id":"R162","module":"R","text":"Bridge-to-bridge communications are generally on VHF channel:","options":["13","16","22A","9"],"explanation":"Some areas, such as parts of the Lower Mississippi, use other channels.","lessonTag":"rules-15"},{"id":"R163","module":"R","text":"The Bridge-to-Bridge Act applies to power-driven vessels of:","options":["20 m or more","12 m or more","7 m or more","Any length"],"explanation":"Also 100 GT+ passenger vessels, towing vessels 26 ft+, and dredges and floating plant.","lessonTag":"rules-15"},{"id":"R164","module":"R","text":"The Bridge-to-Bridge Act applies to towing vessels of:","options":["26 ft or more","16 ft or more","40 ft or more","65 ft or more"],"explanation":"33 CFR Part 26.","lessonTag":"rules-15"},{"id":"R165","module":"R","text":"Which signal is required only under Inland rules?","options":["One prolonged blast when leaving a dock or berth","One prolonged blast at a bend","Five short blasts for danger","Three short blasts for astern propulsion"],"explanation":"Inland Rule 34(g).","lessonTag":"rules-15"},{"id":"R166","module":"R","text":"Which vessel category exists only under International rules?","options":["Constrained by her draft","Not under command","Engaged in fishing","Pilot vessel"],"explanation":"Rule 28.","lessonTag":"rules-15"},{"id":"R167","module":"R","text":"Agreement by radiotelephone can replace whistle signals:","options":["Only under Inland rules","Only under International rules","Under both rule sets","Never"],"explanation":"Inland Rule 34(h).","lessonTag":"rules-15"},{"id":"R168","module":"R","text":"Bridge-to-bridge communications must be in:","options":["English","Any language","Spanish or English","Morse code"],"explanation":"The person keeping the watch must be able to communicate in English.","lessonTag":"rules-15"},{"id":"N24","module":"N","text":"Latitude is measured:","options":["North or south of the equator, 0° to 90°","East or west of Greenwich, 0° to 180°","From the North Pole","From the magnetic pole"],"explanation":"Florida is in north latitude.","lessonTag":"nav-01"},{"id":"N25","module":"N","text":"Longitude is read on a chart’s:","options":["Top and bottom scales","Side scales","Compass rose","Title block"],"explanation":"Latitude is on the side scales.","lessonTag":"nav-01"},{"id":"N26","module":"N","text":"One nautical mile is about:","options":["6,076 ft","5,280 ft","3,000 ft","10,000 ft"],"explanation":"A nautical mile is 1,852 meters.","lessonTag":"nav-01"},{"id":"N27","module":"N","text":"Which chart scale shows the most detail?","options":["1:20,000","1:80,000","1:200,000","1:1,200,000"],"explanation":"Large scale, large detail, small area.","lessonTag":"nav-01"},{"id":"N28","module":"N","text":"A harbor chart has a scale:","options":["Larger than 1:50,000","Between 1:50,000 and 1:150,000","Between 1:150,000 and 1:600,000","Smaller than 1:600,000"],"explanation":"Coast charts are 1:50,000 to 1:150,000.","lessonTag":"nav-01"},{"id":"N29","module":"N","text":"On a Mercator chart, a straight line is:","options":["A rhumb line of constant direction","A great circle","A line of equal depth","A line of equal variation"],"explanation":"That’s why you can steer one course along it.","lessonTag":"nav-01"},{"id":"N30","module":"N","text":"The horizontal datum on most current U.S. charts is:","options":["NAD 83, equivalent to WGS 84 for GPS use","Mean lower low water","Mean high water","NAD 27"],"explanation":"Older charts on NAD 27 can be offset from GPS positions.","lessonTag":"nav-01"},{"id":"N31","module":"N","text":"Heights of lights and bridge clearances on U.S. charts are measured above:","options":["Mean high water","Mean lower low water","Mean sea level","The bottom"],"explanation":"Depths use MLLW; heights use MHW.","lessonTag":"nav-01"},{"id":"N32","module":"N","text":"A knot is:","options":["One nautical mile per hour","One nautical mile","One statute mile per hour","One knot per hour"],"explanation":"Never say “knots per hour.”","lessonTag":"nav-01"},{"id":"N33","module":"N","text":"Green areas on a NOAA chart show:","options":["Areas that cover and uncover with the tide","Deep water","Restricted areas","Land"],"explanation":"Mud flats and bars that dry at low water.","lessonTag":"nav-02"},{"id":"N34","module":"N","text":"Magenta on a chart is used for:","options":["Lights, aids to navigation, cables and restricted areas","Land","Deep water","Depth contours only"],"explanation":"Magenta highlights things that matter to navigation.","lessonTag":"nav-02"},{"id":"N35","module":"N","text":"The bottom abbreviation “Sh” means:","options":["Shells","Shoal","Shingle","Shallow"],"explanation":"S sand, M mud, Rk rock, Co coral.","lessonTag":"nav-02"},{"id":"N36","module":"N","text":"Which bottom is the poorest holding for most anchors?","options":["Rk (rock)","S (sand)","M (mud)","sft M (soft mud)"],"explanation":"Sand and mud hold well; rock and coral don’t.","lessonTag":"nav-02"},{"id":"N37","module":"N","text":"A rock that covers and uncovers is:","options":["Exposed at low tide and covered at high tide","Always above water","Always submerged","Only on harbor charts"],"explanation":"Its height is given above chart datum.","lessonTag":"nav-02"},{"id":"N38","module":"N","text":"On a chart, “ED” means:","options":["Existence doubtful","Extended depth","Edge of dredged channel","East deviation"],"explanation":"PA is position approximate; PD is position doubtful.","lessonTag":"nav-02"},{"id":"N39","module":"N","text":"A cable area on a chart means:","options":["Don’t anchor or drag gear there","Good anchorage","Deep water","A speed limit zone"],"explanation":"Anchors can damage cables and pipelines.","lessonTag":"nav-02"},{"id":"N40","module":"N","text":"A danger of electronic vector charts (ENCs) is that:","options":["Details may disappear when zoomed out","They never show soundings","They can’t show buoys","They’re always out of date"],"explanation":"Zoom in along your route.","lessonTag":"nav-02"},{"id":"N41","module":"N","text":"The publication that explains all chart symbols is:","options":["Chart No. 1","The Coast Pilot","The Light List","The Tide Tables"],"explanation":"Free online from NOAA.","lessonTag":"nav-02"},{"id":"N42","module":"N","text":"The U.S. buoyage system is:","options":["IALA Region B","IALA Region A","The European system","The Uniform State System only"],"explanation":"Region B uses red right returning.","lessonTag":"nav-03"},{"id":"N43","module":"N","text":"Lighted lateral buoys are usually identified by:","options":["Color, number and light","Shape only","Height","Their sound signal only"],"explanation":"Most lighted buoys are pillars or spars.","lessonTag":"nav-03"},{"id":"N44","module":"N","text":"A quick-flashing light on a lateral mark usually indicates:","options":["A sharp turn, junction or need for special caution","Safe water","A wreck","A mooring area"],"explanation":"Quick = about 60 flashes per minute.","lessonTag":"nav-03"},{"id":"N45","module":"N","text":"A preferred channel mark’s light is:","options":["Composite group flashing (2+1) in the color of the top band","White Morse A","Yellow fixed","White group flashing (2)"],"explanation":"Treat the mark as the color of its top band.","lessonTag":"nav-03"},{"id":"N46","module":"N","text":"A green square daybeacon:","options":["Has an odd number and is kept on your left returning","Has an even number and is kept on your right returning","Has no number","Marks safe water"],"explanation":"Green squares, red triangles.","lessonTag":"nav-03"},{"id":"N47","module":"N","text":"When the rear range mark appears to the right of the front mark, you should:","options":["Steer right until they line up","Steer left","Hold course","Stop"],"explanation":"Follow the rear mark.","lessonTag":"nav-03"},{"id":"N48","module":"N","text":"On a range, the rear mark is:","options":["Higher and farther away than the front mark","Lower and closer","The same height","Always lighted green"],"explanation":"So the marks stack vertically on the centerline.","lessonTag":"nav-03"},{"id":"N49","module":"N","text":"Which statement about buoys is TRUE?","options":["They may be off station, so don’t rely on them alone","They never move","Their lights never fail","They mark exact positions"],"explanation":"The Light List carries this caution.","lessonTag":"nav-03"},{"id":"N50","module":"N","text":"A safe water mark shows a:","options":["White light, Morse A","Red quick-flashing light","Green light","Yellow light"],"explanation":"Red and white vertical stripes.","lessonTag":"nav-04"},{"id":"N51","module":"N","text":"An isolated danger mark’s light is:","options":["White, group flashing (2)","Red, quick","Green, isophase","Yellow, fixed"],"explanation":"Black with red bands, two black balls on top.","lessonTag":"nav-04"},{"id":"N52","module":"N","text":"A yellow special mark may indicate:","options":["An anchorage, cable or spoil area","The side of a channel","Safe water","Something to keep on your right"],"explanation":"Special marks give no lateral guidance.","lessonTag":"nav-04"},{"id":"N53","module":"N","text":"A white marker with an orange diamond containing a cross means:","options":["Boats keep out","Danger","Controlled area","Information"],"explanation":"An open orange diamond means danger.","lessonTag":"nav-04"},{"id":"N54","module":"N","text":"A white marker with an orange circle indicates:","options":["A controlled area, such as a speed limit or no-wake zone","Danger","Boats keep out","A mooring buoy"],"explanation":"Common in Florida manatee zones.","lessonTag":"nav-04"},{"id":"N55","module":"N","text":"A white buoy with a blue horizontal band is:","options":["A mooring buoy","A danger buoy","A diver-down marker","A channel marker"],"explanation":"Uniform State Waterway Marking System.","lessonTag":"nav-04"},{"id":"N56","module":"N","text":"On the ICW, a yellow triangle on a mark means:","options":["Treat it as a red mark","Treat it as a green mark","Danger","Safe water"],"explanation":"A yellow square means treat it as green.","lessonTag":"nav-04"},{"id":"N57","module":"N","text":"On the Western Rivers, a diamond-shaped crossing daymark shows:","options":["Where the channel crosses from one bank to the other","A mooring area","Safe water","A speed limit"],"explanation":"Western Rivers buoys aren’t numbered.","lessonTag":"nav-04"},{"id":"N58","module":"N","text":"The range printed on a chart for a light is its:","options":["Nominal range","Geographic range","Luminous range for tonight","Radar range"],"explanation":"Nominal range assumes 10 nm meteorological visibility.","lessonTag":"nav-05"},{"id":"N59","module":"N","text":"Geographic range depends on:","options":["The height of the light and the observer’s height of eye","The light’s color only","The light’s intensity only","The time of day"],"explanation":"The earth’s curve hides the light beyond it.","lessonTag":"nav-05"},{"id":"N60","module":"N","text":"Distance to the horizon in nautical miles is approximately:","options":["1.17 × √(height in feet)","2 × height in feet","Height in feet ÷ 10","10 × √(height in feet)"],"explanation":"The Light List formula.","lessonTag":"nav-05"},{"id":"N61","module":"N","text":"A light is 64 ft high and your eye is 9 ft high. Geographic range is about:","options":["12.9 nm","9.4 nm","73 nm","3.5 nm"],"explanation":"1.17 × (8 + 3) = 12.9.","lessonTag":"nav-05"},{"id":"N62","module":"N","text":"Geographic range 14 nm, luminous range tonight 10 nm. You’ll first see the light at about:","options":["10 nm","14 nm","24 nm","4 nm"],"explanation":"The lesser range wins.","lessonTag":"nav-05"},{"id":"N63","module":"N","text":"Light sector bearings in the Light List are given:","options":["In degrees true, from the vessel toward the light","In degrees magnetic, from the light outward","Relative to the vessel’s heading","In compass degrees"],"explanation":"A classic exam trap.","lessonTag":"nav-05"},{"id":"N64","module":"N","text":"A sector light changes from white to red as you approach. You are most likely:","options":["In a sector covering a hazard","On a range centerline","Past the light","In safe water"],"explanation":"Move back into the white sector.","lessonTag":"nav-05"},{"id":"N65","module":"N","text":"The Light List volume covering most of Florida is:","options":["Volume III","Volume I","Volume V","Volume VII"],"explanation":"Volume IV covers the Gulf from the Econfina River to Texas.","lessonTag":"nav-05"},{"id":"N66","module":"N","text":"Luminous range is:","options":["How far a light carries in the existing visibility","How far before the horizon hides it","The range printed on the chart","Always greater than nominal range"],"explanation":"Use the luminous range diagram in the Light List.","lessonTag":"nav-05"},{"id":"N67","module":"N","text":"Which publication describes regulations, anchorages, hazards and port details not shown on charts?","options":["The Coast Pilot","The Light List","Chart No. 1","The Tide Tables"],"explanation":"Published by NOAA.","lessonTag":"nav-06"},{"id":"N68","module":"N","text":"Coast Pilot 4 covers:","options":["Cape Henry, VA to Key West, FL","The Gulf coast","The Great Lakes","The Pacific coast"],"explanation":"Coast Pilot 5 covers the Gulf, Puerto Rico and the Virgin Islands.","lessonTag":"nav-06"},{"id":"N69","module":"N","text":"The Local Notice to Mariners is published:","options":["Weekly by each Coast Guard district","Annually by NOAA","Monthly by the Navy","Only when a chart is reprinted"],"explanation":"It covers aid changes, hazards and chart corrections.","lessonTag":"nav-06"},{"id":"N70","module":"N","text":"Broadcast Notices to Mariners are announced on channel 16 and then read on:","options":["Channel 22A","Channel 13","Channel 9","Channel 70"],"explanation":"Channel 22A is the Coast Guard working channel.","lessonTag":"nav-06"},{"id":"N71","module":"N","text":"Federal regulations for navigation and navigable waters are in:","options":["33 CFR","46 CFR","49 CFR","14 CFR"],"explanation":"46 CFR covers shipping, including vessels and licensing.","lessonTag":"nav-06"},{"id":"N72","module":"N","text":"Before using a chart, check corrections issued:","options":["Since the chart’s edition date","Only in the last week","Only in the last year","Never; charts don’t change"],"explanation":"Use the Local Notice to Mariners.","lessonTag":"nav-06"},{"id":"N73","module":"N","text":"The Notice to Mariners for ocean charts is published by:","options":["The National Geospatial-Intelligence Agency","Each state","The EPA","The Army Corps of Engineers"],"explanation":"Local Notices come from Coast Guard districts.","lessonTag":"nav-06"},{"id":"N74","module":"N","text":"A tide with two highs and two lows of unequal height each day is:","options":["Mixed","Semidiurnal","Diurnal","Neap"],"explanation":"Common along much of Florida’s Gulf coast.","lessonTag":"nav-07"},{"id":"N75","module":"N","text":"High and low water each day come about how much later than the day before?","options":["50 minutes","10 minutes","2 hours","They don’t change"],"explanation":"The tidal day is about 24 hours 50 minutes.","lessonTag":"nav-07"},{"id":"N76","module":"N","text":"Actual depth equals:","options":["Charted depth plus the height of tide","Charted depth minus the height of tide","Charted depth only","Height of tide only"],"explanation":"A negative tide makes it shallower than charted.","lessonTag":"nav-07"},{"id":"N77","module":"N","text":"A negative tide height means the water is:","options":["Below mean lower low water","Above mean high water","At mean sea level","Rising"],"explanation":"Shallower than charted.","lessonTag":"nav-07"},{"id":"N78","module":"N","text":"In Tide Table 2, a height correction marked *0.9 is:","options":["A ratio to multiply by the reference heights","Feet to add","Feet to subtract","Minutes to add"],"explanation":"The asterisk marks a ratio.","lessonTag":"nav-07"},{"id":"N79","module":"N","text":"Tide Table times are in local standard time. During daylight saving time you should:","options":["Add 1 hour","Subtract 1 hour","Add 2 hours","Make no change"],"explanation":"Spring forward.","lessonTag":"nav-07"},{"id":"N80","module":"N","text":"Reference high water 10:42; subordinate time difference +0:35. Subordinate high water is at:","options":["11:17","10:07","11:42","10:77"],"explanation":"10:42 + 0:35 = 11:17.","lessonTag":"nav-07"},{"id":"N81","module":"N","text":"Low 1.0 ft at 06:00, high 7.0 ft at 12:00. Height at 08:00 by the rule of twelfths:","options":["2.5 ft","3.0 ft","4.0 ft","1.5 ft"],"explanation":"1/12 + 2/12 = 3/12 of 6 ft = 1.5 ft above low, so 2.5 ft.","lessonTag":"nav-07"},{"id":"N82","module":"N","text":"The largest tidal ranges occur at:","options":["Spring tides, near new and full moon","Neap tides","Only in spring","The quarter moons"],"explanation":"Perigean spring (“king”) tides are bigger still.","lessonTag":"nav-07"},{"id":"N83","module":"N","text":"A current setting 090°T flows:","options":["Toward the east","From the east","Toward the west","North"],"explanation":"Currents are named for where they flow toward.","lessonTag":"nav-08"},{"id":"N84","module":"N","text":"An easterly wind blows:","options":["From the east","Toward the east","From the west","Toward the north"],"explanation":"Winds are named for where they come from.","lessonTag":"nav-08"},{"id":"N85","module":"N","text":"Slack water at an inlet:","options":["Doesn’t necessarily occur at high or low tide","Always occurs at high tide","Always occurs at low tide","Never occurs"],"explanation":"Check the Tidal Current Tables.","lessonTag":"nav-08"},{"id":"N86","module":"N","text":"Tidal Current Table 2 gives subordinate stations’:","options":["Time differences, speed ratios and flood/ebb directions","Heights of tide","Light characteristics","Variation"],"explanation":"Table 1 gives reference stations.","lessonTag":"nav-08"},{"id":"N87","module":"N","text":"Reference max flood 2.0 kn at 14:00. Subordinate: −0:20, flood ratio 0.6. Expect:","options":["1.2 kn at 13:40","1.2 kn at 14:20","3.3 kn at 13:40","2.6 kn at 14:20"],"explanation":"2.0 × 0.6 = 1.2; 14:00 − 0:20 = 13:40.","lessonTag":"nav-08"},{"id":"N88","module":"N","text":"Off Florida’s east coast, the Gulf Stream flows:","options":["North","South","West","East"],"explanation":"Often 2 to 4 knots or more.","lessonTag":"nav-08"},{"id":"N89","module":"N","text":"Dangerous seas build in the Gulf Stream when a strong wind blows from the:","options":["North","South","Southwest","West"],"explanation":"Wind against current steepens the seas.","lessonTag":"nav-08"},{"id":"N90","module":"N","text":"After 2 hours, your fix is 3 nm from your DR, bearing 150°T from it. The current is:","options":["Set 150°T, drift 1.5 kn","Set 330°T, drift 1.5 kn","Set 150°T, drift 3 kn","Set 330°T, drift 6 kn"],"explanation":"Set is from the DR toward the fix.","lessonTag":"nav-08"},{"id":"N91","module":"N","text":"Your heading is read on the compass card at the:","options":["Lubber line","Gimbal","North mark","Compass rose"],"explanation":"The lubber line is aligned with the centerline.","lessonTag":"nav-09"},{"id":"N92","module":"N","text":"Variation:","options":["Is the same on every heading at a given location","Changes with the boat’s heading","Is caused by the boat’s electronics","Is found on the deviation card"],"explanation":"Read it from the chart’s compass rose.","lessonTag":"nav-09"},{"id":"N93","module":"N","text":"Deviation:","options":["Changes with the boat’s heading","Is the same on every heading","Is printed on the chart","Comes only from Earth’s field"],"explanation":"Record it on a deviation card.","lessonTag":"nav-09"},{"id":"N94","module":"N","text":"The compass reads 087° when the magnetic heading is 090°. Deviation is:","options":["3° east","3° west","0°","90°"],"explanation":"Compass least, error east.","lessonTag":"nav-09"},{"id":"N95","module":"N","text":"When correcting a compass bearing of a landmark, use the deviation for:","options":["The boat’s heading","The direction of the bearing","North","The average of all headings"],"explanation":"Deviation depends on how the boat is pointed.","lessonTag":"nav-09"},{"id":"N96","module":"N","text":"Compass heading 200°, deviation 3°E, variation 6°W. True heading:","options":["197°","209°","203°","191°"],"explanation":"200 + 3 = 203 M; 203 − 6 = 197 T.","lessonTag":"nav-09"},{"id":"N97","module":"N","text":"True course 090°, variation 7°W, deviation 1°E. Compass course:","options":["096°","098°","084°","082°"],"explanation":"090 + 7 = 097 M; 097 − 1 = 096 C.","lessonTag":"nav-09"},{"id":"N98","module":"N","text":"Variation 4°30′W in 2020, increasing 2′ per year. For 2026 use about:","options":["4°42′W","4°18′W","4°30′W","5°30′W"],"explanation":"6 years × 2′ = 12′ increase.","lessonTag":"nav-09"},{"id":"N99","module":"N","text":"The direction the bow is pointing at this moment is the:","options":["Heading","Course","Track","Bearing"],"explanation":"Course is intended; track is actual over the bottom.","lessonTag":"nav-10"},{"id":"N100","module":"N","text":"A GPS “COG” reading shows your:","options":["Course over ground, your actual track","Compass heading","Magnetic variation","Course to steer"],"explanation":"COG differs from heading when wind or current push you sideways.","lessonTag":"nav-10"},{"id":"N101","module":"N","text":"An object on your starboard beam bears:","options":["090° relative","270° relative","000° relative","180° relative"],"explanation":"Relative bearings run clockwise from the bow.","lessonTag":"nav-10"},{"id":"N102","module":"N","text":"True heading 300°; an object bears 090° relative. Its true bearing is:","options":["030°","210°","390°","300°"],"explanation":"300 + 090 = 390 − 360 = 030.","lessonTag":"nav-10"},{"id":"N103","module":"N","text":"True heading 045°; an object bears 270° relative. Its true bearing is:","options":["315°","225°","135°","270°"],"explanation":"045 + 270 = 315.","lessonTag":"nav-10"},{"id":"N104","module":"N","text":"A table shows 0° deviation at 060° and 2°W at 090°. Deviation on 075° is about:","options":["1°W","2°W","1°E","0°"],"explanation":"Interpolate halfway.","lessonTag":"nav-10"},{"id":"N105","module":"N","text":"A range is charted at 042°T; variation 6°W; your compass reads 051° on the range. Deviation is:","options":["3°W","3°E","9°W","6°W"],"explanation":"Magnetic is 048°; compass reads more, so the error is west.","lessonTag":"nav-10"},{"id":"N106","module":"N","text":"Checking a compass on all headings and recording the deviations is called:","options":["Swinging ship","Boxing the compass","Dead reckoning","Bobbing a light"],"explanation":"A compass adjuster can reduce deviation.","lessonTag":"nav-10"},{"id":"N107","module":"N","text":"GPS speed over ground comes from:","options":["Changes in GPS position over time","The knotmeter","The compass","Engine RPM"],"explanation":"It’s speed over the bottom, not through the water.","lessonTag":"nav-11"},{"id":"N108","module":"N","text":"A chartplotter’s datum should be set to:","options":["Match the chart’s datum (WGS 84 / NAD 83)","Mean lower low water","Whatever loads fastest","Magnetic north"],"explanation":"A mismatch shifts your position.","lessonTag":"nav-11"},{"id":"N109","module":"N","text":"Cross-track error shows:","options":["How far you are to the side of your intended track","Your compass error","Your depth","Time to the next waypoint"],"explanation":"Steer to reduce it.","lessonTag":"nav-11"},{"id":"N110","module":"N","text":"Before following a chartplotter route, you should:","options":["Zoom in and check every leg for hazards","Trust the straight lines","Turn off the depth sounder","Disable the alarms"],"explanation":"Routes can cross shoals.","lessonTag":"nav-11"},{"id":"N111","module":"N","text":"AIS Class B units are intended for:","options":["Smaller vessels","Large commercial ships","Shore stations only","Aircraft"],"explanation":"Class A is for larger commercial vessels.","lessonTag":"nav-11"},{"id":"N112","module":"N","text":"Seeing a vessel on AIS means:","options":["You have information, but you’re not “in sight” under the Rules","You’re in sight under the Rules","You have right of way","She can see you"],"explanation":"Many vessels don’t carry AIS at all.","lessonTag":"nav-11"},{"id":"N113","module":"N","text":"A depth sounder with no offset shows depth below the:","options":["Transducer","Keel","Waterline","Chart datum"],"explanation":"Know how yours is set.","lessonTag":"nav-11"},{"id":"N114","module":"N","text":"A DSC distress alert sends your position only if the radio has:","options":["A registered MMSI and a GPS connection","A long antenna","Channel 13 selected","A Class B AIS"],"explanation":"Register the MMSI and connect GPS.","lessonTag":"nav-11"},{"id":"N115","module":"N","text":"Radar measures which more accurately?","options":["Range","Bearing","They’re equal","Neither"],"explanation":"Beam width limits bearing accuracy.","lessonTag":"nav-12"},{"id":"N116","module":"N","text":"The radar control that measures range to a target is the:","options":["Variable range marker (VRM)","Electronic bearing line (EBL)","Gain","Sea clutter"],"explanation":"The EBL measures bearing.","lessonTag":"nav-12"},{"id":"N117","module":"N","text":"A target stays on your EBL while its range decreases. This means:","options":["Risk of collision exists","The target is moving away","The target is stationary","Your radar is broken"],"explanation":"A steady bearing with closing range.","lessonTag":"nav-12"},{"id":"N118","module":"N","text":"Sea clutter (STC) control:","options":["Reduces echoes from nearby waves","Removes rain returns","Increases range","Adjusts the heading line"],"explanation":"Too much can erase small targets.","lessonTag":"nav-12"},{"id":"N119","module":"N","text":"Turning rain or sea clutter controls up too far can:","options":["Erase real targets such as small boats","Improve every target","Increase the radar horizon","Fix false echoes"],"explanation":"Adjust carefully.","lessonTag":"nav-12"},{"id":"N120","module":"N","text":"Approaching a low, sandy coast by radar at night, the first strong echo may come from:","options":["Higher land or buildings inland","The surf line","A buoy","The sea bottom"],"explanation":"You may be closer to the beach than you think.","lessonTag":"nav-12"},{"id":"N121","module":"N","text":"CPA stands for:","options":["Closest point of approach","Course per azimuth","Corrected plotting angle","Collision probability alert"],"explanation":"TCPA is the time to CPA.","lessonTag":"nav-12"},{"id":"N122","module":"N","text":"Small fiberglass boats are poor radar targets, so they should carry:","options":["A radar reflector","A gong","A strobe light","An extra compass"],"explanation":"Mounted as high as practical.","lessonTag":"nav-12"},{"id":"N123","module":"N","text":"In the Northern Hemisphere, winds blow around a low:","options":["Counterclockwise and inward","Clockwise and outward","Straight inward","Only from the north"],"explanation":"Highs are clockwise and outward.","lessonTag":"nav-13"},{"id":"N124","module":"N","text":"A cold front is drawn on a weather map with:","options":["Triangles","Semicircles","Dashed lines","Circles"],"explanation":"Warm fronts use semicircles.","lessonTag":"nav-13"},{"id":"N125","module":"N","text":"After a Florida cold front passes, the wind usually:","options":["Veers west, then northwest and north","Backs to the south","Dies for a week","Blows from the east"],"explanation":"The barometer rises and skies clear.","lessonTag":"nav-13"},{"id":"N126","module":"N","text":"A long period of low clouds, drizzle and poor visibility usually comes ahead of a:","options":["Warm front","Cold front","High pressure system","Sea breeze"],"explanation":"Warm fronts move slowly.","lessonTag":"nav-13"},{"id":"N127","module":"N","text":"A gale warning is issued for sustained winds of:","options":["34 to 47 knots","20 to 33 knots","48 to 63 knots","64 knots and over"],"explanation":"A storm warning is 48 to 63.","lessonTag":"nav-13"},{"id":"N128","module":"N","text":"Beaufort force 6, a strong breeze, is:","options":["22 to 27 knots","11 to 16 knots","34 to 40 knots","1 to 3 knots"],"explanation":"Large waves with extensive foam crests.","lessonTag":"nav-13"},{"id":"N129","module":"N","text":"Anvil-topped cumulonimbus clouds indicate:","options":["Thunderstorms","Fair weather","A warm front two days away","Fog"],"explanation":"Expect lightning, gusts and heavy rain.","lessonTag":"nav-13"},{"id":"N130","module":"N","text":"A rapidly falling barometer means:","options":["Strong wind is coming soon","Fair weather ahead","Fog is lifting","The tide is turning"],"explanation":"A rising barometer means improving weather.","lessonTag":"nav-13"},{"id":"N131","module":"N","text":"Florida summer thunderstorms usually:","options":["Build over land in the afternoon and drift toward the coast","Form only at night offshore","Occur only in winter","Never produce lightning over water"],"explanation":"Head in early.","lessonTag":"nav-14"},{"id":"N132","module":"N","text":"To avoid a waterspout, move:","options":["Away at right angles to its path","Directly toward it","Directly away along its path","Underneath it"],"explanation":"Treat every waterspout as dangerous.","lessonTag":"nav-14"},{"id":"N133","module":"N","text":"A tropical storm has sustained winds of:","options":["34 to 63 knots","Under 34 knots","64 knots and over","96 knots and over"],"explanation":"Hurricanes are 64 knots and over.","lessonTag":"nav-14"},{"id":"N134","module":"N","text":"Atlantic hurricane season runs:","options":["June 1 to November 30","January 1 to March 31","May 1 to August 31","All year equally"],"explanation":"The peak is August through October.","lessonTag":"nav-14"},{"id":"N135","module":"N","text":"In the Northern Hemisphere, the dangerous semicircle of a hurricane is:","options":["To the right of its track","To the left of its track","Behind it","In the eye"],"explanation":"Forward motion adds to the wind on the right side.","lessonTag":"nav-14"},{"id":"N136","module":"N","text":"A hurricane warning means hurricane conditions are:","options":["Expected, usually within 36 hours","Possible within 48 hours","Over","Unlikely"],"explanation":"A watch means possible, usually within 48 hours.","lessonTag":"nav-14"},{"id":"N137","module":"N","text":"Fog formed when warm, moist air moves over cooler water is:","options":["Advection fog","Radiation fog","Frontal fog","Steam fog"],"explanation":"Common in Florida in winter and spring.","lessonTag":"nav-14"},{"id":"N138","module":"N","text":"Wave size depends on wind speed, duration and:","options":["Fetch","Tide height","Water temperature","Moon phase"],"explanation":"Fetch is the distance of open water the wind blows over.","lessonTag":"nav-14"},{"id":"D25","module":"D","text":"An OUPV credential allows carrying up to how many passengers for hire?","options":["6","12","4","Unlimited on inspected vessels"],"explanation":"On uninspected vessels.","lessonTag":"deck-01"},{"id":"D26","module":"D","text":"An OUPV Near Coastal endorsement extends up to:","options":["100 nm offshore","3 nm offshore","200 nm offshore","The boundary line only"],"explanation":"Inland endorsements stop at the boundary line.","lessonTag":"deck-01"},{"id":"D27","module":"D","text":"Friends voluntarily split the actual fuel and bait cost of a trip. Under federal law that is:","options":["Not consideration, so they aren’t passengers for hire","Consideration, so they are passengers for hire","Legal only beyond 12 nm","A bareboat charter"],"explanation":"Voluntary sharing of actual expenses is excluded from “consideration.”","lessonTag":"deck-01"},{"id":"D28","module":"D","text":"Carrying more than 6 passengers for hire requires:","options":["An inspected vessel with a COI and a Master license","An OUPV with a waiver","Only extra life jackets","A Florida permit"],"explanation":"The COI sets the passenger limit.","lessonTag":"deck-01"},{"id":"D29","module":"D","text":"A commercial vessel operator is considered intoxicated at a BAC of:","options":["0.04%","0.08%","0.10%","0.02%"],"explanation":"Half the recreational limit.","lessonTag":"deck-01"},{"id":"D30","module":"D","text":"After a serious marine incident, alcohol testing must be done within:","options":["2 hours","32 hours","24 hours","5 days"],"explanation":"Drug testing within 32 hours.","lessonTag":"deck-01"},{"id":"D31","module":"D","text":"Which is NOT a required drug test?","options":["An annual birthday test","Pre-employment","Random","Post-casualty"],"explanation":"Reasonable-cause testing is also required.","lessonTag":"deck-01"},{"id":"D32","module":"D","text":"A boat of 5 net tons or more carrying passengers for hire between U.S. points needs:","options":["Coast Guard documentation with a coastwise endorsement","Only state registration","No paperwork","A foreign flag"],"explanation":"Smaller boats are state registered.","lessonTag":"deck-01"},{"id":"D33","module":"D","text":"An OUPV credential is valid for:","options":["5 years","1 year","10 years","Life"],"explanation":"Renew through the National Maritime Center.","lessonTag":"deck-01"},{"id":"D34","module":"D","text":"Uninspected passenger vessels carrying passengers for hire must carry, for each person:","options":["An approved offshore (Type I or equivalent) life jacket","Any approved throwable","A ski vest","A belt-pack inflatable only"],"explanation":"Plus child sizes for children.","lessonTag":"deck-02"},{"id":"D35","module":"D","text":"A boat 26 ft to under 40 ft with no fixed system needs:","options":["Two B-I (5-B) or one B-II (20-B) extinguishers","One B-I","Three B-II","None"],"explanation":"A fixed engine-room system reduces this by one B-I.","lessonTag":"deck-02"},{"id":"D36","module":"D","text":"Disposable fire extinguishers must be replaced:","options":["12 years after the date of manufacture","Every year","Never","After 42 months"],"explanation":"Check the date stamped on the bottle.","lessonTag":"deck-02"},{"id":"D37","module":"D","text":"Pyrotechnic visual distress signals expire:","options":["42 months after manufacture","12 years after manufacture","After 1 year","Never"],"explanation":"Check the dates.","lessonTag":"deck-02"},{"id":"D38","module":"D","text":"Which visual distress signal is acceptable for day use only?","options":["Orange smoke","Red hand flare","Red meteor","Red parachute flare"],"explanation":"The orange flag is also day only.","lessonTag":"deck-02"},{"id":"D39","module":"D","text":"A non-pyrotechnic visual distress signal for night use is:","options":["An electric SOS distress light","An orange flag","Orange smoke","A white flare"],"explanation":"The orange flag covers day use.","lessonTag":"deck-02"},{"id":"D40","module":"D","text":"Before starting a gasoline inboard, run the blower for at least:","options":["4 minutes","30 seconds","10 minutes","1 hour"],"explanation":"Then sniff the bilge.","lessonTag":"deck-02"},{"id":"D41","module":"D","text":"A gasoline inboard engine must have a:","options":["Backfire flame arrestor","Catalytic converter","Spark arrestor on the exhaust","Water separator only"],"explanation":"Keep it clean and secured.","lessonTag":"deck-02"},{"id":"D42","module":"D","text":"The four elements of the fire tetrahedron are heat, fuel, oxygen and:","options":["A chemical chain reaction","Carbon dioxide","Water vapor","Smoke"],"explanation":"Remove any one to put the fire out.","lessonTag":"deck-03"},{"id":"D43","module":"D","text":"A Class B fire involves:","options":["Flammable liquids such as gasoline","Wood and paper","Energized electrical equipment","Combustible metals"],"explanation":"The most common boat fire.","lessonTag":"deck-03"},{"id":"D44","module":"D","text":"Carbon dioxide extinguishers work mainly by:","options":["Displacing oxygen","Cooling with water","Leaving a protective film","Removing the fuel"],"explanation":"No residue, but short range.","lessonTag":"deck-03"},{"id":"D45","module":"D","text":"A solid stream of water should never be used on:","options":["Burning fuel or energized electrical equipment","Burning wood","Burning cushions","Burning paper"],"explanation":"It spreads fuel and conducts electricity.","lessonTag":"deck-03"},{"id":"D46","module":"D","text":"With a portable extinguisher, aim at:","options":["The base of the flames","The top of the flames","The smoke","The overhead"],"explanation":"PASS: Pull, Aim, Squeeze, Sweep.","lessonTag":"deck-03"},{"id":"D47","module":"D","text":"For an engine compartment fire, you should first:","options":["Shut down engines, fuel and blowers, and close vents","Open the hatch to look","Turn on the blowers","Speed up"],"explanation":"Starve it of fuel and air.","lessonTag":"deck-03"},{"id":"D48","module":"D","text":"After a fixed system discharges in the engine room, wait before opening at least:","options":["15 minutes","30 seconds","2 minutes","2 hours"],"explanation":"Let it cool so it doesn’t reignite.","lessonTag":"deck-03"},{"id":"D49","module":"D","text":"A galley grease fire is best put out by:","options":["Smothering it with a lid or fire blanket","Throwing water on it","Fanning it","Carrying the pan outside"],"explanation":"Water makes grease fires explode.","lessonTag":"deck-03"},{"id":"D50","module":"D","text":"Gasoline vapor is:","options":["Heavier than air and collects in the bilge","Lighter than air and rises away","Harmless in small amounts","Only dangerous in winter"],"explanation":"Ventilate before starting.","lessonTag":"deck-04"},{"id":"D51","module":"D","text":"While fueling, you should:","options":["Close hatches and ports and stop engines","Keep the engine running","Leave cabin doors open","Let passengers smoke on the bow"],"explanation":"Open everything up afterward.","lessonTag":"deck-04"},{"id":"D52","module":"D","text":"After fueling and before starting a gasoline engine:","options":["Run the blower at least 4 minutes and sniff the bilge","Start immediately","Close all hatches","Turn off the blower"],"explanation":"Your nose is a backup to the vapor detector.","lessonTag":"deck-04"},{"id":"D53","module":"D","text":"Keeping the fuel nozzle in contact with the fill pipe:","options":["Prevents a static spark","Speeds fueling","Is only needed for diesel","Prevents overfilling"],"explanation":"It grounds the nozzle.","lessonTag":"deck-04"},{"id":"D54","module":"D","text":"Carbon monoxide poisoning symptoms are often mistaken for:","options":["Seasickness","Sunburn","A sprained ankle","Hunger"],"explanation":"Headache, nausea, dizziness.","lessonTag":"deck-04"},{"id":"D55","module":"D","text":"The “station wagon effect” describes:","options":["Exhaust drawn back aboard by the boat’s motion","A fuel leak","Wake damage","A towing method"],"explanation":"Watch the stern and enclosed areas.","lessonTag":"deck-04"},{"id":"D56","module":"D","text":"Charging batteries give off:","options":["Explosive hydrogen gas","Carbon monoxide","Chlorine","Nothing"],"explanation":"Ventilate battery compartments.","lessonTag":"deck-04"},{"id":"D57","module":"D","text":"To prevent electric shock drowning:","options":["Never let anyone swim near docks with shore power","Swim only at night","Swim only in salt water","Turn on the bilge pump"],"explanation":"Faulty wiring can energize the water.","lessonTag":"deck-04"},{"id":"D58","module":"D","text":"The metacentric height is the distance between:","options":["G and M","B and M","G and B","The keel and G"],"explanation":"A larger GM means more initial stability.","lessonTag":"deck-05"},{"id":"D59","module":"D","text":"Passengers climbing up onto a tower:","options":["Raises G and reduces stability","Lowers G","Has no effect","Increases reserve buoyancy"],"explanation":"Keep weight low.","lessonTag":"deck-05"},{"id":"D60","module":"D","text":"Free surface effect is reduced by:","options":["Keeping tanks full or empty and bilges dry","Keeping tanks half full","Adding weight high","Opening hatches"],"explanation":"Sloshing liquid acts like raising G.","lessonTag":"deck-05"},{"id":"D61","module":"D","text":"A steady lean caused by off-center weight or flooding is called:
