","options":["List","Heel","Trim","Sheer"],"explanation":"Heel is temporary, from wind, waves or a turn.","lessonTag":"deck-05"},{"id":"D62","module":"D","text":"A boat with a slow, lazy roll is:","options":["Tender, with a small GM","Stiff, with a large GM","Overloaded forward","Perfectly balanced"],"explanation":"A quick, snappy roll means stiff.","lessonTag":"deck-05"},{"id":"D63","module":"D","text":"Reserve buoyancy is:","options":["Watertight volume above the waterline","Extra fuel","Spare life jackets","Ballast in the keel"],"explanation":"More freeboard usually means more reserve buoyancy.","lessonTag":"deck-05"},{"id":"D64","module":"D","text":"When a boat heels, the center of buoyancy:","options":["Moves toward the low side","Stays on the centerline","Moves toward the high side","Moves aft"],"explanation":"That creates the righting arm.","lessonTag":"deck-05"},{"id":"D65","module":"D","text":"The fore-and-aft balance of a boat is called:","options":["Trim","List","Heel","Camber"],"explanation":"Down by the bow or down by the stern.","lessonTag":"deck-05"},{"id":"D66","module":"D","text":"A planing hull at speed:","options":["Rises onto the water’s surface","Pushes through the water like a displacement hull","Can’t exceed hull speed","Makes no wake"],"explanation":"Displacement hulls are limited by waterline length.","lessonTag":"deck-06"},{"id":"D67","module":"D","text":"Scuppers and freeing ports must be:","options":["Kept clear so water drains off the deck","Plugged permanently","Painted shut","Used to store gear"],"explanation":"Water on deck reduces stability.","lessonTag":"deck-06"},{"id":"D68","module":"D","text":"Hoses below the waterline should be secured with:","options":["Double stainless clamps","Tape","One plastic tie","Rope"],"explanation":"Inspect seacocks and hoses regularly.","lessonTag":"deck-06"},{"id":"D69","module":"D","text":"The first step when you discover flooding is to:","options":["Find the source","Abandon ship","Call your insurer","Speed up"],"explanation":"Then stop or slow it, pump, and call for help.","lessonTag":"deck-06"},{"id":"D70","module":"D","text":"Soft wood plugs are kept aboard to:","options":["Plug a failed through-hull fitting","Repair the engine","Start a fire","Mark a channel"],"explanation":"Tie one beside each through-hull.","lessonTag":"deck-06"},{"id":"D71","module":"D","text":"A bilge pump’s real output is less than its rating because of:","options":["The height it lifts water and its hose length","Salt water","Moon phase","Engine RPM"],"explanation":"Carry a manual backup pump.","lessonTag":"deck-06"},{"id":"D72","module":"D","text":"A boat slewed sideways by a following sea has:","options":["Broached","Pitchpoled","Listed","Trimmed"],"explanation":"Pitchpoling is flipping end over end.","lessonTag":"deck-06"},{"id":"D73","module":"D","text":"In a following sea, trim tabs should usually be:","options":["Raised to keep the bow up","Fully down","Removed","Ignored"],"explanation":"Bow-down trim lets the bow dig in.","lessonTag":"deck-06"},{"id":"D74","module":"D","text":"A right-hand propeller going astern walks the stern to:","options":["Port","Starboard","Straight back","Nowhere"],"explanation":"Many single-screw captains dock port side to.","lessonTag":"deck-07"},{"id":"D75","module":"D","text":"A single-screw inboard steers poorly at very low speed because:","options":["Little water flows over the rudder","The propeller stops","The rudder locks","Of the tide"],"explanation":"A burst of power restores steering.","lessonTag":"deck-07"},{"id":"D76","module":"D","text":"Going ahead, a boat pivots about a point roughly:","options":["A third of its length from the bow","At the transom","At the stern","Ahead of the bow"],"explanation":"So the stern swings wide in a turn.","lessonTag":"deck-07"},{"id":"D77","module":"D","text":"To spin a twin-screw boat in place, put:","options":["One engine ahead and the other astern","Both ahead","Both astern","Both in neutral and use the rudders"],"explanation":"Steer with the engines at low speed.","lessonTag":"deck-07"},{"id":"D78","module":"D","text":"When docking, it’s usually best to approach:","options":["Slowly, into the stronger of wind or current","Fast, with the current behind you","At right angles at speed","With no lines ready"],"explanation":"Heading into it gives you control.","lessonTag":"deck-07"},{"id":"D79","module":"D","text":"Crew should fend off using:","options":["Fenders or a boat hook, never hands or feet","Their feet","Their hands","Their backs"],"explanation":"Crushing injuries are common.","lessonTag":"deck-07"},{"id":"D80","module":"D","text":"To swing the stern away from a dock when leaving, a common method is to:","options":["Motor gently ahead against a bow spring","Back hard with no lines","Push off by hand","Drop the anchor"],"explanation":"The spring holds the bow while the stern pivots out.","lessonTag":"deck-07"},{"id":"D81","module":"D","text":"The best line for an anchor rode, because it stretches and absorbs shock, is:","options":["Nylon","Polyester","Polypropylene","Wire"],"explanation":"Polyester stretches little.","lessonTag":"deck-08"},{"id":"D82","module":"D","text":"A line that floats, often used on ring buoys, is:","options":["Polypropylene","Nylon","Polyester","Manila"],"explanation":"It weakens in sunlight.","lessonTag":"deck-08"},{"id":"D83","module":"D","text":"The knot that makes a fixed loop that won’t slip or jam is the:","options":["Bowline","Clove hitch","Sheet bend","Square knot"],"explanation":"Easy to untie even after a heavy load.","lessonTag":"deck-08"},{"id":"D84","module":"D","text":"Two lines of different sizes are best joined with a:","options":["Sheet bend","Clove hitch","Bowline","Figure-eight"],"explanation":"Single or double sheet bend.","lessonTag":"deck-08"},{"id":"D85","module":"D","text":"A figure-eight knot is used as a:","options":["Stopper knot","Way to join two lines","Fixed loop","Cleat hitch"],"explanation":"Keeps a line from running out.","lessonTag":"deck-08"},{"id":"D86","module":"D","text":"A bow spring leading aft to the dock stops the boat from moving:","options":["Forward","Aft","Away from the dock","Up and down"],"explanation":"A stern spring leading forward stops it moving back.","lessonTag":"deck-08"},{"id":"D87","module":"D","text":"Tying a knot in a line generally:","options":["Reduces its strength significantly","Increases its strength","Has no effect","Doubles its strength"],"explanation":"A splice keeps more strength.","lessonTag":"deck-08"},{"id":"D88","module":"D","text":"The snap-back zone is:","options":["The area a parting line under load can whip through","Where lines are coiled","The bow pulpit","A type of knot"],"explanation":"Stay out of a loaded line’s path.","lessonTag":"deck-08"},{"id":"D89","module":"D","text":"A fluke (Danforth-type) anchor holds best in:","options":["Sand and mud","Rock","Coral","Thick weed"],"explanation":"Grapnels are for rock and wrecks.","lessonTag":"deck-09"},{"id":"D90","module":"D","text":"A mushroom anchor is best suited to:","options":["Permanent moorings in soft mud","Rocky bottoms","Anchoring offshore for fishing","Coral reefs"],"explanation":"It holds by suction over time.","lessonTag":"deck-09"},{"id":"D91","module":"D","text":"Chain at the anchor end of the rode:","options":["Keeps the pull low and resists chafe","Floats the rode","Isn’t needed","Lightens the anchor"],"explanation":"Nylon above it absorbs shock.","lessonTag":"deck-09"},{"id":"D92","module":"D","text":"Depth 15 ft, bow 3 ft above the water. For 7:1 scope, let out:","options":["126 ft","105 ft","90 ft","147 ft"],"explanation":"(15 + 3) × 7 = 126 ft.","lessonTag":"deck-09"},{"id":"D93","module":"D","text":"You should anchor from:","options":["The bow","The stern","The side","The transom cleat"],"explanation":"Anchoring by the stern can swamp a boat.","lessonTag":"deck-09"},{"id":"D94","module":"D","text":"A sign your anchor is dragging is:","options":["Your bearings to fixed objects keep changing","The boat swings with the wind","The rode tightens in a gust","The tide changes"],"explanation":"A GPS anchor alarm helps.","lessonTag":"deck-09"},{"id":"D95","module":"D","text":"A trip line attached to the anchor’s crown helps you:","options":["Free an anchor fouled on the bottom","Set it faster","Measure depth","Mark the channel"],"explanation":"It pulls the anchor out backward.","lessonTag":"deck-09"},{"id":"D96","module":"D","text":"In the Florida Keys National Marine Sanctuary, at coral reefs you should:","options":["Use a mooring buoy instead of anchoring on coral","Anchor anywhere","Anchor on the coral","Drag the anchor slowly"],"explanation":"Anchoring on coral is prohibited.","lessonTag":"deck-09"},{"id":"D97","module":"D","text":"In rough head seas, it’s usually best to:","options":["Slow down and take the seas at a slight angle","Speed up straight into them","Turn beam-on","Shut down the engines"],"explanation":"Reduce pounding and keep control.","lessonTag":"deck-10"},{"id":"D98","module":"D","text":"The most dangerous inlet conditions usually come with:","options":["A strong ebb against an onshore wind","Slack water and no wind","A flood current with an offshore wind","A calm night"],"explanation":"Breaking seas build in the entrance.","lessonTag":"deck-10"},{"id":"D99","module":"D","text":"When towing another boat, attach the towline to:","options":["A bridle spreading the load between strong points","One small cleat","The swim ladder","The bow rail"],"explanation":"Strong points only.","lessonTag":"deck-10"},{"id":"D100","module":"D","text":"A towline should be long enough to:","options":["Have a sag that absorbs shock","Be bar tight","Drag on the bottom","Reach the propeller"],"explanation":"Keep tow speed low.","lessonTag":"deck-10"},{"id":"D101","module":"D","text":"After running aground, before trying to back off you should:","options":["Check for leaks and damage","Back hard immediately","Have passengers jump overboard","Open the seacocks"],"explanation":"Backing a holed boat off can sink it.","lessonTag":"deck-10"},{"id":"D102","module":"D","text":"Carrying an anchor out to pull a boat off a shoal is called:","options":["Kedging","Warping a range","Scoping","Swinging ship"],"explanation":"Or wait for the rising tide.","lessonTag":"deck-10"},{"id":"D103","module":"D","text":"An unintended grounding of a commercial vessel is:","options":["A reportable marine casualty","Never reportable","Reportable only with injuries","Reportable only offshore"],"explanation":"Notify the Coast Guard and file CG-2692.","lessonTag":"deck-10"},{"id":"D104","module":"D","text":"After a collision, your first concern is:","options":["Injuries to everyone aboard","Exchanging insurance details","Photographing the damage","Leaving the area"],"explanation":"Then assess damage and render assistance.","lessonTag":"deck-10"},{"id":"D105","module":"D","text":"When someone falls overboard, first:","options":["Shout, point, keep eyes on them and throw flotation","Call your insurer","Back straight toward them","Go below for a life jacket"],"explanation":"Then press MOB on the GPS.","lessonTag":"deck-11"},{"id":"D106","module":"D","text":"Turning toward the side a person fell from:","options":["Swings the stern and propellers away from them","Brings the propeller toward them","Has no effect","Is never correct"],"explanation":"Kick the stern clear.","lessonTag":"deck-11"},{"id":"D107","module":"D","text":"The Williamson turn is most useful when:","options":["The person is out of sight, such as at night","The person is right alongside","You’re at anchor","Docking"],"explanation":"It brings you back down your own track.","lessonTag":"deck-11"},{"id":"D108","module":"D","text":"In a Williamson turn, you shift the rudder the other way when you’re about:","options":["60° off your original course","10° off course","180° off course","90° off course"],"explanation":"Then steady on the reciprocal course.","lessonTag":"deck-11"},{"id":"D109","module":"D","text":"Recover a person from the water:","options":["Over the side, with the engine in neutral","Over the stern near the propeller","While moving at speed","By backing toward them"],"explanation":"Keep the propeller away from them.","lessonTag":"deck-11"},{"id":"D110","module":"D","text":"The HELP position in the water means:","options":["Knees to chest and arms crossed to reduce heat loss","Swimming hard to keep warm","Floating face down","Taking off your life jacket"],"explanation":"Huddle if you’re in a group.","lessonTag":"deck-11"},{"id":"D111","module":"D","text":"In the 1-10-1 rule, cold water shock lasts about:","options":["1 minute","10 minutes","1 hour","1 day"],"explanation":"Then about 10 minutes of useful movement, and about an hour before unconsciousness.","lessonTag":"deck-11"},{"id":"D112","module":"D","text":"Abandon the boat for a life raft:","options":["Only when the boat is clearly lost","At the first sign of trouble","Whenever the engine fails","Before sending a Mayday"],"explanation":"A floating boat is easier to find.","lessonTag":"deck-11"},{"id":"D113","module":"D","text":"“Pan-pan” indicates:","options":["An urgent situation without immediate danger to life","Grave and imminent danger","A navigation safety message","A routine call"],"explanation":"Mayday is distress; securité is safety.","lessonTag":"deck-12"},{"id":"D114","module":"D","text":"A DSC distress alert goes out on channel:","options":["70","16","13","22A"],"explanation":"Then follow up by voice on 16.","lessonTag":"deck-12"},{"id":"D115","module":"D","text":"After sending a DSC distress alert, you should:","options":["Follow up by voice on channel 16","Turn off the radio","Switch to channel 9 and wait","Wait for a phone call"],"explanation":"Give the details by voice.","lessonTag":"deck-12"},{"id":"D116","module":"D","text":"Radio checks should be made:","options":["On a working channel or automated service, not channel 16","On channel 16","On channel 70","Only during emergencies"],"explanation":"Keep 16 clear.","lessonTag":"deck-12"},{"id":"D117","module":"D","text":"A false distress call is:","options":["A federal crime","Allowed for testing","Fine if canceled later","Required monthly"],"explanation":"Penalties include fines and prison.","lessonTag":"deck-12"},{"id":"D118","module":"D","text":"When a helicopter lowers a rescue basket, you should:","options":["Let it touch the water or deck first","Grab it right away","Tie it to the boat","Push it away"],"explanation":"It carries a static charge. Never tie off the cable.","lessonTag":"deck-12"},{"id":"D119","module":"D","text":"An EPIRB must be registered with:","options":["NOAA","The marina","The state FWC","Your insurer"],"explanation":"Registration tells rescuers who you are.","lessonTag":"deck-12"},{"id":"D120","module":"D","text":"The phonetic word for the letter C is:","options":["Charlie","Charles","Cat","Carol"],"explanation":"Alfa, Bravo, Charlie, Delta…","lessonTag":"deck-12"},{"id":"D121","module":"D","text":"Adult CPR compressions should be given at a rate of:","options":["100 to 120 per minute","60 per minute","200 per minute","30 per minute"],"explanation":"About 2 inches deep.","lessonTag":"deck-13"},{"id":"D122","module":"D","text":"The first step to control serious bleeding is:","options":["Firm, direct pressure on the wound","A tourniquet on every wound","Elevation alone","Giving water"],"explanation":"A tourniquet is for life-threatening limb bleeding.","lessonTag":"deck-13"},{"id":"D123","module":"D","text":"Hot skin and confusion in hot weather suggest:","options":["Heat stroke","Heat exhaustion","Hypothermia","Seasickness"],"explanation":"A medical emergency.","lessonTag":"deck-13"},{"id":"D124","module":"D","text":"Pale, cool, sweaty skin and weakness in hot weather suggest:","options":["Heat exhaustion","Heat stroke","Hypothermia","A stroke"],"explanation":"Shade, cooling, fluids and rest.","lessonTag":"deck-13"},{"id":"D125","module":"D","text":"A stingray or lionfish spine wound is best treated by:","options":["Soaking in water as hot as the person can tolerate","Ice","A tourniquet","Rubbing alcohol only"],"explanation":"Heat breaks down the venom. Seek care.","lessonTag":"deck-13"},{"id":"D126","module":"D","text":"Rinse a jellyfish sting with:","options":["Seawater, not fresh water","Fresh water","Soda","Nothing"],"explanation":"Fresh water can trigger more stinging cells.","lessonTag":"deck-13"},{"id":"D127","module":"D","text":"A minor burn should be cooled with:","options":["Cool running water for 10 to 20 minutes","Ice directly on the skin","Butter","Nothing"],"explanation":"Then cover it loosely.","lessonTag":"deck-13"},{"id":"D128","module":"D","text":"With a suspected neck or back injury, you should:","options":["Keep the person still unless they’re in danger","Sit them up","Walk them around","Give them alcohol"],"explanation":"Moving them can cause permanent harm.","lessonTag":"deck-13"},{"id":"D129","module":"D","text":"Oil spills must be reported to:","options":["The National Response Center","The marina only","No one if small","The EPA by mail"],"explanation":"1-800-424-8802.","lessonTag":"deck-14"},{"id":"D130","module":"D","text":"On an oil sheen, you should NOT use:","options":["Dish soap or dispersants","Absorbent pads","A report to the NRC","Containment booms"],"explanation":"Soap sinks oil and is itself a violation.","lessonTag":"deck-14"},{"id":"D131","module":"D","text":"The MARPOL Annex V garbage placard is required on boats:","options":["26 ft and over","16 ft and over","40 ft and over","Over 100 GT only"],"explanation":"The oil placard too.","lessonTag":"deck-14"},{"id":"D132","module":"D","text":"A written waste management plan is required on ocean-going boats:","options":["40 ft and over with a galley and berthing","26 ft and over","Under 20 ft","Of any size"],"explanation":"MARPOL Annex V.","lessonTag":"deck-14"},{"id":"D133","module":"D","text":"Plastics, including fishing line, may be discharged:","options":["Never","Beyond 12 nm","Beyond 25 nm","If ground up"],"explanation":"Bring all plastic back.","lessonTag":"deck-14"},{"id":"D134","module":"D","text":"Food waste that hasn’t been ground up may be discharged no closer to land than:","options":["12 nm","3 nm","1 nm","Anywhere"],"explanation":"Ground food waste: 3 nm.","lessonTag":"deck-14"},{"id":"D135","module":"D","text":"A Type III marine sanitation device is a:","options":["Holding tank","Flow-through treatment device","Portable toilet","Macerator"],"explanation":"Empty it at a pump-out station.","lessonTag":"deck-14"},{"id":"D136","module":"D","text":"In a no-discharge zone such as the Florida Keys:","options":["No sewage may be discharged, treated or not","Treated sewage is allowed","Discharge is allowed at night","Type I discharge is allowed"],"explanation":"Use pump-out stations.","lessonTag":"deck-14"},{"id":"D137","module":"D","text":"Which is a reportable marine casualty?","options":["An unintended grounding","Running out of ice","A seasick passenger","Routine refueling"],"explanation":"Report to the Coast Guard.","lessonTag":"deck-15"},{"id":"D138","module":"D","text":"Property damage over what amount makes a marine casualty reportable?","options":["$75,000","$5,000","$500,000","$1,000"],"explanation":"Deaths, serious injuries and loss of control are also reportable.","lessonTag":"deck-15"},{"id":"D139","module":"D","text":"After notifying the Coast Guard of a marine casualty, file Form CG-2692 within:","options":["5 days","24 hours","30 days","1 year"],"explanation":"Keep your records and evidence.","lessonTag":"deck-15"},{"id":"D140","module":"D","text":"To request a drawbridge opening by horn, sound:","options":["One prolonged and one short blast","Five short blasts","Three short blasts","One short blast"],"explanation":"Most Florida bridges also monitor VHF 9.","lessonTag":"deck-15"},{"id":"D141","module":"D","text":"A drawbridge answering with five short blasts means:","options":["It can’t open right now","It will open immediately","Proceed at full speed","The channel is closed for good"],"explanation":"One prolonged and one short means it will open.","lessonTag":"deck-15"},{"id":"D142","module":"D","text":"Within 500 yards of a large U.S. naval vessel you must:","options":["Operate at minimum speed and stay at least 100 yards away","Anchor","Sound five blasts","Speed up to pass quickly"],"explanation":"The Naval Vessel Protection Zone.","lessonTag":"deck-15"},{"id":"D143","module":"D","text":"An injury is a reportable marine casualty when it requires:","options":["Professional medical treatment beyond first aid","Any bandage","Sunscreen","A short rest"],"explanation":"A death is always reportable.","lessonTag":"deck-15"},{"id":"D144","module":"D","text":"A charter captain’s boat insurance should be:","options":["Commercial charter coverage","A standard recreational policy","Unnecessary","Homeowner’s insurance"],"explanation":"Recreational policies usually exclude paying passengers.","lessonTag":"deck-15"},{"id":"P14","module":"P","text":"Distance on a chart is measured on the:","options":["Latitude scale at the side, beside your work","Longitude scale at the top","Compass rose","Title block"],"explanation":"1′ of latitude = 1 nm.","lessonTag":"plot-01"},{"id":"P15","module":"P","text":"The outer ring of a compass rose shows:","options":["True directions","Magnetic directions","Compass directions","Deviation"],"explanation":"The inner ring is magnetic.","lessonTag":"plot-01"},{"id":"P16","module":"P","text":"When reading a course on the rose, read:","options":["The side in your direction of travel","Either side; they’re the same","Only the inner ring","Only the north mark"],"explanation":"The wrong side puts you 180° off.","lessonTag":"plot-01"},{"id":"P17","module":"P","text":"The usual training chart for the plotting exam is:","options":["1210-Tr, Martha’s Vineyard to Block Island","Chart No. 1","A Florida harbor chart","A world Mercator chart"],"explanation":"Even for Florida candidates.","lessonTag":"plot-01"},{"id":"P18","module":"P","text":"The variation printed in a compass rose is correct for:","options":["The year shown; apply the annual change for other years","All years","Only the inner ring","Daytime only"],"explanation":"Update it, unless the question gives the variation.","lessonTag":"plot-01"},{"id":"P19","module":"P","text":"Dividers are used to:","options":["Measure distances and positions","Draw course lines","Read the compass","Steer"],"explanation":"Parallel rulers transfer directions.","lessonTag":"plot-01"},{"id":"P20","module":"P","text":"A position is written:","options":["Latitude first, then longitude","Longitude first","Either way","As a distance and bearing only"],"explanation":"For example 41°18.5′N, 71°35.0′W.","lessonTag":"plot-02"},{"id":"P21","module":"P","text":"In west longitude, numbers increase toward the:","options":["West (left)","East (right)","Top","Bottom"],"explanation":"Check the direction when measuring from a meridian.","lessonTag":"plot-02"},{"id":"P22","module":"P","text":"41°18.5′ means:","options":["41 degrees, 18 and a half minutes","41 degrees, 18 minutes, 5 seconds","41.185 degrees","41 degrees, 185 minutes"],"explanation":"Minutes are divided into tenths.","lessonTag":"plot-02"},{"id":"P23","module":"P","text":"The latitude of a point is read on the:","options":["Side scale","Top scale","Compass rose","Title block"],"explanation":"Longitude is read on the top or bottom scale.","lessonTag":"plot-02"},{"id":"P24","module":"P","text":"One degree contains:","options":["60 minutes","100 minutes","360 minutes","10 minutes"],"explanation":"And each minute contains 60 seconds.","lessonTag":"plot-02"},{"id":"P25","module":"P","text":"A light lies 4.6′ west of the 71°30′W meridian. Its longitude is:","options":["71°34.6′W","71°25.4′W","71°30.46′W","72°34.6′W"],"explanation":"West longitude increases toward the west.","lessonTag":"plot-02"},{"id":"P26","module":"P","text":"On a course line, the course is written:","options":["Above the line, with T or M","Below the line","Only at the destination","Nowhere"],"explanation":"Speed goes below the line.","lessonTag":"plot-03"},{"id":"P27","module":"P","text":"“C 068 T” on a course line means:","options":["Course 068° true","Compass heading 068°","Current 068°","Chart 068"],"explanation":"Always mark true or magnetic.","lessonTag":"plot-03"},{"id":"P28","module":"P","text":"To measure a leg longer than your dividers can span:","options":["Set them to a round distance and step it off","Use the longitude scale","Estimate by eye","Use the compass rose"],"explanation":"Then measure the remainder.","lessonTag":"plot-03"},{"id":"P29","module":"P","text":"5.3′ of latitude equals:","options":["5.3 nm","5.3 statute miles","0.53 nm","53 nm"],"explanation":"1′ of latitude = 1 nm.","lessonTag":"plot-03"},{"id":"P30","module":"P","text":"A 5.3 nm leg at 12 knots takes:","options":["26.5 minutes","44 minutes","63.6 minutes","15 minutes"],"explanation":"60 × 5.3 ÷ 12.","lessonTag":"plot-03"},{"id":"P31","module":"P","text":"Measuring distance on the longitude scale gives:","options":["A wrong answer, except at the equator","The correct answer","A more accurate answer","True direction"],"explanation":"Minutes of longitude shrink with latitude.","lessonTag":"plot-03"},{"id":"P32","module":"P","text":"Departing 0815, you run 22 nm at 16 knots. Your ETA is about:","options":["0938","0915","1001","0853"],"explanation":"82.5 min ≈ 1 h 23 min.","lessonTag":"plot-04"},{"id":"P33","module":"P","text":"1.75 hours equals:","options":["1 hour 45 minutes","1 hour 75 minutes","1 hour 7.5 minutes","105 hours"],"explanation":"0.75 × 60 = 45.","lessonTag":"plot-04"},{"id":"P34","module":"P","text":"To cover 18 nm in 1 hour 12 minutes, you need a speed of:","options":["15 knots","12 knots","18 knots","21.6 knots"],"explanation":"60 × 18 ÷ 72 = 15.","lessonTag":"plot-04"},{"id":"P35","module":"P","text":"Your spot is 30 nm out at 15 knots, burning 20 gal/h. By the rule of thirds, carry:","options":["120 gallons","40 gallons","80 gallons","60 gallons"],"explanation":"2 h × 20 = 40 gal one way; × 3 = 120.","lessonTag":"plot-04"},{"id":"P36","module":"P","text":"Speed through the water is measured by the:","options":["Knotmeter or log","GPS","Radar","Depth sounder"],"explanation":"GPS gives speed over ground.","lessonTag":"plot-04"},{"id":"P37","module":"P","text":"0945 plus 50 minutes is:","options":["1035","0995","1095","1045"],"explanation":"Carry the hour at 60 minutes.","lessonTag":"plot-04"},{"id":"P38","module":"P","text":"At 9 knots for 2 hours 20 minutes you cover:","options":["21 nm","18 nm","20.7 nm","23 nm"],"explanation":"9 × 140 ÷ 60 = 21.","lessonTag":"plot-04"},{"id":"P39","module":"P","text":"True course 068°, variation 15°W, deviation 2°E. Compass course:","options":["081°","085°","051°","055°"],"explanation":"068 + 15 = 083 M; 083 − 2 = 081 C.","lessonTag":"plot-05"},{"id":"P40","module":"P","text":"A bearing taken with the ship’s compass is corrected with the deviation for:","options":["The boat’s heading","The bearing’s direction","North","Zero degrees"],"explanation":"Deviation depends on how the boat is pointed.","lessonTag":"plot-05"},{"id":"P41","module":"P","text":"Steering 080° compass (deviation 2°E), a light bears 015° compass; variation 14°W. True bearing:","options":["003°","031°","027°","359°"],"explanation":"015 + 2 = 017 M; 017 − 14 = 003 T.","lessonTag":"plot-05"},{"id":"P42","module":"P","text":"Rose: 14°45′W (2010), increasing 2′ a year. For 2026 use about:","options":["15°17′W","14°13′W","14°45′W","16°45′W"],"explanation":"16 years × 2′ = 32′.","lessonTag":"plot-05"},{"id":"P43","module":"P","text":"A light bears 340°T from you. From the light, the line toward your boat runs:","options":["160°T","340°T","070°T","250°T"],"explanation":"The reciprocal.","lessonTag":"plot-05"},{"id":"P44","module":"P","text":"Reading a course from the inner ring of the rose gives:","options":["Magnetic direction","True direction","Compass direction","Deviation"],"explanation":"Check the rose’s year for variation change.","lessonTag":"plot-05"},{"id":"P45","module":"P","text":"Going from true toward compass, you:","options":["Add westerly errors and subtract easterly ones","Add easterly errors","Ignore deviation","Subtract all errors"],"explanation":"The reverse of correcting.","lessonTag":"plot-05"},{"id":"P46","module":"P","text":"A fix is plotted from:","options":["Two or more lines of position taken at the same time","One bearing","Course and speed only","A single sounding"],"explanation":"Mark it with a circle and the time.","lessonTag":"plot-06"},{"id":"P47","module":"P","text":"The best angle between two bearing lines for a fix is about:","options":["60° to 90°","10°","170°","0°"],"explanation":"Shallow angles magnify errors.","lessonTag":"plot-06"},{"id":"P48","module":"P","text":"Three bearings form a small triangle (a cocked hat). You should:","options":["Plot the fix in the middle of the triangle","Assume the compass is broken","Ignore the third bearing","Anchor"],"explanation":"A large triangle means a mistake.","lessonTag":"plot-06"},{"id":"P49","module":"P","text":"A radar range to a charted point gives a line of position shaped like a:","options":["Circle","Straight line","Square","Parabola"],"explanation":"Centered on the object.","lessonTag":"plot-06"},{"id":"P50","module":"P","text":"Two charted objects in line (a range) give:","options":["A very accurate line of position","A fix by themselves","No useful information","Your speed"],"explanation":"No compass error is involved.","lessonTag":"plot-06"},{"id":"P51","module":"P","text":"On a line of position, write:","options":["The time above the line and the bearing below","The bearing above and the time below","Nothing","Only the date"],"explanation":"Label as you go.","lessonTag":"plot-06"},{"id":"P52","module":"P","text":"A bearing and a radar range on the same object give:","options":["A fix","Only one line of position","A DR","An EP"],"explanation":"The lines cross at right angles.","lessonTag":"plot-06"},{"id":"P53","module":"P","text":"A dead reckoning position is marked with a:","options":["Half circle","Full circle","Square","Triangle"],"explanation":"Fix: circle. EP: square.","lessonTag":"plot-07"},{"id":"P54","module":"P","text":"An estimated position (EP) is marked with a:","options":["Square","Half circle","Circle","Star"],"explanation":"A DR improved with other information.","lessonTag":"plot-07"},{"id":"P55","module":"P","text":"A new DR track should be started:","options":["From every fix","Once a day","Only at the dock","Never"],"explanation":"The fix is better information.","lessonTag":"plot-07"},{"id":"P56","module":"P","text":"DR positions should be plotted:","options":["Every hour and at every course or speed change","Only at the end of the trip","Only when GPS fails","Every 5 minutes"],"explanation":"Also at each fix and each single LOP.","lessonTag":"plot-07"},{"id":"P57","module":"P","text":"Dead reckoning uses:","options":["Course and speed only, not current","Current and wind","GPS positions","Tide heights"],"explanation":"An EP adds current or other information.","lessonTag":"plot-07"},{"id":"P58","module":"P","text":"From a 0800 fix, course 125°T at 10 knots. The 0900 DR is:","options":["10 nm along 125°T from the fix","10 nm along 305°T","5 nm along 125°T","At the fix"],"explanation":"Distance = speed × time.","lessonTag":"plot-07"},{"id":"P59","module":"P","text":"A running fix is made by:","options":["Advancing an earlier LOP by your run and crossing it with a later one","Crossing two simultaneous bearings","Reading GPS","Following a depth contour"],"explanation":"Its accuracy depends on your course and speed.","lessonTag":"plot-08"},{"id":"P60","module":"P","text":"Course 090°T at 12 knots; bearings at 0900 and 0930. Advance the 0900 LOP:","options":["6 nm toward 090°T","12 nm toward 090°T","6 nm toward the light","3 nm toward 270°T"],"explanation":"Run = 12 × 30 ÷ 60.","lessonTag":"plot-08"},{"id":"P61","module":"P","text":"With bow and beam bearings (45°, then abeam), distance off when abeam equals:","options":["The distance run between bearings","Half the distance run","Twice the distance run","0.7 × the distance run"],"explanation":"A special case of doubling the angle.","lessonTag":"plot-08"},{"id":"P62","module":"P","text":"Doubling the angle on the bow (such as 30° then 60°), the distance run equals:","options":["The distance off at the second bearing","The distance off at the first bearing","Half the distance off","Nothing useful"],"explanation":"The bearings form an isosceles triangle.","lessonTag":"plot-08"},{"id":"P63","module":"P","text":"With bow bearings of 22.5° and 45°, distance off when abeam is about:","options":["7/10 of the distance run","Equal to the distance run","Twice the distance run","Half the distance run"],"explanation":"The 7/10 rule.","lessonTag":"plot-08"},{"id":"P64","module":"P","text":"At 10 knots, a light goes from 30° to 60° on the bow in 18 minutes. Distance off at the second bearing:","options":["3 nm","1.8 nm","6 nm","10 nm"],"explanation":"Run = 10 × 18 ÷ 60 = 3.","lessonTag":"plot-08"},{"id":"P65","module":"P","text":"An unknown current between the two bearings of a running fix:","options":["Makes the running fix less accurate","Has no effect","Makes it more accurate","Turns it into a true fix"],"explanation":"Treat running fixes with some caution.","lessonTag":"plot-08"},{"id":"P66","module":"P","text":"Set is measured:","options":["From the DR position to the fix","From the fix to the DR position","From the wind direction","From your heading"],"explanation":"Drift is the current’s speed.","lessonTag":"plot-09"},{"id":"P67","module":"P","text":"Two hours after your last fix, the new fix is 2.4 nm from the DR. Drift is:","options":["1.2 knots","2.4 knots","4.8 knots","0.6 knots"],"explanation":"2.4 ÷ 2.","lessonTag":"plot-09"},{"id":"P68","module":"P","text":"To make good a track across a current, steer:","options":["Up-current of the track","Down-current of the track","Straight along the track","Toward the wind"],"explanation":"Solve it with a current diagram.","lessonTag":"plot-09"},{"id":"P69","module":"P","text":"Track 090°T, boat speed 10 knots, current 180°T at 2 knots. Course to steer is about:","options":["078°T","102°T","090°T","070°T"],"explanation":"About 12° into the current.","lessonTag":"plot-09"},{"id":"P70","module":"P","text":"In that problem, speed made good is about:","options":["9.8 knots","12 knots","8 knots","10 knots"],"explanation":"√(10² − 2²).","lessonTag":"plot-09"},{"id":"P71","module":"P","text":"At 10 knots against a 2-knot current, your speed over the ground is:","options":["8 knots","12 knots","10 knots","5 knots"],"explanation":"Subtract.","lessonTag":"plot-09"},{"id":"P72","module":"P","text":"Wind pushing a boat sideways through the water is called:","options":["Leeway","Set","Drift","Trim"],"explanation":"It acts like a current in plotting.","lessonTag":"plot-09"},{"id":"P73","module":"P","text":"True course 068°, variation 15°W, deviation 2°E. Steer:","options":["081° compass","083° compass","053° compass","070° compass"],"explanation":"068 + 15 − 2.","lessonTag":"plot-10"},{"id":"P74","module":"P","text":"Departing 0700, a 9.6 nm leg at 12 knots gives an ETA of:","options":["0748","0712","0800","0736"],"explanation":"60 × 9.6 ÷ 12 = 48 min.","lessonTag":"plot-10"},{"id":"P75","module":"P","text":"Thirty minutes after departure, the fix is 0.8 nm from the DR. Drift:","options":["1.6 knots","0.8 knots","0.4 knots","2.4 knots"],"explanation":"0.8 ÷ 0.5.","lessonTag":"plot-10"},{"id":"P76","module":"P","text":"If your answer isn’t among the choices, you should:","options":["Recheck the step most likely wrong","Pick the closest without checking","Leave it blank","Assume the test is wrong"],"explanation":"Common errors: variation sign, wrong scale, wrong side of the rose.","lessonTag":"plot-10"},{"id":"P77","module":"P","text":"Before answering a plotting question, confirm whether it asks for:","options":["True, magnetic or compass","The chart’s edition","The tide height","Your boat’s length"],"explanation":"Many wrong answers are the right number in the wrong reference.","lessonTag":"plot-10"},{"id":"P78","module":"P","text":"Your answer is exactly 180° off from a choice. You most likely:","options":["Read the wrong side of the rose or reversed a set","Used the wrong variation","Used the wrong deviation","Measured distance wrong"],"explanation":"Check the direction of travel.","lessonTag":"plot-10"}]};

/* ---------- Storage (per-browser) ---------- */
let store={stats:{},misses:[]};
try{const s=localStorage.getItem("oupv-v1");if(s){const p=JSON.parse(s);if(p&&p.stats)store=p;}}catch(e){}
function save(){try{localStorage.setItem("oupv-v1",JSON.stringify(store));}catch(e){}updateBadge();}
function record(id,ok){
  const s=store.stats[id]||[0,0,0];s[0]++;if(ok)s[1]++;s[2]=ok?1:0;store.stats[id]=s;
  const sr=store.sr||(store.sr={}),o=sr[id]||{b:0},DAY=864e5;if(ok){o.due=Date.now()+[1,2,4,8,16,32][o.b]*DAY;o.b=Math.min(5,o.b+1);}else{o.b=0;o.due=Date.now()+6e5;}sr[id]=o;
  const i=store.misses.indexOf(id);
  if(!ok&&i<0)store.misses.push(id);
  if(ok&&i>=0)store.misses.splice(i,1);
  save();
}
function dueList(){const sr=store.sr||{},now=Date.now();return BANK.filter(x=>sr[x.id]&&sr[x.id].due<=now);}
function updateBadge(){const b=document.getElementById("badge");const n=store.misses.filter(id=>BANK.some(x=>x.id===id)).length;b.hidden=!n;b.textContent=n;}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pickQ(m,n){return shuffle(BANK.filter(x=>m==="A"||x.m===m)).slice(0,n);}

/* ---------- Render mode for video (scripts/video.js): index.html?render=1#render-<lesson>-<slide>-<builds> ----------
   Draws one slide state, or a title card, at 1920x1080 with no navigation. Sets body[data-frame] when ready. */
const RENDER=new URLSearchParams(location.search).get("render")==="1";
function stillFigs(root){if(RENDER||(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches))root.querySelectorAll("svg").forEach(s=>{try{s.pauseAnimations();s.setCurrentTime(0);}catch(e){}});}
function renderFrame(spec){
  document.documentElement.dataset.theme="light";document.body.classList.add("render");
  const c=spec.match(/^card-(intro|outro)-(.+)$/),m=spec.match(/^(.+)-(\d+)-(\d+)$/);
  const les=LESSONS.find(l=>l.id===(c?c[2]:m?m[1]:""));
  if(!les){main.innerHTML="";document.body.dataset.frame=spec;return;}
  const n=LESSONS.filter(l=>l.m===les.m).indexOf(les)+1,where=`${MODS[les.m].name}, lesson ${n}`;
  if(c){main.innerHTML=`<div class="rframe card"><p class="tag">${c[1]==="intro"?"Six-Pack Prep":"End of lesson"}</p><h1>${c[1]==="intro"?les.t:"Now take the lesson check"}</h1><p class="rsub">${c[1]==="intro"?where:les.t}</p><p class="rdisc">Practice material. Not an official U.S. Coast Guard examination or approved course.</p></div>`;}
  else{const s=les.slides[+m[2]-1],k=+m[3];
    main.innerHTML=`<div class="rframe"><div class="slide"><h2>${s.h}</h2><div class="visual">${visual(s.v)}</div></div><div class="lower"><span>${where}</span><span>${les.t}</span></div></div>`;
    const items=[...main.querySelectorAll(".rv-item")];if(/\[\+\]/.test(s.say))items.forEach((el,i)=>el.classList.toggle("dim",i>=k));
    stillFigs(main);const sl=main.querySelector(".slide");sl.style.zoom=Math.min(1.85,940/sl.offsetHeight);}
  (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>requestAnimationFrame(()=>{document.body.dataset.frame=spec;}));
}

const VIEWS={home,quiz,test,cards,drills,misses,lessons,progress};
function route(){
  clearInterval(timer);stopSpeech();
  let h=(location.hash||"#home").slice(1);S=null;
  if(RENDER){renderFrame(h.replace(/^render-/,""));return;}
  if(h.startsWith("lesson-")&&LESSONS.some(l=>"lesson-"+l.id===h)){player(h.slice(7));h="lessons";}
  else if(h.startsWith("check-")&&LESSONS.some(l=>"check-"+l.id===h)){const les=LESSONS.find(l=>"check-"+l.id===h);if(!(store.sess&&store.sess.key===h&&resumeSess(store.sess)))startSession(shuffle(BANK.filter(x=>x.tag===les.id)),{mode:"learn",title:"Lesson check: "+les.t,key:h});h="lessons";}
  else{if(!VIEWS[h])h="home";VIEWS[h]();}
  document.querySelectorAll("nav a").forEach(a=>a.setAttribute("aria-current",a.getAttribute("href")==="#"+h?"page":"false"));
  window.scrollTo(0,0);
}

function rose(){
  let ticks="",labels="";
  for(let d=0;d<360;d+=5){
    const r1=d%30===0?86:d%10===0?91:95,a=(d-90)*Math.PI/180;
    ticks+=`<line x1="${(100+r1*Math.cos(a)).toFixed(1)}" y1="${(100+r1*Math.sin(a)).toFixed(1)}" x2="${(100+100*Math.cos(a)).toFixed(1)}" y2="${(100+100*Math.sin(a)).toFixed(1)}"/>`;
    if(d%30===0)labels+=`<text x="${(100+76*Math.cos(a)).toFixed(1)}" y="${(100+76*Math.sin(a)+3).toFixed(1)}">${d}</text>`;
  }

function resumeSess(sv){if(!sv||!sv.ids)return false;const items=sv.ids.map((id,k)=>{const q=BANK.find(x=>x.id===id);return q?{q,order:sv.orders[k],pick:sv.picks[k]}:null;});if(items.some(x=>!x)||!items.length)return false;S={items,i:Math.min(sv.i,items.length-1),mode:sv.mode,title:sv.title,end:sv.end,done:false,key:sv.key};clearInterval(timer);if(S.end)timer=setInterval(tickTimer,1000);renderQ();return true;}

function wireResume(){const b=document.getElementById("resume");if(b)b.onclick=()=>{if(!resumeSess(store.sess)){store.sess=null;save();}};}
function startSession(list,opt){

/* ---------- Hear a sound signal (Web Audio; a synthesized horn, no files) ---------- */
let HORN=null;
function playSignal(pat){
  try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;HORN=HORN||new AC();if(HORN.state==="suspended")HORN.resume();
    if(HORN._g){try{HORN._g.gain.cancelScheduledValues(0);HORN._g.gain.value=0;HORN._g.disconnect();}catch(e){}}
    const g=HORN.createGain(),f=HORN.createBiquadFilter();f.type="lowpass";f.frequency.value=900;g.gain.value=0;f.connect(g);g.connect(HORN.destination);HORN._g=g;
    const o=[155,233,311].map(hz=>{const x=HORN.createOscillator();x.type="sawtooth";x.frequency.value=hz;x.connect(f);x.start();return x;});
    let at=HORN.currentTime+.05;[...pat].forEach(c=>{const d=c==="P"?4.5:1;g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(.16,at+.06);g.gain.setValueAtTime(.16,at+d-.08);g.gain.linearRampToValueAtTime(0,at+d);at+=d+1;});
    o.forEach(x=>x.stop(at));
  }catch(e){}
}

function drills(){newProb();renderDrill();}
function renderDrill(){
  const types=[["ct","Compass to true"],["tc","True to compass"],["std","Speed, time, distance"],["eta","ETA"],["fuel","Fuel"],["rel","Relative bearings"],["sd","Set and drift"],["var","Variation update"],["geo","Light ranges"],["dbl","Bow angles"]],p=D.prob;
  main.innerHTML=`<section><h1>Plotting drills</h1><p class="lede">Fresh problems every time. These two calculations show up on nearly every plotting exam.</p>
  <div class="chips">${types.map(([k,n])=>`<button class="chip" data-t="${k}" aria-pressed="${k===D.type}">${n}</button>`).join("")}</div>
  <div class="formula">${FORM[D.type]}</div>
  <div class="problem"><h2 class="qtext">${p.ask}</h2>
  <div class="answer-row"><input id="ans" inputmode="decimal" autocomplete="off" aria-label="Your answer in ${p.unit}" placeholder="${p.unit}"><button class="btn" id="check">Check answer</button><button class="btn ghost" id="skip">New problem</button></div>
  <div class="fb" id="fb" aria-live="polite"></div></div>
  <p class="streak">Streak: ${D.streak}. Best this session: ${D.best}.</p></section>`;
  main.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{D.type=b.dataset.t;drills();});
  const inp=document.getElementById("ans");inp.focus();
  const check=()=>{
    if(D.answered){newProb();renderDrill();return;}
    const v=p.kind==="time"?parseTime(inp.value):parseFloat(inp.value.replace(/[°,]/g,""));if(isNaN(v)){document.getElementById("fb").innerHTML=`<p class="muted">Type a number, then check.</p>`;return;}

    D.answered=true;if(ok){D.streak++;D.best=Math.max(D.best,D.streak);}else D.streak=0;
    document.getElementById("fb").innerHTML=`<p class="verdict ${ok?"ok":"bad"}">${ok?"Correct.":`Not quite. The answer is ${p.kind==="deg"?deg(p.ans):p.kind==="time"?hm(p.ans):p.ans+" "+p.unit}.`}</p><div class="steps">${p.steps}</div>`;

  inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();check();}});

  const best={};hist.filter(h=>String(h.k).startsWith("check-")).forEach(h=>{const id=h.k.slice(6),p=Math.round(h.c/h.n*100);if(!(id in best)||p>best[id])best[id]=p;});
  const tests=hist.filter(h=>h.k==="test"||h.k==="exam");
  const topic=LESSONS.map(l=>{const qs=BANK.filter(x=>x.tag===l.id&&store.stats[x.id]);const a=qs.reduce((t,x)=>t+store.stats[x.id][0],0),c=qs.reduce((t,x)=>t+store.stats[x.id][1],0);return {l,a,p:a?Math.round(c/a*100):null};}).filter(x=>x.a>=3).sort((x,y)=>x.p-y.p).slice(0,6);
  const worst=BANK.map(x=>({x,w:store.stats[x.id]?store.stats[x.id][0]-store.stats[x.id][1]:0})).filter(o=>o.w>0).sort((a,b)=>b.w-a.w).slice(0,8);
  const answered=Object.keys(store.stats).filter(id=>BANK.some(x=>x.id===id)).length;
  main.innerHTML=`<section class="prog"><h1>My progress</h1><p class="lede">Everything here is stored only in this browser. Back it up to move it to another device.</p>
  <div class="prog-top"><div class="stat"><span class="big">${done.length}</span><span>of ${LESSONS.length} lessons finished</span></div><div class="stat"><span class="big">${answered}</span><span>of ${BANK.length} questions tried</span></div><div class="stat"><span class="big">${tests.length}</span><span>practice tests taken</span></div></div>
  <h2>Lessons and lesson checks</h2>
  ${Object.entries(MODS).map(([m,info])=>{const ls=LESSONS.filter(l=>l.m===m);return `<h3 class="mod-h">${info.name}: ${ls.filter(l=>done.includes(l.id)).length} of ${ls.length}</h3><div class="chips">${ls.map((l,i)=>`<a class="chip${done.includes(l.id)?" fin":""}" href="#lesson-${l.id}" title="${esc(l.t)}">${i+1}${l.id in best?`<small>${best[l.id]}%</small>`:""}</a>`).join("")}</div>`;}).join("")}
  <p class="muted" style="margin-top:.6rem">Filled = lesson finished. The percentage is your best lesson-check score.</p>
  <h2>Practice tests</h2>${tests.length?`<table class="vtable"><thead><tr><th>Date</th><th>Score</th></tr></thead><tbody>${tests.slice(-10).reverse().map(h=>`<tr><td>${d(h.t)}</td><td>${h.c} of ${h.n} (${Math.round(h.c/h.n*100)}%)</td></tr>`).join("")}</tbody></table>`:`<p class="muted">None yet. <a href="#test">Take a practice test</a>.</p>`}
  <h2>Weakest topics</h2>${topic.length?`<ul class="plain">${topic.map(o=>`<li><a href="#lesson-${o.l.id}">${o.l.t}</a>: ${o.p}% correct over ${o.a} answers</li>`).join("")}</ul>`:`<p class="muted">Answer a few lesson-check questions and your weakest topics will show here.</p>`}
  <h2>Questions you miss most</h2>${worst.length?`<ol class="plain">${worst.map(o=>`<li>${o.x.text} <span class="muted">(missed ${o.w}×)</span></li>`).join("")}</ol><p><a class="btn ghost" href="#misses">Practice your misses</a></p>`:`<p class="muted">No misses recorded yet.</p>`}
  <h2>Back up and restore</h2><p>Progress has no account behind it. To carry it to another phone or computer, back it up here and restore it there.</p>
  <div class="row"><button class="btn" id="bk">Back up progress</button><button class="btn ghost" id="rs">Restore progress</button><input type="file" id="rsf" accept="application/json,.json" hidden></div><p class="muted" id="bkmsg" aria-live="polite"></p>
  <h2>Study record</h2><p>Print or save as PDF a summary of the lessons you’ve finished and your scores.</p><div class="row"><button class="btn ghost" id="pr">Print study record</button></div>
  <h2>Use it offline</h2><p id="offmsg">${"serviceWorker" in navigator&&location.protocol==="https:"?"Save the lessons’ narration on this device so the course works without a signal.":"Offline saving works when the course is opened from its website address."}</p><div class="row"><button class="btn ghost" id="off" ${"serviceWorker" in navigator&&location.protocol==="https:"?"":"disabled"}>Save narration for offline use</button></div>
  <div id="record" class="record"><h1>Six-Pack Prep: personal study record</h1><p>Printed ${d(Date.now())}</p><p><strong>${done.length} of ${LESSONS.length}</strong> lessons finished. <strong>${answered} of ${BANK.length}</strong> questions tried.</p>
   ${Object.entries(MODS).map(([m,info])=>`<h2>${info.name}</h2><table><thead><tr><th>Lesson</th><th>Finished</th><th>Best lesson check</th></tr></thead><tbody>${LESSONS.filter(l=>l.m===m).map(l=>`<tr><td>${l.t}</td><td>${done.includes(l.id)?"Yes":"No"}</td><td>${l.id in best?best[l.id]+"%":"Not taken"}</td></tr>`).join("")}</tbody></table>`).join("")}
   <h2>Practice tests</h2>${tests.length?`<table><thead><tr><th>Date</th><th>Score</th></tr></thead><tbody>${tests.map(h=>`<tr><td>${d(h.t)}</td><td>${h.c} of ${h.n} (${Math.round(h.c/h.n*100)}%)</td></tr>`).join("")}</tbody></table>`:"<p>None taken.</p>"}
   <p class="disc">This is a personal record of self-study with practice material. It is not a U.S. Coast Guard credential, certificate, course approval or proof of training, and it does not satisfy any licensing requirement.</p></div></section>`;
  const msg=t=>{document.getElementById("bkmsg").textContent=t;};
  document.getElementById("bk").onclick=()=>{const blob=new Blob([JSON.stringify({app:"six-pack-prep",v:1,saved:new Date().toISOString(),data:store})],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="six-pack-progress-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);msg("Saved a backup file to your downloads.");};
  const f=document.getElementById("rsf");document.getElementById("rs").onclick=()=>f.click();
  f.onchange=()=>{const file=f.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result),dta=o&&o.app==="six-pack-prep"?o.data:null;if(!dta||typeof dta.stats!=="object"||!Array.isArray(dta.misses))throw 0;
    if(!confirm("Replace the progress in this browser with the backup from "+String(o.saved).slice(0,10)+"?"))return;store=dta;save();progress();document.getElementById("bkmsg").textContent="Progress restored.";}catch(e){msg("That file isn’t a Six-Pack Prep backup.");}};r.readAsText(file);f.value="";};
  document.getElementById("pr").onclick=()=>window.print();
  document.getElementById("off").onclick=async()=>{const m=document.getElementById("offmsg"),b=document.getElementById("off");b.disabled=true;
    try{const c=await caches.open("spp-audio-v1");let ok=0,n=0;const urls=[];LESSONS.forEach(l=>l.slides.forEach((s,i)=>{urls.push(`audio/${l.id}-${i+1}.mp3`,`audio/${l.id}-${i+1}.timing.json`);}));
      for(const u of urls){n++;try{if(!(await c.match(u))){const r=await fetch(u);if(r.ok)await c.put(u,r);else continue;}ok++;}catch(e){}if(n%10===0)m.textContent=`Saving narration: ${Math.round(n/urls.length*100)}%`;}
      m.textContent=ok?`Saved ${Math.round(ok/2)} narrated slides on this device. The course now works offline.`:"No narration could be saved. Check your connection and try again.";}catch(e){m.textContent="This browser couldn’t save files for offline use.";}b.disabled=false;};
}
if("serviceWorker" in navigator&&location.protocol==="https:")window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});});
route();
</script>
