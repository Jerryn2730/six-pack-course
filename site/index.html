red bands","White, Fl (2)"],["Special","Yellow","Yellow"]],"fig":{"t":"band","items":[["buoyR","Starboard side","Red, red light"],["buoyG","Port side","Green, green light"],["txt:Mo(A)","Safe water","Red and white, white light"],["txt:Fl(2)","Isolated danger","Black and red, white light"]]}},"script":"Let’s pull the whole buoyage system into one table. If you know this table, you can name almost any mark the exam describes. [+] Starboard-side lateral marks: red, with a red light. [+] Port-side lateral marks: green, with a green light. [+] Preferred channel marks: red and green bands, with a composite group-flashing light, two plus one, in the color of the top band. [+] Safe water marks: red and white vertical stripes, with a white light flashing Morse A. [+] Isolated danger marks: black with red bands, and a white light flashing in groups of two. [+] Special marks: yellow, with a yellow light. [pause] Notice the pattern in the lights. Red and green lights are only on lateral marks. White lights are on safe water and isolated danger. Yellow is special. That’s lesson four. Morse A means safe water. Two balls and two flashes mean danger. On the Intracoastal, follow the yellow. Next time: lights, and how far you can see them."}]},{"id":"nav-05","module":"N","title":"Lights and how far you can see them","status":"draft-unverified","slides":[{"heading":"Light characteristics","visual":{"k":"dg","f":"lightchar"},"script":"At night a lighthouse doesn’t tell you its name. It tells you its rhythm, and you look it up. That rhythm is called the light’s characteristic. Look at the patterns on screen. Fixed is a steady light. Flashing means it’s dark longer than it’s lit. Quick is about sixty flashes a minute. Isophase means equal light and dark. Occulting is the reverse of flashing: lit longer than dark, with short eclipses. Group flashing shows its flashes in groups. And Morse A is a short and a long. Now read a chart label with me. F L two, white, ten seconds, forty-five feet, fourteen miles. What does it say? [pause] A white light, flashing in groups of two, every ten seconds, forty-five feet above mean high water, with a nominal range of fourteen miles. So when you think you’ve found your light, time it with a watch. The period will tell you if you’re right."},{"heading":"The Light List","visual":{"k":"points","items":["Every Coast Guard light, buoy and daybeacon in a region","Characteristic, height, nominal range, structure, remarks","Sector bearings and fog signals in the remarks","Volume III: Florida’s Atlantic coast through the Big Bend","Volume IV: the rest of the Gulf coast to Texas"],"fig":{"t":"rows","items":[["book","Light List","Every light, buoy and daybeacon in a region"],["txt:III","Volume III","Florida’s Atlantic coast through the Big Bend"],["txt:IV","Volume IV","The rest of the Gulf coast to Texas"]]}},"script":"Where do you look a light up? In the Light List. [+] It’s published by the Coast Guard, and it lists every Coast Guard light, buoy and daybeacon in a region. [+] For each one it gives the characteristic, the height above water, the nominal range, and a description of the structure. [+] The remarks column holds the details the chart has no room for, like sector bearings and fog signals. [+] It comes in seven volumes. Volume three is yours. It runs from South Carolina, around Florida, to the Big Bend. [+] Volume four carries on along the Gulf to Texas. And how do you keep it current? [pause] With the Local Notice to Mariners, which lists every change since your edition was printed."},{"heading":"Nominal, luminous and geographic range","visual":{"k":"table","head":["Range","Meaning"],"rows":[["Nominal range","How far the light carries in clear weather (10 nm meteorological visibility); shown on the chart"],["Luminous range","How far it carries in tonight’s actual visibility"],["Geographic range","How far before the earth’s curve hides it"],["Visible range","The lesser of luminous and geographic range"]],"fig":{"t":"band","items":[["bulb","Nominal range","Clear weather. Shown on the chart"],["fog","Luminous range","In tonight’s visibility"],["globe","Geographic range","Until the earth’s curve hides it"]]}},"script":"How far away can you see a light? There are three answers, and the exam wants you to keep them apart. [+] Nominal range is how far the light carries in clear weather, defined as ten miles of visibility. That’s the number printed on the chart. It’s about the lamp. [+] Luminous range is how far it carries in tonight’s actual visibility. Haze shortens it. It’s about the air. [+] Geographic range is how far you could see it before the curve of the earth hides it. That depends on the height of the light and the height of your eye. It’s about the earth. [+] So which one tells you when you’ll actually see the light? [pause] The lesser of the luminous range and the geographic range. Whichever limit you hit first, wins. Lamp, air, earth: nominal, luminous, geographic."},{"heading":"Computing geographic range","visual":{"k":"dg","f":"horizon"},"script":"Geographic range is one you can calculate, and the exam will ask you to. Look at the diagram. The light can see to its own horizon. Your eye can see to yours. Add the two distances, and that’s how far apart you can be and still see the light. The distance to the horizon, in nautical miles, is one point one seven times the square root of the height in feet. Try it. A light sixty-four feet high. The square root of sixty-four is eight. Eight times one point one seven is about nine point four miles. Your eye is nine feet up. The square root is three, so your horizon is about three and a half miles. Add them. [pause] About twelve point nine miles. And if the luminous range tonight is fifteen miles? You still see it at twelve point nine. The earth is in the way. The lesser range wins."},{"heading":"Worked example","visual":{"k":"script","lines":["Light height 100 ft; your eye 16 ft","Light’s horizon: 1.17 × √100 = 11.7 nm","Your horizon: 1.17 × √16 = 4.7 nm","Geographic range: 11.7 + 4.7 = 16.4 nm","Luminous range tonight 12 nm: you’ll see it at about 12 nm"],"fig":{"t":"td","els":[["f","M0,300 Q220,196 440,300 V400 H0 Z","s-bg"],["raw","\u003crect x='52' y='160' width='12' height='122' class='s-ink'/>\u003ccircle cx='58' cy='154' r='8' fill='#ffd34d'/>"],["i","boat",392,276,0.9],["l","M58,154 L392,262"],["m",58,136,"Light: 100 ft"],["m",392,246,"Eye: 16 ft"],["t",170,176,"11.7 nm","middle",17,"s-mag"],["t",316,222,"4.7 nm","middle",17,"s-mag"],["t",220,60,"11.7 + 4.7 = 16.4 nm"],["m",220,82,"Geographic range"],["m",220,350,"Tonight’s luminous range is 12 nm,"],["m",220,370,"so you see it at about 12 nm"]]}},"script":"Let’s work one more, so the steps stick. Follow it on screen. [+] A light stands one hundred feet above the water, and you’re on a flybridge with your eye sixteen feet up. [+] The light’s horizon. The square root of one hundred is ten, and ten times one point one seven is eleven point seven miles. [+] Your horizon. The square root of sixteen is four, and four times one point one seven is about four point seven miles. [+] Add them: sixteen point four miles. That’s the geographic range. [+] Now the twist. Tonight it’s hazy, and the luminous range is only twelve miles. When do you see the light? [pause] At about twelve miles. This time the air is the limit, not the earth. The lesser range always wins. Notice I picked heights with easy square roots. The exam usually does too."},{"heading":"Sector lights","visual":{"k":"dg","f":"sector"},"script":"Last, a light that changes color to warn you. Look at the diagram. Some lights have colored sectors. A red sector usually covers a hazard, like a shoal or a reef. So if you’re watching a white light and it turns red, what’s it telling you? [pause] You’re standing into danger. Turn back toward the white. Now the exam trap. The Light List gives the edges of each sector as bearings in degrees true. But from where? From the vessel, looking toward the light. Not from the light looking out. People get that backward all the time. One last trick. The moment a light first pops up over the horizon, you’re at its geographic range. So you know roughly how far off you are. That’s called bobbing a light. That’s lesson five. Time the period. Lamp, air, earth. One point one seven times the square root. And red sector means danger. Next time: the books every captain keeps."}]},{"id":"nav-06","module":"N","title":"Publications every captain uses","status":"draft-unverified","slides":[{"heading":"The Coast Pilot","visual":{"k":"points","items":["NOAA’s U.S. Coast Pilot: what the chart can’t show","Regulations, hazards, anchorages, bridges, currents, weather, ports","Coast Pilot 4: Cape Henry, VA to Key West","Coast Pilot 5: Gulf coast, Puerto Rico and Virgin Islands","Free to download; updated regularly"],"fig":{"t":"rows","items":[["book","U.S. Coast Pilot","What the chart can’t show"],["txt:CP 4","Coast Pilot 4","Cape Henry to Key West"],["txt:CP 5","Coast Pilot 5","Gulf coast, Puerto Rico and Virgin Islands"]]}},"script":"A chart can only show what fits on paper. It can’t tell you that the inlet shoals after a blow, that the bridge opens on the half hour, or where to find fuel. For that, a captain keeps a small library, and today I’ll walk you along the shelf. First, the Coast Pilot. [+] The United States Coast Pilot is published by NOAA, and it holds what the chart can’t show. [+] Navigation regulations, local hazards, anchorages, bridge and cable clearances, currents, weather, and descriptions of ports and channels. [+] It comes in nine volumes. Coast Pilot four covers the Atlantic coast, from Cape Henry in Virginia down to Key West. [+] Coast Pilot five covers the Gulf coast, Puerto Rico and the Virgin Islands. So a captain working out of Tampa Bay needs which one? [pause] Five. [+] And it’s free to download, and updated regularly. Before you run any inlet for the first time, read its page."},{"heading":"Notices to Mariners","visual":{"k":"points","items":["Local Notice to Mariners: weekly, from each Coast Guard district","Aid changes and discrepancies, dredging, hazards, events, chart corrections","NGA Notice to Mariners: weekly, for ocean charts","Broadcast Notices: urgent info, announced on VHF 16, read on 22A"],"fig":{"t":"rows","items":[["doc","Local Notice to Mariners","Weekly, from each Coast Guard district"],["globe","NGA Notice to Mariners","Weekly, for ocean charts"],["radio","Broadcast Notice","Announced on VHF 16, read on 22A"]]}},"script":"Charts and books go out of date the day they’re printed. Notices to Mariners keep them current. [+] The Local Notice to Mariners comes out weekly from each Coast Guard district. This is the one you’ll actually use. [+] It lists aids that have been added, moved, or are off station, plus dredging, construction, marine events, hazards, and chart corrections for local waters. [+] The National Geospatial-Intelligence Agency publishes its own weekly Notice to Mariners, for ocean charts and international publications. [+] And for things that can’t wait a week, the Coast Guard makes Broadcast Notices to Mariners. They’re announced on channel sixteen, and then read on channel twenty-two alpha. So when you hear the Coast Guard say, switch to twenty-two alpha, what should you do? [pause] Switch, and listen. It may be about the channel you’re in."},{"heading":"The rest of the captain’s library","visual":{"k":"points","items":["Tide and current predictions: NOAA Tides and Currents","The exam uses the classic Tide Tables and Tidal Current Tables format","Navigation Rules and Regulations Handbook","Chart No. 1","Code of Federal Regulations: 33 CFR navigation, 46 CFR shipping"],"fig":{"t":"tiles","items":[["tide","Tide and current predictions"],["book","Navigation Rules handbook"],["chart","Chart No. 1"],["doc","33 CFR and 46 CFR"]]}},"script":"The rest of the shelf. [+] Tide and current predictions come from NOAA’s Tides and Currents service. [+] But the exam uses pages from the classic printed Tide Tables and Tidal Current Tables, so you need to know how those are laid out. We’ll practice them in the next two lessons. [+] The Navigation Rules handbook, which you know well by now. [+] Chart Number One, the key to every chart symbol. [+] And the Code of Federal Regulations, the law you operate under. Two titles matter to you. Title thirty-three is navigation and navigable waters. Title forty-six is shipping, which includes uninspected passenger vessels and your license. Here’s how I keep them apart. [pause] Thirty-three is about the water. Forty-six is about the boat and the people on it."},{"heading":"Keeping charts corrected","visual":{"k":"points","items":["Note the chart’s edition date","Check every Local Notice issued since then","Mark corrections neatly and log them","Chartplotters: install chart updates regularly","When sources disagree, use the newest and go carefully"],"fig":{"t":"steps","items":["Note the chart’s edition date","Check every Local Notice since then","Mark each correction and log it","Update chartplotter charts too"]}},"script":"Owning a chart isn’t enough. Keeping it corrected is a basic duty, and here’s the routine. [+] Start with the chart’s edition date. [+] Check every Local Notice to Mariners issued since that date for corrections that touch your chart. [+] On paper, mark each correction neatly, and record it in a log, so you can prove the chart is current. [+] On a chartplotter, install the chart updates regularly. Here’s a question to ask yourself. How old is the chart card in your plotter right now? [pause] If you don’t know, it’s probably years old. [+] And when two sources disagree, use the most recent one, and go carefully. That’s lesson six. The Coast Pilot says what the chart can’t. The Local Notice is weekly. Thirty-three for the water, forty-six for the boat. Next time: tides."}]},{"id":"nav-07","module":"N","title":"Tides and the Tide Tables","status":"draft-unverified","slides":[{"heading":"Types of tide","visual":{"k":"dg","f":"tidetypes"},"script":"Twice a day, more or less, the whole ocean rises and falls, and in Florida’s shallow water that can be the difference between floating and sitting on the bottom. Tides are caused mainly by the moon’s gravity, with help from the sun. And they don’t behave the same everywhere. Look at the three curves. A semidiurnal tide has two highs and two lows each day, about equal in height. That’s Florida’s Atlantic coast. A mixed tide also has two highs and two lows, but noticeably unequal. That’s much of our Gulf coast. And a diurnal tide has just one high and one low a day, as in parts of the Panhandle. [pause] One more fact. The tidal day is about twenty-four hours and fifty minutes long. So if high water is at eight this morning, about when is it tomorrow morning? Around eight fifty. Roughly fifty minutes later each day."},{"heading":"Tide terms","visual":{"k":"points","items":["Range: the difference between high and low water","Depths from MLLW; heights and clearances from MHW","Actual depth = charted depth + height of tide","Negative tide: water below MLLW, shallower than charted","Stand: the pause at high or low water"],"fig":{"t":"td","els":[["t",220,30,"Depth = charted depth + height of tide"],["raw","\u003crect x='300' y='62' width='130' height='12' class='s-ink'/>"],["a","M364,118 V80","s-st"],["m",356,104,"Clearance","end"],["l","M10,124 H430"],["m",14,116,"MHW","start"],["p","M10,196 H430","s-magst",3],["t",14,188,"Water now","start",14,"s-mag"],["l","M10,262 H430"],["m",14,254,"MLLW","start"],["a","M250,258 V202"],["m",262,236,"Height of tide","start"],["a","M150,334 V268","s-st"],["m",162,306,"Charted depth","start"],["f","M0,340 Q220,322 440,342 V400 H0 Z","s-land"]]}},"script":"A few terms, and one formula you’ll use on every trip. [+] The range of the tide is the difference between high water and low water. [+] Charted depths are measured from mean lower low water. Heights and bridge clearances are measured from mean high water. [+] So here’s the formula. The actual depth at any moment equals the charted depth plus the height of tide. [+] Now the trap. Can the height of tide be a negative number? [pause] Yes. A minus tide means the water is below mean lower low water, so it’s shallower than the chart says. It happens around spring tides, especially with a strong offshore wind. [+] And the stand of the tide is the short pause at high or low water, when the level barely changes."},{"heading":"Spring and neap tides","visual":{"k":"dg","f":"springneap"},"script":"The size of the tide isn’t the same every week. It follows the moon. Look at the diagram. At new moon and full moon, the sun and the moon are lined up, and they pull together. That gives spring tides, with the biggest range. Spring has nothing to do with the season. Think of the water springing up. At the first and third quarter moons, the sun and the moon pull at right angles and partly cancel. That gives neap tides, with the smallest range. [pause] So when do you get the lowest low water of the month, the kind that leaves the flats dry? On a spring tide, around new or full moon. And when a spring tide falls on the moon’s closest approach to the earth, you get what people call a king tide, the kind that puts water in the streets. Wind matters too. Onshore wind and low pressure pile water up. Offshore wind pushes it out."},{"heading":"How the Tide Tables work","visual":{"k":"table","head":["Table","What it gives"],"rows":[["Table 1","Daily high and low times and heights at reference stations"],["Table 2","Corrections for subordinate stations: time differences, and height differences or ratios"],["Table 3","Height of tide at any time between high and low"]],"fig":{"t":"band","items":[["num:1","Reference stations","Daily high and low times and heights"],["num:2","Subordinate stations","Time and height corrections"],["num:3","Any time","Height between high and low"]]}},"script":"On the exam, you’ll work from pages of the classic Tide Tables. They have three tables, and each answers one question. [+] Table one: when and how high are the tides at the reference stations? It gives the daily times and heights of high and low water at the major ports. [+] Table two: what about my spot? It lists the subordinate stations, each tied to a reference station, with time differences and height corrections. The height correction is either feet to add or subtract, or a ratio to multiply by, marked with an asterisk. [+] Table three: what’s the height right now, between high and low? [pause] One more thing that costs people points. The times are in local standard time. So in summer, what do you do? Add one hour for daylight saving time."},{"heading":"Worked example: subordinate station","visual":{"k":"script","lines":["Reference: high 10:42, 3.6 ft; low 16:50, 0.4 ft","Subordinate: high +0:35, +0.4 ft; low +0:48, −0.1 ft","High: 10:42 + 0:35 = 11:17, height 3.6 + 0.4 = 4.0 ft","Low: 16:50 + 0:48 = 17:38, height 0.4 − 0.1 = 0.3 ft","Daylight saving time: add 1 hour, giving 12:17 and 18:38"],"fig":{"t":"rows","items":[["clock","High water time","10:42 + 0:35 = 11:17"],["up","High water height","3.6 + 0.4 = 4.0 ft"],["clock","Low water time","16:50 + 0:48 = 17:38"],["down","Low water height","0.4 − 0.1 = 0.3 ft"]]}},"script":"Let’s work one from start to finish. Follow it on screen. [+] The reference station says: high water at ten forty-two, three point six feet. Low water at sixteen fifty, zero point four feet. [+] Table two gives the corrections for our subordinate station. High water: plus thirty-five minutes, plus zero point four feet. Low water: plus forty-eight minutes, minus zero point one feet. [+] So high water. Ten forty-two plus thirty-five minutes is eleven seventeen. And the height is three point six plus zero point four, four point zero feet. [+] Low water. Sixteen fifty plus forty-eight minutes. Careful with the minutes. [pause] Seventeen thirty-eight. And the height is zero point four minus zero point one, zero point three feet. [+] Last step, in summer. Add an hour for daylight saving time: twelve seventeen and eighteen thirty-eight. Notice that highs and lows get their own corrections. Don’t mix them."},{"heading":"Height of tide at a given time","visual":{"k":"script","lines":["Low 0.5 ft at 06:00, high 6.5 ft at 12:00: range 6 ft","At 09:00, three hours in: 1 + 2 + 3 = 6/12 of the range","6/12 × 6 ft = 3 ft above low water","Height of tide at 09:00 ≈ 0.5 + 3 = 3.5 ft","Charted 5 ft spot: about 8.5 ft of water at 09:00"],"fig":"tide"},"script":"Often you need the depth at a time between high and low. For a quick answer, use the rule of twelfths. The tide doesn’t rise evenly. It starts slowly, runs fastest in the middle, and slows again. Over six hours it rises one twelfth, two twelfths, three, three, two, and one. Now work it. [+] Low water is zero point five feet at six in the morning. High water is six point five feet at noon. That’s a range of six feet over six hours. [+] What about nine o’clock, three hours in? Add the first three hours: one plus two plus three. Six twelfths. [+] Six twelfths of six feet is three feet. [+] So the height of tide at nine is zero point five plus three: about three and a half feet. [+] And if the chart shows a five-foot spot? [pause] Five plus three and a half. About eight and a half feet of water. That’s lesson seven. Depth equals charted depth plus height of tide. Spring tides at new and full moon. One, two, three, three, two, one. Next time: currents."}]},{"id":"nav-08","module":"N","title":"Currents and current sailing","status":"draft-unverified","slides":[{"heading":"Tidal currents","visual":{"k":"points","items":["Current is named for where it flows TOWARD (its set)","Wind is named for where it comes FROM","Flood toward land, ebb away, slack between","Reversing currents in channels; rotary currents offshore","Slack often doesn’t match high or low tide"],"fig":{"t":"cmp","a":["","Current: where it flows TOWARD","current","A set of 090° flows toward the east"],"b":["","Wind: where it comes FROM","wind","A north wind blows from the north"]}},"script":"Tide is water going up and down. Current is water going sideways. People mix them up, and so do exam answers. A tidal current is the horizontal flow that the tide causes. [+] First, the naming rule, which trips up almost everyone. A current is named for the direction it flows toward. That direction is called its set. [+] Wind is the opposite. It’s named for where it comes from. So a north wind and a north-setting current: are they moving the same way? [pause] No. The wind is blowing toward the south, and the current is flowing toward the north. [+] Flood current flows toward the land, ebb flows away, and slack water is the pause between. [+] In rivers and inlets, the current reverses. Offshore, it may be rotary, swinging steadily around the compass. [+] And here’s the practical one. Slack water often doesn’t happen at high or low tide. In an inlet it can be an hour or more off. Never assume one from the other."},{"heading":"The Tidal Current Tables","visual":{"k":"table","head":["Table","What it gives"],"rows":[["Table 1","Daily times of slack and maximum current, with max speeds, at reference stations"],["Table 2","Subordinate stations: time differences, speed ratios, flood and ebb directions"],["Table 3","Current speed at any time between slack and maximum"]],"fig":{"t":"band","items":[["num:1","Reference stations","Slack and maximum current times"],["num:2","Subordinate stations","Time differences and speed ratios"],["num:3","Any time","Speed between slack and maximum"]]}},"script":"The Tidal Current Tables are built just like the Tide Tables, so this will feel familiar. [+] Table one gives the daily times of slack water and maximum current at the reference stations, with the maximum flood and ebb speeds. [+] Table two is for the subordinate stations. It gives time differences, speed ratios for flood and ebb, and the true directions of flood and ebb. [+] Table three gives the speed at any time between slack and maximum. Let’s try one. The reference station predicts a maximum flood of two knots at fourteen hundred. Your subordinate station has a time difference of minus twenty minutes, and a flood ratio of point six. When is your maximum flood, and how strong? [pause] Thirteen forty, and two times point six is one point two knots. Times get added or subtracted. Speeds get multiplied."},{"heading":"Florida’s big currents","visual":{"k":"points","items":["The Florida Current (Gulf Stream) flows north along the east coast","Often 2 to 4 knots or more; closest to shore off Palm Beach County","North wind against the Stream: steep, dangerous seas","The Loop Current in the Gulf feeds it","Inlets: strong ebb against an onshore wind breaks"],"fig":"flcurrents"},"script":"Florida has one of the strongest ocean currents in the world running right past the front door. Look at the map. [+] The Florida Current, the start of the Gulf Stream, flows north along the east coast. [+] It often runs two to four knots, sometimes more, and it comes closest to shore off Palm Beach County. Think about what that means. If your boat cruises at twenty knots, four knots of current is a fifth of your speed, for or against you. [+] Now the dangerous part. What happens when a strong north wind blows against that northbound current? [pause] The seas turn short, steep and ugly. Experienced captains don’t cross the Stream in a norther. [+] On the Gulf side, the Loop Current comes up into the Gulf and feeds the Florida Current. [+] And closer to home, a strong ebb pouring out of an inlet against an onshore wind makes breaking seas right in the entrance. Wind against current is trouble everywhere."},{"heading":"Course to steer in a current","visual":{"k":"dg","f":"currentvector"},"script":"If a current is pushing you sideways and you point straight at your destination, you’ll miss it. So you aim off, upstream, by just the right amount. Finding that amount is called current sailing. Look at the diagram, and follow the three steps. First, draw your intended track, from where you are to where you want to go. Second, from your starting point, draw the current: its set, and its drift for one hour. Third, from the end of that current line, swing an arc equal to your boat speed for one hour, until it cuts your intended track. [pause] Now read off two answers. The line from the end of the current to that crossing point is your course to steer. And the distance from your start to that crossing point, along the track, is your speed made good. Current first, then your speed. We’ll draw these for real in the plotting module."},{"heading":"Measuring the current from fixes","visual":{"k":"script","lines":["08:00 fix; plot your 10:00 DR from course and speed","10:00 fix lies 3 nm from the 10:00 DR, bearing 150°T","Set = 150°T, the direction from DR to fix","Drift = 3 nm ÷ 2 hours = 1.5 knots","Use it to correct your next course"],"fig":{"t":"td","els":[["raw","\u003ccircle cx='90' cy='320' r='8' class='s-magst' stroke-width='2.5'/>\u003cpath d='M292,118 A10,10 0 0 1 312,118' class='s-st' stroke-width='2.5'/>\u003ccircle cx='347' cy='200' r='8' class='s-magst' stroke-width='2.5'/>"],["p","M97,314 L296,124","s-st",2],["m",90,350,"0800 fix"],["m",300,98,"1000 DR"],["a","M306,128 L342,192"],["m",360,206,"1000 fix","start"],["t",250,170,"3 nm","end",15,"s-mag"],["t",220,40,"Set and drift from two fixes"],["t",220,290,"Set 150°T: from DR to fix","middle",16,"s-mag"],["m",220,314,"Drift: 3 nm ÷ 2 hours = 1.5 knots"]]}},"script":"What if nobody tells you the current? Then you measure it yourself, with two fixes. Follow it on screen. [+] You have a good fix at eight hundred. You run your course and speed, and plot where you should be at ten hundred. That’s your dead reckoning position. [+] At ten hundred you take another fix, and it isn’t on the DR. It lies three miles away, bearing one five zero true from the DR. [+] So what pushed you there? The current. Its set is the direction from the DR to the fix: one five zero true. [+] Its drift is the distance divided by the time. Three miles in two hours. [pause] One and a half knots. [+] Now use it, to correct your next course. And remember the direction: from where you thought you were, to where you really are. That’s lesson eight. Current is named for where it goes. Wind against current is trouble. And set runs from DR to fix. Next time: the compass."}]},{"id":"nav-09","module":"N","title":"The magnetic compass","status":"draft-unverified","slides":[{"heading":"The compass itself","visual":{"k":"points","items":["A magnetized card floats in liquid and points to magnetic north","The lubber line marks the boat’s heading","Mount it on or parallel to the centerline","Keep magnets, electronics, speakers and tools away","Gimbals keep it level as the boat rolls"],"fig":{"t":"td","els":[["raw","\u003ccircle cx='220' cy='210' r='120' class='s-surfb'/>\u003ccircle cx='220' cy='210' r='96' class='s-lst' stroke-width='1.5'/>\u003cpath d='M220,90 V110 M220,310 V330 M100,210 H120 M320,210 H340' class='s-st' stroke-width='3'/>\u003cline x1='220' y1='60' x2='220' y2='96' class='s-magst' stroke-width='5'/>"],["t",220,142,"N","middle",26],["t",298,219,"E","middle",22],["t",220,296,"S","middle",22],["t",142,219,"W","middle",22],["i","north",220,204,1.2],["t",220,44,"Lubber line = the boat’s heading","middle",16,"s-mag"],["m",220,372,"The card points to magnetic north"]]}},"script":"Every screen on your boat needs electricity. One instrument doesn’t, and it’s the one that will get you home when the rest go dark. The magnetic compass. [+] It’s simple. A magnetized card floats in liquid, and it lines itself up with the earth’s magnetic field. The card stays still. The boat turns around it. [+] The lubber line is a mark on the bowl, lined up with the boat’s centerline. Your heading is the number on the card at the lubber line. [+] So the compass must be mounted on the centerline, or parallel to it, where the helmsman can see it. [+] Keep magnetic and electrical things away from it. Speakers, radios, phones, tools. Even a cup holder with a magnet in it. Why does that matter so much? [pause] Because moving any of them changes the compass’s error, and you won’t know by how much. [+] And the gimbals keep the card level as the boat rolls."},{"heading":"True, magnetic, compass","visual":{"k":"dg","f":"chain"},"script":"There are three ways to name the same direction, and the whole subject is getting from one to another without losing your way. Look at the chain on screen. True is the direction on the chart. Magnetic is where a perfect compass would point. Compass is what yours actually reads. Between true and magnetic sits variation. Between magnetic and compass sits deviation. So the order is: true, variation, magnetic, deviation, compass. Going from compass toward true is called correcting. When you’re correcting, add easterly errors and subtract westerly ones. Going the other way, from true down to compass, is uncorrecting, and you do the opposite. [pause] A sentence to remember the correcting order: Can Dead Men Vote Twice At Elections. Compass, deviation, magnetic, variation, true, add east. Write that at the top of your scratch paper on exam day, before you read a single question."},{"heading":"Variation","visual":{"k":"points","items":["Caused by Earth’s magnetic field; the same on every heading","Read it from the chart’s compass rose","Update for annual change to the current year","Florida: roughly 2° to 8° west, depending on location","Westerly variation: magnetic north lies west of true north"],"fig":{"t":"td","els":[["a","M240,330 V84","s-st"],["t",260,74,"True north","start",15],["a","M240,330 L166,96"],["t",150,82,"Magnetic north","end",15,"s-mag"],["p","M240,180 A150,150 0 0 0 195,187","s-magst",2],["t",118,210,"Westerly","middle",15,"s-mag"],["t",118,228,"variation","middle",15,"s-mag"],["m",220,372,"Read it from the chart’s compass rose"]]}},"script":"Let’s take the two errors one at a time. Variation first. [+] It’s caused by the earth itself. Magnetic north and true north aren’t in the same place. So variation depends only on where you are. It’s the same on every heading. [+] You read it from the center of the nearest compass rose on your chart. [+] The rose also gives the year it was measured and the annual change. So what do you do with a rose that’s fifteen years old? [pause] Multiply the annual change by the years, and bring it up to date. [+] In Florida, variation is a few degrees west, from roughly two degrees in the western Panhandle to around eight on the Atlantic coast. [+] And westerly variation means just what it says: magnetic north lies to the west of true north."},{"heading":"Deviation","visual":{"k":"points","items":["Caused by your boat’s own magnetism","Changes as the boat’s heading changes","Recorded on a deviation card for each heading","Use the deviation for your HEADING, even when taking a bearing","“Compass least, error east; compass best, error west”"],"fig":{"t":"td","els":[["t",220,44,"Deviation changes with heading"],["m",220,68,"It comes from the boat’s own magnetism"],["h",120,200,0,"s-ink",1.9],["t",120,292,"Heading 000°","middle",16],["m",120,314,"Deviation 2°E"],["h",320,200,90,"s-ink",1.9],["t",320,292,"Heading 090°","middle",16],["m",320,314,"Deviation 2°W"]]}},"script":"Now the second error, and this one belongs to you. Deviation. [+] It’s caused by your own boat’s magnetism: the engine, the wiring, the electronics. [+] And unlike variation, it changes as the boat’s heading changes. Turn the boat, and the iron moves around the compass. [+] So it’s recorded on a deviation card, with the error for each heading. [+] Now the exam’s favorite trap. You’re steering one course, and you take a compass bearing on a lighthouse off to the side. Which deviation do you use: the one for your heading, or the one for the bearing? [pause] Your heading. Deviation depends on which way the boat is pointed, not where you’re looking. [+] And a rhyme for naming the error. Compass least, error east. Compass best, error west. If the compass reads less than magnetic, the deviation is east."},{"heading":"Worked example: correcting a bearing","visual":{"k":"script","lines":["Heading 045° by compass; deviation on 045° is 2°W; variation 5°W","Lighthouse bears 120° by compass","120° − 2° (deviation for your heading) = 118° magnetic","118° − 5° (variation) = 113° true","Plot the bearing as 113°T"],"fig":{"t":"rows","items":[["compass","Compass bearing","120°"],["magnet","Deviation 2°W, for heading 045°","120° − 2° = 118° magnetic"],["globe","Variation 5°W","118° − 5° = 113° true"]]}},"script":"Let’s work that trap through, so you’ve done it once before the exam. Follow it on screen. [+] You’re steering zero four five by compass. Your deviation card shows two degrees west on that heading. Variation is five degrees west. [+] You take a bearing on a lighthouse, and the compass reads one two zero. [+] Which deviation? The one for zero four five, your heading. Two west. And we’re correcting, compass toward true, so west is subtracted. One two zero minus two is one one eight, magnetic. [+] Now variation, five west. Subtract again. One one eight minus five is one one three, true. [+] And what goes on the chart? [pause] One one three. Bearings are always plotted as true. That’s lesson nine. True, variation, magnetic, deviation, compass. Correcting, add east. Deviation goes with your heading. Compass least, error east. Next time: headings, bearings and checking your compass."}]},{"id":"nav-10","module":"N","title":"Headings, bearings and checking the compass","status":"draft-unverified","slides":[{"heading":"Navigation words","visual":{"k":"table","head":["Term","Meaning"],"rows":[["Heading","Direction the bow points right now"],["Course","Direction you intend to steer"],["Track (course over ground)","Direction you actually move over the bottom"],["Speed over ground","Speed actually made over the bottom"],["Bearing","Direction from you to an object"]],"fig":{"t":"band","items":[["north","Heading","Where the bow points"],["turn","Course","Where you mean to steer"],["current","Track","Where you actually go"],["eye","Bearing","Direction to an object"]]}},"script":"Navigators use ordinary-sounding words with exact meanings, and the exam will happily swap one for another to see if you notice. So let’s pin down five. [+] Heading is the direction your bow is pointing at this instant. It wanders as the boat yaws. [+] Course is the direction you intend to steer. [+] Track, which your GPS calls course over ground, is the direction the boat actually moves over the bottom. So when would heading and track be different? [pause] Whenever wind or current is pushing you sideways. You’re pointed one way and sliding another. [+] Speed over ground is how fast you’re really covering the bottom, as opposed to your speed through the water. [+] And a bearing is the direction from your boat to an object. It can be true, magnetic, compass, or relative."},{"heading":"Relative bearings","visual":{"k":"dg","f":"relbearing"},"script":"A relative bearing ignores north altogether. It’s measured from your own bow. Look at the diagram. Zero zero zero is dead ahead. Zero nine zero is on your starboard beam. One eight zero is dead astern. Two seven zero is on your port beam. It always runs clockwise from the bow. To turn a relative bearing into a true bearing, add it to your true heading. If the total goes over three hundred sixty, subtract three hundred sixty. Try one. Your true heading is three hundred. A buoy bears zero nine zero relative. What’s its true bearing? [pause] Three hundred plus ninety is three ninety. Take away three sixty. Zero three zero true. Lookouts report this way all the time. Broad on the starboard bow means about forty-five degrees relative."},{"heading":"Using a deviation table","visual":{"k":"table","head":["Magnetic heading","Deviation"],"rows":[["000°","2°E"],["030°","1°E"],["060°","0°"],["090°","2°W"],["120°","3°W"],["150°","2°W"]],"fig":{"t":"big","ic":"compass","v":"2°E to 3°W","cap":"Deviation depends on your heading. Enter the table with the heading you’re steering."}},"script":"A deviation table is your compass’s report card, heading by heading. Look at this one as it builds. [+] On zero zero zero, two degrees east. [+] On zero three zero, one east. [+] On zero six zero, none. [+] On zero nine zero, two west. [+] On one two zero, three west. [+] And on one five zero, two west. See how it swings smoothly from east to west? That’s normal. Now, what if your heading falls between two lines? You interpolate. Say you’re steering zero seven five magnetic. That’s halfway between zero six zero, with no deviation, and zero nine zero, with two west. So what’s the deviation? [pause] About one degree west. One caution. Some tables are entered with the compass heading, and some with the magnetic heading. Read the top of the column before you use it."},{"heading":"Checking your compass","visual":{"k":"points","items":["Line up on a range and compare with its charted direction","The difference is your deviation on that heading","GPS course over ground is a rough check in calm, slack water","Swinging ship: check all headings and record them","Recheck after installing electronics or moving gear"],"fig":{"t":"td","els":[["t",220,40,"Line up on a range"],["raw","\u003crect x='206' y='70' width='28' height='44' fill='#C8312A'/>\u003crect x='216' y='70' width='8' height='44' fill='#fff'/>\u003crect x='210' y='140' width='20' height='32' fill='#C8312A'/>\u003crect x='217' y='140' width='6' height='32' fill='#fff'/>"],["l","M220,172 V300"],["h",220,320,0,"s-ink",1.4],["m",330,96,"Rear mark"],["m",330,160,"Front mark"],["t",220,376,"Compass vs charted direction = deviation","middle",15,"s-mag"]]}},"script":"How do you know your deviation card is still right? You check it, and the best tool is one you met in lesson three: a range. [+] Line the boat up on a range, so the two marks are one above the other. [+] The chart gives you the range’s direction. Compare that, as a magnetic direction, with what your compass reads. The difference is your deviation on that heading. [+] You can also compare your compass with the GPS course over ground. But only in calm water with no current, and it’s rougher. [+] Checking on all headings, and writing down the results, is called swinging ship. [+] And when should you check again? [pause] Any time you install new electronics, or move gear near the compass. A new stereo speaker can throw it off by ten degrees."},{"heading":"Worked example: a range check","visual":{"k":"script","lines":["Range line on the chart: 042°T","Variation 6°W: 042° + 6° = 048° magnetic","On the range, your compass reads 051°","Compass reads 3° more than magnetic: deviation 3°W","“Compass best, error west”"],"fig":{"t":"rows","items":[["chart","Range on the chart","042°T + 6°W = 048° magnetic"],["compass","Compass on the range","Reads 051°"],["magnet","Deviation 3°W","Compass best, error west"]]}},"script":"Let’s do a range check with real numbers. Follow it on screen. [+] The chart shows the range line as zero four two, true. [+] Variation is six degrees west. We’re going from true toward magnetic, which is uncorrecting, so we add west. Zero four two plus six is zero four eight, magnetic. [+] You line up on the range, and your compass reads zero five one. [+] The compass reads three degrees more than magnetic. So is the deviation east or west? [pause] Compass best, error west. Three degrees west. [+] Write it on your deviation card for that heading. That’s lesson ten. Heading is where you point, track is where you go. Relative bearings start at the bow. And a range is the best compass check there is. Next time: the electronics."}]},{"id":"nav-11","module":"N","title":"GPS, chartplotters, AIS and radios","status":"draft-unverified","slides":[{"heading":"GPS","visual":{"k":"points","items":["Satellite positioning, typically accurate to a few meters","WAAS corrections improve accuracy","Speed and course over ground come from position changes","Set the datum to match your chart","GPS can fail or be jammed: keep backup skills"],"fig":{"t":"tiles","items":[["globe","Satellites fix your position"],["target","Accurate to a few meters"],["gauge","Speed and course over ground"],["warn","Can fail: keep backup skills"]]}},"script":"GPS gives your position from satellite signals, typically accurate to within a few meters, and better with WAAS, a correction system available across North America. A GPS receiver also gives speed over ground and course over ground, which come from changes in position, not from the compass. Make sure the receiver’s datum matches your chart, normally WGS 84 matched to NAD 83. GPS can fail, lose power or be jammed, so a good captain keeps dead reckoning skills, paper charts and a compass as backups. The Loran system that once backed up GPS was shut down in 2010."},{"heading":"Chartplotters","visual":{"k":"points","items":["Your GPS position on an electronic chart","Waypoints and routes: check every leg for hazards","Cross-track error: distance off your intended track","Zoom in to see all detail on vector charts","Keep charts updated; never rely on one source"],"fig":{"t":"td","els":[["raw","\u003ccircle cx='60' cy='330' r='8' class='s-magst' stroke-width='2.5'/>\u003ccircle cx='380' cy='90' r='8' class='s-magst' stroke-width='2.5'/>"],["p","M66,325 L374,95","s-st",2],["m",60,362,"Waypoint 1"],["m",380,70,"Waypoint 2"],["h",256,248,53,"s-ink",1],["p","M220,210 L250,240","s-magst",3],["t",286,262,"Cross-track error","start",15,"s-mag"],["m",176,186,"Intended track","end"]]}},"script":"A chartplotter shows your GPS position on an electronic chart. You can enter waypoints and build routes, but before you follow a route, zoom in and check every leg for shoals, markers and obstructions, because a straight line between waypoints may cross a shoal or even land. Cross-track error shows how far you are to the side of your intended track. Vector charts may hide details when zoomed out. The Coast Guard and the courts expect a prudent captain not to rely solely on any single aid, so cross-check the plotter with buoys, depths and visual bearings."},{"heading":"AIS","visual":{"k":"points","items":["Automatic Identification System: VHF data broadcasts","Name, MMSI, position, course, speed; CPA on your plotter","Class A: larger commercial vessels; Class B: smaller boats","Many vessels don’t carry AIS: keep a lookout","AIS contact isn’t “in sight” under the Rules"],"fig":{"t":"rows","items":[["radio","VHF data broadcasts","Name, MMSI, position, course and speed"],["txt:A","Class A","Larger commercial vessels"],["txt:B","Class B","Smaller boats"],["eye","Not everyone has AIS","Keep a lookout"]]}},"script":"The Automatic Identification System, or AIS, broadcasts a vessel’s identity, position, course and speed over VHF data channels. With an AIS receiver you can see a ship’s name and call her directly, and your plotter can calculate the closest point of approach. Class A transponders are required on many commercial vessels, and Class B units are designed for smaller boats. Many vessels carry no AIS at all, so it never replaces a proper lookout. And seeing a vessel on AIS doesn’t mean you’re in sight of her under the Navigation Rules."},{"heading":"Depth sounder","visual":{"k":"points","items":["Measures depth below the transducer","Set an offset for depth below the keel or waterline","Compare with charted depth plus tide to confirm position","Follow a depth contour in poor visibility","Use a shallow-water alarm"],"fig":{"t":"td","els":[["p","M10,110 H430","s-magst",2.5],["i","boat",220,96,3],["f","M220,136 L160,330 H280 Z","s-mag",0.18],["f","M0,330 Q220,312 440,334 V400 H0 Z","s-land"],["a","M330,140 V318","s-st"],["t",342,220,"Depth below","start",15],["t",342,238,"the transducer","start",15],["m",220,378,"Set an offset for depth below the keel"]]}},"script":"The depth sounder sends a sound pulse down and times its echo. It shows depth below the transducer, unless you’ve set an offset to show depth below the keel or below the waterline, so know how yours is set. Depth is a powerful navigation check. Compare your reading with the charted depth plus the height of tide to confirm your position, and in poor visibility you can follow a depth contour toward a harbor. Set a shallow-water alarm as a safety net, especially in Florida’s skinny water."},{"heading":"VHF and DSC","visual":{"k":"points","items":["Range is roughly line of sight: antenna height matters","16: distress, safety and calling; 9: recreational calling","13: bridge-to-bridge; 22A: Coast Guard working","DSC: register an MMSI and connect GPS","WX channels: NOAA Weather Radio, 162.400 to 162.550 MHz"],"fig":{"t":"rows","items":[["txt:16","Channel 16","Distress, safety and calling"],["txt:9","Channel 9","Recreational calling"],["txt:13","Channel 13","Bridge-to-bridge"],["txt:22A","Channel 22A","Coast Guard working channel"],["txt:WX","Weather channels","NOAA Weather Radio"]]}},"script":"Your VHF radio is also a navigation tool. Its range is roughly line of sight, so antenna height matters more than power. Channel sixteen is for distress, safety and calling. Channel nine is an alternate calling channel for recreational boats. Channel thirteen is the bridge-to-bridge channel, and channel twenty-two alpha is the Coast Guard working channel. A DSC radio needs a registered MMSI number and a GPS connection to send your position in a distress alert. The weather channels carry continuous NOAA Weather Radio broadcasts."}]},{"id":"nav-12","module":"N","title":"Radar","status":"draft-unverified","slides":[{"heading":"How radar works","visual":{"k":"dg","f":"radar"},"script":"Radar transmits pulses of microwave energy and measures the time for echoes to return. It measures range very accurately, and bearing somewhat less accurately, because the beam has width. On the display, your boat is usually at the center, with a heading line pointing up and range rings to help judge distance. The variable range marker, or V R M, measures range to a target, and the electronic bearing line, or E B L, measures its bearing. If a target stays on your E B L while its range closes, its bearing is steady, and Rule seven says risk of collision exists."},{"heading":"The key controls","visual":{"k":"points","items":["Gain: overall sensitivity","Sea clutter (STC): reduces echoes from nearby waves","Rain clutter (FTC): breaks up rain returns","Too much clutter control erases real targets","Head-up, north-up and course-up displays"],"fig":{"t":"rows","items":[["radar","Gain","Overall sensitivity"],["wave","Sea clutter (STC)","Cuts echoes from nearby waves"],["rain","Rain clutter (FTC)","Breaks up rain returns"],["warn","Too much clutter control","Erases real targets"]]}},"script":"Three controls matter most. Gain sets overall sensitivity: too low and you miss weak targets, too high and the screen fills with speckle. Sea clutter control reduces echoes from waves close to the boat. Rain clutter control breaks up the solid returns from rain. The danger is turning these controls up so far that real targets, like a small boat or a buoy, disappear. Displays can be head-up, with the heading line straight up, or north-up and course-up, which stabilize the picture using a heading sensor and make plotting easier."},{"heading":"Radar’s limits","visual":{"k":"points","items":["Radar horizon is only a little beyond the visual horizon","Low beaches may not show: the first echo may be land inland","Small fiberglass, wood and rubber boats return weak echoes","Large objects cast shadows that hide targets","False echoes: side lobes, multiple echoes, second-trace returns"],"fig":{"t":"rows","items":[["boat","Small boats","Fiberglass, wood and rubber return weak echoes"],["ship","Shadows","Large objects hide the targets behind them"],["q","False echoes","Side lobes, multiple echoes"],["wave","Low beaches","May not show at all"]]}},"script":"Know radar’s limits. The radar horizon is only a little farther than the visual horizon, so a low target beyond it won’t show. A low sandy beach may give little return, and the first strong echo may come from higher land or buildings well inland, which can make you think you’re farther off than you are. Small fiberglass, wooden or rubber boats return weak echoes, which is why a radar reflector is worth carrying. Large ships and islands cast shadows that hide targets behind them. And radar can show false echoes, such as side-lobe echoes or multiple echoes between you and a nearby ship."},{"heading":"Plotting and CPA","visual":{"k":"points","items":["Mark a target’s position several times","The line through them is its relative motion","CPA: closest point of approach; TCPA: time to it","MARPA or ARPA can track targets automatically","Rule 7: no decisions on scanty radar information"],"fig":"radarplot"},"script":"To judge risk of collision on radar, mark a target’s position several times over a few minutes. The line through those marks is its relative motion line. Extend it past the center of the screen, and the closest distance between that line and your boat is the closest point of approach, or C P A. The time until you reach it is the T C P A. Many radars can track targets automatically, called MARPA on small boats or ARPA on ships, and compute C P A for you. Remember Rule seven: radar plotting or equivalent systematic observation is required, and decisions must not be based on scanty radar information, like a single glance at the screen."},{"heading":"Radar and the Rules","visual":{"k":"points","items":["If fitted, radar must be used properly (Rule 7)","A radar-only contact isn’t “in sight” (Rule 3)","Rule 19: don’t turn to port for targets forward of the beam","A radar reflector helps others see you","Practice in clear weather before you need it in fog"],"fig":{"t":"rows","items":[["radar","If fitted, use it properly","Rule 7"],["eye","A radar-only contact","Isn’t “in sight” (Rule 3)"],["no","Target forward of the beam","Don’t turn to port (Rule 19)"],["target","Radar reflector","Helps others see you"]]}},"script":"Radar ties directly into the Navigation Rules. If your boat has radar, Rule seven requires you to use it properly, including long-range scanning for early warning. A target seen only on radar is not in sight, so in fog Rule nineteen applies, and you avoid turning to port for a target forward of the beam. Make your own boat a better target with a radar reflector mounted as high as practical. And practice with radar on clear days, comparing the screen with what you see, so you can trust your interpretation when the fog rolls in."}]},{"id":"nav-13","module":"N","title":"Weather systems and forecasts","status":"draft-unverified","slides":[{"heading":"Highs, lows and fronts","visual":{"k":"dg","f":"fronts"},"script":"Weather moves in systems. Air flows from high pressure toward low pressure, and the earth’s rotation bends it. In the Northern Hemisphere, winds blow clockwise and outward around a high, which usually brings fair weather, and counterclockwise and inward around a low, which brings clouds, wind and rain. A front is the boundary between air masses. A cold front, drawn with triangles, moves fast and brings a sharp line of showers or thunderstorms, a sudden wind shift, and then clearing, cooler weather. A warm front, drawn with semicircles, moves slowly and brings a long period of low clouds, drizzle and poor visibility ahead of it."},{"heading":"Florida cold fronts","visual":{"k":"points","items":["Ahead: southerly winds, falling barometer, building clouds","At the front: squall line, gusts, sudden wind shift","Behind: wind veers west, then northwest and north","Barometer rises; clear, cool, often rough for a day or two","East coast: north winds against the Gulf Stream"],"fig":{"t":"steps","items":["Ahead: southerly wind, falling barometer","At the front: squalls and a sudden wind shift","Behind: wind veers west, then north","Barometer rises: clear, cool, often rough"]}},"script":"In Florida, winter cold fronts set the rhythm of offshore fishing. Ahead of a front, winds blow from the south or southwest, the barometer falls, and clouds build. As the front passes, a squall line can bring gusty winds and rain, and the wind shifts suddenly. Behind it, the wind veers to the west, then northwest and north, often blowing hard for a day or two, while the barometer rises and the sky clears. On the Atlantic side, those north winds blow against the Gulf Stream and make it dangerous. The best fishing windows often come just before a front, or after the wind lies down behind it."},{"heading":"Reading the barometer and the sky","visual":{"k":"points","items":["Falling barometer: low or front approaching","Rapid fall: strong wind soon","Rising barometer: improving weather","Cirrus thickening and lowering: warm front coming","Towering cumulus with anvil tops: thunderstorms","Buys Ballot: back to the wind, low on your left"],"fig":{"t":"rows","items":[["down","Falling barometer","A low or front is approaching"],["up","Rising barometer","Improving weather"],["cloud","Cirrus thickening, lowering","Warm front coming"],["bolt","Towering cumulus, anvil tops","Thunderstorms"]]}},"script":"Your barometer and the sky give early warning. A falling barometer signals an approaching low or front, and a rapid fall means strong wind is coming soon. A rising barometer means improving weather. High, thin cirrus clouds that thicken and lower over several hours often mean a warm front is approaching. Towering cumulus clouds that grow into anvil-topped cumulonimbus mean thunderstorms. And remember Buys Ballot’s law: in the Northern Hemisphere, stand with your back to the wind and low pressure is on your left."},{"heading":"Marine forecasts and warnings","visual":{"k":"table","head":["Advisory or warning","Sustained wind"],"rows":[["Small craft advisory","Roughly 20 to 33 knots, or hazardous seas; thresholds vary by region"],["Gale warning","34 to 47 knots"],["Storm warning","48 to 63 knots"],["Hurricane force wind warning","64 knots and over"],["Special marine warning","Short-lived hazards: thunderstorms, waterspouts, strong gusts"]],"fig":{"t":"band","items":[["flag","Small craft advisory","About 20 to 33 knots"],["wind","Gale warning","34 to 47 knots"],["wind","Storm warning","48 to 63 knots"],["warn","Hurricane force","64 knots and over"]]}},"script":"Get the marine forecast before every trip. The National Weather Service issues coastal waters and offshore forecasts, available online and broadcast continuously on NOAA Weather Radio. Learn the warning levels. A small craft advisory is issued for winds roughly in the twenty to thirty-three knot range, or for hazardous seas, with exact thresholds varying by region. A gale warning means thirty-four to forty-seven knots. A storm warning means forty-eight to sixty-three knots. A hurricane force wind warning means sixty-four knots or more. A special marine warning covers short-lived hazards like severe thunderstorms and waterspouts."},{"heading":"The Beaufort scale","visual":{"k":"table","head":["Force","Description","Knots"],"rows":[["0","Calm","Less than 1"],["3","Gentle breeze","7 to 10"],["4","Moderate breeze","11 to 16"],["5","Fresh breeze","17 to 21"],["6","Strong breeze","22 to 27"],["7","Near gale","28 to 33"],["8","Gale","34 to 40"],["12","Hurricane","64 and over"]],"fig":{"t":"band","items":[["txt:F 0","Calm","Less than 1 knot"],["txt:F 6","Strong breeze","22 to 27 knots"],["txt:F 8","Gale","34 to 40 knots"],["txt:F 12","Hurricane","64 knots and over"]]}},"script":"The Beaufort scale describes wind force by its effect on the sea. Force zero is calm. Force three, a gentle breeze of seven to ten knots, brings scattered whitecaps. Force four, a moderate breeze of eleven to sixteen knots, brings frequent whitecaps. Force six, a strong breeze of twenty-two to twenty-seven knots, builds large waves with extensive foam crests, which is where many small charter boats stay at the dock. Force eight is a gale, thirty-four to forty knots, and force twelve is hurricane force, sixty-four knots and above."}]},{"id":"nav-14","module":"N","title":"Thunderstorms, hurricanes, fog and seas","status":"draft-unverified","slides":[{"heading":"Thunderstorms and waterspouts","visual":{"k":"points","items":["Summer storms build over land in the afternoon and drift to the coast","Hear thunder? You’re within striking distance: head in","Outflow gusts can hit before the rain","Caught out: everyone low, away from metal, out of the water","Waterspouts: move away at right angles to their path"],"fig":{"t":"td","els":[["t",220,40,"Hear thunder? Head in"],["i","bolt",90,130,2.2],["a","M340,90 V330","s-st"],["m",340,76,"Waterspout’s path"],["raw","\u003cpath d='M322,150 Q340,200 330,250 Q350,200 358,150 Z' class='s-mut' opacity='.6'/>"],["h",230,230,-90,"s-ink",1],["a","M200,230 H80"],["t",150,280,"Move away at right angles","middle",15,"s-mag"]]}},"script":"Florida leads the nation in lightning, and summer thunderstorms are a near-daily hazard. They usually build over land in the early afternoon and drift toward the coast. Gusts flowing out of a storm can hit well before the rain, sometimes at gale force. If you hear thunder, you’re within striking distance, so head in early. If you’re caught out, get everyone low, away from metal, rods and the console, and out of the water. Waterspouts are common in the Keys and along both coasts. Most are fair-weather spouts, but treat every one as dangerous and move away at right angles to its path."},{"heading":"Tropical cyclones","visual":{"k":"table","head":["Type","Sustained wind"],"rows":[["Tropical depression","Under 34 knots"],["Tropical storm","34 to 63 knots"],["Hurricane","64 knots and over"],["Major hurricane","Category 3 and up: 96 knots and over"]],"fig":{"t":"band","items":[["cloud","Tropical depression","Under 34 knots"],["rain","Tropical storm","34 to 63 knots"],["wind","Hurricane","64 knots and over"],["warn","Major hurricane","96 knots and over"]]}},"script":"Tropical cyclones are classified by sustained wind. A tropical depression has winds under thirty-four knots, a tropical storm thirty-four to sixty-three knots, and a hurricane sixty-four knots or more. Category three and higher hurricanes, ninety-six knots and above, are called major hurricanes. Atlantic hurricane season runs from June first through November thirtieth, with the peak from August through October. The National Hurricane Center issues a watch when hurricane conditions are possible, usually within forty-eight hours, and a warning when they are expected, usually within thirty-six hours."},{"heading":"The dangerous semicircle","visual":{"k":"dg","f":"hurricane"},"script":"In the Northern Hemisphere, hurricane winds circulate counterclockwise. On the right side of the storm’s track, the storm’s forward motion adds to the wind speed, so this is called the dangerous semicircle, and the right front quadrant usually has the strongest winds and the highest storm surge. On the left side, forward motion subtracts from the wind, so it’s called the navigable semicircle, though it’s still extremely dangerous. For a charter captain, the real lesson is preparation. Have a written hurricane plan, know where you’ll secure or haul the boat, and act early, because bridges lock down and marinas fill up."},{"heading":"Fog","visual":{"k":"points","items":["Advection fog: warm moist air moving over cooler water","Radiation fog: clear, calm nights; drifts over rivers and bays","Florida sea fog: mostly winter and spring","When visibility drops: Rule 19 and fog signals","Slow down, lights on, radar plotting, extra lookout"],"fig":{"t":"cmp","a":["","Advection fog","fog","Warm, moist air moving over cooler water"],"b":["","Radiation fog","moon","Clear, calm nights. Drifts over rivers and bays"]}},"script":"Fog forms when air cools to its dew point. Advection fog forms when warm, moist air moves over cooler water, and it can persist for hours or even days. In Florida, it’s most common in winter and spring, when warm air flows over cooler nearshore water. Radiation fog forms on clear, calm nights as the land cools, and it can drift over rivers, bays and harbors until the morning sun burns it off. When visibility drops, follow Rule nineteen: slow to a safe speed, turn on your navigation lights, sound fog signals, plot radar targets and post an extra lookout."},{"heading":"Waves and seas","visual":{"k":"points","items":["Wave size grows with wind speed, fetch and duration","Fetch: the distance of open water the wind blows across","Swell: waves that have left the area where they formed","Forecast heights are significant wave height: the average of the highest third","Expect some waves much larger, occasionally about double"],"fig":{"t":"td","els":[["a","M60,70 H400","s-st"],["t",230,56,"Wind"],["f","M0,120 H50 V400 H0 Z","s-land"],["p","M56,240 q12,-6 24,0 t24,0 q16,-14 32,0 t32,0 q24,-30 48,0 t48,0 q32,-50 64,0 t64,0","s-magst",3.5],["l","M56,290 H400"],["t",230,318,"Fetch: open water the wind crosses","middle",15],["m",230,352,"More wind, more fetch, more time: bigger waves"]]}},"script":"Waves grow with three things: wind speed; fetch, the distance of open water the wind blows across; and duration, how long it has blown. That’s why an offshore wind leaves a calm strip near the beach, while the same wind blowing onshore across a long fetch builds big seas. Swell is waves that have traveled away from where they formed, and it can arrive well ahead of a distant storm. Forecast wave heights are significant wave heights, the average of the highest one third of the waves, so expect some individual waves much larger, occasionally around twice the forecast height."}]},{"id":"deck-01","module":"D","title":"Your license and the passenger rules","status":"draft-unverified","slides":[{"heading":"What the OUPV allows","visual":{"k":"points","items":["Up to 6 passengers for hire","On uninspected vessels","Near Coastal: up to 100 nm offshore; Inland: inside the boundary line","Valid 5 years; renew through the National Maritime Center","7 or more passengers: inspected vessel and a Master license"],"fig":{"t":"big","ic":"people","v":"6","cap":"Up to six passengers for hire, on uninspected vessels","sub":"Near Coastal: up to 100 nm offshore"}},"script":"Welcome to Deck General and Safety. The Rules module was about not hitting anybody. This one is about everything else it takes to run a safe, legal charter, and it starts with the piece of paper you’re studying for. So what does a six-pack license actually let you do? [+] It lets you carry up to six passengers for hire. That’s where the nickname comes from. [+] And only on an uninspected vessel. [+] Where you can go depends on your endorsement. Near Coastal takes you up to one hundred miles offshore. Inland keeps you inside the boundary line. [+] The credential is good for five years, and you renew it through the National Maritime Center. [+] Now the limit. What if a seventh paying passenger wants to come along? [pause] You can’t take him. Seven or more passengers for hire means an inspected vessel, with a Certificate of Inspection, and a Master license. Six is a hard number."},{"heading":"Who is a passenger for hire?","visual":{"k":"points","items":["A passenger for whom consideration is contributed as a condition of carriage","Consideration: money or any economic benefit, directly or indirectly","Voluntary sharing of the trip’s actual expenses is NOT consideration","Owners, crew and true non-paying guests aren’t passengers for hire","Disguised fees (“donations,” required fuel charges) still count"],"fig":{"t":"cmp","a":["yes","Passenger for hire","money","Pays, directly or indirectly, as a condition of the trip"],"b":["no","Not for hire","people","Guests, crew, or friends voluntarily sharing actual expenses"]}},"script":"Everything in this lesson turns on one legal phrase: passenger for hire. Get it wrong and you’re running an illegal charter. [+] A passenger for hire is a passenger for whom consideration is contributed as a condition of carriage. [+] Consideration means money, or any other economic benefit, given directly or indirectly. [+] But federal law carves out one thing: the voluntary sharing of a trip’s actual expenses. Friends splitting fuel and bait isn’t consideration. [+] And owners, crew, and true non-paying guests aren’t passengers for hire either. So here’s a test. Your neighbor says, take me and my buddies out Saturday, and we’ll each give you a hundred dollars. Is that a charter? [pause] Yes. The payment is a condition of going. [+] And it doesn’t matter what you call it. A donation, a club membership, a required fuel charge: if they have to pay to come, they’re passengers for hire. The key word is voluntary."},{"heading":"Uninspected vs inspected vessels","visual":{"k":"table","head":["Vessel","Passengers for hire","Credential"],"rows":[["Uninspected passenger vessel","Up to 6","OUPV or Master"],["Inspected small passenger vessel","More than 6, up to the limit on its COI","Master"],["Bareboat (demise) charter","Charterer hires the boat and supplies the captain","Strict rules; a common illegal-charter disguise"]],"fig":{"t":"band","items":[["txt:≤ 6","Uninspected","OUPV or Master"],["txt:7+","Inspected","Master, within the COI limit"],["warn","Bareboat charter","Strict rules; a common illegal disguise"]]}},"script":"Here’s how the vessel categories fit together. [+] An uninspected passenger vessel carries no more than six passengers for hire, and the operator needs at least an OUPV. That’s your boat. [+] An inspected small passenger vessel carries more than six, up to the number on her Certificate of Inspection, and she needs a Master. [+] The third row is where captains get into trouble: the bareboat charter, also called a demise charter. In a real one, the charterer hires the boat and supplies his own captain, and the owner steps away completely. [pause] Why does that matter to you? Because fake bareboat charters are a classic way to dodge the six-passenger limit, and the Coast Guard fines operators for them regularly. If someone offers you a job running twelve people on an uninspected boat under a bareboat agreement, be very careful."},{"heading":"The boat’s paperwork","visual":{"k":"points","items":["5 net tons or more, passengers for hire between U.S. points: Coast Guard documentation with a coastwise endorsement","Smaller boats: state registration","Florida: the right FWC charter fishing license covers your customers","Carry your credential, the boat’s papers and required placards aboard"],"fig":{"t":"rows","items":[["doc","5 net tons or more","Coast Guard documentation, coastwise endorsement"],["card","Smaller boats","State registration"],["fish","Florida","FWC charter fishing license"],["card","Carry aboard","Credential, boat’s papers, placards"]]}},"script":"Your boat needs the right paperwork too, not just you. [+] A boat of five net tons or more, carrying passengers for hire between American points, must be documented by the Coast Guard with a coastwise endorsement. That endorsement also has rules about where the boat was built and who owns her. [+] Smaller boats are simply registered with the state. [+] In Florida there’s one more piece. A charter fishing operation needs the right saltwater charter license from the Fish and Wildlife Conservation Commission. That license covers your customers, so they don’t each need their own. [+] And carry it all aboard: your credential, the boat’s papers, and the required placards. When the Coast Guard boards you, and one day they will, what do they ask for first? [pause] Your license and the boat’s documents. Have them where you can reach them in ten seconds."},{"heading":"Drugs and alcohol","visual":{"k":"points","items":["Join a DOT drug testing program, usually through a consortium","Tests: pre-employment, random, post-casualty, reasonable cause","Commercial operators are intoxicated at 0.04% BAC","After a serious marine incident: alcohol test within 2 hours, drugs within 32 hours","Refusing a test can cost you your license"],"fig":{"t":"rows","items":[["bottle","0.04% BAC","Intoxicated, for commercial operators"],["clock","After a serious incident","Alcohol test in 2 hours, drugs in 32"],["doc","Drug testing program","Pre-employment, random, post-casualty, cause"]]}},"script":"One more thing comes with the license: drug and alcohol rules that are stricter than for any recreational boater. [+] As a commercial operator, you must be enrolled in a Department of Transportation drug testing program. Most owner-operators join a consortium that handles it. [+] The tests come before employment, at random, after a serious marine incident, and when there’s reasonable cause. [+] For alcohol, a commercial operator is intoxicated at zero point zero four percent. That’s half the recreational limit. [+] After a serious marine incident, the clock starts. Alcohol testing within two hours, drug testing within thirty-two hours. [+] And refusing a test can cost you your license. [pause] That’s lesson one. Six passengers, uninspected vessel, five years. If they have to pay to come, they’re passengers for hire. And zero point zero four, two hours, thirty-two hours. Next time: the safety gear the law requires on your boat."}]},{"id":"deck-02","module":"D","title":"Required safety equipment","status":"draft-unverified","slides":[{"heading":"Life jackets","visual":{"k":"points","items":["An approved wearable life jacket for every person aboard","Passenger-carrying vessels: offshore (Type I or equivalent) life jackets","Child sizes for every child","Readily accessible and in good condition","Plus a throwable device, usually a ring buoy"],"fig":{"t":"rows","items":[["vest","A wearable for every person","Offshore type on passenger vessels"],["person","Child sizes","For every child aboard"],["ring","A throwable device","Usually a ring buoy"]]}},"script":"Today is the equipment list: what the law says must be on your boat before a paying passenger steps aboard. We start where every boarding officer starts. Life jackets. [+] You need a Coast Guard approved wearable life jacket for every person aboard, in the right size. [+] And because you carry passengers for hire, they must be the offshore type, traditionally called Type one, with the most flotation. [+] Child sizes for every child. An adult jacket on a six-year-old doesn’t count, and it doesn’t work. [+] They must be readily accessible and in good condition. So are they legal if they’re still sealed in plastic under a locked seat? [pause] No. Readily accessible means a passenger can get one in seconds. Newer jackets carry performance-level labels instead of Types, and the older ones stay legal while they’re serviceable. [+] And you need a throwable device, usually a ring buoy, ready at hand."},{"heading":"Fire extinguishers","visual":{"k":"table","head":["Boat length","Portable extinguishers (no fixed system)"],"rows":[["Under 26 ft","1 B-I (5-B)"],["26 to under 40 ft","2 B-I, or 1 B-II (20-B)"],["40 to 65 ft","3 B-I, or 1 B-II plus 1 B-I"],["With a fixed engine-room system","One fewer B-I required"],["Disposable extinguishers","Replace 12 years after manufacture"]],"fig":{"t":"band","items":[["ext","Under 26 ft","1 B-I"],["ext","26 to under 40 ft","2 B-I, or 1 B-II"],["ext","40 to 65 ft","3 B-I, or 1 B-II plus 1 B-I"]]}},"script":"Fire extinguishers go by boat length, and the exam loves the table. Assume no fixed system in the engine room. [+] Under twenty-six feet: one B-one. [+] Twenty-six to under forty feet: two B-ones, or one B-two. [+] Forty to sixty-five feet: three B-ones, or one B-two plus one B-one. See the pattern? One, two, three, and a B-two is worth two B-ones. [+] If you have an approved fixed system in the engine room, you need one fewer B-one. [+] And disposable extinguishers expire. Replace them twelve years after the date of manufacture. [pause] One labeling note. Newer extinguishers are marked five-B and twenty-B instead of B-one and B-two, and newer boats must carry those. Mount them where you can grab one without reaching over the thing that’s likely to be on fire."},{"heading":"Visual distress signals","visual":{"k":"table","head":["Signal","Day","Night","Type"],"rows":[["Red hand flare","Yes","Yes","Pyrotechnic"],["Red meteor or parachute flare","Yes","Yes","Pyrotechnic"],["Orange smoke","Yes","No","Pyrotechnic"],["Orange distress flag","Yes","No","Non-pyrotechnic"],["Electric SOS light","No","Yes","Non-pyrotechnic"]],"fig":{"t":"band","items":[["flare","Red flares","Day and night"],["smoke","Orange smoke","Day only"],["flag","Orange flag","Day only"],["bulb","Electric SOS light","Night only"]]}},"script":"Visual distress signals are required on coastal waters: the ocean, the Gulf, and connected bays and sounds until they narrow to less than two miles wide. A boat sixteen feet or longer must carry signals for both day and night. Follow the table. [+] Red hand flares count for day and night. [+] So do red meteor and parachute flares. [+] Orange smoke is for day only. Why? [pause] You can’t see smoke in the dark. [+] The orange distress flag is also day only. [+] And the electric SOS light is night only. So three red flares cover you for both. Or you can pair a flag for day with an electric light for night, and carry no pyrotechnics at all. One date to remember: pyrotechnic signals expire forty-two months after manufacture. And never fire one except in a real emergency."},{"heading":"Ventilation and flame arrestors","visual":{"k":"points","items":["Gasoline engine spaces need natural and powered ventilation","Run the blower at least 4 minutes before starting","Gasoline inboards need a backfire flame arrestor","Keep arrestors clean and secured","Diesels need ventilation for combustion air"],"fig":{"t":"rows","items":[["wind","Run the blower","At least 4 minutes before starting"],["engine","Backfire flame arrestor","On gasoline inboards. Keep it clean"],["fuel","Gasoline engine spaces","Natural and powered ventilation"]]}},"script":"Now the equipment that keeps a gasoline boat from exploding. [+] Any gasoline engine in an enclosed space needs ventilation to carry vapor away: natural vents, plus a powered blower. [+] Run that blower for at least four minutes before you start the engine. Four minutes. Then use the best vapor detector aboard. What’s that? [pause] Your nose. Open the hatch and sniff the bilge. [+] Gasoline inboards and sterndrives must also have an approved backfire flame arrestor on the air intake. If the engine backfires, the arrestor stops the flame from reaching vapor in the compartment. [+] Keep it clean and firmly secured. An oily, loose arrestor doesn’t do its job. [+] Diesels are far less explosive, but their spaces still need ventilation, to feed the engine combustion air."},{"heading":"Everything else aboard","visual":{"k":"points","items":["Navigation lights and sound-signaling equipment","Oil and garbage placards on boats 26 ft and over","An approved marine sanitation device if there’s a toilet","A pre-departure safety briefing for passengers","Wise extras: EPIRB or PLB, VHF-DSC, first aid kit, high-water alarm"],"fig":{"t":"tiles","items":[["light","Navigation lights"],["horn","Sound signals"],["doc","Oil and garbage placards"],["people","Safety briefing"],["epirb","EPIRB or PLB"],["aid","First aid kit"]]}},"script":"A few more required items, and then the ones a professional carries anyway. [+] Navigation lights and sound-signaling equipment that meet the rules you just studied. [+] On boats twenty-six feet and over, the oil discharge placard and the garbage placard. [+] If there’s an installed toilet, a Coast Guard certified marine sanitation device. [+] And one thing that isn’t equipment at all: a safety briefing before every trip. Where the life jackets are, how to put one on, and what to do if something goes wrong. It takes two minutes at the dock. [+] Beyond the minimum, I’d carry a registered EPIRB or personal locator beacon, a VHF with DSC, a real first aid kit, and a high-water alarm. [pause] That’s lesson two. A Type one for everyone. Extinguishers: one, two, three by length. Flares expire at forty-two months. And four minutes on the blower. Next time: what to do when there’s a fire anyway."}]},{"id":"deck-03","module":"D","title":"Firefighting","status":"draft-unverified","slides":[{"heading":"How fire works","visual":{"k":"dg","f":"fire"},"script":"Fire is the emergency every captain dreads. On the water there’s no fire department and nowhere to run. So today we learn how a fire works, because that tells you how to kill it. Look at the diagram. A fire needs three things: heat, fuel and oxygen. Plus a fourth, the chemical chain reaction that keeps it going. Take away any one, and the fire goes out. [pause] Cooling removes the heat. Smothering removes the oxygen. Shutting a valve removes the fuel. And dry chemical breaks the chain reaction. Fires are also sorted into classes by what’s burning. Class A is ordinary stuff that leaves ash: wood, cushions, line. Class B is flammable liquids that boil: gasoline and oil. That’s the most common boat fire. Class C is energized electrical equipment, think current. And Class D is combustible metals. A for ash, B for boil, C for current."},{"heading":"Extinguishing agents","visual":{"k":"table","head":["Agent","Fire classes","Notes"],"rows":[["Dry chemical (ABC or BC)","A, B, C","Most common on boats; messy and corrosive"],["Carbon dioxide (CO2)","B, C","Displaces oxygen; no residue; short range"],["Clean agent","B, C","Often in fixed engine-room systems"],["Foam","A, B","Smothers fuel
